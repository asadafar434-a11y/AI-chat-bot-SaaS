# Автопроверка на каждый PR и на каждое изменение main: сервер (web/) — тесты, линтер, типы; сервер и экран продукта
# (design-system/prototype) — сборка для хостинга, типы экрана и проверка «как на хостинге» (npm run check:host).
# Ключ API для проверки не нужен: ИИ вызывается только при работе приложения, не при сборке.
name: Проверка приложения

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Тесты, линтер, типы, сборка и проверка как на хостинге
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Линтер
        run: npx eslint src

      - name: Типы
        run: npx next typegen && npx tsc --noEmit

      # Ставит зависимости экрана, собирает его в web/public/product, затем сервер (next build).
      - name: Сборка экрана и сервера
        run: npm run build:host

      - name: Типы экрана
        run: npm --prefix ../design-system/prototype run typecheck

      # Настоящий сервер с паролем: вход, закрытые файлы экрана, шрифты, PDF. Запросов к ИИ нет.
      - name: Проверка как на хостинге
        run: npm run check:host
