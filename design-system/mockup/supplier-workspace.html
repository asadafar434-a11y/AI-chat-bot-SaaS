    ? noteHTML("warn", items[0], "", "alert")
    : noteHTML("warn", `<p class="note-title">Проверьте перед подачей</p><ul>${items.map((t) => `<li>${t}</li>`).join("")}</ul>`, "", "alert");
  const busyHTML = () => `<div class="busy" aria-live="polite"><p class="busy-text" id="busy-text">${esc(S.busy.lines[0])}</p><p class="busy-sub">${esc(S.busy.sub)}</p><div class="track"><i id="busy-bar"></i></div></div>`;
  const dropHTML = (id, hint, button, sample) => `<div class="drop" data-drop="${id}">
      <span class="drop-ic">${ic("upload", 26)}</span>
      <p>${hint}</p>
      <label class="btn lg" for="file-${id}">${button}<input id="file-${id}" type="file" multiple class="sr-only"></label>
      ${sample ? `<span class="or">или <button class="link" type="button" data-act="${sample.act}">${sample.text}</button></span>` : ""}
      <label class="ocr-row"><input type="checkbox" data-ocr${S.ocr ? " checked" : ""}><span>Распознавать сканы и фото через ИИ. Картинка уходит в США как есть: персональные данные на ней не скрываются — паспорта и анкеты со скана лучше не загружать.</span></label>
    </div>`;

  function md(text) {
    const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return text.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n").filter((l) => l.trim());
      if (!lines.length) return "";
      const head = lines[0].startsWith("- ") ? "" : lines.shift();
      const list = lines.filter((l) => l.startsWith("- "));
      const rest = lines.filter((l) => !l.startsWith("- "));
      return (head ? `<p>${inline(head)}</p>` : "") + (list.length ? `<ul>${list.map((l) => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>` : "") + (rest.length ? `<p>${rest.map(inline).join("<br>")}</p>` : "");
    }).join("");
  }

  function refBtn(r, p) {
    if (r.law) {
      const L = LAW[r.law];
      return `<button class="src" type="button" data-act="ref" data-ref="law:${r.law}"${r.hl ? ` data-hl="${esc(r.hl)}"` : ""}>${ic("scale", 12)}${esc(`${L.law}, ст. ${L.art}, ${L.label}`)}</button>`;
    }
    return `<button class="src" type="button" data-act="ref" data-ref="doc:${p.id}:${r.doc}">${ic("file", 12)}${esc(p.sources[r.doc].label)}</button>`;
  }

  // Значок закупки — номер закона: 44-ФЗ и 223-ФЗ поставщик различает с первого взгляда.
  const lawOf = (p) => (/^(44|223)-ФЗ/.exec(p.kind || "") || [])[1] || "";
  const lawBadge = (p, big) => {
    const n = lawOf(p);
    return `<span class="law${n === "223" ? " l223" : ""}${big ? " big" : ""}" title="${n ? `${n}-ФЗ` : "Закон не указан"}" aria-hidden="true">${n || "—"}</span>`;
  };
  const daysText = (n) => `${n} ${plural(n, "день", "дня", "дней")}`;
  function initials(name) {
    const inner = (/«([^»]+)»/.exec(name) || [])[1] || name;
    return (inner.split(/[\s-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "?").toUpperCase();
  }
  function dueText(p) {
    const due = dueLine(p.deadline, false);
    if (!due) return "Срок подачи не найден в документах";
    const soon = due.tone === "soon" ? ' class="warn-t"' : "";
    if (!due.left) return `<span${soon}>${esc(due.head)}</span>`;
    return `${esc(due.head)} · <span${soon}>${esc(due.left)}</span>`;
  }
  const nextDue = () => [...S.purchases].sort(byUrgency).map((p) => ({ p, d: dueLine(p.deadline, false) })).find((x) => x.d && x.d.days >= 0);

  /* ---------- сайдбар: только разделы ---------- */
  function sideHTML() {
    const countHTML = (count) => count === undefined ? ""
      : count.fresh ? `<span class="count fresh">${count.fresh}<span class="sr-only"> ${plural(count.fresh, "новый ответ", "новых ответа", "новых ответов")}</span></span>`
      : `<span class="count">${count}</span>`;
    const nav = (screen, icon, label, count, current) => `<button class="nav-item" type="button" data-go="${screen}"${current ? ' aria-current="page"' : ""}>${ic(icon)}<span>${label}</span>${countHTML(count)}</button>`;
    const lawFresh = S.law.threads.filter((t) => t.unread).length;
    const pr = S.profile;
    const name = pr.shortName.trim() || pr.fullName.trim() || "Участник закупок";
    const sub = pr.email.trim() || (pr.inn.trim() ? `ИНН ${pr.inn.trim()}` : "реквизиты не заполнены");
    return `
      <div class="side-head">
        <button class="logo" type="button" data-go="home" aria-label="Тендерный юрист — на главную"><span class="logo-mark">${ic("scale", 16)}</span><span class="logo-text">Тендерный юрист<span class="proto">прототип</span></span></button>
        <button class="icon-btn side-close" type="button" data-act="drawer-close" aria-label="Закрыть меню">${ic("x", 20)}</button>
      </div>
      <div class="side-body">
        <nav class="nav" aria-label="Разделы">
          ${nav("home", "home", "Главная", undefined, S.screen === "home")}
          ${nav("list", "list", "Закупки", S.purchases.length, WORK.includes(S.screen) || S.screen === "new")}
          ${nav("ask", "chat", "Спросить про тендер", undefined, S.screen === "ask")}
          ${nav("lawyer", "scale", "Вопросы юристу", lawFresh ? { fresh: lawFresh } : undefined, S.screen === "lawyer")}
        </nav>
        <section aria-labelledby="side-me">
          <h2 class="sec-label" id="side-me">Данные компании</h2>
          <div class="nav">
            ${nav("profile", "user", "Реквизиты", `${filledCount()}/${PROFILE_KEYS.length}`, S.screen === "profile")}
            ${nav("docs", "folder", "Образцы и реквизиты", undefined, S.screen === "docs")}
          </div>
        </section>
      </div>
      <div class="side-foot">
        ${nav("help", "help", "Как это работает", undefined, S.screen === "help")}
        <button class="nav-item" type="button" role="switch" aria-checked="${isDark()}" data-act="theme">${ic("moon")}<span>Тёмная тема</span><span class="switch" aria-hidden="true"></span></button>
        <button class="me" type="button" data-go="profile" aria-label="Реквизиты: ${esc(name)}">
          <span class="avatar" aria-hidden="true">${esc(initials(name))}</span>
          <span class="me-text"><span class="me-name">${esc(name)}</span><span class="me-sub">${esc(sub)}</span></span>
          ${ic("chev", 16)}
        </button>
      </div>`;
  }

  /* ---------- шапка экрана: заголовок, подзаголовок, главное действие ---------- */
  // Главная кнопка на экране одна: на главной она у самого срочного дела или у «С чего начать», и «Новая закупка» — обводкой.
  const newBtn = (quiet) => `<button class="btn${quiet ? " line" : ""}" type="button" data-go="new" aria-label="Новая закупка">${ic("plus")}<span class="lbl">Новая закупка</span></button>`;
  function headInfo() {
    const n = S.purchases.length;
    const next = nextDue();
    const when = next ? (next.d.days === 0 ? "сегодня" : `через ${daysText(next.d.days)}`) : "";
    switch (S.screen) {
      case "home":
        return { title: "Главная", sub: next ? `Ближайший срок подачи ${when}: ${next.p.short}` : n ? "Сроков подачи впереди нет" : "Начните с документов первой закупки", acts: newBtn(!n || tasksOf().length > 0) };
      case "ask":
        return { title: "Спросить про тендер", sub: "Общие вопросы по 44-ФЗ и 223-ФЗ — ответ со ссылкой на статью" };
      case "lawyer":
        return { title: "Вопросы юристу", sub: "Живой юрист по 44-ФЗ и 223-ФЗ · ответ в течение рабочего дня", acts: `<button class="btn" type="button" data-act="lawyer-new">${ic("plus")}<span class="lbl">Новый вопрос</span></button>` };
      case "help":
        return { title: "Как это работает", sub: "Путь по закупке и где что лежит" };
      case "new":
        return { title: "Новая закупка", sub: "Начало пути: загрузите документы — дальше шаги подскажут, что делать" };
      case "profile": {
        const canFill = S.docs.some((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
        return {
          title: "Реквизиты",
          sub: `Данные компании для анкеты, декларации и цены · заполнено ${filledCount()} из ${PROFILE_KEYS.length}`,
          acts: `<span class="save-state" id="save-state" aria-live="polite">${esc(S.ui.saved || "")}</span>${canFill ? `<button class="btn line" type="button" data-act="fill" aria-label="Заполнить из загруженных документов"${S.ui.filling ? " disabled" : ""}>${ic("upload")}<span class="lbl">${S.ui.filling ? "Ищу реквизиты в документах…" : "Заполнить из документов"}</span></button>` : ""}`,
        };
      }
      case "docs":
        return {
          title: "Образцы и реквизиты",
          sub: S.docs.length ? `${S.docs.length} ${plural(S.docs.length, "документ", "документа", "документов")} · по ним заполняются реквизиты и пишутся новые документы` : "Прошлые заявки, анкеты, карточка предприятия — по ним заполняются реквизиты и пишутся новые документы",
          acts: `<label class="btn" for="file-mydocs-top">${ic("plus")}<span class="lbl">Добавить документы</span><input id="file-mydocs-top" type="file" multiple class="sr-only" aria-label="Добавить документы"></label>`,
        };
      default:
        return { title: "Закупки", sub: n ? `${n} ${plural(n, "закупка", "закупки", "закупок")}${next ? ` · ближайший срок подачи ${when}` : ""}` : "Закупок пока нет", acts: newBtn() };
    }
  }
  function headHTML() {
    const h = headInfo();
    return `<button class="icon-btn menu-btn" type="button" id="menu-btn" data-act="drawer" aria-label="Открыть меню" aria-controls="side" aria-expanded="${S.drawer && narrow.matches}">${ic("menu", 22)}</button>
      <div class="head-text"><h1 id="page-title" tabindex="-1">${esc(h.title)}</h1>${h.sub ? `<p class="head-sub">${esc(h.sub)}</p>` : ""}</div>
      ${bellHTML()}
      ${h.acts ? `<div class="head-acts">${h.acts}</div>` : ""}`;
  }

  /* ---------- главная: самое срочное, закупки по этапам, данные компании ---------- */
  // Главная — рабочий стол, а не всё сразу: сверху одно самое срочное дело с главной кнопкой экрана,
  // ниже — закупки по этапам, в конце — данные компании. Вопросы — в разделе «Спросить про тендер».

  // Что осталось сделать по закупкам, где ещё идёт приём. Порядок — по сроку подачи.
  function tasksOf() {
    const out = [];
    for (const p of [...S.purchases].sort(byUrgency)) {
      const due = dueLine(p.deadline, false);
      if (!due || due.days < 0) continue;
      const urgent = due.tone === "soon" ? "warn" : "brand";
      const [, tp] = stepsOf(p);
      const bad = p.check.state === "done" ? checkCounts(p).bad : 0;
      if (bad) out.push({ p, go: "check", text: bad === 1 ? "Исправить ошибку в заявке" : `Исправить ошибки в заявке — ${bad}`, tone: "bad" });
      else if (p.check.state !== "done") {
        if (tp.state === "todo") out.push({ p, go: "tp", text: "Составить техническое предложение", tone: urgent });
        else if (tp.state === "fix") out.push({ p, go: "tp", text: `Вписать свои данные в ТП — ${tp.status.replace(/^впишите /, "")}`, tone: urgent });
        else out.push({ p, go: "check", text: "Проверить заявку перед подачей", tone: urgent });
      } else if (stepsOf(p)[2].state === "done") out.push({ p, go: "files", text: "Скачать документы и подать заявку на площадке", tone: urgent });
      if ((p.scans || []).length) out.push({ p, go: "req", text: `Сверить цифры в ${p.scans.length === 1 ? "файле со скана" : "файлах со скана"}`, tone: "warn" });
      p.unreadable.forEach((f) => out.push({ p, go: "req", text: `Пересохранить «${f.name}» — файл не прочитан`, tone: "warn" }));
    }
    // Новый ответ юриста — сразу после самого срочного дела: его ждали, но срок подачи важнее.
    const answers = S.law.threads.filter((t) => t.unread).map((t) => ({ p: lawPurchase(t), thread: t.id, text: `Прочитать ответ юриста: «${t.title}»`, tone: "brand" }));
    out.splice(Math.min(1, out.length), 0, ...answers);
    return out;
  }
  const GO_LABEL = { tp: "Открыть ТП", check: "Открыть проверку", req: "Открыть требования", files: "Скачать документы" };
  // Кнопка дела: шаг закупки, окно документов заявки или разговор с юристом.
  const taskAttrs = (t) => t.thread ? `data-act="law-open" data-thread="${t.thread}"` : t.go === "files" ? `data-act="files" data-id="${t.p.id}"` : `data-go="${t.go}" data-id="${t.p.id}"`;
  const taskBadge = (t, long) => (t.thread ? badge("brand", "новый ответ") : dueBadge(t.p, long));
  const taskWhere = (t) => (t.p ? t.p.short : "Общий вопрос");

  // Самое срочное — крупно, с главной кнопкой; остальное — строками ниже.
  function nowHTML(tasks) {
    if (!tasks.length) return `<p class="all-done">${badge("ok", "всё сделано", "check")}По открытым закупкам делать нечего.</p>`;
    const [top, ...rest] = tasks;
    return `<div class="now">
        <div class="now-text">
          <div class="now-badges">${taskBadge(top, true)}${top.p && top.p.sample ? badge("calm", "пример") : ""}</div>
          <p class="now-title">${esc(top.text)}</p>
          <p class="now-sub">${esc(taskWhere(top))}${top.p ? ` · ${esc(top.p.customer)}` : ""}</p>
        </div>
        <button class="btn" type="button" ${taskAttrs(top)}>${top.thread ? "Прочитать ответ" : GO_LABEL[top.go]}${ic("chev", 16)}</button>
      </div>
      ${rest.length ? `<ul class="plist">${rest.map((t) => `<li><button class="prow task" type="button" ${taskAttrs(t)}>
        <span class="todo-dot ${t.tone}" aria-hidden="true"></span>
        <span class="prow-text"><span class="prow-title">${esc(t.text)}</span><span class="prow-sub">${esc(taskWhere(t))}</span></span>
        ${taskBadge(t)}
        <span class="chev">${ic("chev", 16)}</span>
      </button></li>`).join("")}</ul>` : ""}`;
  }

  // Этапы — как колонки доски у Контур.Закупок и этапы у Тендерплана, но по нашему пути из трёх шагов.
  const LANES = [
    { key: "tp", title: "Техническое предложение" },
    { key: "check", title: "Проверка заявки" },
    { key: "ready", title: "Готово к подаче" },
    { key: "closed", title: "Приём закончился" },
  ];
  function laneOf(p) {
    const due = dueLine(p.deadline, false);
    if (due && due.days < 0) return "closed";
    const [, tp, check] = stepsOf(p);
    if (check.state === "done") return "ready";
    return p.check.state === "done" || tp.state === "done" ? "check" : "tp";
  }
  // Что на этапе ждёт вас — одной строкой под числом.
  function laneNote(key, list) {
    const steps = list.map((p) => stepsOf(p));
    if (!list.length) return { tone: "", text: "нет закупок" };
    if (key === "tp") {
      const fix = steps.filter(([, tp]) => tp.state === "fix").length;
      return fix ? { tone: "warn", text: `${fix} ${plural(fix, "ждёт", "ждут", "ждут")} ваших данных` } : { tone: "brand", text: "составить ТП" };
    }
    if (key === "check") {
      const bad = list.filter((p) => p.check.state === "done" && checkCounts(p).bad).length;
      return bad ? { tone: "bad", text: `${bad} с ошибками` } : { tone: "brand", text: "проверить перед подачей" };
    }
    if (key === "ready") return { tone: "ok", text: "можно подавать" };
    return { tone: "", text: "срок прошёл" };
  }
  function dealsHTML(list) {
    const lane = S.lane && list.some((p) => laneOf(p) === S.lane) ? S.lane : null;
    const shown = lane ? list.filter((p) => laneOf(p) === lane) : list;
    const lanes = LANES.map((l) => {
      const inLane = list.filter((p) => laneOf(p) === l.key);
      const note = laneNote(l.key, inLane);
      return `<button class="lane" type="button" data-act="lane" data-lane="${l.key}" aria-pressed="${lane === l.key}"${inLane.length ? "" : " disabled"}>
        <span class="lane-title">${l.title}</span>
        <span class="lane-count">${inLane.length}</span>
        <span class="lane-note ${note.tone}">${esc(note.text)}</span>
      </button>`;
    }).join("");
    const rows = shown.map((p) => `<li><button class="deal" type="button" data-go="p" data-id="${p.id}">
        ${lawBadge(p)}
        <span class="deal-main"><span class="deal-title">${esc(p.short)}</span><span class="deal-sub">${esc([p.sample ? "пример" : "", p.customer].filter(Boolean).join(" · "))}</span></span>
        <span class="deal-tags">${stageBadge(p)}${dueBadge(p)}</span>
        <span class="chev">${ic("chev", 16)}</span>
      </button></li>`).join("");
    return `<div class="lanes" role="group" aria-label="Этапы: нажмите, чтобы оставить в таблице только этап">${lanes}</div>
      <div class="deals-head" aria-hidden="true"><span>Закупка</span><span>Что сейчас</span><span>До подачи</span></div>
      <ul class="deals">${rows}</ul>
      ${lane ? `<p class="home-foot">Показан этап «${esc(LANES.find((l) => l.key === lane).title)}». <button class="link quiet" type="button" data-act="lane" data-lane="${lane}">Показать все закупки</button></p>` : ""}`;
  }

  function homeHTML() {
    const list = [...S.purchases].sort(byUrgency);
    const tasks = tasksOf();
    const filled = filledCount(), total = PROFILE_KEYS.length, missing = total - filled;
    const tpSamples = samplesOf("tp").length;
    const dataRow = (screen, icon, title, sub, tag, extra = "") => `<li><button class="prow task" type="button" data-go="${screen}">
        <span class="law icon" aria-hidden="true">${ic(icon, 16)}</span>
        <span class="prow-text"><span class="prow-title">${title}</span><span class="prow-sub">${sub}</span>${extra}</span>
        ${tag}
        <span class="chev">${ic("chev", 16)}</span>
      </button></li>`;
    const start = `<section class="panel" aria-labelledby="start-title">
        <div class="panel-head"><h2 class="panel-title" id="start-title">С чего начать</h2><button class="link quiet small" type="button" data-go="help">Как это работает</button></div>
        <ol class="start-steps">
          <li><span class="num" aria-hidden="true">1</span><p class="small"><b>Загрузите документы закупки</b></p><p class="small ink2">Извещение, ТЗ и проект контракта — PDF, Word, сканы или фото.</p></li>
          <li><span class="num" aria-hidden="true">2</span><p class="small"><b>Пройдите три шага</b></p><p class="small ink2">Требования, техническое предложение, проверка заявки. Каждый шаг подскажет, что делать дальше.</p></li>
          <li><span class="num" aria-hidden="true">3</span><p class="small"><b>Подайте заявку на площадке</b></p><p class="small ink2">Срок подачи и сколько дней осталось — всегда в шапке закупки.</p></li>
        </ol>
        <div class="panel-foot"><button class="btn" type="button" data-go="new">${ic("plus")}Загрузить документы закупки</button><span class="or">или <button class="link" type="button" data-act="sample">посмотреть на примере</button></span></div>
      </section>`;
    return `<div class="home">
      ${list.length ? `<section class="panel" aria-labelledby="now-title">
        <div class="panel-head"><h2 class="panel-title" id="now-title">Сейчас важно${tasks.length ? ` <span class="count">${tasks.length}</span>` : ""}</h2></div>
        ${nowHTML(tasks)}
      </section>
      <section class="panel" aria-labelledby="deals-title">
        <div class="panel-head"><div><h2 class="panel-title" id="deals-title">Закупки по этапам <span class="count">${list.length}</span></h2><p class="panel-sub">Нажмите на этап — останутся только его закупки</p></div><button class="link small" type="button" data-go="list">Все закупки</button></div>
        ${dealsHTML(list)}
      </section>` : start}
      <section class="panel" aria-labelledby="mine-title">
        <div class="panel-head"><div><h2 class="panel-title" id="mine-title">Данные компании</h2><p class="panel-sub">Вписываются один раз и сами подставляются в анкету, декларацию и цену</p></div></div>
        <ul class="plist">
          ${dataRow("profile", "user", "Реквизиты", `Заполнено ${filled} из ${total}`, missing ? badge("warn", `не хватает ${missing} ${plural(missing, "поля", "полей", "полей")}`, "pen") : badge("ok", "заполнены", "check"), `<span class="meter" aria-hidden="true"><i style="width:${Math.round((filled / total) * 100)}%"></i></span>`)}
          ${dataRow("docs", "folder", "Образцы и реквизиты", S.docs.length ? `${S.docs.length} ${plural(S.docs.length, "документ", "документа", "документов")} · по ним пишутся новые` : "Прошлые заявки — чтобы писать в вашем стиле", tpSamples ? badge("ok", `ТП: ${tpSamples}`, "check") : badge("warn", "нет образцов ТП", "alert"))}
        </ul>
      </section>
    </div>
    <p class="foot">Прототип: закупки, документы и ответы вымышленные. Файлы не читаются, ничего не сохраняется и никуда не отправляется. Ответы ИИ не являются юридической консультацией — проверяйте нормы по первоисточнику.</p>`;
  }

  /* ---------- вопросы: общий чат и чат закупки ---------- */
  function msgHTML(m, p, i) {
    if (m.role === "user") {
      const files = (m.files || []).length ? `<div class="msg-files">${m.files.map((n) => `<span class="file-chip plain">${ic("file", 14)}<span class="fc-name">${esc(n)}</span></span>`).join("")}</div>` : "";
      return files + (m.text ? `<div class="msg user">${esc(m.text)}</div>` : "");
    }
    const done = m.done !== false;
    const refs = (m.src || []).map((r) => refBtn(r, p)).join("");
    return `<div class="msg bot">${md(done ? m.text : m.shown)}${done && m.note ? `<p class="note-line">${esc(m.note)}</p>` : ""}${done ? `<div class="msg-meta">${refs ? `<span class="refs">Источники: ${refs}</span>` : ""}<button class="link quiet" type="button" data-act="lawyer" data-i="${i}">Спросить юриста</button></div>` : ""}</div>`;
  }
  const feedInner = (messages, thinking, p) => messages.map((m, i) => msgHTML(m, p, i)).join("") + (thinking ? '<p class="thinking">Изучаю документы и закон…</p>' : "");

  function chipsHTML(list, used) {
    const left = list.filter((q) => !used.includes(q));
    return left.map((q) => `<button class="chip" type="button" data-act="q" data-q="${esc(q)}">${esc(q)}</button>`).join("");
  }

  function composerHTML(kind, placeholder, attach) {
    const g = S.general;
    const talk = attach && g.docs.length ? `<div class="in-talk"><span>В разговоре:</span>${g.docs.map((n, i) => `<span class="file-chip">${ic("file", 14)}<span class="fc-name">${esc(n)}</span><button class="x" type="button" data-act="gdoc-x" data-i="${i}" aria-label="Убрать ${esc(n)} из разговора">${ic("x", 14)}</button></span>`).join("")}</div>` : "";
    return `<form class="composer" id="${kind}-form">
      ${talk}
      <div class="prompt">
        <textarea id="${kind}-q" rows="1" placeholder="${placeholder}" aria-label="Вопрос" data-enter>${esc(S.drafts[kind] || "")}</textarea>
        <div class="prompt-foot">
          ${attach ? `<label class="tool-btn" for="g-file">${ic("clip", 14)}Документ<input id="g-file" type="file" multiple class="sr-only"></label>` : "<span></span>"}
          <button class="circle send" type="submit" aria-label="Отправить">${ic("send")}</button>
        </div>
      </div>
      <p class="disclaimer">Ответы ИИ не являются юридической консультацией. Проверяйте нормы по первоисточнику.</p>
    </form>`;
  }

  // Разговор — остров: сообщения прокручиваются внутри, поле ввода прижато к низу острова.
  function chatHTML(kind, p, placeholder) {
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const empty = !messages.length && !holder.thinking;
    const used = messages.filter((m) => m.role === "user").map((m) => m.text);
    const intro = p
      ? `<h2 class="chat-title">Вопросы по закупке</h2><p>Спросите о чём угодно в этой закупке — отвечу по её документам со ссылкой на пункт и статью закона.</p><p class="chat-docs">Документы: ${p.files.map(esc).join(", ")}</p>`
      : '<h2 class="chat-title">Общий вопрос по 44-ФЗ и 223-ФЗ</h2><p>Отвечу со ссылкой на статью: тексты законов — в действующей редакции с официального портала. Приложите документ — отвечу и по нему.</p><p class="chat-docs">Вопрос про конкретную закупку задайте внутри неё, в «Вопросах», — отвечу по её документам.</p>';
    return `<section class="chat" aria-label="${p ? "Вопросы по закупке" : "Разговор"}">
      <div class="chat-scroll" id="chat-scroll" data-scroll><div class="chat-main">
        <div class="chat-empty" id="chat-intro"${empty ? "" : " hidden"}>${intro}</div>
        <div class="feed" id="feed"${empty ? " hidden" : ""}>${feedInner(messages, holder.thinking, p)}</div>
        <div class="chips" id="chips">${chipsHTML(p ? CHAT_SUGGEST : GENERAL_SUGGEST, used)}</div>
      </div></div>
      ${composerHTML(kind, placeholder, kind === "ask")}
    </section>`;
  }

  function askHTML() {
    const g = S.general;
    return `<div class="ws solo"><div class="pane"><div class="pane-body" id="pane-main">${chatHTML("ask", null, g.docs.length ? "Спросите про приложенные документы…" : "Задайте вопрос по закупкам…")}</div></div></div>`;

  /* ---------- закупки: список, закупка, сведения ---------- */
  function plistBodyHTML(sel) {
    if (!S.purchases.length) return `<div class="empty">
        <p>Закупок пока нет. Загрузите документы — выпишу требования и сроки.</p>

    const facts = [

      fact("landmark", "Заказчик", p.customer),

    }).join("") + p.unreadable.map((f) => `<li class="file"><span class="file-ic warn">${ic("alert", 16)}</span><span class="file-text"><span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span><span class="file-meta warn">не прочитан: ${esc(f.reason)}</span></span></li>`).join("");
    const del = S.ui.confirmDelete ? `<div class="confirm">

    return `<div class="pane-body" id="info-body" data-scroll>
      <div class="info-top">

      </div>

      ${fold("files", "Документы закупки", `<ul class="files">${files}</ul><label class="link" for="add-doc-2">Добавить документы<input id="add-doc-2" type="file" multiple class="sr-only"></label>`, p.files.length + p.unreadable.length)}
      <div class="info-foot">${del}</div>

  function workspaceHTML() {
    const p = PURCHASE_SCREENS.includes(S.screen) ? cur() : null;
    const empty = S.purchases.length
      ? '<div class="empty"><p>Выберите закупку в списке.</p></div>'
      : `<div class="empty"><p>Загрузите документы закупки — выпишу требования и сроки, составлю черновик технического предложения и отвечу на вопросы по документам.</p><div class="btn-row"><button class="btn" type="button" data-go="new">${ic("plus")}Новая закупка</button><span class="or">или <button class="link" type="button" data-act="sample">посмотреть на примере</button></span></div></div>`;
    return `<div class="ws" id="ws" data-pane="${p ? "main" : "list"}" data-sel="${p ? 1 : 0}" data-info="${S.info ? "open" : "closed"}">
      <section class="pane ws-list" aria-label="Мои закупки">
        <div class="list-head">
          <label class="search" for="plist-q">${ic("search", 16)}<input id="plist-q" type="search" placeholder="Найти закупку…" value="${esc(S.q)}" autocomplete="off"></label>
        </div>
        <div class="pane-body" id="plist-body" data-scroll>${plistBodyHTML(p)}</div>
      </section>
      <section class="pane ws-main" aria-labelledby="${p ? "pd-title" : "page-title"}">${p ? detailHTML(p) : empty}</section>
      ${p ? `<aside class="pane ws-info" id="ws-info" aria-label="Сведения о закупке">${infoHTML(p)}</aside>` : ""}
    </div>`;
  }

  function checkCounts(p) {
    return { bad: p.check.findings.filter((f) => f.kind === "bad").length, warn: p.check.findings.filter((f) => f.kind === "warn").length };
  }

  /* ---------- как оценят заявку ---------- */
  // Как в web/src/lib/criteria.ts: модель переписывает значимости, долю строки в итоговой сотне баллов считает код.
  function percentOf(text) {
    const m = /(\d+(?:[.,]\d+)?)\s*(%|процент)?/i.exec(text || "");
    if (!m) return null;
    let value = Number(m[1].replace(",", "."));
    if (!m[2] && value > 0 && value <= 1 && /[.,]/.test(m[1])) value *= 100;
    return value >= 0 && value <= 100 ? value : null;
  }
  const critKey = (t) => t.trim().toLowerCase();
  // Не указана значимость — у единственного пункта уровня весь уровень, у нескольких — неизвестно: делить поровну — догадка.
  const levelWeight = (text, alone) => percentOf(text) ?? (alone ? 100 : null);
  function groupCriteria(rows) {
    const groups = [];
    for (const row of rows) {
      const name = row.criterion.trim() || "Критерий без названия";
      let g = groups.find((x) => critKey(x.name) === critKey(name));
      if (!g) { g = { name, weight: null, raw: [] }; groups.push(g); }
      if (g.weight === null && row.criterionWeight.trim()) g.weight = percentOf(row.criterionWeight);
      g.raw.push(row);
    }
    return groups.map((g) => {
      const indicators = new Set(g.raw.filter((r) => r.indicator.trim()).map((r) => critKey(r.indicator)));
      const rows = g.raw.map((row) => {
        const siblings = g.raw.filter((r) => critKey(r.indicator) === critKey(row.indicator) && r.detail.trim());
        const ind = row.indicator.trim() ? levelWeight(row.indicatorWeight, indicators.size === 1) : 100;
        const det = row.detail.trim() ? levelWeight(row.detailWeight, siblings.length === 1) : 100;
        return { ...row, share: g.weight === null || ind === null || det === null ? null : (g.weight * ind * det) / 10000 };
      });
      return { name: g.name, weight: g.weight, rows };
    });
  }
  const weightsAddUp = (groups) => groups.length > 0 && groups.every((g) => g.weight !== null) && Math.abs(groups.reduce((s, g) => s + g.weight, 0) - 100) < 0.5;
  function pointsText(share) {
    const r = Math.round(share * 10) / 10;
    return `${r.toLocaleString("ru-RU")} ${Number.isInteger(r) ? plural(r, "балл", "балла", "баллов") : "балла"}`;
  }
  const isPriceCrit = (name) => /цен/i.test(name) && !/квалификац|характеристик|качеств/i.test(name);
  // Число и его единица — на одной строке: «20 %», «3 000 000 ₽», «5 лет».
  const glue = (t) => t.replace(/(\d) (?=\d{3}(?!\d))/g, "$1\u00a0").replace(/(\d) (?=%|₽|руб|балл|лет|год|дн|раз|специалист|договор|контракт)/g, "$1\u00a0");

  function critSummary(c, groups) {
    if (c.howWins === "price") return "Побеждает наименьшая цена — баллов нет.";
    if (!weightsAddUp(groups)) return "Побеждает больше баллов. Значимости критериев — в строках ниже.";
    const price = groups.filter((g) => isPriceCrit(g.name)).reduce((s, g) => s + g.weight, 0);
    if (price === 0) return "Побеждает больше баллов из 100. Цена баллов не даёт — решают критерии ниже.";
    if (price === 100) return "Побеждает больше баллов из 100 — и все они за цену.";
    return `Побеждает больше баллов из 100: цена — до ${pointsText(price)}, остальное — до ${pointsText(100 - price)}.`;
  }
  function critRowHTML(id, title, sub, row) {
    const points = row.share !== null ? `до ${pointsText(row.share)}` : [row.indicatorWeight, row.detailWeight].filter((w) => w.trim()).join(" · ") || "значимость не указана";
    const fact = (label, text) => (text.trim() ? `<p class="crit-fact"><span>${label}: </span>${esc(glue(text))}</p>` : "");
    return `<li>
      <div class="crit-head"><div class="crit-name"><span class="crit-title">${esc(title)}</span>${sub ? `<span class="crit-sub">${esc(sub)}</span>` : ""}</div><span class="badge brand">${esc(points)}</span></div>
      ${fact("Как считают", row.scoring)}${fact("Что приложить", row.proof)}${fact("Форма", row.form)}
      ${sourceHTML(id, row.source, row.quote, row.verified, "строку")}
    </li>`;
  }
  // Шаг 1: сколько из 100 баллов решает цена и за что дают остальные — с цитатами из порядка оценки.
  function criteriaHTML(p) {
    const c = p.criteria;
    if (!c || (c.howWins === "unknown" && !c.rows.length)) return "";
    const groups = groupCriteria(c.rows);
    const body = groups.map((g, gi) => {
      const single = g.rows.length === 1 && !g.rows[0].indicator.trim();
      if (single) return critRowHTML(`crit-${gi}-0`, g.name, "", { ...g.rows[0], share: g.weight });
      return `<li class="crit-group">
        <div class="crit-cap"><span class="eyebrow">${esc(g.name)}</span>${g.weight !== null ? `<span class="panel-sub">всего до ${pointsText(g.weight)}</span>` : ""}</div>
        <ul class="crit-rows">${g.rows.map((row, ri) => critRowHTML(`crit-${gi}-${ri}`, row.detail.trim() || row.indicator.trim(), row.detail.trim() ? row.indicator : "", row)).join("")}</ul>
      </li>`;
    }).join("");
    return `<section class="panel" aria-labelledby="req-criteria"><div class="panel-head"><div><h3 class="panel-title" id="req-criteria">Как оценят заявку</h3><p class="panel-sub">${critSummary(c, groups)}</p></div></div>
      ${c.howWins === "points" && !groups.length ? `<p class="empty-group">Порядок оценки заявок не нашёл. Обычно он отдельным файлом к извещению — добавьте его, и я выпишу, за что дают баллы.</p>` : ""}
      ${groups.length ? `<ul class="list">${body}</ul>` : ""}
      ${c.howWins === "points" && groups.length && !weightsAddUp(groups) ? `<p class="unver crit-warn">${ic("alert", 16)}Значимости критериев в сумме не 100 % — сверьте с порядком оценки: что-то могло не выписаться.</p>` : ""}
    </section>`;
  }

  /* ---------- требования ---------- */
  function reqHTML(p) {
    const unverified = REQ_KEYS.reduce((n, k) => n + p.requirements[k].filter((it) => !it.verified).length, 0) + (p.criteria ? p.criteria.rows.filter((r) => !r.verified).length : 0);
    const notes = warnsHTML([
      p.unreadable.length ? `Не получилось прочитать: ${p.unreadable.map((f) => `${esc(f.name)} — ${esc(f.reason)}`).join("; ")}. Требования выписаны по остальным файлам.` : "",
      scanWarning(p),
      unverified ? `В ${unverified} ${plural(unverified, "пункте", "пунктах", "пунктах")} цитата не найдена в документах дословно — сверьте их вручную.` : "",
    ].filter(Boolean));
    return `<div class="tab-body">
      <p class="tab-lead">Шаг 1 — разобраться, подходит ли вам закупка и что подать. Всё выписано из документов закупки; нажмите на ссылку под пунктом, чтобы увидеть точную цитату.</p>
      ${notes ? `<div class="notes">${notes}</div>` : ""}
      ${priceTeaserHTML(p)}
      ${REQ_KEYS.map((key) => {
        const items = p.requirements[key];
        return `${key === "submit" ? criteriaHTML(p) : ""}<section class="panel" aria-labelledby="req-${key}"><div class="panel-head"><h3 class="panel-title" id="req-${key}">${GROUPS[key].title}${items.length ? ` <span class="count">${items.length}</span>` : ""}</h3></div>
          ${items.length ? `<ul class="list">${items.map((it, i) => `<li><span>${esc(it.text)}</span>${sourceHTML(`${key}-${i}`, it.source, it.quote, it.verified, "пункт")}</li>`).join("")}</ul>` : `<p class="empty-group">${GROUPS[key].empty}</p>`}
        </section>`;
      }).join("")}
      ${nextHTML(p, "req")}
    </div>`;
  }

  // Ссылка на источник: нажали — под ней точная цитата; ненайденная дословно помечена янтарём.
  function sourceHTML(id, source, quote, verified, what) {
    const open = S.ui.open === id;
    return `<button class="src" type="button" data-act="toggle" data-open="${id}" aria-expanded="${open}">${ic("file", 12)}${esc(source || "цитата из ТЗ")}</button>
      ${open ? `<blockquote class="quote">${esc(quote)}</blockquote>` : ""}
      ${verified ? "" : `<p class="unver">${ic("alert", 16)}Не нашёл эту цитату в документах дословно — сверьте ${what} вручную.</p>`}`;
  }

  /* ---------- техническое предложение ---------- */
  const TP_STEPS = ["Ищу в документах форму заявки…", "Читаю ТЗ…", "Выписываю товары и характеристики…", "Готовлю предложение по пунктам…", "Сверяю цитаты с ТЗ…"];

  function tpNotes(p) {
    const tp = p.tp;
    const fill = itemsFill(tp);
    const cast = castTodo(tp);
    const leaks = leaksOf(tp);
    const own = castLeaks(tp);
    const unverified = [...tp.goods, ...tp.items].filter((r) => !r.verified).length;
    const points = `${fill} ${plural(fill, "пункт", "пункта", "пунктов")}`;
    let h = fill && cast
      ? noteHTML("warn", `Впишите свои данные в ${points} и состав исполнителей. Пункты выделены жёлтым — нажмите на текст, чтобы исправить.`, "", "pen")
      : fill ? noteHTML("warn", `Впишите свои данные в ${points} — они выделены жёлтым. Нажмите на текст, чтобы исправить.`, "", "pen")
      : cast ? noteHTML("warn", "Осталось вписать состав исполнителей — он ниже, после пунктов ТЗ.", "", "pen")
      : noteHTML("ok", "Все пункты заполнены.", "", "check");
    return h + warnsHTML([
      leaks.length ? `В техническом предложении есть ваши данные: ${leaks.map((v) => `«${esc(v)}»`).join(", ")}. Уберите их — ТП подают в первую часть заявки анонимно, иначе заявку отклонят.` : "",
      own.length ? `Среди исполнителей — ${own.map((v) => `«${esc(v)}»`).join(", ")}, как в подписи заявки. ТП подают в первую часть заявки анонимно: прежде чем подавать, уточните у юриста, не раскроет ли это участника.` : "",
      unverified ? `В ${unverified} ${plural(unverified, "строке", "строках", "строках")} цитата не найдена в документах дословно — сверьте их вручную.` : "",
      scanWarning(p),
    ].filter(Boolean));
  }

  function editHTML(key, value, label) {
    if (S.ui.editing === key) return `<textarea class="edit-area" id="edit-${key.replace(":", "-")}" data-edit="${key}" data-label="${esc(label)}" aria-label="${esc(label)}">${esc(value)}</textarea>`;
    return `<button class="edit" type="button" data-act="edit" data-edit="${key}" data-label="${esc(label)}" aria-label="Изменить: ${esc(label)}">${fields(value)}</button>`;
  }

  function priceInfo(p) {
    const nmck = parseRub(p.price);
    const price = p.tpPrice;
    const drop = nmck && price ? (1 - price / nmck) * 100 : null;
    const percent = drop !== null ? drop.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) : "";
    let h = "";
    if (price) h += `<p class="small ink2">Прописью: ${esc(rublesInWords(price))}</p>`;
    if (nmck) h += `<p class="small muted">Начальная цена — ${fmtRub(nmck)} ₽${drop !== null && drop > 0 ? ` · снижение ${percent}%` : ""}</p>`;
    if (drop !== null && drop < 0) h += noteHTML("warn", "Цена выше начальной — такую заявку отклонят.", "", "alert");
    if (drop !== null && drop >= 25) h += noteHTML("warn", `Снижение ${percent}% — это 25% и больше. ${esc(p.tp.antiDumping.rule || "В таких случаях обычно действуют антидемпинговые меры: обеспечение исполнения в полтора раза больше или подтверждение опыта. Проверьте условия в извещении.")}`, "", "alert");
    return h;
  }

  // Готовая часть заявки актуальна, пока не изменились цена, реквизиты и образцы, по которым она составлена.
  const basisKey = (p, k) => JSON.stringify({ price: p.tp.form.hasPrice ? p.tpPrice || null : null, profile: S.profile, samples: samplesOf(PART_SAMPLE_KIND[k]).map((d) => d.id) });
  function basisText(p, k) {
    const form = p.tp.form.partForms && p.tp.form.partForms[k];
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    if (form && samples.length) return `по форме заказчика (${form}) и вашему образцу «${samples[0].name}»`;
    if (samples.length) return `по вашему образцу «${samples[0].name}»`;
    if (form) return `по форме заказчика (${form})`;
    return "по обычной форме — ни формы заказчика, ни образца нет";
  }
  function partRow(p, k) {
    const made = p.parts[k];
    const fresh = made && made.key === basisKey(p, k);
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    const writing = S.ui.writing === k;
    const status = p.sample ? (isEvidence(k) ? EVIDENCE_DEMO[k].score : "в примере — по стандартному шаблону")
      : writing ? "Пишу документ — это около минуты…"
      : fresh ? esc(made.basis)
      : made ? "реквизиты, цена или образцы изменились — составлю заново"
      : samples.length ? `составлю по вашему образцу «${esc(samples[0].name)}»${samples.length > 1 ? ` и ещё ${samples.length - 1}` : ""}`
      : "ваших образцов нет — составлю по форме заказчика";
    return `<li>
      <span class="part-name">${esc(PART_TITLES[k])}</span>
      <button class="btn soft xs" type="button" data-act="part" data-part="${k}"${S.ui.writing ? " disabled" : ""}>${writing ? "Пишу…" : "Скачать"}</button>
      <span class="part-status">${status}${fresh && !p.sample && !writing ? ` · <button class="link quiet" type="button" data-act="part-redo" data-part="${k}">составить заново</button>` : ""}</span>
      ${p.sample && isEvidence(k) ? `<ul class="part-gaps">${EVIDENCE_DEMO[k].gaps.map((g) => `<li>${ic("alert", 16)}${esc(g)}</li>`).join("")}</ul>` : ""}
    </li>`;
  }
  const partsRows = (p) => partsOf(p.tp.form, p.criteria).filter((k) => k !== "tp").map((k) => partRow(p, k)).join("");

  /* ---------- состав исполнителей ---------- */
  // ТЗ требует назвать исполнителей. Кто нужен — выписано из ТЗ, людей участник вписывает под эту закупку:
  // состав каждый раз свой, поэтому справочника нет. Подсказки при наборе — люди из прошлых закупок.
  const RANK_NEED = ["", "«Заслуженный артист Российской Федерации»", "«Народный артист Российской Федерации»"];
  const RANK_SHORT = ["", "заслуженного артиста", "народного артиста"];
  const CAST_TITLES = ["Народный артист России", "Народная артистка России", "Заслуженный артист России", "Заслуженная артистка России", "Лауреат международного конкурса", "Лауреат всероссийского конкурса"];
  // Кого участник вписывал в прошлых закупках. В приложении — из закупок в этом браузере, в прототипе — пример.
  const CAST_HISTORY = [
    { name: "Соколова Мария Андреевна", title: "Заслуженная артистка России", from: "Учитель года — 2025" },
    { name: "Громов Павел Сергеевич", title: "Народный артист России", from: "День города — 2024" },
    { name: "Лебедев Игорь Викторович", title: "Лауреат международного конкурса", from: "Учитель года — 2025" },
    { name: "Орлова Дарья Игоревна", title: "", from: "День города — 2024" },
    { name: "Ким Артём Олегович", title: "", from: "Учитель года — 2025" },
    { name: "Белова Нина Петровна", title: "Лауреат всероссийского конкурса", from: "Выпускной — 2025" },
    { name: "Соловьёв Денис Андреевич", title: "", from: "Выпускной — 2025" },
  ];
  const CAST_EXAMPLE = "Лебедев Игорь Викторович, скрипка, лауреат международного конкурса\nСоколова Мария Андреевна, вокал, заслуженная артистка России\nОрлова Дарья Игоревна, фортепиано\nКим Артём Олегович, виолончель\nБелова Нина Петровна, флейта";

  // Звание — по словам: «народный артист» выше «заслуженного», другие звания требованию из ТЗ не засчитываются.
  const rankOf = (title) => (/народн\S*\s+артист/i.test(title || "") ? 2 : /заслуж\S*\s+артист/i.test(title || "") ? 1 : 0);
  function castRows(cast, key) { return cast.rows.filter((r) => r.group === key); }
  // Сверка с ТЗ по каждой позиции: хватает ли людей и нужного звания.
  function castCheck(cast) {
    return cast.groups.map((g) => {
      const named = castRows(cast, g.key).filter((r) => r.name.trim());
      const fit = g.rank ? named.filter((r) => rankOf(r.title) >= g.rank).length : named.length;
      const need = `${g.title}${g.rank ? ` со званием не ниже ${RANK_SHORT[g.rank]}` : ""}`;
      const one = g.count === 1;
      if (fit >= g.count) return { ok: true, rankFail: false, text: `${need} — ${one ? "есть" : `${fit} ${plural(fit, "человек", "человека", "человек")}, по ТЗ не менее ${g.count}`}` };
      if (named.length < g.count) return { ok: false, rankFail: false, text: `${need} — ${one ? "не указан" : named.length ? `вписано ${named.length}, по ТЗ не менее ${g.count}` : `по ТЗ не менее ${g.count} ${plural(g.count, "человека", "человек", "человек")}`}` };
      const blank = named.every((r) => !r.title.trim());
      return { ok: false, rankFail: true, text: `${need} — ${one ? (blank ? "впишите звание" : "у вписанного нет такого звания") : `с таким званием ${fit}, по ТЗ не менее ${g.count}`}` };
    });
  }
  function castTodo(tp) { return tp.cast ? castCheck(tp.cast).filter((c) => !c.ok).length : 0; }
  // Если среди исполнителей тот, кто подписывает заявку, его фамилия в ТП может выдать участника.
  function castLeaks(tp) {
    if (!tp.cast) return [];
    const surname = S.profile.signer.trim().split(/\s+/)[0] || "";
    const found = surname.length >= 4 && tp.cast.rows.some((r) => (r.name.trim().split(/\s+/)[0] || "").toLowerCase() === surname.toLowerCase());
    return found ? [surname] : [];
  }
  function castNote(g, r, rankFail) {
    if (!g.rank || !rankFail || !r.name.trim() || rankOf(r.title) >= g.rank) return "";
    return `${r.title.trim() ? "Не вижу нужного звания" : "Впишите звание"}: по ТЗ — не ниже ${RANK_NEED[g.rank]}`;
  }
  const castChecksHTML = (checks) => checks.map((c) => `<li class="${c.ok ? "ok" : "warn"}">${ic(c.ok ? "check" : "alert", 16, 2)}<span>${esc(c.text)}</span></li>`).join("");
  function castRowHTML(g, r, i, rankFail) {
    const who = `${g.one} ${i + 1}`;
    const note = castNote(g, r, rankFail);
    const box = (field, placeholder, label) => `<div class="cast-field"><input class="input" id="cast-${field}-${r.id}" data-cast="${field}" data-row="${r.id}" value="${esc(r[field])}" placeholder="${placeholder}" aria-label="${esc(who)}: ${label}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"></div>`;
    return `<li class="cast-row">
      <span class="cast-n" aria-hidden="true">${i + 1}</span>
      <div class="cast-fields">${box("name", "Фамилия, имя, отчество", "фамилия, имя, отчество")}${box("title", g.rank ? "Почётное звание" : "Звание, если есть", "почётное звание")}</div>
      <button class="icon-btn xs" type="button" data-act="cast-del" data-key="${r.id}" aria-label="Убрать: ${esc(who.toLowerCase())}">${ic("x", 16)}</button>
      <p class="cast-row-note" id="cast-note-${r.id}"${note ? "" : " hidden"}>${ic("alert", 14)}<span>${esc(note)}</span></p>
    </li>`;
  }
  function castHTML(p) {
    const cast = p.tp.cast;
    if (!cast) return "";
    const checks = castCheck(cast);
    const replace = cast.replace && p.sources[cast.replace.src] ? cast.replace : null;
    return `<section class="panel" id="cast" aria-labelledby="cast-title">
      <div class="panel-head">
        <div><h3 class="panel-title" id="cast-title">Состав исполнителей${checks.some((c) => !c.ok) ? ' <span class="flag" data-flag>впишите исполнителей</span>' : ""}</h3>
        <p class="panel-sub">Кто выступит в этот раз, знаете только вы. ИИ фамилий не видит и не придумывает.</p></div>
        <button class="btn soft xs" type="button" data-act="cast-paste" aria-expanded="${S.ui.castPaste ? "true" : "false"}">Вставить списком</button>
      </div>
      <div class="cast-body">
        <div class="cast-need"><p class="need">В ТЗ${cast.clause ? `, п. ${esc(cast.clause)}` : ""}: ${esc(cast.requirement)}</p>${sourceHTML("cast", "", cast.quote, cast.verified, "состав")}</div>
        ${S.ui.castPaste ? `<div class="paste-box">
          <label for="cast-paste-text">Список исполнителей: по человеку в строке — ФИО, через запятую роль и звание</label>
          <textarea class="input" id="cast-paste-text" placeholder="Соколова Мария Андреевна, вокал, заслуженная артистка России">${esc(S.ui.castText || "")}</textarea>
          <div class="btn-row"><button class="btn xs" type="button" data-act="cast-split">Разложить по строкам</button><button class="btn soft xs" type="button" data-act="cast-paste">Отмена</button><button class="link quiet" type="button" data-act="cast-example">Вставить пример</button></div>
        </div>` : ""}
        <ul class="cast-checks" id="cast-checks" aria-label="Сверка с ТЗ">${castChecksHTML(checks)}</ul>
        ${cast.groups.map((g, gi) => {
          const rows = castRows(cast, g.key);
          return `<div class="cast-group" role="group" aria-labelledby="cg-${g.key}">
            <div class="cast-group-head"><h4 id="cg-${g.key}">${esc(g.title)}</h4><span class="need">${g.count === 1 ? "1 человек" : `не менее ${g.count} человек`}${g.rank ? ` · звание не ниже ${RANK_NEED[g.rank]}` : ""}</span></div>
            ${rows.length ? `<ol class="cast-rows">${rows.map((r, i) => castRowHTML(g, r, i, checks[gi].rankFail)).join("")}</ol>` : ""}
            <button class="link cast-add" type="button" data-act="cast-add" data-key="${g.key}">${ic("plus", 16)}Добавить ${esc(g.acc)}</button>
          </div>`;
        }).join("")}
        ${replace ? `<div class="cast-foot"><p class="m0">Состав поменяется после подачи? ${esc(replace.text)}</p>${refBtn({ doc: replace.src }, p)}</div>` : ""}
      </div>
    </section>`;
  }
  // Статусы и пометки — на месте, без перерисовки полей: курсор остаётся там, где печатают.
  function refreshCast(p) {
    const cast = p.tp.cast;
    const checks = castCheck(cast);
    const box = $("#cast-checks");
    if (box) box.innerHTML = castChecksHTML(checks);
    cast.groups.forEach((g, gi) => castRows(cast, g.key).forEach((r) => {
      const el = document.getElementById(`cast-note-${r.id}`);
      if (!el) return;
      const note = castNote(g, r, checks[gi].rankFail);
      el.hidden = !note;
      el.querySelector("span").textContent = note;
    }));
    const title = $("#cast-title"), flag = title && title.querySelector("[data-flag]");
    const todo = checks.some((c) => !c.ok);
    if (todo && title && !flag) title.insertAdjacentHTML("beforeend", ' <span class="flag" data-flag>впишите исполнителей</span>');
    else if (!todo && flag) flag.remove();
    $("#tp-notes").innerHTML = tpNotes(p);
    refreshCounts();
  }

  // Подсказки при наборе: фамилии — из прошлых закупок, звания — обычные почётные звания.
  let sug = null;
  function castPeople(p) {
    const seen = new Set(p.tp.cast.rows.map((r) => r.name.trim().toLowerCase()));
    const past = S.purchases.filter((x) => x !== p && x.tp && x.tp.cast)
      .flatMap((x) => x.tp.cast.rows.filter((r) => r.name.trim()).map((r) => ({ name: r.name.trim(), title: r.title.trim(), from: x.short })));
    return [...past, ...CAST_HISTORY].filter((h) => {
      const k = h.name.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }
  function sugItems(p, input) {
    const q = input.value.trim().toLowerCase().replace(/\s+/g, " ");
    if (input.dataset.cast === "title") return CAST_TITLES.filter((t) => t.toLowerCase().includes(q) && t.toLowerCase() !== q).map((t) => ({ value: t }));
    if (!q) return [];
    return castPeople(p)
      .filter((h) => { const words = h.name.toLowerCase().split(/\s+/); return words.some((w, i) => words.slice(i).join(" ").startsWith(q)); })
      .slice(0, 6)
      .map((h) => ({ value: h.name, title: h.title, sub: `${h.title ? `${h.title} · ` : ""}из закупки «${h.from}»` }));
  }
  function showSug(p, input) {
    const items = sugItems(p, input);
    if (sug && sug.input !== input) hideSug();
    if (!items.length) { hideSug(); return; }
    sug = { input, items, active: -1 };
    let list = $("#cast-sug");
    if (!list) { input.insertAdjacentHTML("afterend", '<ul class="sug" id="cast-sug" role="listbox"></ul>'); list = $("#cast-sug"); }
    list.setAttribute("aria-label", input.dataset.cast === "name" ? "Люди из прошлых закупок" : "Почётные звания");
    list.innerHTML = items.map((it, i) => `<li role="option" id="cast-sug-${i}" data-sug="${i}" aria-selected="false"><span>${esc(it.value)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</li>`).join("");
    input.setAttribute("aria-expanded", "true");
    input.setAttribute("aria-controls", "cast-sug");
    input.removeAttribute("aria-activedescendant");
  }
  function hideSug() {
    const list = $("#cast-sug");
    if (list) list.remove();
    if (sug) {
      sug.input.setAttribute("aria-expanded", "false");
      sug.input.removeAttribute("aria-controls");
      sug.input.removeAttribute("aria-activedescendant");
    }
    sug = null;
  }
  function moveSug(step) {
    const n = sug.items.length;
    sug.active = step > 0 ? (sug.active + 1) % n : sug.active <= 0 ? n - 1 : sug.active - 1;
    document.querySelectorAll("#cast-sug [data-sug]").forEach((li, i) => li.setAttribute("aria-selected", String(i === sug.active)));
    sug.input.setAttribute("aria-activedescendant", `cast-sug-${sug.active}`);
    const li = $(`#cast-sug-${sug.active}`);
    if (li) li.scrollIntoView({ block: "nearest" });
  }
  function pickSug(i) {
    const p = cur(), it = sug && sug.items[i];
    if (!p || !it) return;
    const input = sug.input;
    const row = p.tp.cast.rows.find((r) => r.id === input.dataset.row);
    hideSug();
    if (!row) return;
    input.value = it.value;
    row[input.dataset.cast] = it.value;
    // Человек из прошлой закупки — вместе со званием, если звание ещё не вписано
    if (input.dataset.cast === "name" && it.title && !row.title.trim()) {
      row.title = it.title;
      const t = document.getElementById(`cast-title-${row.id}`);
      if (t) t.value = it.title;
    }
    refreshCast(p);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  function onCastInput(input) {
    const p = cur();
    const row = p && p.tp && p.tp.cast && p.tp.cast.rows.find((r) => r.id === input.dataset.row);
    if (!row) return;
    row[input.dataset.cast] = input.value;
    refreshCast(p);
    showSug(p, input);
  }

  // Список из сообщения или таблицы: человек в строке — ФИО, дальше через запятую роль и звание.
  // Раскладывается по позициям из ТЗ без ИИ: по роли, если она названа; со званием — туда, где звание нужно;
  // остальные — по порядку, лишние — новыми строками.
  const TITLE_WORDS = /артист|лауреат|дипломант|деятел|заслуж|народн|звани/i;
  function parseCast(text) {
    return text.split(/\n+/).map((line) => line.replace(/^\s*(?:\d+\s*[.)]|[-–—•*])\s*/, "").trim()).filter(Boolean).map((line) => {
      const parts = line.split(/\s*[,;\t]\s*|\s+[—–-]\s+/).map((x) => x.trim()).filter(Boolean);
      const name = (parts.shift() || "").replace(/\s+/g, " ");
      const title = parts.filter((x) => TITLE_WORDS.test(x)).join(", ");
      return { name, title: title.charAt(0).toUpperCase() + title.slice(1), rest: parts.join(" ") };
    }).filter((x) => x.name);
  }
  function splitCast(p) {
    const cast = p.tp.cast;
    const area = $("#cast-paste-text");
    const text = area ? area.value : S.ui.castText || "";
    const taken = new Set(cast.rows.map((r) => r.name.trim().toLowerCase()).filter(Boolean));
    const people = parseCast(text).filter((x) => {
      const k = x.name.toLowerCase();
      if (taken.has(k)) return false;
      taken.add(k);
      return true;
    });
    if (!people.length) {
      toast(text.trim() ? "Все из списка уже в составе." : "Вставьте список — по человеку в строке.");
      if (area) area.focus();
      return;
    }
    const empty = (g) => castRows(cast, g.key).filter((r) => !r.name.trim());
    const put = (g, x) => {
      const slot = empty(g)[0];
      if (slot) { slot.name = x.name; slot.title = x.title; }
      else cast.rows.push({ id: uid(), group: g.key, name: x.name, title: x.title });
    };
    const left = [];
    people.forEach((x) => {
      const g = cast.groups.find((gr) => gr.match && new RegExp(gr.match, "i").test(x.rest));
      if (g) put(g, x); else left.push(x);
    });
    cast.groups.filter((g) => g.rank).forEach((g) => empty(g).forEach((slot) => {
      const i = left.findIndex((x) => rankOf(x.title) >= g.rank);
      if (i < 0) return;
      const [x] = left.splice(i, 1);
      slot.name = x.name; slot.title = x.title;
    }));
    const plain = cast.groups.filter((g) => !g.rank);
    left.forEach((x) => put(plain.find((g) => empty(g).length) || plain[plain.length - 1] || cast.groups[cast.groups.length - 1], x));
    S.ui.castPaste = false;
    S.ui.castText = "";
    rerender();
    const btn = $('[data-act="cast-paste"]');
    if (btn) btn.focus({ preventScroll: true });
    toast(`Добавил из списка: ${people.length} ${plural(people.length, "человек", "человека", "человек")}. Проверьте, кто куда попал.`);
  }

  function tpHTML(p) {
    if (!p.tp) {
      const tpSamples = samplesOf("tp");
      return `<div class="tab-body"><section class="panel"><div class="panel-body">
        <p class="small ink2 m0">Шаг 2 — техническое предложение. Найду в документах форму заявки и заполню её, как тендерный юрист: товары с конкретными характеристиками, предложение по пунктам ТЗ, цена. Вам останется вписать то, что знаете только вы.</p>
        ${p.sample ? "" : `<p class="small muted m0">${tpSamples.length
          ? `Пишу по вашим техническим предложениям: ${tpSamples.length} ${plural(tpSamples.length, "документ", "документа", "документов")} из <button class="link" type="button" data-go="docs">«Образцов и реквизитов»</button>.`
          : 'Черновик будет в общем стиле. <button class="link" type="button" data-go="docs">Загрузите свои документы</button> — и ТП будет написано так, как пишете вы.'}</p>`}
        <div><button class="btn lg" type="button" data-act="compose">Составить черновик</button></div>
      </div></section></div>`;
    }
    const tp = p.tp;
    const goods = tp.goods.length ? `<section class="panel" aria-labelledby="tp-goods">
        <div class="panel-head"><h3 class="panel-title" id="tp-goods">Товары и оборудование <span class="count">${tp.goods.length}</span></h3></div>
        <ol class="items">${tp.goods.map((g, i) => `<li>
          <div class="item-head"><h4 class="m0">${i + 1}. ${esc(g.name)}</h4>${g.quantity ? `<span class="qty">${esc(g.quantity)}</span>` : ""}${needsFill(g.characteristics) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          ${sourceHTML(`g${i}`, g.source, g.quote, g.verified, "строку")}
          ${editHTML(`good:${i}`, g.characteristics, `Характеристики: ${g.name}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    const items = tp.items.length ? `<section class="panel" aria-labelledby="tp-items">
        <div class="panel-head"><h3 class="panel-title" id="tp-items">Предложение по пунктам ТЗ <span class="count">${tp.items.length}</span></h3></div>
        <ol class="items">${tp.items.map((it, i) => `<li>
          <div class="item-head"><h4 class="m0">${i + 1}. ${esc(it.topic)}</h4>${needsFill(it.offer) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          <p class="need">В ТЗ${it.clause ? `, п. ${esc(it.clause)}` : ""}: ${esc(it.requirement)}</p>
          ${sourceHTML(`i${i}`, "", it.quote, it.verified, "строку")}
          ${editHTML(`item:${i}`, it.offer, `Предложение: ${it.topic}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    return `<div class="tab-body">
      <p class="tab-lead">${tp.form.source
        ? `По форме заказчика: ${esc(tp.form.title)} (${esc(tp.form.source)}). Каждая часть заявки — отдельным файлом.`
        : "Формы заявки в документах нет — составлено как техническое предложение по пунктам ТЗ."} Техническое предложение идёт в первую часть заявки, поэтому в нём нет ни названия, ни ИНН, ни подписи участника.</p>
      <div class="notes" id="tp-notes">${tpNotes(p)}</div>
      ${tp.form.hasPrice ? `<section class="price">
          <label for="tp-price">Цена вашего предложения</label>
          <div class="price-row"><input class="input num" id="tp-price" inputmode="decimal" autocomplete="off" placeholder="например, 690000" value="${esc(p.tpPriceText)}"><span class="muted">₽</span></div>
          <div id="price-info" style="display:grid;gap:8px">${priceInfo(p)}</div>
          <p><button class="link" type="button" data-go="price" data-id="${p.id}">До какой цены снижаться</button></p>
        </section>` : ""}
      ${goods}
      ${items}
      ${castHTML(p)}
      ${S.ui.confirmRedo ? `<div class="confirm">
          <p>Составить черновик заново? Ваши правки в этом черновике пропадут.</p>
          <div class="btn-row"><button class="btn xs" type="button" data-act="redo">Составить заново</button><button class="btn xs soft" type="button" data-act="cancel-redo">Отмена</button></div>
        </div>` : '<p class="small muted m0 redo-line">Добавили документы или черновик не подходит? <button class="link" type="button" data-act="ask-redo">Составить заново</button></p>'}
      <section class="panel" aria-labelledby="tp-parts">
        <div class="panel-head"><div><h3 class="panel-title" id="tp-parts">Остальные части заявки</h3><p class="panel-sub">Каждая — отдельным файлом Word</p></div></div>
        <ul class="parts" id="parts-list">${partsRows(p)}</ul>
        <p class="parts-foot">Реквизиты берутся из <button class="link" type="button" data-go="profile">«Реквизитов»</button>, образцы — из <button class="link" type="button" data-go="docs">«Образцов и реквизитов»</button>. Чего там нет — выделено в Word жёлтым.</p>
      </section>
    </div>
    <div class="sticky-actions"><div class="bar"><button class="btn" type="button" data-act="preview-tp">Скачать техническое предложение</button><button class="btn line" type="button" data-go="check" data-id="${p.id}">Дальше: проверка заявки${ic("chev", 16)}</button></div></div>`;
  }

  /* ---------- проверка заявки ---------- */
  function checkHTML(p) {
    if (p.check.state !== "done") {
      return `<div class="tab-body">
        <p class="tab-lead">Шаг 3 — перед подачей. Загрузите свою заявку или техническое предложение: сверю их с ТЗ по каждому пункту и скажу, за что могут отклонить.</p>
        <section class="panel drop-box">${dropHTML("app", "Перетащите файл заявки сюда", "Загрузить заявку", { act: "sample-check", text: "проверить пример" })}</section>
      </div>`;
    }
    const { bad, warn } = checkCounts(p);
    const parts = [];
    if (bad) parts.push(`<span class="bad-t">${bad} ${plural(bad, "ошибку", "ошибки", "ошибок")}</span>`);
    if (warn) parts.push(`<span class="warn-t">${warn} ${plural(warn, "замечание", "замечания", "замечаний")}</span>`);
    const title = parts.length ? `Нашёл ${parts.join(" и ")}` : "Ошибок нет";
    const lead = bad ? "Исправьте ошибку до подачи — замечания тоже лучше поправить." : warn ? "Отклонять не за что, но замечания лучше поправить." : "Заявка соответствует ТЗ по всем пунктам.";
    const ok = p.check.ok;
    const found = p.check.findings.length;
    return `<div class="tab-body">
      <section class="panel verdict" aria-labelledby="check-verdict">
        <h3 class="check-title" id="check-verdict">${title}</h3>
        <p class="small ink2 m0">${lead}</p>
        <p class="under"><button class="link" type="button" data-act="recheck">${found ? "Проверить исправленный файл" : "Проверить другой файл"}</button><span>Сомневаетесь? <button class="link" type="button" data-act="lawyer" data-from="check">Спросить юриста</button></span></p>
      </section>
      <section class="panel" aria-labelledby="find-title">
        <div class="panel-head"><h3 class="panel-title" id="find-title">${found ? `Что исправить <span class="count">${found}</span>` : "Проверенные пункты"}</h3></div>
        <ul class="findings">${p.check.findings.map((f) => `<li class="finding ${f.kind}">
          <span class="ico" aria-hidden="true">${f.kind === "bad" ? "✕" : "!"}</span>
          <div style="display:grid;gap:4px"><p class="what">${esc(f.what)}</p><p class="todo">${esc(f.todo)}</p>${f.src && p.sources[f.src] ? refBtn({ doc: f.src }, p) : ""}</div>
        </li>`).join("")}
        <li class="finding ok"><span class="ico" aria-hidden="true">✓</span><div><p class="what">${found ? "Остальные" : "Все"} ${ok} ${plural(ok, "пункт", "пункта", "пунктов")} — в порядке.</p></div></li>
        </ul>
      </section>
      ${nextHTML(p, "check")}
    </div>`;
  }

  /* ---------- до какой цены снижаться ---------- */
  const showNum = (v) => (v === null || v === undefined ? "" : v.toLocaleString("ru-RU", { maximumFractionDigits: 2 }).replace(/[  ]/g, " "));
  function parseNum(text) {
    const s = String(text).replace(/\s/g, "").replace(",", ".");
    if (!s) return null;
    const v = Number(s);
    return Number.isFinite(v) && v >= 0 ? v : null;
  }
  const rub = (v) => `${fmtRub(v).replace("-", "−")} ₽`;
  // Снижение — с округлением вниз: 24,99 % не должно выглядеть как 25 %, с которых начинается антидемпинг.
  const dropText = (d) => (Math.floor(d * 1000 + 1e-6) / 10).toLocaleString("ru-RU", { maximumFractionDigits: 1 });
  const pctText = (v) => v.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  const secured = (c) => (c.securityPct || 0) > 0 && !(c.smeOnly && c.exempt);
  const rateOf = (c) => (c.method === "guarantee" ? c.guaranteeRatePct : c.moneyRatePct);
  const rated = (c) => (rateOf(c) || 0) > 0 && (c.days || 0) > 0;
  const adHint = (p, c) => `Снизите цену на 25 % и больше — обеспечение нужно в полтора раза больше обычного, но не меньше 10 % ${c.smeOnly ? "цены контракта" : "начальной цены"} (ч. 1 ст. 37).${/223/.test(p.kind) ? " Закупка по 223-ФЗ: такие меры — в положении о закупке заказчика; включите, если правила там те же." : ""}`;
  const adNone = (c) => (c.smeOnly && c.exempt
    ? "Вы освобождены от обеспечения, в том числе от повышенного (ч. 8.1 ст. 96), — на цену эти меры не влияют."
    : "Обеспечения исполнения нет — повышать нечего, на цену эти меры не влияют.");

  // Поле калькулятора: note — короткая строка под полем, help — подсказка «?» у подписи.
  function numField(key, id, label, unit, value, note, help) {
    return `<div class="num-field">
      <div class="label-row"><label for="${id}">${label}</label>${help ? hintBtn(label, help) : ""}</div>
      <div class="price-row"><input class="input calc" id="${id}" data-calc="${key}" inputmode="decimal" autocomplete="off" value="${esc(showNum(value))}"${note ? ` aria-describedby="${id}-note"` : ""}><span class="muted">${unit}</span></div>
      ${note ? `<p class="hint" id="${id}-note">${note}</p>` : ""}
    </div>`;
  }
  // Галочка с короткой подписью; условия и статьи — в подсказке «?».
  function checkRow(key, id, label, checked, help, shown = true, helpId = "") {
    return `<div class="check-row" id="${id}-row"${shown ? "" : " hidden"}>
      <input type="checkbox" id="${id}" data-calc="${key}"${checked ? " checked" : ""}>
      <div class="label-row"><label for="${id}">${label}</label>${help ? hintBtn(label, help, helpId) : ""}</div>
    </div>`;
  }
  const CALC_HELP = {
    nmck: "Начальная (максимальная) цена контракта — из извещения. Предложить больше нельзя: такую заявку отклонят.",
    costs: "Всё, что потратите на исполнение контракта: товар, работа, зарплата, аренда, доставка.",
    tax: "Например, 6 на УСН «доходы». Налог с прибыли не вписывайте: на нижней цене прибыли нет.",
    extra: "Обеспечение заявки, плата площадке, дорога — всё, что заплатите за участие.",
    security: "Залог на время исполнения контракта: деньги на счёте заказчика или банковская гарантия. Это тоже расход: гарантия стоит комиссию банка, а свои деньги на это время выключены из оборота. Если обеспечения нет, оставьте поле пустым.",
    sme: "Закупка только у малого бизнеса и социально ориентированных НКО. Тогда обеспечение считается от цены контракта, а не от начальной (ч. 6.2 ст. 96 44-ФЗ).",
    exempt: "Если за три года исполнили три контракта без неустоек на сумму не меньше начальной цены. Сведения из реестра контрактов подаёте до заключения контракта (ч. 8.1 ст. 96 44-ФЗ).",
    method: "Независимая гарантия — её обычно выдаёт банк: он обязуется заплатить заказчику, если вы не исполните контракт, и берёт за это комиссию. Свои деньги — переводите на счёт заказчика, их вернут после исполнения контракта.",
    goodFaith: "За три года — три контракта без неустоек, один из них — не меньше 20 % начальной цены. Тогда хватит обычного обеспечения. Сведения из реестра контрактов подаёте вместе с подписанным проектом контракта (ч. 2, 3 и 5 ст. 37).",
  };
  // Что учтено во второстепенном — одной строкой, чтобы было видно и в свёрнутом виде.
  function moreSummary(c) {
    const sec = secured(c);
    const parts = [
      (c.extra || 0) > 0 && `расходы на участие ${rubShort(c.extra)}`,
      sec ? `обеспечение ${pctText(c.securityPct || 0)} %${rated(c) ? ` — ${c.method === "guarantee" ? "гарантия" : "свои деньги"}` : " — впишите ставку и срок"}`
        : c.smeOnly && c.exempt ? "освобождены от обеспечения" : "без обеспечения исполнения",
      c.antiDumping && "антидемпинговые меры",
    ].filter(Boolean).join(" · ");
    return parts.charAt(0).toUpperCase() + parts.slice(1);
  }

  // Шкала цены: где убыток, где прибыль и докуда обеспечение повышенное. С ползунком — на экране «Цена»,
  // без — в блоке на шаге «Требования». Подпись у точки: у краёв прижата к краю, между ними сдвигается плавно.
  const anchored = (x) => `left:${x}%;translate:-${x}% 0`;
  const rubShort = (v) => rub(v).replace(",00 ₽", " ₽");
  const outcome = (b) => `${b.profit < 0 ? "убыток" : "прибыль"} ${rubShort(Math.abs(b.profit))}`;
  const valueText = (c, shown, b) => `${rubShort(shown)}, на ${dropText(1 - shown / c.nmck)} % ниже начальной${b ? `, ${outcome(b)}` : ""}`;
  function scaleHTML(c, interactive) {
    const { floor, at, raisedBelow } = priceFloor(c);
    const m = scaleModel(c.nmck, floor, raisedBelow);
    const shown = Math.min(Math.max(c.price ?? c.nmck, m.lo), m.hi);
    const floorInner = m.floorX !== null && floor.ok ? `Нижняя цена <b>${rubShort(floor.price)}</b>` : "";
    const top = !floorInner ? "" : interactive
      ? `<button class="scale-floor" type="button" data-act="floor-price" title="Поставить свою цену на нижнюю" style="${anchored(m.floorX)}">${floorInner}</button>`
      : `<p class="scale-floor" style="${anchored(m.floorX)}">${floorInner}</p>`;
    const zones = m.loss === "unknown" ? '<div class="zone none"></div>'
      : `${m.loss !== "none" ? `<div class="zone loss${m.loss === "all" ? " all" : ""}"${m.loss === "part" ? ` style="width:${m.floorX}%"` : ""}><span class="zone-label">${ic("alert", 14)}Убыток</span></div>` : ""}${m.loss !== "all" ? `<div class="zone ok${m.loss === "none" ? " all" : ""}"><span class="zone-label">${ic("check", 14, 2.5)}Без убытка</span></div>` : ""}`;
    const legend = [
      m.raisedX !== null ? `<span><i aria-hidden="true"></i>Снижение на 25 % и больше — обеспечение ${pctText(raisedPct(c.securityPct || 0))} %</span>` : "",
      m.loss === "all" ? "<span>Без убытка — только выше начальной цены</span>" : "",
      m.loss === "unknown" ? "<span>Впишите себестоимость — покажу, где начинается убыток</span>" : "",
    ].filter(Boolean).join("");
    return `<div class="scale" data-lo="${m.lo}" data-hi="${m.hi}" data-step="${m.step}">
      <div class="scale-top">${top}</div>
      <div class="scale-track">
        <div class="zones">${zones}</div>
        ${m.floorX !== null ? `<span class="scale-caret" aria-hidden="true" style="left:${m.floorX}%"></span>` : ""}
        ${interactive ? `<input class="scale-range" type="range" id="calc-range" data-calc="price" min="${m.lo}" max="${m.hi}" step="${m.step}" value="${shown}" aria-label="Ваша цена" aria-valuetext="${esc(valueText(c, shown, at(c.price ?? c.nmck)))}">` : ""}
        ${interactive || c.price !== null ? `<span class="scale-pin" aria-hidden="true" style="left:${m.x(shown)}%"></span>` : ""}
      </div>
      ${m.raisedX !== null ? `<div class="scale-band"><i style="width:${m.raisedX}%"></i></div>` : ""}
      <div class="scale-ticks">${m.ticks.map((t) => `<span${t.x === 100 ? ' class="word"' : ""} style="${anchored(t.x)}">${t.label}</span>`).join("")}</div>
      ${legend ? `<p class="scale-legend">${legend}</p>` : ""}
    </div>`;
  }
  // Наведение на шкалу: вместо подписи нижней цены — цена под курсором и что по ней останется.
  function scaleHover(el, clientX) {
    const track = el.querySelector(".scale-track");
    const box = track.getBoundingClientRect();
    const lo = Number(el.dataset.lo), hi = Number(el.dataset.hi), step = Number(el.dataset.step);
    const pos = Math.min(Math.max((clientX - box.left) / box.width, 0), 1);
    const price = Math.min(hi, lo + Math.round((pos * (hi - lo)) / step) * step);
    const x = ((price - lo) / (hi - lo)) * 100;
    const b = priceFloor(calcOf(cur())).at(price);
    const top = el.querySelector(".scale-top");
    if (el.dataset.top === undefined) el.dataset.top = top.innerHTML;
    top.innerHTML = `<p class="scale-tip" style="${anchored(x)}"><b>${rubShort(price)}</b>${b ? ` — ${outcome(b)}` : ""}</p>`;
    let line = track.querySelector(".scale-hover");
    if (!line) { line = document.createElement("span"); line.className = "scale-hover"; line.setAttribute("aria-hidden", "true"); track.appendChild(line); }
    line.style.left = `${x}%`;
  }
  function scaleUnhover(el) {
    if (el.dataset.top === undefined) return;
    el.querySelector(".scale-top").innerHTML = el.dataset.top;
    delete el.dataset.top;
    const line = el.querySelector(".scale-hover");
    if (line) line.remove();
  }
  // Что останется по вашей цене, а пока её нет — по начальной.
  function profitHTML(c) {
    const { at } = priceFloor(c);
    const mine = c.price ? at(c.price) : null;
    const b = mine || (c.nmck ? at(c.nmck) : null);
    if (!b) return "";
    const loss = b.profit < 0;
    return `<span class="profit-head">${mine ? "По вашей цене" : "По начальной цене"}</span>
      <span class="profit-line">${loss ? `<span class="bad-ic">${ic("alert", 16)}</span>` : `<span class="ok-ic">${ic("check", 16, 2.5)}</span>`}<span class="ink2">${loss ? "убыток" : "прибыль"}</span><span class="res-num">${rubShort(Math.abs(b.profit))}</span></span>
      ${Math.abs(b.profit) >= 0.5 ? `<span class="hint">${pctText(Math.round((Math.abs(b.profit) / b.price) * 1000) / 10)} % цены</span>` : ""}`;
  }
  const priceHint = (c) => (c.price !== null && c.nmck !== null && c.price > c.nmck
    ? '<span class="warn-t">Выше начальной — такую заявку отклонят</span>'
    : c.price !== null && c.nmck ? `На ${dropText(1 - c.price / c.nmck)} % ниже начальной` : "Сколько хотите предложить на торгах");

  // Вход в калькулятор — первым на шаге «Требования», над «Кто может участвовать»: ответ, если уже посчитан, и шкала.
  function priceTeaserHTML(p) {
    const c = calcOf(p);
    const { floor, at } = priceFloor(c);
    const atFloor = floor.ok && !floor.aboveNmck ? at(floor.price) : null;
    const text = atFloor ? `Можно снижаться до ${rub(atFloor.price)} — на ${dropText(atFloor.drop)} % ниже начальной.`
      : floor.ok ? "Даже по начальной цене контракт в убытке — проверьте расходы."
      : floor.reason === "impossible" ? "Налог и стоимость обеспечения съедают всю цену — проверьте проценты."
      : `Впишите себестоимость — посчитаю нижнюю цену без убытка${c.nmck ? "" : " (начальную цену тоже впишите: в документах она не нашлась)"}: с налогом, обеспечением и антидемпингом.`;
    return `<section class="panel teaser" aria-labelledby="req-price">
      <div class="teaser-head">
        <div class="teaser-main">
          <span class="teaser-ic" aria-hidden="true">${ic("calc", 20)}</span>
          <div class="next-text"><p class="next-label">Перед торгами</p><h3 class="next-title" id="req-price">До какой цены снижаться</h3><p class="next-desc">${text}</p></div>
        </div>
        <button class="btn line" type="button" data-go="price" data-id="${p.id}">${ic("calc", 16)}${floor.ok ? "Открыть расчёт" : "Посчитать"}</button>
      </div>
      ${floor.ok && c.nmck ? scaleHTML(c, false) : ""}
    </section>`;
  }

  // Ответ экрана — плавающим островом внизу, как «Скачать ТП»: виден, пока правите расходы и обеспечение.
  function calcResultHTML(c) {
    const { floor, at } = priceFloor(c);
    const atFloor = floor.ok ? at(floor.price) : null;
    const raised = pctText(raisedPct(c.securityPct || 0));
    const usual = pctText(c.securityPct || 0);
    const why = {
      plain: "Ниже — контракт в убытке.",
      antiDumping: `Ниже — убыток. При таком снижении обеспечение — ${raised} % вместо ${usual} % (ст. 37).`,
      threshold: `Снизите на 25 % и больше — обеспечение вырастет до ${raised} % (ст. 37), и контракт уйдёт в убыток.`,
    };
    if (!floor.ok && floor.reason === "input") return `<p class="res-text">Впишите ${c.nmck ? "себестоимость" : "начальную цену и себестоимость"} — посчитаю, до какой цены можно снижаться.</p>`;
    if (!floor.ok) return '<p class="res-warn">Налог и стоимость обеспечения съедают всю цену — проверьте проценты.</p>';
    if (floor.aboveNmck || !atFloor) return `<p class="res-warn">Даже по начальной цене контракт в убытке</p><p class="res-text">Без убытка — только от ${rub(floor.price)}, а начальная цена — ${rub(c.nmck || 0)}.</p>`;
    const unpriced = secured(c) && !rated(c) ? " Стоимость обеспечения не учтена — впишите ставку и срок." : "";
    return `<p class="res-label">Можно снижаться до</p>
      <p class="res-line"><span class="res-num">${rub(floor.price)}</span><span class="res-text">— на ${dropText(atFloor.drop)} % ниже начальной</span></p>
      <p class="res-label">${why[floor.kind]}${unpriced}</p>`;
  }

  // Из чего складывается цена: нижняя и, если вписана, ваша — рядом, чтобы видеть разницу.
  function calcTableHTML(c) {
    const { floor, at } = priceFloor(c);
    const atFloor = floor.ok ? at(floor.price) : null;
    const mine = c.price ? at(c.price) : null;
    const cols = [...(atFloor ? [["Нижняя", atFloor]] : []), ...(mine ? [["Ваша", mine]] : [])];
    if (!cols.length) return "";
    const rows = [
      { label: "Цена", cell: (b) => rub(b.price), strong: true },
      { label: "Снижение", cell: (b) => (b.drop >= 0 ? `${dropText(b.drop)} %` : "выше начальной") },
      { label: "Себестоимость", cell: (b) => rub(b.costs) },
      ...((c.extra || 0) > 0 ? [{ label: "Расходы на участие", cell: (b) => rub(b.extra) }] : []),
      ...((c.taxPct || 0) > 0 ? [{ label: `Налог ${pctText(c.taxPct)} %`, cell: (b) => rub(b.tax) }] : []),
      ...(secured(c) ? [{
        label: "Обеспечение",
        note: rated(c) ? `${c.method === "guarantee" ? "гарантия" : "свои деньги"}, ${pctText(rateOf(c))} % годовых, ${pctText(c.days)} ${plural(c.days, "день", "дня", "дней")}` : "впишите ставку и срок",
        cell: (b) => (rated(c) ? rub(b.securityCost) : "не учтено"),
        sub: (b) => `на ${rub(b.security)} (${pctText(b.securityPct)} %)`,
      }] : []),
      {
        label: "Прибыль", strong: true,
        cell: (b) => `<span class="${b.profit < 0 ? "bad-t" : ""}">${rub(b.profit)}</span>`,
        sub: (b) => (Math.abs(b.profit) >= 0.5 ? `${pctText(Math.round((b.profit / b.price) * 1000) / 10)} % цены` : ""),
      },
    ];
    return `<div class="calc-table-wrap"><table class="calc-table">
      <thead><tr><td></td>${cols.map(([title]) => `<th scope="col">${title}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((row) => `<tr${row.strong ? ' class="strong"' : ""}><th scope="row">${row.label}${row.note ? `<span class="cell-sub">${esc(row.note)}</span>` : ""}</th>${cols.map(([, b]) => {
        const sub = row.sub ? row.sub(b) : "";
        return `<td><span class="cell-num">${row.cell(b)}</span>${sub ? `<span class="cell-sub">${sub}</span>` : ""}</td>`;
      }).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <p class="hint">Прибыль — до налога с прибыли, если вы его платите.</p>`;
  }

  // Инструмент «Цена»: самая низкая цена без убытка. Считает браузер, без ИИ.
  function priceHTML(p) {
    const c = calcOf(p);
    const found = readRequirements(p);
    const guarantee = c.method === "guarantee";
    const small = c.nmck !== null && c.nmck <= GOOD_FAITH_LIMIT;
    const big = c.nmck !== null && c.nmck > GOOD_FAITH_LIMIT;
    const sec = secured(c);
    const rule = p.tp && p.tp.antiDumping && p.tp.antiDumping.rule;
    const methods = [["guarantee", "Независимая гарантия"], ["money", "Свои деньги"]];
    // Второстепенное свёрнуто. Открыто сразу, если без вас расчёт неполный: обеспечение есть, а ставки или срока нет.
    const moreKey = `calc-more-${p.id}`;
    if (S.fold[moreKey] === undefined) S.fold[moreKey] = sec && !rated(c);
    const moreOpen = S.fold[moreKey];
    const tableOpen = !!S.fold["calc-table"];
    const table = calcTableHTML(c);
    return `<div class="tab-body">
      <p class="tab-lead">До какой цены можно снижаться на торгах, чтобы контракт не ушёл в убыток. Впишите себестоимость — остальное подставлено из документов закупки. Считается прямо в браузере, цифры никуда не отправляются.</p>
      <section class="panel" aria-labelledby="calc-costs-title">
