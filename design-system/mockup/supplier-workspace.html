        <div class="panel-head"><div><h3 class="panel-title" id="calc-costs-title">Ваши цифры</h3>${p.sample ? '<p class="panel-sub">В примере — вымышленные расходы</p>' : ""}</div></div>
        <div class="calc-body"><div class="calc-grid three">
          ${numField("nmck", "calc-nmck", "Начальная цена", "₽", c.nmck, parseRub(p.price) ? "Из сведений о закупке" : "Не нашлась — впишите из извещения", CALC_HELP.nmck)}
          ${numField("costs", "calc-costs", "Себестоимость", "₽", c.costs, "", CALC_HELP.costs)}
          ${numField("taxPct", "calc-tax", "Налог с выручки", "%", c.taxPct, "", CALC_HELP.tax)}
        </div></div>
      </section>
      <section class="panel" aria-labelledby="calc-scale-title">
        <div class="panel-head"><div><h3 class="panel-title" id="calc-scale-title">Проверить свою цену</h3><p class="panel-sub">Двигайте ползунок или впишите цену — покажу, что останется</p></div></div>
        <div class="calc-body">
          <div class="scale-head">
            ${numField("price", "calc-price", "Ваша цена", "₽", c.price, priceHint(c))}
            <div class="profit" id="calc-profit" aria-live="polite">${profitHTML(c)}</div>
          </div>
          <div id="calc-scale">${c.nmck ? scaleHTML(c, true) : '<p class="hint">Впишите начальную цену — нарисую шкалу.</p>'}</div>
          <div class="disclosure" id="calc-table-panel"${table ? "" : " hidden"}>
            <button class="link disc-btn" type="button" data-act="fold" data-fold="calc-table" aria-expanded="${tableOpen}" aria-controls="calc-out">Из чего складывается цена${ic("down", 16)}</button>
            <div class="calc-out" id="calc-out"${tableOpen ? "" : " hidden"}>${table}</div>
          </div>
        </div>
      </section>
      <section class="panel" aria-labelledby="calc-more-title">
        <h3 class="m0" id="calc-more-title"><button class="fold-head more-head" type="button" data-act="fold" data-fold="${moreKey}" aria-expanded="${moreOpen}" aria-controls="calc-more"><span class="more-text"><span>Что ещё влияет на цену</span><span class="more-sum${sec && !rated(c) ? " warn" : ""}" id="calc-more-sum">${esc(moreSummary(c))}</span></span>${ic("down", 18)}</button></h3>
        <div class="calc-body more-body" id="calc-more"${moreOpen ? "" : " hidden"}>
          ${numField("extra", "calc-extra", "Расходы на участие", "₽", c.extra, "", CALC_HELP.extra)}
          <div class="calc-group">
            ${numField("securityPct", "calc-sec-pct", "Обеспечение исполнения", "%", c.securityPct, found.securityLine ? `В требованиях: ${esc(found.securityLine)}` : "В требованиях не нашёл — посмотрите в извещении", CALC_HELP.security)}
            ${checkRow("smeOnly", "calc-sme", "Закупка только для малого бизнеса", c.smeOnly, CALC_HELP.sme)}
            ${checkRow("exempt", "calc-exempt", "Освобождены от обеспечения", c.exempt, CALC_HELP.exempt, c.smeOnly)}
            <div class="calc-more" id="calc-cost-block"${sec ? "" : " hidden"}>
              <fieldset class="pills-set"><legend><span class="label-row">Чем обеспечите${hintBtn("Чем обеспечить", CALC_HELP.method)}</span></legend><div class="pills">
                ${methods.map(([key, label]) => `<label class="pill"><input class="sr-only" type="radio" name="calc-method" id="calc-method-${key}" data-calc="method" value="${key}"${c.method === key ? " checked" : ""}>${label}</label>`).join("")}
              </div></fieldset>
              <div class="calc-grid">
                ${numField(guarantee ? "guaranteeRatePct" : "moneyRatePct", "calc-rate", guarantee ? "Комиссия банка" : "Сколько стоят ваши деньги", "% годовых", rateOf(c), "", guarantee ? "Процент в год от суммы гарантии — по тарифу банка." : "Ставка кредита, если берёте в долг, или вклада, если деньги свои.")}
                ${numField("days", "calc-days", guarantee ? "Срок гарантии" : "Сколько дней деньги у заказчика", "дней", c.days, "", guarantee ? "Срок исполнения контракта и ещё не меньше месяца (ч. 3 ст. 96 44-ФЗ)." : "Срок исполнения и до 30 дней на возврат, в закупке у малого бизнеса — до 15 (ч. 27 ст. 34 44-ФЗ).")}
              </div>
            </div>
          </div>
          <div class="calc-group">
            ${checkRow("antiDumping", "calc-ad-on", "Учитывать антидемпинговые меры", c.antiDumping, adHint(p, c), true, "calc-ad-help")}
            ${checkRow("goodFaith", "calc-good", "Подтвержу добросовестность", c.goodFaith, CALC_HELP.goodFaith, c.antiDumping && small && sec)}
            <p class="hint" id="calc-ad-big"${c.antiDumping && big && sec ? "" : " hidden"}>Начальная цена больше 15 млн ₽ — заменить повышенное обеспечение подтверждением добросовестности нельзя (ч. 1 ст. 37).</p>
            <p class="hint" id="calc-ad-none"${c.antiDumping && !sec ? "" : " hidden"}>${esc(adNone(c))}</p>
            ${rule ? noteHTML("info", `В документах закупки: ${esc(rule)}`) : ""}
          </div>
        </div>
      </section>
    </div>
    <div class="sticky-actions"><div class="result-bar" id="calc-result" aria-live="polite">${calcResultHTML(c)}</div></div>`;
  }

  // Правка поля: пересчитываются таблица и ответ, условные строки показываются и прячутся — само поле не перерисовывается.
  // Ползунок (source "range") двигает только отметку: шкалу с ним не перерисовываем, чтобы не сорвать перетаскивание.
  function refreshPrice(p, source) {
    const c = calcOf(p);
    const sec = secured(c);
    const show = (id, on) => { const el = document.getElementById(id); if (el) el.hidden = !on; };
    show("calc-exempt-row", c.smeOnly);
    show("calc-cost-block", sec);
    show("calc-good-row", c.antiDumping && c.nmck !== null && c.nmck <= GOOD_FAITH_LIMIT && sec);
    show("calc-ad-big", c.antiDumping && c.nmck !== null && c.nmck > GOOD_FAITH_LIMIT && sec);
    show("calc-ad-none", c.antiDumping && !sec);
    const none = $("#calc-ad-none");
    if (none) none.textContent = adNone(c);
    const adBtn = $("#calc-ad-help");
    if (adBtn) adBtn.dataset.hint = adHint(p, c);
    const sum = $("#calc-more-sum");
    if (sum) { sum.textContent = moreSummary(c); sum.classList.toggle("warn", sec && !rated(c)); }
    const table = calcTableHTML(c);
    $("#calc-out").innerHTML = table;
    show("calc-table-panel", !!table);
    $("#calc-result").innerHTML = calcResultHTML(c);
    $("#calc-profit").innerHTML = profitHTML(c);
    $("#calc-price-note").innerHTML = priceHint(c);
    if (source !== "price") $("#calc-price").value = showNum(c.price);
    const range = $("#calc-range");
    if (source === "range" && range) {
      const { floor, at, raisedBelow } = priceFloor(c);
      const m = scaleModel(c.nmck, floor, raisedBelow);
      const shown = Math.min(Math.max(c.price ?? c.nmck, m.lo), m.hi);
      range.nextElementSibling.style.left = `${m.x(shown)}%`;
      range.setAttribute("aria-valuetext", valueText(c, shown, at(c.price ?? c.nmck)));
    } else $("#calc-scale").innerHTML = c.nmck ? scaleHTML(c, true) : '<p class="hint">Впишите начальную цену — нарисую шкалу.</p>';
  }
  function onCalcInput(input) {
    const p = cur();
    const value = input.type === "checkbox" ? input.checked : input.type === "radio" ? input.value : parseNum(input.value);
    p.priceCalc = { ...(p.priceCalc || {}), [input.dataset.calc]: value };
    // Способ обеспечения меняет подписи и ставку в поле — экран перерисовывается, фокус остаётся на переключателе.
    if (input.type === "radio") rerender();
    else refreshPrice(p, input.type === "range" ? "range" : input.id === "calc-price" ? "price" : "field");
  }

  /* ---------- как это работает: путь по закупке, разделы, цвета ---------- */
  function helpHTML() {
    const path = [
      ["+", "Новая закупка", "кнопка «Новая закупка»", "Загрузите извещение, ТЗ и проект контракта — PDF, Word, сканы или фото. Через 1–2 минуты закупка появится в разделе «Закупки»."],
      ["1", "Требования", "в закупке, шаг 1", "Кто может участвовать, как оценят заявку и за что дают баллы, что подать, что требует ТЗ, сроки и деньги. Под каждым пунктом — ссылка на точную цитату из документа."],
      ["2", "Техническое предложение", "в закупке, шаг 2", "Черновик по форме заказчика. Впишите свои данные в пункты, выделенные жёлтым, и скачайте файл Word. Там же — анкета, декларация и предложение о цене."],
      ["3", "Проверка заявки", "в закупке, шаг 3", "Загрузите заявку, которую собираетесь подавать. Покажу ошибки, за которые могут отклонить, и замечания — с цитатами из документов."],
      ["✓", "Подача", "на электронной площадке", "Заявку подаёте вы сами на площадке, до срока подачи. Срок и сколько дней осталось видны в шапке закупки."],
    ];
    const sections = [
      ["home", "home", "Главная", "Самое срочное дело, закупки по этапам и данные компании."],
      ["list", "list", "Закупки", "Все закупки: список слева, открытая закупка справа — с шагами, расчётом, до какой цены снижаться, и вопросами по ней."],
      ["lawyer", "scale", "Вопросы юристу", "Живой юрист по закупкам: ответ обычно в течение рабочего дня. Ответил — число в меню, уведомление в колокольчике наверху и письмо на почту."],
      ["ask", "chat", "Спросить про тендер", "Общий вопрос по 44-ФЗ и 223-ФЗ. Вопрос про конкретную закупку задайте внутри неё — в «Вопросах»: отвечу по её документам."],
      ["profile", "user", "Реквизиты", "Данные компании. Сами попадают в анкету, декларацию и цену — но никогда в ТП: его подают анонимно."],
      ["docs", "folder", "Образцы и реквизиты", "Ваши прошлые заявки, анкеты, карточка предприятия. По ним заполняются реквизиты и пишутся новые документы — так же, как пишете вы."],
    ];
    const num = (n) => n === "+" ? ic("plus", 14) : n === "✓" ? ic("check", 14, 3) : n;
    return `<div class="page-col">
      <section class="panel" aria-labelledby="path-title">
        <div class="panel-head"><h2 class="panel-title" id="path-title">Путь по одной закупке</h2></div>
        <ol class="plist path">${path.map(([n, title, where, text]) => `<li><span class="num" aria-hidden="true">${num(n)}</span><div><p class="path-head"><span class="panel-title">${title}</span><span class="path-where">${where}</span></p><p class="path-text">${text}</p></div></li>`).join("")}</ol>
        <div class="panel-foot"><button class="btn" type="button" data-go="new">${ic("plus")}Новая закупка</button><span class="or">или <button class="link" type="button" data-act="sample">пройти путь на примере</button></span></div>
      </section>
      <section class="panel" aria-labelledby="map-title">
        <div class="panel-head"><h2 class="panel-title" id="map-title">Разделы слева</h2></div>
        <ul class="plist">${sections.map(([go, icon, title, text]) => `<li><button class="prow" type="button" data-go="${go}"><span class="law icon" aria-hidden="true">${ic(icon, 16)}</span><span class="prow-text"><span class="prow-title">${title}</span><span class="small ink2">${text}</span></span><span class="chev">${ic("chev", 16)}</span></button></li>`).join("")}</ul>
      </section>
      <section class="panel" aria-labelledby="marks-title">
        <div class="panel-head"><h2 class="panel-title" id="marks-title">Что значат цвета</h2></div>
        <ul class="marks">
          <li><span class="mark-dot" style="background:var(--brand)"></span><span>Индиго — ваш следующий шаг: составить ТП, проверить заявку.</span></li>
          <li><span class="mark-dot" style="background:var(--warn)"></span><span>Янтарный — нужно ваше действие: вписать данные, сверить цифры; до подачи неделя и меньше.</span></li>
          <li><span class="mark-dot" style="background:var(--danger)"></span><span>Красный — ошибка в заявке, за неё могут отклонить.</span></li>
          <li><span class="step-dot done" style="width:16px;height:16px;justify-self:center">${ic("check", 10, 3)}</span><span>Зелёный с галочкой — шаг сделан, заявка готова к подаче.</span></li>
          <li><span class="mark-dot" style="background:var(--edge-2)"></span><span>Серый — справка или ещё не начато: дни до подачи, прошедший приём.</span></li>
        </ul>
      </section>
      <p class="foot m0">Прототип: закупки, документы и ответы вымышленные. Ответы ИИ не являются юридической консультацией — проверяйте нормы по первоисточнику.</p>
    </div>`;
  }

  /* ---------- новая закупка ---------- */
  const NEW_STEPS = ["Читаю документы…", "Смотрю, кто может участвовать…", "Выписываю, что подать в заявке…", "Разбираю требования ТЗ…", "Проверяю сроки и суммы…", "Сверяю цитаты с документами…"];
  const ADDING_STEPS = ["Читаю новые документы…", "Перечитываю закупку целиком…", "Обновляю требования и сроки…", "Сверяю цитаты с документами…"];

  function newHTML() {
    return `<div class="page-col"><section class="panel"><div class="panel-body">
      ${S.busy ? busyHTML() : `<p class="intro">Загрузите извещение, ТЗ и проект контракта — выпишу требования и сроки. Потом закупка откроется на шаге 1 «Требования», а дальше будут техническое предложение и проверка заявки.</p>
      ${dropHTML("new", "Перетащите сюда документы закупки — можно сразу несколько: PDF, Word, сканы и фото", "Загрузить документы", { act: "sample", text: "посмотреть на примере" })}`}
    </div></section></div>`;
  }

  /* ---------- реквизиты ---------- */
  function groupSuggestions(items) {
    const groups = [];
    for (const item of items) {
      const bank = BANK_KEYS.includes(item.key);
      const group = bank ? groups.find((g) => BANK_KEYS.includes(g[0].key) && g[0].source === item.source && !g.some((i) => i.key === item.key)) : undefined;
      if (group) group.push(item); else groups.push([item]);
    }
    return groups;
  }

  function profileHTML() {
    const sourceDocs = S.docs.filter((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
    const problems = profileProblems(S.profile);
    const groups = groupSuggestions(S.suggestions);
    return `<div class="page-col">
      <p class="intro">Впишите один раз — дальше они сами попадут в анкету, декларацию, предложение о цене и подпись. В техническое предложение реквизиты не попадают никогда: его подают анонимно.</p>
      ${sourceDocs.length ? "" : '<p class="intro">Можно не вписывать руками: загрузите анкету или карточку предприятия в <button class="link" type="button" data-go="docs">«Образцы и реквизиты»</button> — реквизиты заполнятся сами.</p>'}
      ${S.ui.fillNote ? noteHTML(S.ui.fillNote.tone, esc(S.ui.fillNote.text), "", S.ui.fillNote.tone === "ok" ? "check" : "") : ""}
      ${groups.length ? `<section class="suggest" aria-labelledby="sug-title">
          <p class="suggest-head" id="sug-title">${ic("alert", 18)}В ваших документах есть другие значения — проверьте, какое верное</p>
          <ul>${groups.map((g, i) => `<li>
            <span>${g.length > 1 ? `<b>Банковские реквизиты:</b> ${esc(g.map((it) => it.value).join(", "))}` : `<b>${esc(LABELS[g[0].key])}:</b> ${esc(g[0].value)}`} <span class="muted">— из «${esc(g[0].source)}»</span></span>
            <span class="acts"><button class="link" type="button" data-act="sug-accept" data-i="${i}">${g.length > 1 ? "Подставить все" : "Подставить"}</button><button class="link quiet" type="button" data-act="sug-dismiss" data-i="${i}">Оставить как есть</button></span>
          </li>`).join("")}</ul>
        </section>` : ""}
      ${PROFILE_GROUPS.map((g, gi) => `<section class="panel" aria-labelledby="pg-${gi}">
        <div class="panel-head"><h2 class="panel-title" id="pg-${gi}">${g.title}</h2></div>
        <div class="form-rows">${g.fields.map((f) => `<div class="field">
          <div class="label-row"><label class="field-label" for="pf-${f.key}">${esc(f.label)}</label>${f.help ? hintBtn(f.label, f.help) : ""}</div>
          <input class="input" id="pf-${f.key}" data-pf="${f.key}" value="${esc(S.profile[f.key])}" placeholder="${esc(f.example || "")}" autocomplete="off"${problems[f.key] ? ` aria-invalid="true" aria-describedby="pf-${f.key}-err"` : ""}>
          <span class="field-err" id="pf-${f.key}-err"${problems[f.key] ? "" : " hidden"}>${esc(problems[f.key] || "")}</span>
          ${S.sources[f.key] ? `<span class="field-src" data-src-of="${f.key}">из «${esc(S.sources[f.key])}»</span>` : ""}
        </div>`).join("")}</div>
      </section>`).join("")}
      ${dataPanelsHTML()}
    </div>`;
  }

  // Копия данных и удаление всего — внизу «Реквизитов», как в приложении. В прототипе файл копии не скачивается и не читается.
  function dataPanelsHTML() {
    const note = S.ui.backupNote;
    return `<section class="panel" aria-labelledby="backup-title" id="backup">
        <div class="panel-head"><div><h2 class="panel-title" id="backup-title">Копия данных</h2><p class="panel-sub">Закупки, документы, реквизиты и образцы</p></div></div>
        <div class="panel-body">
          <p class="intro">Всё это хранится только в этом браузере. Если очистить браузер — пропадёт, а Safari может стереть данные сам, если сервис не открывать неделю. Сохраняйте копию файлом: из неё всё вернётся, и так же данные переносятся на другой компьютер. В файле реквизиты и тексты документов — храните его так же бережно, как сами документы.</p>
          <div class="btn-row"><button class="btn soft" type="button" data-act="backup-save">${ic("download")}Сохранить копию</button><label class="btn soft" for="backup-file">${ic("upload")}Загрузить копию<input id="backup-file" type="file" accept=".json,application/json" class="sr-only"></label></div>
          <div aria-live="polite">${note ? noteHTML(note.tone, esc(note.text), "", note.tone === "ok" ? "check" : "info") : ""}</div>
        </div>
      </section>
      <section class="panel" aria-labelledby="wipe-title" id="wipe">
        <div class="panel-head"><div><h2 class="panel-title" id="wipe-title">Удалить все данные</h2><p class="panel-sub">Из этого браузера — всё сразу</p></div></div>
        <div class="panel-body">
          <p class="intro">Удалятся все закупки с документами и черновиками, реквизиты, образцы, настройки и отметка о согласии. Вернуть их можно будет только из копии — сохраните её выше. На сервере данные не хранятся; то, что уже отправлено ИИ, хранится у Anthropic по её условиям.</p>
          ${S.ui.wipeAsk
            ? `<div class="wipe-ask"><p>Удалить всё? Вернуть данные можно будет только из копии.</p><div class="btn-row"><button class="btn xs danger" type="button" data-act="wipe-yes">Удалить всё</button><button class="btn xs soft" type="button" data-act="wipe-no" id="wipe-no">Отмена</button></div></div>`
            : `<button class="link quiet del" type="button" data-act="wipe-ask" id="wipe-ask">Удалить все мои данные</button>`}
        </div>
      </section>`;
  }
  // «1 закупка, 2 образца и реквизиты» — только то, что есть.
  function dataContents() {
    const filled = PROFILE_KEYS.some((k) => String(S.profile[k] || "").trim());
    const parts = [
      S.purchases.length && `${S.purchases.length} ${plural(S.purchases.length, "закупка", "закупки", "закупок")}`,
      S.docs.length && `${S.docs.length} ${plural(S.docs.length, "образец", "образца", "образцов")}`,
      filled && "реквизиты",
    ].filter(Boolean);
    return parts.length > 1 ? `${parts.slice(0, -1).join(", ")} и ${parts[parts.length - 1]}` : parts[0] || "";
  }
  /* ---------- перед началом: два согласия ---------- */
  // Как в приложении (components/consent-gate.tsx): галочки не отмечены заранее, без обеих дальше не пройти.
  const CONSENT_KEY = "tj-consent";
  function consentGiven() {
    try { return localStorage.getItem(CONSENT_KEY) === "1"; } catch (e) { return false; }
  }
  // Ссылкой, а не кнопкой: текст ссылки переносится внутри строки, как в приложении.
  const legalBtn = (doc, text) => `<a class="link" href="#${doc}" data-act="legal" data-doc="${doc}">${text}</a>`;
  function showConsent() {
    const el = $("#consent");
    el.innerHTML = `<form class="consent-card" id="consent-form" role="dialog" aria-modal="true" aria-labelledby="consent-title">
        <div class="consent-brand"><span class="brand-ic">${ic("scale", 16)}</span>Тендерный юрист</div>
        <div style="display:grid;gap:4px"><h1 id="consent-title">Перед началом</h1>
        <p class="small ink2">Сервис читает документы закупки с помощью ИИ. В документах и реквизитах бывают персональные данные, поэтому нужны два согласия.</p></div>
        <label class="consent-check"><input type="checkbox" id="consent-processing"><span>Даю ${legalBtn("consent", "согласие на обработку персональных данных")}</span></label>
        <label class="consent-check"><input type="checkbox" id="consent-transfer"><span>Даю ${legalBtn("transfer", "согласие на передачу данных за рубеж")} — модели ИИ в США, без этого сервис не прочитает документы</span></label>
        <button class="btn lg" type="button" id="consent-ok" data-act="consent-ok" disabled>Продолжить</button>
        <p class="small muted">Продолжая, вы принимаете ${legalBtn("terms", "условия использования")}. Как сервис обращается с данными — в ${legalBtn("privacy", "политике")}.</p>
      </form>`;
    el.hidden = false;
    $("#app").inert = true;
    $("#consent-processing").focus();
  }
  function acceptConsent() {
    if (!($("#consent-processing").checked && $("#consent-transfer").checked)) return;
    try { localStorage.setItem(CONSENT_KEY, "1"); } catch (e) { /* не запомнится — спросим при следующем открытии */ }
    const el = $("#consent");
    el.hidden = true;
    el.innerHTML = "";
    $("#app").inert = false;
    const main = $("#view");
    if (main) main.focus({ preventScroll: true });
  }
  // Правовые документы в прототипе — короткой выжимкой; полные шаблоны — в приложении.
  const LEGAL_DOCS = {
    consent: ["Согласие на обработку персональных данных", "/consent", [
      "Какие данные: документы закупок, реквизиты, вопросы в сервисе — и персональные данные в них.",
      "Зачем: прочитать документы, выписать требования, подготовить документы заявки и ответить на вопросы.",
      "Срок — до отзыва. Отозвать — письмом владельцу сервиса; данные в браузере удаляются кнопкой «Удалить все мои данные» на странице «Реквизиты».",
    ]],
    transfer: ["Согласие на трансграничную передачу персональных данных", "/consent-transfer", [
      "Кому: Anthropic PBC, США — модель ИИ Claude. США нет в перечне стран с адекватной защитой данных (приказ Роскомнадзора № 128 от 05.08.2022).",
      "Что уходит: тексты документов и вопросы — персональные данные в них заменяются метками; сканы и фото — картинкой, как есть.",
      "Без этого согласия сервис не может прочитать документы.",
    ]],
    privacy: ["Политика обработки персональных данных", "/privacy", [
      "Закупки, документы и реквизиты хранятся в вашем браузере, на вашем устройстве. Сервер их не сохраняет — получает на время запроса и передаёт ИИ.",
      "Перед отправкой ИИ ФИО, телефоны, почта, паспорт и другие данные заменяются метками.",
      "Ваши права: узнать, какие данные обрабатываются, уточнить, заблокировать или уничтожить их, отозвать согласие.",
    ]],
    terms: ["Условия использования", "/terms", [
      "Ответы готовит искусственный интеллект: это не юридическая консультация — проверяйте нормы по первоисточнику.",
      "Результаты хранятся в вашем браузере: сохраните файл Word или копию данных.",
      "Сейчас сервис работает в тестовом режиме, по закрытой ссылке и бесплатно.",
    ]],
  };
  function openLegal(doc) {
    const [title, path, points] = LEGAL_DOCS[doc];
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">Правовой документ · шаблон</span>
      <h2 id="m-title">${title}</h2>
      ${noteHTML("warn", "<b>ТРЕБУЕТ ПРОВЕРКИ ЮРИСТОМ.</b> Это шаблон: формулировки, основания и сроки проверьте с юристом до того, как открыть сервис другим людям.", "", "alert")}
      <ul class="small ink2" style="margin:0;padding-left:18px;display:grid;gap:6px">${points.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      <p class="small muted m0">В прототипе — выжимка. Полный текст — в приложении, страница ${path}.</p>
    </div>`);
  }

  // Удалить всё: прототип возвращается к первому запуску — пустые закупки и реквизиты, снова вопрос о согласии.
  function wipeAll() {
    S.purchases = []; S.docs = []; S.id = null;
    S.profile = Object.fromEntries(PROFILE_KEYS.map((k) => [k, ""])); S.sources = {}; S.suggestions = [];
    S.general = { messages: [], docs: [], pending: [], thinking: false }; S.drafts = {}; S.ui = {}; S.fold = {};
    S.law = { open: null, want: null, threads: [] }; S.notes = []; S.ocr = true;
    try { localStorage.removeItem(CONSENT_KEY); } catch (e) { /* хранилище недоступно — согласие и так не запомнено */ }
    go("home");
    showConsent();
  }

  /* ---------- мои документы ---------- */
  function countLine(docs) {
    return DOC_KIND_KEYS.map((k) => [k, docs.filter((d) => d.kinds.includes(k)).length]).filter(([, n]) => n > 0).map(([k, n]) => `${DOC_KINDS[k].few} — ${n}`).join(", ");
  }
  function docRowHTML(d, kind) {
    const key = `${kind}:${d.id}`;
    const others = d.kinds.filter((k) => k !== kind);
    const meta = [
      `≈ ${d.pages} ${plural(d.pages, "страница", "страницы", "страниц")}`,
      `добавлен ${d.added}`,
      ...(d.scan ? ["распознан со скана — сверьте цифры"] : []),
      ...(others.length ? [`в файле также: ${others.map((k) => DOC_KINDS[k].few).join(", ")}`] : []),
    ].join(" · ");
    let acts;
    if (S.ui.editKind === key) {
      const draft = S.ui.kindDraft || d.kinds;
      acts = `<div class="kinds"><p>Что в этом файле? Можно выбрать несколько.</p>
        <div class="chips">${DOC_KIND_KEYS.map((k) => `<button class="kind-pill" type="button" data-act="kind-toggle" data-kind="${k}" aria-pressed="${draft.includes(k)}">${DOC_KINDS[k].group}</button>`).join("")}</div>
        <div class="btn-row"><button class="btn xs" type="button" data-act="kind-save" data-key="${key}">Готово</button><button class="btn xs soft" type="button" data-act="kind-cancel">Отмена</button></div></div>`;
    } else if (S.ui.confirmDoc === key) {
      acts = `<div class="doc-acts"><span>${others.length ? "Удалить файл целиком, из всех групп?" : "Удалить документ?"}</span><button class="btn xs danger" type="button" data-act="doc-del-yes" data-key="${key}">Удалить</button><button class="btn xs soft" type="button" data-act="doc-del-no">Отмена</button></div>`;
    } else {
      acts = `<div class="doc-acts"><button class="link" type="button" data-act="kind-edit" data-key="${key}">Изменить вид</button><button class="link quiet del" type="button" data-act="doc-del" data-key="${key}">Удалить</button></div>`;
    }
    return `<li>
      <div class="doc-main"><span class="file-ic${d.scan ? " warn" : ""}">${ic("file", 16)}</span><div class="doc-text">
        <span class="doc-name">${esc(d.name)}</span>
        ${d.about ? `<span class="doc-about">${esc(d.about)}</span>` : ""}
        <span class="doc-meta">${esc(meta)}</span>
      </div></div>
      ${acts}
    </li>`;
  }

  function docsHTML() {
    const groups = DOC_KIND_KEYS.map((k) => [k, S.docs.filter((d) => d.kinds.includes(k))]).filter(([, list]) => list.length);
    const rep = S.ui.report;
    const report = rep ? `<div style="display:grid;gap:8px" aria-live="polite">
        ${noteHTML("ok", `Добавил ${rep.added.length} ${plural(rep.added.length, "документ", "документа", "документов")}: ${esc(countLine(rep.added))}.`, "", "check")}
        ${noteHTML("info", "Разложил по названиям файлов — прототип не читает их содержимое. Проверьте виды и поправьте, где нужно.", "", "info")}
        ${rep.requisites ? noteHTML("info", 'Реквизиты: в приложении они заполнятся из новых анкет и карточек сами. В прототипе файлы не читаются, поэтому <button class="link" type="button" data-go="profile">реквизиты</button> не изменились.', "", "info") : ""}
      </div>` : "";
    return `<div class="page-col">
      <p class="intro">Загрузите всё, что подавали раньше: заявки целиком или по частям, анкеты, декларации, ценовые предложения, а ещё карточку предприятия. Для конкурсов — исполненные договоры с актами и документы сотрудников: дипломы, удостоверения, допуски. Приложение разложит всё по видам — и новые документы будет писать так же, как ваши.</p>
      ${report}
      ${S.busy ? `<section class="panel"><div class="panel-body">${busyHTML()}</div></section>` : ""}
      ${groups.map(([k, list], gi) => `<section class="panel" aria-labelledby="dg-${gi}">
        <div class="panel-head"><div><h2 class="panel-title" id="dg-${gi}">${DOC_KINDS[k].group} <span class="count">${list.length}</span></h2><p class="panel-sub">${DOC_KINDS[k].use}</p></div></div>
        <ul class="docs-list">${list.map((d) => docRowHTML(d, k)).join("")}</ul>
      </section>`).join("")}
      ${S.busy ? "" : `<section class="panel drop-box">${dropHTML("mydocs", "Перетащите сюда свои документы — PDF, Word, сканы и фото. Можно сразу все.", S.docs.length ? "Добавить документы" : "Загрузить документы")}</section>`}
    </div>`;
  }

  /* ---------- предпросмотр файлов Word ---------- */
  const docFields = (t) => esc(t).replace(/\[[^\]]+\]/g, (m) => `<mark>${m}</mark>`);
  const paras = (text, indent) => (text || "").split(/\n+/).filter((l) => l.trim()).map((l) => `<p${indent ? ' class="jst"' : ""}>${docFields(l.trim())}</p>`).join("");
  const signature = () => `<p class="sig">Участник закупки  ______________________ / ${esc(S.profile.signer.trim() || "______________________")} /</p>
    <p class="sub-sig">(подпись)  /  (расшифровка подписи)</p>
    <p>М.П. (при наличии)          «____» ________________ 20___ г.</p>`;

  function tpDoc(p) {
    const { form, goods, items } = p.tp;
    let h = `<h3>${esc(PART_TITLES.tp)}</h3>`;
    if (p.subject) h += `<p class="c">Предмет закупки: ${esc(p.subject)}</p>`;
    if (goods.length) {
      h += paras(form.consent, true);
      h += `<table><thead><tr><th style="width:7%">№ п/п</th><th style="width:25%">Наименование товара</th><th>Характеристики товара</th><th style="width:16%">Количество</th></tr></thead><tbody>${goods.map((g, i) => `<tr><td>${i + 1}</td><td>${esc(g.name)}</td><td>${paras(g.characteristics)}</td><td>${esc(g.quantity)}</td></tr>`).join("")}</tbody></table>`;
    }
    if (items.length) {
      h += `<table><thead><tr><th style="width:6%">№</th><th style="width:40%">Требование заказчика</th><th>Предложение участника закупки</th></tr></thead><tbody>${items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.requirement)}${it.clause ? ` (п. ${esc(it.clause)} ТЗ)` : ""}</td><td>${paras(it.offer)}</td></tr>`).join("")}</tbody></table>`;
    }
    if (p.tp.cast) {
      const cast = p.tp.cast;
      const rows = cast.groups.flatMap((g) => castRows(cast, g.key).map((r) => ({ g, r })));
      h += `<p class="tbl-title">Состав исполнителей${cast.clause ? ` (п. ${esc(cast.clause)} ТЗ)` : ""}</p>`;
      h += `<table><thead><tr><th style="width:6%">№</th><th style="width:24%">Исполнитель</th><th>Фамилия, имя, отчество</th><th style="width:32%">Почётное звание</th></tr></thead><tbody>${rows.map(({ g, r }, i) => `<tr><td>${i + 1}</td><td>${esc(g.one)}</td><td>${r.name.trim() ? esc(r.name.trim()) : "<mark>[фамилия, имя, отчество]</mark>"}</td><td>${r.title.trim() ? esc(r.title.trim()) : g.rank ? "<mark>[почётное звание]</mark>" : "—"}</td></tr>`).join("")}</tbody></table>`;
    }
    return h;
  }
  function anketaDoc(p) {
    const extra = p.tp.form.participantFields.filter((f, i, all) => all.indexOf(f) === i && !COVERED.some((re) => re.test(f.trim())));
    const rows = [...ANKETA.map(([key, label]) => ({ label, value: S.profile[key].trim() })), ...extra.map((label) => ({ label, value: "" }))];
    return `<h3>${esc(PART_TITLES.participant)}</h3>
      <table><thead><tr><th style="width:6%">№</th><th style="width:44%">Наименование сведений</th><th>Сведения об участнике</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.label)}</td><td>${r.value ? esc(r.value) : "<mark>[заполните]</mark>"}</td></tr>`).join("")}</tbody></table>
      <p class="hint">Строки, которые к вам не относятся, удалите.</p>
      ${signature()}`;
  }
  const declDoc = (p) => `<h3>${esc(PART_TITLES.declaration)}</h3>${paras(fillFromProfile(p.tp.form.smeDeclaration), true)}${signature()}`;
  function evidenceDoc(p, k) {
    const cols = k === "experience"
      ? ["Заказчик", "Предмет договора", "Номер и дата договора", "Цена договора, руб.", "Дата акта о приёмке"]
      : ["Фамилия, имя, отчество", "Должность, роль", "Образование, квалификация", "Документ о квалификации, срок действия", "Основание работы"];
    const demo = EVIDENCE_DEMO[k];
    const tail = k === "experience"
      ? "Общая цена исполненных договоров: 1 762 000,00 руб.\nПриложения: копии исполненных договоров и актов о приёмке — 4 шт."
      : "Приложения: копии дипломов, удостоверений и трудовых договоров — 4 шт.";
    return `<h3>${esc(PART_TITLES[k])}</h3>
      <p>Участник закупки: ${S.profile.fullName.trim() ? esc(S.profile.fullName.trim()) : "<mark>[наименование участника]</mark>"}</p>
      <table><thead><tr><th style="width:6%">№</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${demo.rows.map((r, i) => `<tr><td>${i + 1}</td>${r.map((v) => `<td>${docFields(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ${paras(tail)}${signature()}`;
  }
  function priceDoc(p) {
    const price = p.tpPrice;
    const amount = price ? `${fmtRub(price)} руб. (${rublesInWords(price)})` : "[цена договора цифрами] руб. ([цена прописью])";
    const vat = S.profile.vatNote.trim() || "[в том числе НДС по ставке __% — сумма НДС, либо «НДС не облагается» с указанием основания]";
    return `<h3>${esc(PART_TITLES.price)}</h3><p class="c">Предмет закупки: ${esc(p.subject)}</p>${paras(`Предлагаемая цена договора составляет ${amount}, ${vat}.`, true)}${paras(p.tp.form.priceNote, true)}${signature()}`;
  }

  /* ---------- документы заявки: все готовые файлы в одном окне ---------- */
  // Скачать заявку можно из шапки закупки, из «Готово к подаче» в конце шагов и из дела на главной.
  // Каждая часть — отдельным файлом Word; жёлтые поля — то, что осталось вписать.
  function filesRows(p) {
    const [, tp] = stepsOf(p);
    const missing = PROFILE_KEYS.length - filledCount();
    const row = (name, sub, tag, action) => `<li class="file-row">
        <span class="law icon" aria-hidden="true">${ic("file", 16)}</span>
        <span class="prow-text"><span class="file-title">${esc(name)}</span><span class="file-sub">${sub}</span></span>
        ${tag}${action}
      </li>`;
    const dl = (k) => `<button class="btn soft xs" type="button" data-act="file-dl" data-part="${k}" data-id="${p.id}"${S.ui.writing ? " disabled" : ""}>${S.ui.writing === k ? "Пишу…" : "Скачать"}</button>`;
    const rows = [row(PART_TITLES.tp, "первая часть заявки — без названия и реквизитов участника",
      tp.state === "todo" ? badge("calm", "не составлено") : tp.state === "fix" ? badge("warn", tp.status, "pen") : badge("ok", "готово", "check"),
      tp.state === "todo" ? `<button class="btn soft xs" type="button" data-go="tp" data-id="${p.id}">Составить</button>` : dl("tp"))];
    if (!p.tp) return rows.join("") + '<li class="file-note">Анкета, декларация и предложение о цене появятся, когда составите ТП: форму заявки беру из документов закупки.</li>';
    for (const k of partsOf(p.tp.form, p.criteria).filter((x) => x !== "tp")) {
      const writing = S.ui.writing === k;
      if (isEvidence(k)) {
        const n = S.docs.filter((d) => d.kinds.includes(k)).length;
        rows.push(row(PART_TITLES[k], n ? `из ${n} ${plural(n, "документа", "документов", "документов")} в «Образцах и реквизитах» · за них дают баллы` : "загрузите документы в «Образцы и реквизиты» — без них баллов не будет",
          writing ? badge("calm", "пишу документ…") : p.sample ? badge("warn", k === "experience" ? "8,8 из 15 баллов" : "7,5 из 15 баллов", "alert") : n ? badge("brand", "за них баллы") : badge("warn", "нет документов", "alert"),
          dl(k)));
        continue;
      }
      const price = k === "price";
      const tag = writing ? badge("calm", "пишу документ…")
        : price ? (p.tpPrice ? badge("ok", "цена вписана", "check") : badge("warn", "впишите цену", "pen"))
        : missing ? badge("warn", "впишите реквизиты", "pen") : badge("ok", "готово", "check");
      const sub = price ? (p.tpPrice ? "цена — из шага 2" : "цену вписывают на шаге 2, в ТП")
        : missing ? `в «Реквизитах» не хватает ${missing} ${plural(missing, "поля", "полей", "полей")} — в файле они жёлтые` : "реквизиты — из «Реквизитов»";
      rows.push(row(PART_TITLES[k], sub, tag, dl(k)));
    }
    return rows.join("");
  }
  function openFiles(p) {
    if (!p) return;
    const [, , check] = stepsOf(p);
    const n = p.tp ? partsOf(p.tp.form, p.criteria).length : 1;
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">${esc(p.short)}</span>
      <h2 id="m-title">Документы заявки</h2>
      <p class="small ink2 m0">Каждая часть — отдельным файлом Word. Что осталось вписать, в файле выделено жёлтым.</p>
      <ul class="files-list" id="files-list">${filesRows(p)}</ul>
      <div class="btn-row"><button class="btn" type="button" data-act="files-zip" data-id="${p.id}"${p.tp ? "" : " disabled"}>${ic("download", 16)}Скачать всё архивом</button><span class="small muted">${n} ${plural(n, "файл", "файла", "файлов")} Word</span></div>
      ${check.state === "done" ? "" : `<p class="small ink2 m0">Перед подачей проверьте заявку: <button class="link" type="button" data-go="check" data-id="${p.id}">шаг 3, проверка заявки</button>.</p>`}
    </div>`);
  }

  /* ---------- уведомления: колокольчик в шапке ---------- */
  // Ответы юриста, сроки подачи и конец приёма заявок. Новые — жирным и с точкой бренда, число — на колокольчике.
  // Копии уходят письмом на почту из «Реквизитов».
  function initNotes() {
    const notes = S.law.threads.filter((t) => t.unread).map((t) => ({ id: `n-${t.id}`, tone: "brand", title: "Юрист ответил на вопрос", text: `«${t.title}»`, sub: `${lawPurchase(t) ? lawPurchase(t).short : "Общий вопрос"} · ${t.messages[t.messages.length - 1].when}`, unread: true, thread: t.id }));
    for (const p of [...S.purchases].sort(byUrgency)) {
      const due = dueLine(p.deadline, false);
      if (!due) continue;
      const [, tp] = stepsOf(p);
      if (due.days >= 0 && due.tone === "soon") {
        notes.push({ id: `n-due-${p.id}`, tone: "warn", title: `До подачи ${daysText(due.days)}`, text: tp.state === "fix" ? `В ТП осталось: ${tp.status}` : tp.state === "todo" ? "ТП ещё не составлено" : "", sub: `${p.short} · сегодня, 09:00`, unread: false, go: "p", id: p.id });
      } else if (due.days < 0) {
        notes.push({ id: `n-end-${p.id}`, tone: "", title: "Приём заявок закончился", text: "", sub: `${p.short} · ${due.head.replace(/^Приём заявок закончился /, "")}`, unread: false, go: "p", id: p.id });
      }
    }
    return notes;
  }
  function bellHTML() {
    const fresh = S.notes.filter((n) => n.unread).length;
    return `<button class="icon-btn bell" type="button" id="bell" data-act="notif" aria-haspopup="dialog" aria-controls="notif" aria-expanded="${S.notifOpen}" aria-label="Уведомления${fresh ? `, новых: ${fresh}` : ""}">${ic("bell", 20)}${fresh ? `<span class="bell-dot" aria-hidden="true">${fresh}</span>` : ""}</button>`;
  }
  function notifHTML() {
    const fresh = S.notes.filter((n) => n.unread).length;
    const email = S.profile.email.trim();
    return `<div class="notif-head"><h2 class="panel-title" id="notif-title">Уведомления${fresh ? ` <span class="count">${fresh}</span>` : ""}</h2>${fresh ? '<button class="link quiet small" type="button" data-act="notif-read">Прочитать все</button>' : ""}</div>
      ${S.notes.length ? `<ul class="notif-list">${S.notes.map((n) => `<li><button class="notif-item${n.unread ? " unread" : ""}" type="button" data-act="note" data-note="${n.id}">
        <span class="todo-dot ${n.tone}" aria-hidden="true"></span>
        <span class="prow-text"><span class="prow-title">${esc(n.title)}${n.unread ? '<span class="sr-only">, новое</span>' : ""}</span>${n.text ? `<span class="notif-text">${esc(n.text)}</span>` : ""}<span class="prow-sub">${esc(n.sub)}</span></span>
        ${n.unread ? '<span class="notif-new" aria-hidden="true"></span>' : "<span></span>"}
      </button></li>`).join("")}</ul>` : '<p class="notif-empty">Уведомлений пока нет.</p>'}
      <p class="notif-foot">Копии приходят письмом на ${email ? esc(email) : "почту из «Реквизитов»"}. В прототипе письма не отправляются.</p>`;
  }
  function renderNotif() {
    const box = $("#notif");
    box.hidden = !S.notifOpen;
    box.innerHTML = S.notifOpen ? notifHTML() : "";
    const bell = $("#bell");
    if (bell) bell.setAttribute("aria-expanded", String(S.notifOpen));
  }
  // focusBell — вернуть фокус на колокольчик (закрыли клавишей или кнопкой), а не при переходе по уведомлению.
  function setNotif(open, focusBell = true) {
    S.notifOpen = open;
    renderNotif();
    if (open) { const first = $("#notif .notif-item") || $("#notif .link"); if (first) first.focus(); }
    else if (focusBell) { const bell = $("#bell"); if (bell) bell.focus(); }
  }

  /* ---------- вопросы юристу ---------- */
  // Живой юрист по закупкам: вопрос уходит вместе с документами закупки, ответ — обычно в течение рабочего дня.
  // Ответил — число в меню, уведомление в колокольчике, дело на главной и письмо на почту из «Реквизитов».
  function lawPurchase(t) { return S.purchases.find((p) => p.id === t.pid); }
  function lawStatus(t) {
    const last = t.messages[t.messages.length - 1];
    if (last.role === "user") return badge("calm", "ждёт ответа", "clock");
    return t.unread ? badge("brand", "новый ответ") : badge("ok", "юрист ответил", "check");
  }
  function lawRowsHTML() {
    return S.law.threads.map((t) => `<li><button class="prow law-row" type="button" data-act="law-open" data-thread="${t.id}"${S.law.open === t.id ? ' aria-current="true"' : ""}>
        <span class="prow-text"><span class="prow-title">${esc(t.title)}</span><span class="prow-sub">${esc(lawPurchase(t) ? lawPurchase(t).short : "Общий вопрос")}</span><span>${lawStatus(t)}</span></span>
        <span class="chev">${ic("chev", 16)}</span>
      </button></li>`).join("");
  }
  const lawMetaHTML = (t) => `${lawPurchase(t) ? `<button class="link" type="button" data-go="p" data-id="${t.pid}">${esc(lawPurchase(t).short)}</button>` : "<span>Общий вопрос</span>"}${lawStatus(t)}`;
  function lawBodyHTML(t) {
    const p = lawPurchase(t);
    const waiting = t.messages[t.messages.length - 1].role === "user";
    const msgs = t.messages.map((m) => (m.role === "user"
      ? `<div class="msg user">${esc(m.text)}</div>`
      : `<div class="msg lawyer"><p class="who"><span class="avatar" aria-hidden="true">${LAWYER.initials}</span><b>${esc(LAWYER.name)}</b><span>${esc(LAWYER.role)} · ${esc(m.when)}</span></p>${m.text.split(/\n\n+/).map((x) => `<p>${esc(x)}</p>`).join("")}</div>`)).join("");
    const ctx = t.ctx
      ? `<div class="law-ctx"><p class="law-ctx-label">Приложено к вопросу: ${esc(t.ctx.label)}${p ? " и документы закупки" : ""}</p><p class="law-ctx-text">${esc(t.ctx.text)}</p></div>`
      : p ? `<p class="law-ctx-label">Приложены документы закупки: ${p.files.length}</p>` : "";
    return `${ctx}
      <div class="law-feed" aria-live="polite">${msgs}</div>
      ${waiting ? `<p class="law-wait">${ic("clock", 16)}<span>Юрист ответит в течение рабочего дня. Когда ответит — уведомление в колокольчике наверху и письмо на почту.</span></p>` : ""}`;
  }
  function threadHTML(t) {
    return `<section class="panel law-thread" aria-labelledby="law-t-title">
      <div class="law-head">
        <button class="icon-btn law-back" type="button" data-act="law-back" aria-label="Все вопросы">${ic("back", 18)}</button>
        <div class="law-head-text">
          <h2 class="law-title" id="law-t-title" tabindex="-1">${esc(t.title)}</h2>
          <div class="law-meta">${lawMetaHTML(t)}</div>
        </div>
      </div>
      <div class="law-body">${lawBodyHTML(t)}</div>
      <form class="law-compose" id="law-reply">
        <div class="prompt">
          <textarea id="law-reply-q" rows="1" placeholder="Уточнить у юриста…" aria-label="Сообщение юристу" data-enter>${esc(S.drafts.law || "")}</textarea>
          <div class="prompt-foot"><span></span><button class="circle send" type="submit" aria-label="Отправить юристу">${ic("send")}</button></div>
        </div>
      </form>
    </section>`;
  }
  function lawyerHTML() {
    const threads = S.law.threads;
    if (!threads.length) {
      return `<div class="page-col"><section class="panel"><div class="empty"><p>Вопросов юристу пока нет. Задайте вопрос — ответит живой юрист по закупкам, обычно в течение рабочего дня.</p><button class="btn" type="button" data-act="lawyer-new">${ic("plus")}Задать вопрос</button></div></section></div>`;
    }
    const open = threads.find((t) => t.id === S.law.open);
    return `<div class="law-ws"${open ? " data-open" : ""}>
      <section class="panel law-list" aria-labelledby="law-list-title">
        <div class="panel-head"><h2 class="panel-title" id="law-list-title">Вопросы <span class="count">${threads.length}</span></h2></div>
        <ul class="plist">${lawRowsHTML()}</ul>
      </section>
      ${open ? threadHTML(open) : '<section class="panel law-thread"><p class="list-empty">Выберите вопрос в списке.</p></section>'}
    </div>`;
  }
  function markThreadRead(t) {
    t.unread = false;
    S.notes.forEach((n) => { if (n.thread === t.id) n.unread = false; });
  }
  function openThread(id) {
    const t = S.law.threads.find((x) => x.id === id);
    if (!t) return;
    if (S.screen !== "lawyer") { S.law.want = id; go("lawyer"); }
    else { S.law.open = id; markThreadRead(t); rerender(); }
    const h = $("#law-t-title");
    if (h) h.focus({ preventScroll: true });
  }

  function markIn(text, phrase) {

  /* ---------- отрисовка и навигация ---------- */
  function screenHTML() {
    switch (S.screen) {
      case "home": return homeHTML();
      case "ask": return askHTML();
      case "lawyer": return lawyerHTML();
      case "new": return newHTML();
      case "profile": return profileHTML();

  }
  function autosize(el) {
    const max = el.classList.contains("edit-area") ? 600 : el.closest(".prompt") ? 160 : el.closest(".paste-box") ? 320 : 140;
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, max)}px`;
  }
  // Строка шагов: подписи сокращаются по ступеням, пока она не поместится, — как в приложении (purchase-view.tsx).
  // Не помещается и так — инструменты уходят на свою строку, шаги листаются отдельно.
  const FIT_NAMES = ["short-tp", "short-check", "icons", "tight", "stack"];
  const FIT_LEVELS = [[], ["short-tp"], ["short-tp", "short-check"], ["short-tp", "short-check", "icons"], ["short-tp", "short-check", "icons", "tight"]];
  const STACKED = ["short-tp", "short-check", "tight", "stack"];
  function fitTabs() {
    const nav = $("#tabs");
    if (!nav || !nav.offsetParent) return;
    const apply = (level) => FIT_NAMES.forEach((name) => nav.toggleAttribute(`data-${name}`, level.includes(name)));
    for (const level of FIT_LEVELS) {
      apply(level);
      if (nav.scrollWidth <= nav.clientWidth) return;
    }
    apply(STACKED);
    // Шаги листаются отдельно — текущий должен быть на виду.
    const row = nav.querySelector(".steps"), current = row.querySelector('[aria-current="page"]');
    if (!current) return;
    const r = row.getBoundingClientRect(), c = current.getBoundingClientRect();
    if (c.right > r.right) row.scrollLeft += c.right - r.right + 8;
    else if (c.left < r.left) row.scrollLeft -= r.left - c.left + 8;
  }
  window.addEventListener("resize", fitTabs);
  // Подсказка привязана к месту на экране: при прокрутке и смене размера окна закрываем её.
  window.addEventListener("resize", () => closeHint(false));
  document.addEventListener("scroll", () => closeHint(false), true);
  if (document.fonts) document.fonts.ready.then(fitTabs);
  const renderSide = () => { $("#side").innerHTML = sideHTML(); };
  const renderHead = () => { $("#head").innerHTML = headHTML(); };
  function render() {
    closeHint(false);
    renderSide();
    renderHead();
    const view = $("#view");
    view.classList.toggle("fill", WORK.includes(S.screen) || S.screen === "ask");
    view.innerHTML = screenHTML();
    document.querySelectorAll("#view textarea").forEach(autosize);
    fitTabs();
  }
  // Перерисовка на месте: фокус остаётся на том же элементе.
  function focusKey(el) {
    if (!el || el === document.body) return null;
    const scope = el.closest("#view") ? "#view " : el.closest("#side") ? "#side " : el.closest("#head") ? "#head " : "";
    if (el.id) return `#${CSS.escape(el.id)}`;
    const act = el.getAttribute("data-act");
    const goTo = el.getAttribute("data-go");
    if (!act && !goTo) return null;
    let sel = scope + (act ? `[data-act="${act}"]` : `[data-go="${goTo}"]`);
    for (const k of ["data-open", "data-q", "data-part", "data-edit", "data-key", "data-kind", "data-i", "data-id", "data-fold", "data-lane"]) {
      const v = el.getAttribute(k);
      if (v !== null) sel += `[${k}="${CSS.escape(v)}"]`;
    }
    return sel;
  }
  // Панели прокручиваются сами по себе: при перерисовке на месте их прокрутка сохраняется.
  const scrollState = () => [...document.querySelectorAll("[data-scroll]")].filter((el) => el.id).map((el) => [el.id, el.scrollTop]);
  function rerender() {
    const key = focusKey(document.activeElement);
    const pos = scrollState();
    render();
    pos.forEach(([id, top]) => { const el = document.getElementById(id); if (el) el.scrollTop = top; });
    const el = key && document.querySelector(key);
    if (el) el.focus({ preventScroll: true });
  }
  // Счётчики в сайдбаре, списке закупок и вкладках — без перерисовки того, что сейчас правят.
  function refreshCounts() {
    renderSide();
    const p = PURCHASE_SCREENS.includes(S.screen) ? cur() : null;
    const body = $("#plist-body");
    if (body) body.innerHTML = plistBodyHTML(p);
    const tabs = $("#tabs");
    if (tabs && p) { tabs.outerHTML = tabsHTML(p); fitTabs(); }
  }
  const toTop = () => ["view", "pane-main", "chat-scroll"].forEach((id) => { const el = document.getElementById(id); if (el) el.scrollTop = 0; });

  let busyToken = 0;
  function go(screen, id, focusSel) {
    busyToken++;
    S.notifOpen = false;
    renderNotif();
    S.busy = null;
    if (screen === "p") screen = S.tabs[id || S.id] || "req";
    // На широком экране закупка открыта рядом со списком — как переписка в мессенджере.
    if (screen === "list" && !single.matches) {
      const target = cur() || [...S.purchases].sort(byUrgency)[0];
      if (target) { id = target.id; screen = S.tabs[target.id] || "req"; }
    }
    if (id && id !== S.id) S.info = false;
    if (id) S.id = id;
    S.screen = screen;
    // Вопросы юристу: открыт нужный разговор; на широком экране без выбора — первый, на узком — список.
    if (screen === "lawyer") {
      const want = S.law.want;
      S.law.want = null;
      S.law.open = want || (single.matches ? null : S.law.open || (S.law.threads[0] && S.law.threads[0].id) || null);
      const t = S.law.threads.find((x) => x.id === S.law.open);
      if (t) markThreadRead(t);
    }
    if (PURCHASE_SCREENS.includes(screen)) {
      if (cur()) S.tabs[S.id] = screen;
      else S.screen = "list";
    } else S.info = false;
    S.ui = {};
    S.visit++;
    S.drawer = false;
    render();
    applyDrawer();
    toTop();
    const keep = focusSel && document.querySelector(focusSel);
    const target = keep && keep.offsetParent !== null ? keep : PURCHASE_SCREENS.includes(S.screen) ? $("#pd-title") : $("#page-title");
    if (target) target.focus({ preventScroll: true });
  }

  // Шаги работы ИИ. Если за это время ушли на другой экран, результат не применяется.
  async function runSteps(lines, sub) {
    const token = ++busyToken;
    S.busy = { lines, sub: sub || "В приложении это занимает 1–2 минуты." };
    render();
    for (let i = 0; i < lines.length; i++) {
      if (token !== busyToken) return false;
      const text = $("#busy-text"), bar = $("#busy-bar");
      if (text) text.textContent = lines[i];
      if (bar) bar.style.width = `${Math.round(((i + 1) / lines.length) * 100)}%`;
      await wait(750);
    }
    if (token !== busyToken) return false;
    S.busy = null;
    return true;
  }

  /* ---------- тема: как в системе, пока не выбрали сами ---------- */

  }

  /* ---------- вопросы ---------- */
  function answerFor(p, question) {
    const map = p ? p.answers : GENERAL_QA;
    const q = question.trim().toLowerCase();
    const key = Object.keys(map).find((k) => k.toLowerCase() === q);
    if (key) return clone(map[key]);
    return {
      text: `**Тестовый режим.** В прототипе ответы заготовлены только для вопросов-подсказок. В приложении с подключённой моделью я отвечу и на этот вопрос — по ${p ? "документам закупки и закону" : "44-ФЗ, 223-ФЗ и приложенным документам"}, со ссылкой на статью и пункт.\n\nВаш вопрос: «${question.trim()}»`,
      src: [],
    };
  }
  function showsThread(p) {
    return p ? S.screen === "chat" && cur() === p : S.screen === "ask";
  }
  function refreshFeed(p, toBottom) {
    if (!showsThread(p)) return;
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const feed = $("#feed");
    if (!feed) return;
    const box = $("#chat-scroll");
    const near = box ? box.scrollTop + box.clientHeight >= box.scrollHeight - 160 : false;
    const empty = !messages.length && !holder.thinking;
    feed.innerHTML = feedInner(messages, holder.thinking, p);
    feed.hidden = empty;
    const intro = $("#chat-intro");
    if (intro) intro.hidden = !empty;
    const used = messages.filter((m) => m.role === "user").map((m) => m.text);
    $("#chips").innerHTML = chipsHTML(p ? CHAT_SUGGEST : GENERAL_SUGGEST, used);
    if (box && (toBottom || near)) box.scrollTop = box.scrollHeight;
  }
  async function ask(p, question, files) {
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const last = messages[messages.length - 1];
    if (holder.thinking || (last && last.done === false)) { toast("Дождитесь ответа на предыдущий вопрос."); return; }
    messages.push({ role: "user", text: question.trim(), files: files || [] });
    holder.thinking = true;
    refreshFeed(p, true);
    refreshCounts();
    await wait(800);
    holder.thinking = false;
    const a = answerFor(p, question);
    const m = { role: "assistant", text: a.text, src: a.src || [], note: a.note || "", shown: "", done: false };
    messages.push(m);
    const tokens = a.text.match(/\*\*[^*]+\*\*[^\S\n]*|\S+[^\S\n]*|\n+/g) || [a.text];
    for (let k = 0; k < tokens.length; k++) {
      m.shown += tokens[k];
      if (k % 2 === 0) { refreshFeed(p); await wait(28); }
    }
    m.done = true;
    refreshFeed(p);
  }

  /* ---------- действия ---------- */
  async function createPurchase() {
    if (S.purchases.some((p) => p.id === TEMPLATE.id)) {
      go("p", TEMPLATE.id);
      toast("Пример новой закупки уже добавлен — открыл его.");
      return;
    }
    if (!(await runSteps(NEW_STEPS))) return;
    S.purchases.push(prepare(TEMPLATE, false));
    go("p", TEMPLATE.id);
    toast("Закупка добавлена. Прототип не читает файлы, поэтому показан пример «Концерт ко Дню матери».");
  }
  function openSample() {
    if (!S.purchases.some((p) => p.id === P1.id)) S.purchases.push(prepare(P1, true));
    go("p", P1.id);
  }
  async function addToPurchase(p, names) {
    if (!(await runSteps(ADDING_STEPS))) return;
    names.forEach((n) => { if (!p.files.includes(n)) p.files.push(n); });
    p.unreadable = p.unreadable.filter((f) => !names.includes(f.name));
    rerender();
    toast(`Добавлено: ${names.join(", ")}. В приложении требования и сроки перечитываются с учётом нового файла.`);
  }
  async function compose(p) {
    if (!p.sample && !(await runSteps(TP_STEPS))) return;
    S.busy = null;
    p.tp = draftTp(p);
    p.parts = {};
    S.ui = {};
    render();
    toTop();
  }
  // Документ пишется около минуты; строка на шаге ТП и в окне документов заявки показывает, что идёт работа.
  async function writePart(p, k, back) {
    const visit = S.visit;
    const redraw = () => {
      const parts = $("#parts-list"), files = $("#files-list");
      if (parts) parts.innerHTML = partsRows(p);
      if (files) files.innerHTML = filesRows(p);
    };
    if (!p.sample) {
      S.ui.writing = k;
      redraw();
      await wait(1600);
      if (S.visit !== visit) return;
      p.parts[k] = { key: basisKey(p, k), basis: basisText(p, k) };
      S.ui.writing = null;
      redraw();
      // Окно документов закрыли, пока документ писался, — не открываем его снова.
      if (back && $("#modal").hidden) return;
    }
    openPreview(p, k, back);
  }
  function onPartClick(p, k, redo) {
    const made = p.parts[k];
    if (!redo && (p.sample || (made && made.key === basisKey(p, k)))) { openPreview(p, k); return; }
    writePart(p, k);
  }
  async function runCheck(p) {
    if (!(await runSteps(["Читаю вашу заявку…", "Сверяю с ТЗ по каждому пункту…", "Смотрю, за что могут отклонить…"]))) return;
    p.check.state = "done";
    rerender();
    toTop();
  }
  async function fillFromDocs() {
    const visit = S.visit;
    S.ui.filling = true;
    rerender();
    await wait(1200);
    const filled = FOUND.filter((f) => !S.profile[f.key].trim());
    filled.forEach((f) => { S.profile[f.key] = f.value; S.sources[f.key] = f.source; });
    if (S.visit !== visit) { renderSide(); return; }
    S.ui.filling = false;
    S.ui.fillNote = filled.length
      ? { tone: "ok", text: `Заполнил ${filled.length} ${plural(filled.length, "поле", "поля", "полей")} из ваших документов — под ними написано, откуда. Проверьте.` }
      : { tone: "info", text: "Нового в документах не нашлось: всё, что там есть, уже вписано." };
    rerender();
  }
  async function addMyDocs(files) {
    const added = files.map((f) => ({ id: uid(), name: f.name, kinds: guessKinds(f.name), about: "", pages: Math.max(1, Math.round(f.size / 60000)), added: "25.09.2026" }));
    const requisites = added.some((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
    const steps = ["Читаю файлы…", "Раскладываю по видам…", ...(requisites ? ["Заполняю реквизиты…"] : [])];
    if (!(await runSteps(steps, "Сканы и фото распознаются дольше — примерно минута на каждые 10 страниц."))) return;
    S.docs.unshift(...added);
    S.ui.report = { added, requisites };
    render();
    toTop();
  }

  let saveTimer;
  function onProfileInput(input) {
    const key = input.dataset.pf;
    S.profile[key] = input.value;
    if (S.sources[key]) {
      delete S.sources[key];
      const src = $(`[data-src-of="${key}"]`);
      if (src) src.remove();
    }
    const state = $("#save-state");
    if (state) state.textContent = "Сохраняю…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      S.ui.saved = "Сохранено.";
      const st = $("#save-state");
      if (st && S.screen === "profile") st.textContent = S.ui.saved;
    }, 400);
    renderSide();
    const sub = $("#head .head-sub");
    if (sub) sub.textContent = headInfo().sub;
  }
  function onEditInput(area) {
    const p = cur();
    const [type, i] = area.dataset.edit.split(":");
    if (type === "good") p.tp.goods[Number(i)].characteristics = area.value;
    else p.tp.items[Number(i)].offer = area.value;
    const li = area.closest("li");
    const flag = li.querySelector("[data-flag]");
    if (needsFill(area.value)) { if (!flag) li.querySelector(".item-head").insertAdjacentHTML("beforeend", '<span class="flag" data-flag>впишите данные</span>'); }
    else if (flag) flag.remove();
    $("#tp-notes").innerHTML = tpNotes(p);
    refreshCounts();
  }
  function onPriceInput(input) {
    const p = cur();
    const value = Number(input.value.replace(/[\s ]/g, "").replace(",", "."));
    p.tpPriceText = input.value;
    p.tpPrice = Number.isFinite(value) && value > 0 ? value : null;
    $("#price-info").innerHTML = priceInfo(p);
    if (!S.ui.writing) $("#parts-list").innerHTML = partsRows(p);
  }

  function handleAct(act, el) {
    const p = cur();
    switch (act) {
      case "drawer": setDrawer(!S.drawer); break;
      case "theme": setTheme(!isDark()); rerender(); break;
      case "info": setInfo(!S.info); break;
      case "info-close": setInfo(false); break;
      case "fold": S.fold[el.dataset.fold] = !S.fold[el.dataset.fold]; rerender(); break;
      case "hint": openHint(el); break;
      case "backup-save": {
        const inside = dataContents();
        S.ui.backupNote = inside
          ? { tone: "ok", text: `В приложении здесь скачается файл «Тендерный юрист — копия ${new Date().toLocaleDateString("ru-RU")}.json»: ${inside}. В прототипе файл не сохраняется.` }
          : { tone: "info", text: "Сохранять пока нечего: в этом браузере нет ни закупок, ни образцов, ни реквизитов." };
        rerender();
        break;
      }
      case "wipe-ask": S.ui.wipeAsk = true; rerender(); { const no = $("#wipe-no"); if (no) no.focus(); } break;
      case "wipe-no": S.ui.wipeAsk = false; rerender(); { const ask = $("#wipe-ask"); if (ask) ask.focus(); } break;
      case "wipe-yes": wipeAll(); break;
      case "legal": openLegal(el.dataset.doc); break;
      case "consent-ok": acceptConsent(); break;
      case "drawer-close": setDrawer(false); break;
      case "close": closeModal(); break;
      case "sample": openSample(); break;
      case "lane": S.lane = S.lane === el.dataset.lane ? null : el.dataset.lane; rerender(); break;
      case "gdoc-x": {
        const [name] = S.general.docs.splice(Number(el.dataset.i), 1);
        S.general.pending = S.general.pending.filter((n) => n !== name);
        rerender();
        break;
      }
      case "q": {
        if (S.screen === "ask") { const pending = S.general.pending; S.general.pending = []; ask(null, el.dataset.q, pending); }
        else ask(p, el.dataset.q);
        break;
      }
      case "toggle": S.ui.open = S.ui.open === el.dataset.open ? null : el.dataset.open; rerender(); break;
      case "ref": openRef(el.dataset.ref, el.dataset.hl); break;
      case "lawyer": {
        // Что приложить: итог проверки заявки или ответ ИИ, после которого возник вопрос.
        if (el.dataset.from === "check" && p) {
          const found = p.check.findings.map((f) => f.what).join(" ");
          openAskLawyer({ pid: p.id, label: "итог проверки заявки", text: found || "Проверка заявки: ошибок нет.", question: "" });
          break;
        }
        const list = S.screen === "ask" ? S.general.messages : p ? p.chat : [];
        const i = Number(el.dataset.i);
        const m = list[i];
        const before = list.slice(0, i).reverse().find((x) => x.role === "user");
        const plain = m ? m.text.replace(/\*\*/g, "").replace(/\s+/g, " ").trim() : "";
        openAskLawyer({ pid: S.screen === "ask" ? "" : p ? p.id : "", label: "ответ ИИ", text: plain.length > 240 ? `${plain.slice(0, 238).trim()}…` : plain, question: before ? before.text : "" });
        break;
      }
      case "lawyer-new": openAskLawyer({ pid: "" }); break;
      case "law-open": openThread(el.dataset.thread); break;
      case "law-back": {
        const was = S.law.open;
        S.law.open = null;
        rerender();
        const row = $(`[data-act="law-open"][data-thread="${was}"]`);
        if (row) row.focus();
        break;
      }
      case "notif": setNotif(!S.notifOpen); break;
      case "notif-read": {
        S.notes.forEach((n) => { n.unread = false; });
        renderHead();
        renderNotif();
        const first = $("#notif .notif-item");
        if (first) first.focus();
        break;
      }
      case "note": {
        const n = S.notes.find((x) => x.id === el.dataset.note);
        if (!n) break;
        n.unread = false;
        setNotif(false, false);
        if (n.thread) openThread(n.thread);
        else go(n.go, n.id);
        break;
      }
      case "files": openFiles(S.purchases.find((x) => x.id === el.dataset.id) || p); break;
      case "file-dl": {
        const q = S.purchases.find((x) => x.id === el.dataset.id) || p;
        const k = el.dataset.part;
        const made = q.parts[k];
        if (k === "tp" || q.sample || (made && made.key === basisKey(q, k))) openPreview(q, k, true);
        else writePart(q, k, true);
        break;
      }
      case "files-zip": {
        const q = S.purchases.find((x) => x.id === el.dataset.id) || p;
        toast(`В рабочей версии скачается архив «${q.short} — заявка.zip» со всеми файлами Word. В прототипе откройте файлы по одному.`);
        break;
      }
      case "ask-delete": S.ui.confirmDelete = true; rerender(); { const b = $('[data-act="cancel-delete"]'); if (b) b.focus(); } break;
      case "cancel-delete": S.ui.confirmDelete = false; rerender(); break;
      case "delete": S.purchases = S.purchases.filter((x) => x !== p); S.id = null; go("list"); toast("Закупка удалена."); break;
      case "compose": compose(p); break;
      case "ask-redo": S.ui.confirmRedo = true; rerender(); { const b = $('[data-act="redo"]'); if (b) b.focus(); } break;
      case "cancel-redo": S.ui.confirmRedo = false; rerender(); break;
      case "redo": compose(p); break;
      case "edit": {
        S.ui.editing = el.dataset.edit;
        const [type, i] = el.dataset.edit.split(":");
        const value = type === "good" ? p.tp.goods[Number(i)].characteristics : p.tp.items[Number(i)].offer;
        el.outerHTML = editHTML(el.dataset.edit, value, el.dataset.label);
        const area = $(`#edit-${el.dataset.edit.replace(":", "-")}`);
        if (area) { autosize(area); area.focus(); area.setSelectionRange(area.value.length, area.value.length); }
        break;
      }
      case "part": onPartClick(p, el.dataset.part, false); break;
      case "part-redo": onPartClick(p, el.dataset.part, true); break;
      case "preview-tp": openPreview(p, "tp"); break;
      case "cast-paste": {
        S.ui.castPaste = !S.ui.castPaste;
        rerender();
        const target = S.ui.castPaste ? $("#cast-paste-text") : $('[data-act="cast-paste"]');
        if (target) target.focus();
        break;
      }
      case "cast-example": {
        S.ui.castText = CAST_EXAMPLE;
        const area = $("#cast-paste-text");
        if (area) { area.value = CAST_EXAMPLE; autosize(area); area.focus(); }
        break;
      }
      case "cast-split": splitCast(p); break;
      case "cast-add": {
        const id = uid();
        p.tp.cast.rows.push({ id, group: el.dataset.key, name: "", title: "" });
        rerender();
        const input = document.getElementById(`cast-name-${id}`);
        if (input) input.focus();
        break;
      }
      case "cast-del": {
        const row = p.tp.cast.rows.find((r) => r.id === el.dataset.key);
        if (!row) break;
        p.tp.cast.rows = p.tp.cast.rows.filter((r) => r !== row);
        rerender();
        const add = $(`[data-act="cast-add"][data-key="${row.group}"]`);
        if (add) add.focus();
        break;
      }
      case "sample-check": runCheck(p); break;
      case "recheck": p.check.state = "none"; rerender(); toTop(); break;
      case "floor-price": {
        const { floor } = priceFloor(calcOf(p));
        if (floor.ok) { p.priceCalc = { ...(p.priceCalc || {}), price: floor.price }; refreshPrice(p, "floor"); }
        break;
      }
      case "fill": fillFromDocs(); break;
      case "sug-accept": case "sug-dismiss": {
        const group = groupSuggestions(S.suggestions)[Number(el.dataset.i)];
        if (!group) break;
        if (act === "sug-accept") group.forEach((it) => { S.profile[it.key] = it.value; S.sources[it.key] = it.source; });
        S.suggestions = S.suggestions.filter((s) => !group.includes(s));
        if (act === "sug-accept") S.ui.saved = "Сохранено.";
        rerender();
        break;
      }
      case "kind-edit": {
        const d = S.docs.find((x) => x.id === el.dataset.key.split(":")[1]);
        S.ui.editKind = el.dataset.key; S.ui.confirmDoc = null; S.ui.kindDraft = [...d.kinds];
        rerender();
        break;
      }
      case "kind-toggle": {
        const k = el.dataset.kind, draft = S.ui.kindDraft;
        S.ui.kindDraft = draft.includes(k) ? draft.filter((x) => x !== k) : [...draft, k];
        rerender();
        break;
      }
      case "kind-save": {
        const d = S.docs.find((x) => x.id === el.dataset.key.split(":")[1]);
        const kinds = DOC_KIND_KEYS.filter((k) => S.ui.kindDraft.includes(k));
        d.kinds = kinds.length ? kinds : ["other"];
        S.ui.editKind = null;
        render();
        break;
      }
      case "kind-cancel": S.ui.editKind = null; rerender(); break;
      case "doc-del": S.ui.confirmDoc = el.dataset.key; S.ui.editKind = null; rerender(); break;
      case "doc-del-no": S.ui.confirmDoc = null; rerender(); break;
      case "doc-del-yes": {
        const id = el.dataset.key.split(":")[1];
        S.docs = S.docs.filter((d) => d.id !== id);
        S.ui.confirmDoc = null;
        render();
        toast("Документ удалён.");
        break;
      }
    }
  }

  /* ---------- события ---------- */
  document.addEventListener("mousedown", (e) => { if (e.target.closest && e.target.closest("#cast-sug")) e.preventDefault(); });
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (hintFrom && !t.closest("#hint-pop") && t.closest(".hint-btn") !== hintFrom) closeHint(false);
    const opt = t.closest && t.closest("#cast-sug [data-sug]");
    if (opt) { pickSug(Number(opt.dataset.sug)); return; }
    if (t.id === "modal") { closeModal(); return; }
    if (t.id === "scrim") { setDrawer(false); return; }
    if (S.notifOpen && !t.closest("#notif") && !t.closest("#bell")) setNotif(false, false);
    const nav = t.closest("[data-go]");
    if (nav && nav.closest("#modal")) closeModal();
    // Во вкладках и в списке закупок фокус остаётся там, где нажали.
    if (nav) { go(nav.dataset.go, nav.dataset.id, nav.closest(".tabs, .ws-list") ? focusKey(nav) : null); return; }
    const act = t.closest("[data-act]");
    if (act && act.tagName === "A") e.preventDefault();
    if (act && !act.disabled) handleAct(act.dataset.act, act);
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "law-form") { sendLawQuestion(); return; }
    const area = f.querySelector("textarea");
    const q = area ? area.value.trim() : "";
    if (!q) { if (area) area.focus(); return; }
    if (f.id === "ask-form") {
      const pending = S.general.pending;
      S.general.pending = [];
      S.drafts.ask = "";
      area.value = "";
      autosize(area);
      ask(null, q, pending);
    } else if (f.id === "chat-form") {
      S.drafts.chat = "";
      area.value = "";
      autosize(area);
      ask(cur(), q);
    } else if (f.id === "law-reply") {
      const t = S.law.threads.find((x) => x.id === S.law.open);
      if (!t) return;
      t.messages.push({ role: "user", text: q, when: "только что" });
      S.drafts.law = "";
      area.value = "";
      autosize(area);
      refreshLaw();
      toast("Отправлено юристу. Ответ придёт сюда — пришлём уведомление.");
      lawReplyLater(t);
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.tagName === "TEXTAREA") autosize(t);
    if (t.id === "ask-q") S.drafts.ask = t.value;
    else if (t.id === "chat-q") S.drafts.chat = t.value;
    else if (t.id === "law-reply-q") S.drafts.law = t.value;
    else if (t.id === "law-q" && t.value.trim()) { const err = $("#law-q-err"); if (err) err.hidden = true; t.removeAttribute("aria-invalid"); }
    else if (t.dataset.edit) onEditInput(t);
    else if (t.dataset.cast) onCastInput(t);
    else if (t.id === "cast-paste-text") S.ui.castText = t.value;
    else if (t.id === "tp-price") onPriceInput(t);
    else if (t.id === "plist-q") { S.q = t.value; const body = $("#plist-body"); if (body) body.innerHTML = plistBodyHTML(PURCHASE_SCREENS.includes(S.screen) ? cur() : null); }
    else if (t.dataset.pf) onProfileInput(t);
    else if (t.dataset.calc && t.type !== "checkbox" && t.type !== "radio") onCalcInput(t);
  });

  // Наведение на шкалу цены: цена под курсором и что по ней останется. Только мышью и без нажатой кнопки.
  document.addEventListener("pointermove", (e) => {
    const track = e.target.closest && e.target.closest(".scale-track");
    const hovered = $(".scale[data-top]");
    if (hovered && (!track || !hovered.contains(track))) scaleUnhover(hovered);
    if (track && e.pointerType === "mouse" && e.buttons === 0) scaleHover(track.parentElement, e.clientX);
    else if (track) scaleUnhover(track.parentElement);
  });
  document.addEventListener("pointerleave", () => { const hovered = $(".scale[data-top]"); if (hovered) scaleUnhover(hovered); });

  // Поле расчёта отпустили — число показывается с пробелами между разрядами.
  document.addEventListener("focusout", (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains("calc")) t.value = showNum(parseNum(t.value));
  });

  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!t.dataset || t.dataset.cast !== "title" || t.value.trim()) return;
    const p = cur();
    const row = p && p.tp && p.tp.cast && p.tp.cast.rows.find((r) => r.id === t.dataset.row);
    const g = row && p.tp.cast.groups.find((x) => x.key === row.group);
    if (g && g.rank) showSug(p, t);
  });
  document.addEventListener("focusout", (e) => { if (sug && e.target === sug.input) hideSug(); });
  document.addEventListener("focusin", (e) => { if (e.target.dataset && e.target.dataset.pf) showProfileProblems(); });
  document.addEventListener("focusout", (e) => { if (e.target.dataset && e.target.dataset.pf) setTimeout(showProfileProblems); });

  // Правка закончилась — поле снова становится текстом. Заменяем только его, чтобы не сорвать нажатие рядом.
  document.addEventListener("focusout", (e) => {
    const area = e.target;
    if (!area.classList || !area.classList.contains("edit-area")) return;
    const p = cur();
    if (!p || !p.tp) return;
    S.ui.editing = null;
    const [type, i] = area.dataset.edit.split(":");
    const value = type === "good" ? p.tp.goods[Number(i)].characteristics : p.tp.items[Number(i)].offer;
    area.outerHTML = editHTML(area.dataset.edit, value, area.dataset.label);
  });

  document.addEventListener("change", (e) => {
    const input = e.target;
    if (input.dataset && input.dataset.calc && (input.type === "checkbox" || input.type === "radio")) { onCalcInput(input); return; }
    if (input.dataset && input.dataset.ocr !== undefined) { S.ocr = input.checked; return; }
    if (input.id === "consent-processing" || input.id === "consent-transfer") {
      $("#consent-ok").disabled = !($("#consent-processing").checked && $("#consent-transfer").checked);
      return;
    }
    if (input.type !== "file") return;
    const files = [...input.files];
    input.value = "";
    if (!files.length) return;
    if (input.id === "backup-file") {
      S.ui.backupNote = { tone: "info", text: `Выбран файл «${files[0].name}». В приложении из копии добавится то, чего нет в этом браузере, — сделанное здесь не затрётся. В прототипе файл не читается.` };
      rerender();
      return;
    }
    const names = files.map((f) => f.name);
    if (input.id === "g-file") { S.general.docs = [...new Set([...S.general.docs, ...names])]; S.general.pending = [...new Set([...S.general.pending, ...names])]; rerender(); }
    else if (input.id === "file-new") createPurchase();
    else if (input.id === "add-doc" || input.id === "add-doc-2") addToPurchase(cur(), names);
    else if (input.id === "file-app") runCheck(cur());
    else if (input.id === "file-mydocs" || input.id === "file-mydocs-top") addMyDocs(files);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.dataset && e.target.dataset.cast) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!sug || sug.input !== e.target) { const p = cur(); if (p) showSug(p, e.target); }
        if (sug) { e.preventDefault(); moveSug(e.key === "ArrowDown" ? 1 : -1); }
        return;
      }
      if (sug && sug.input === e.target && e.key === "Enter" && sug.active >= 0) { e.preventDefault(); pickSug(sug.active); return; }
      if (sug && sug.input === e.target && e.key === "Escape") { e.preventDefault(); hideSug(); return; }
    }
    if (e.key === "Escape") {
      if (hintFrom) { closeHint(hintPinned); return; }
      if (closeModal()) return;
      if (S.notifOpen) { setNotif(false); return; }
      if (S.drawer && narrow.matches) { setDrawer(false); return; }
      if (S.info && !wide.matches && $("#ws-info")) { setInfo(false); return; }
      if (e.target.classList && e.target.classList.contains("edit-area")) e.target.blur();
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches && e.target.matches("textarea[data-enter]")) {
      e.preventDefault();
      e.target.form.requestSubmit();
      return;
    }
    // Фокус не уходит из открытого окна.
    if (e.key === "Tab" && !$("#modal").hidden) {
      const items = [...$("#modal").querySelectorAll("button, a[href], [tabindex]:not([tabindex='-1'])")];
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  document.addEventListener("dragover", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone) zone.classList.add("over");
  });
  document.addEventListener("dragleave", (e) => {
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over");
  });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (!zone) return;
    zone.classList.remove("over");
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    if (!files.length) return;
    const kind = zone.dataset.drop;
    if (kind === "new") createPurchase();
    else if (kind === "app") runCheck(cur());
    else if (kind === "mydocs") addMyDocs(files);
  });

  S.notes = initNotes();
  render();
  applyDrawer();
  if (!consentGiven()) showConsent();
})();
</script>
