<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочее место поставщика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap">
<style>
  /* Токены — design-system/brand.css («Индиго + мягкая») */
  :root {
    --ground: #eceef3; --ground-2: #e3e5ec; --ink: #101227; --ink-2: #454a5f; --ink-3: #626880; --rule: #e6e8ee;
    --paper: #ffffff; --paper-2: #f5f6f9; --paper-3: #eceef3; --edge: #e4e6ec; --edge-2: #d3d6df;
    --brand: #4f46e5; --brand-press: #4338ca; --brand-tint: #eef0ff; --on-brand: #ffffff;
    --ok: #087a54; --ok-tint: #dcf5ea;
    --warn: #9a590b; --warn-tint: #fbeeda;
    --danger: #cf2f24;
    --danger-tint: color-mix(in srgb, var(--danger) 12%, var(--paper));
    --scrim: rgb(20 20 43 / .42);
    --r-island: 16px; --r-surface: 12px; --r-card: 10px; --r-bubble: 16px; --r-ctl: 8px; --r-pill: 999px;
    /* Острова: кольцо 1 px и мягкая тень, как карточка меню AI Elements в Figma (OpenInContent);
       всплывающие — меню, лист «Сведения», плавающая панель, окна — с тенью lg оттуда же */
    --island-ring: rgb(16 18 39 / .1);
    --island-shadow: 0 0 0 1px var(--island-ring), 0 1px 2px rgb(16 18 39 / .04), 0 4px 10px -4px rgb(16 18 39 / .08);
    --float: 0 0 0 1px var(--island-ring), 0 4px 6px -4px rgb(16 18 39 / .1), 0 10px 15px -3px rgb(16 18 39 / .1);
    --hairline: 0 1px 2px rgb(16 18 39 / .05);
    --ring: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
    --display: "Montserrat", ui-sans-serif, system-ui, sans-serif;
    --ui: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    /* Предпросмотр файла Word: белый лист и Times-совместимый шрифт в обеих темах, как настоящий документ */
    --doc: "Tinos", "Times New Roman", Times, serif;
    --sheet: #ffffff; --sheet-ink: #111111; --sheet-mark: #ffff00;
    /* Холст с островами: каждый блок экрана — белая карточка, между островами 8 px холста */
    --canvas: #eff1f5; --card: #ffffff; --line: #e6e8ee; --hover: #f3f4f7; --select: #eef0ff;
    --side-w: 224px; --list-w: 288px; --info-w: 272px;

    /* Шкала шрифтов — плотная: пять кеглей 12 · 13 · 14 · 16 · 20, интерлиньяж кратен 4.
       Интерфейс — 13, текст документов и сообщений — 14, заголовок экрана — 20. */
    --t-page: 700 20px/28px var(--display);   /* заголовок экрана */
    --t-title: 600 16px/24px var(--display);  /* открытая закупка, заголовок разговора и окна */
    --t-section: 600 14px/20px var(--ui);     /* заголовки панелей, разделов, пунктов ТП */
    --t-doc: 500 14px/20px var(--ui);         /* текст документа и поля ввода */
    --t-body: 500 13px/20px var(--ui);        /* текст интерфейса */
    --t-read: 500 14px/20px var(--ui);        /* текст требований, цитаты, статьи закона */
    --t-strong: 600 13px/20px var(--ui);      /* названия в списках, важное в тексте */
    --t-label: 500 13px/20px var(--ui);       /* пункты меню, шаги, подсказки-вопросы */
    --t-caption: 500 12px/16px var(--ui);     /* подписи: заказчик, даты, пометки файлов */
    --t-over: 600 12px/16px var(--ui);        /* надписи разделов капсом, метки */
    --t-tag: 600 12px/16px var(--ui);         /* метки статусов: «Убыток», «впишите данные» */
    --t-num: 500 12px/16px var(--mono);       /* счётчики и сроки: цифры одной ширины */
    /* Поля внутри острова — 16 (12 на телефоне); между островами и у краёв окна — 8. Шаг отступов — 4. */
    --pad: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #08090f; --ground-2: #0f1019; --ink: #eceef6; --ink-2: #b1b4c8; --ink-3: #9296ad; --rule: #242636;
      --paper: #13141e; --paper-2: #191a26; --paper-3: #20222f; --edge: #262838; --edge-2: #333648;
      --brand: #a5b4fc; --brand-press: #c7d0fe; --brand-tint: #1f2147; --on-brand: #0b0c1f;
      --ok: #3ddc9a; --ok-tint: #0f2e22; --warn: #e2a34a; --warn-tint: #2f2413; --danger: #ff7a70;
      --scrim: rgb(0 0 0 / .6);
      --island-ring: rgb(255 255 255 / .08);
      --island-shadow: 0 0 0 1px var(--island-ring), 0 1px 2px rgb(0 0 0 / .3), 0 4px 10px -4px rgb(0 0 0 / .4);
      --float: 0 0 0 1px var(--island-ring), 0 4px 6px -4px rgb(0 0 0 / .5), 0 10px 15px -3px rgb(0 0 0 / .5);
      --hairline: 0 1px 2px rgb(0 0 0 / .3);
      --canvas: #0b0c13; --card: #13141e; --line: #242636; --hover: #1a1b28; --select: #1e2040;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #08090f; --ground-2: #0f1019; --ink: #eceef6; --ink-2: #b1b4c8; --ink-3: #9296ad; --rule: #242636;
    --paper: #13141e; --paper-2: #191a26; --paper-3: #20222f; --edge: #262838; --edge-2: #333648;
    --brand: #a5b4fc; --brand-press: #c7d0fe; --brand-tint: #1f2147; --on-brand: #0b0c1f;
    --ok: #3ddc9a; --ok-tint: #0f2e22; --warn: #e2a34a; --warn-tint: #2f2413; --danger: #ff7a70;
    --scrim: rgb(0 0 0 / .6);
    --island-ring: rgb(255 255 255 / .08);
    --island-shadow: 0 0 0 1px var(--island-ring), 0 1px 2px rgb(0 0 0 / .3), 0 4px 10px -4px rgb(0 0 0 / .4);
    --float: 0 0 0 1px var(--island-ring), 0 4px 6px -4px rgb(0 0 0 / .5), 0 10px 15px -3px rgb(0 0 0 / .5);
    --hairline: 0 1px 2px rgb(0 0 0 / .3);
    --canvas: #0b0c13; --card: #13141e; --line: #242636; --hover: #1a1b28; --select: #1e2040;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Страница не прокручивается целиком — прокручиваются острова; скрытые поля выбора файла не раздвигают её */
  body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); font: var(--t-body); letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
  * { scrollbar-width: thin; scrollbar-color: var(--edge-2) transparent; }
  /* Сжатие -0.01em — для текста от 14 px; мелкие подписи без него, иначе слипаются слова */
  .due-chip, .count, .days, .src, .prow-sub, .pd-sub, .file-meta, .fact-label, .panel-sub, .me-sub, .proto,
  .flag, .qty, .unver, .part-status, .doc-meta, .field-src, .msg-meta, .disclaimer, .chat-docs, .foot, .file-chip, .tool-btn,
  .sample, .info-sub, .in-talk, .save-state, .law { letter-spacing: 0; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button, label[for] { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .m0 { margin: 0; }
  .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-5 { margin-top: 20px; }
  .mt-6 { margin-top: 24px; } .mt-7 { margin-top: 28px; } .mt-8 { margin-top: 32px; } .mt-10 { margin-top: 40px; }
  .small { font: var(--t-body); }
  .muted { color: var(--ink-3); }
  .ink2 { color: var(--ink-2); }
  .warn-t { color: var(--warn); font-weight: 600; }
  .ok-t { color: var(--ok); font-weight: 600; }
  .bad-t { color: var(--danger); font-weight: 600; }

  /* ---------- холст с островами: сайдбар и основная часть ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; padding-left: 8px; }
  /* Остров — белая карточка на холсте: кольцо 1 px и мягкая тень. Каждый смысловой блок экрана —
     свой остров: навигация, список, шапка закупки, группа требований, «Дальше», разговор. */
  .panel, .side, .ws-list, .pd-island, .chat, .next, .price, .confirm, .info-top, .fold, .ws-main > .empty {
    min-width: 0; border-radius: var(--r-island); background: var(--card); box-shadow: var(--island-shadow);
  }

  .side { display: flex; flex-direction: column; min-height: 0; margin-block: 8px; }
  /* Знак, иконки пунктов и аватар стоят на одной вертикали */
  .side-head { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 10px 8px 10px 12px; }
  .logo {
    appearance: none; border: 0; background: none; padding: 0;
    display: inline-flex; align-items: center; gap: 10px; min-width: 0; text-align: left;
    font: 700 14px/20px var(--display); letter-spacing: -.01em; color: var(--ink);
  }
  .logo-mark { flex: none; width: 28px; height: 28px; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--brand); color: var(--on-brand); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .12); }
  .logo-text { display: grid; gap: 2px; }
  .proto { font: var(--t-caption); letter-spacing: 0; color: var(--ink-3); }
  .icon-btn.side-close { display: none; margin-left: auto; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding: 4px 8px 12px; }
  .nav { display: grid; gap: 2px; }
  .nav-item {
    appearance: none; border: 0; background: none; width: 100%;
    display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 10px;
    border-radius: var(--r-ctl); text-align: left; font: var(--t-label); color: var(--ink-2);
  }
  .nav-item > svg { flex: none; color: var(--ink-3); }
  .nav-item > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item:hover { background: var(--hover); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--brand); color: var(--on-brand); font-weight: 600; box-shadow: 0 1px 2px color-mix(in srgb, var(--brand) 40%, transparent); }
  .nav-item[aria-current="page"] > svg, .nav-item[aria-current="page"] .count { color: color-mix(in srgb, var(--on-brand) 88%, transparent); }
  .count { margin-left: auto; font: var(--t-num); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  /* Новое в разделе — пилюлей бренда: «Вопросы юристу 1» */
  .count.fresh { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--brand); color: var(--on-brand); font: 600 12px/16px var(--ui); }
  .nav-item[aria-current="page"] .count.fresh { background: var(--on-brand); color: var(--brand); }
  .sec-label { margin: 0 10px 4px; font: var(--t-over); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .side-foot { display: grid; gap: 4px; padding: 8px; border-top: 1px solid var(--line); }
  .switch { position: relative; flex: none; width: 36px; height: 20px; margin-left: auto; border-radius: var(--r-pill); background: var(--edge-2); transition: background .15s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s ease; }
  [aria-checked="true"] > .switch { background: var(--brand); }
  [aria-checked="true"] > .switch::after { transform: translateX(16px); background: var(--on-brand); }
  .me {
    appearance: none; border: 0; background: none; width: 100%;
    display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 6px 4px; border-radius: var(--r-ctl); color: var(--ink); text-align: left;
  }
  .me:hover { background: var(--hover); }
  .me > svg { color: var(--ink-3); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); font: 700 12px/16px var(--ui); }
  .me-text { display: grid; min-width: 0; }
  .me-name, .me-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-name { font: var(--t-strong); }
  .me-sub { font: var(--t-caption); color: var(--ink-3); }

  .scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* Шапка экрана на холсте: заголовок на одной линии со знаком сайдбара и по краю островов.
     Справа — место под полосу прокрутки, как у островов под шапкой: края кнопки и островов совпадают. */
  .head { flex: none; display: flex; align-items: center; gap: 12px 16px; min-height: 64px; padding: 8px 8px 0; overflow: hidden; scrollbar-gutter: stable; }
  .icon-btn.menu-btn { display: none; }
  .head-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px 12px; }
  .head h1 { margin: 0; font: var(--t-page); letter-spacing: -.02em; }
  .head h1:focus { outline: none; }
  .head-sub { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--t-caption); color: var(--ink-3); }
  .head-acts { flex: none; display: flex; align-items: center; gap: 12px; }
  /* Колокольчик — в шапке каждого экрана; число новых — пилюлей бренда на углу */
  .icon-btn.bell { position: relative; }
  .bell-dot { position: absolute; top: 1px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--brand); color: var(--on-brand); font: 600 12px/16px var(--ui); box-shadow: 0 0 0 2px var(--canvas); }
  /* Уведомления — всплывающий остров под колокольчиком (тень --float): пункты без разделителей, новые — жирным и с точкой */
  .notif-pop { position: fixed; top: 60px; right: 16px; z-index: 50; width: min(380px, calc(100vw - 16px)); max-height: min(560px, calc(100dvh - 76px)); overflow-y: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: 4px; padding: 4px 0 12px; border-radius: var(--r-island); background: var(--card); box-shadow: var(--float); }
  .notif-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 8px var(--pad) 0; }
  .notif-list { list-style: none; margin: 0; padding: 0 8px; display: grid; gap: 2px; }
  .notif-item { appearance: none; border: 0; background: none; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) 8px; column-gap: 10px; align-items: start; padding: 8px; border-radius: var(--r-ctl); color: var(--ink); text-align: left; }
  .notif-item:hover { background: var(--hover); }
  .notif-item .todo-dot { margin: 5px 3px 0; }
  .notif-item .prow-title { font: var(--t-body); color: var(--ink-2); }
  .notif-item.unread .prow-title { font: var(--t-strong); color: var(--ink); }
  .notif-text { font: var(--t-caption); color: var(--ink-2); }
  .notif-item .prow-sub { white-space: normal; }
  .notif-new { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--brand); }
  .notif-foot { margin: 4px var(--pad) 0; padding-top: 10px; border-top: 1px solid var(--line); font: var(--t-caption); color: var(--ink-3); }
  .notif-empty { margin: 0; padding: 4px var(--pad) 8px; font: var(--t-body); color: var(--ink-3); }
  /* Холст под шапкой; поля по 8 px — место для кольца и тени островов, иначе край прокрутки их срежет */
  .view { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 16px; scrollbar-gutter: stable; }
  .view.fill { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 8px; scrollbar-gutter: auto; }

  /* ---------- кнопки, ссылки, поля ---------- */
  .btn {
    appearance: none; border: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 32px; padding-inline: 12px; border-radius: var(--r-ctl);
    background: var(--brand); color: var(--on-brand); font: 600 13px/20px var(--ui); letter-spacing: -.005em; text-align: center; white-space: nowrap;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--brand) 35%, transparent), inset 0 1px 0 rgb(255 255 255 / .12);
    transition: background .12s ease;
  }
  .btn > svg { flex: none; }
  .btn:hover { background: var(--brand-press); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.line { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-2), var(--hairline); }
  .btn.line:hover { background: var(--hover); }
  .btn.soft { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge-2), var(--hairline); }
  .btn.soft:hover { background: var(--hover); }
  .btn.danger { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); box-shadow: none; }
  .btn.danger:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); }
  .btn.lg { min-height: 40px; padding-inline: 16px; font: 600 14px/20px var(--ui); }
  .btn.xs { min-height: 28px; padding-inline: 10px; border-radius: 6px; font: 600 12px/16px var(--ui); letter-spacing: 0; }
  .icon-btn { appearance: none; border: 0; background: none; flex: none; width: 32px; height: 32px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--ink-2); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.line { background: var(--card); box-shadow: inset 0 0 0 1px var(--edge-2), var(--hairline); }
  .btn:has(input:focus-visible), .link:has(input:focus-visible), .circle:has(input:focus-visible),
  .tool-btn:has(input:focus-visible), .icon-btn:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 3px; }
  .link {
    appearance: none; border: 0; background: none; padding: 0; text-align: left;
    color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .link.quiet { color: var(--ink-3); font-weight: 500; text-decoration-color: color-mix(in srgb, var(--ink-3) 45%, transparent); }
  .link.quiet:hover { color: var(--ink); }
  .link.del:hover { color: var(--danger); }
  .src {
    appearance: none; border: 0; background: none; justify-self: start; text-align: left;
    display: inline-flex; align-items: center; gap: 4px; margin-left: -6px; padding: 2px 6px; border-radius: 6px;
    color: var(--brand); font: 600 12px/16px var(--ui);
  }
  .src > svg { flex: none; opacity: .8; }
  .src:hover, .src[aria-expanded="true"] { background: var(--brand-tint); }
  .input { width: 100%; height: 32px; padding-inline: 10px; border: 1px solid var(--edge-2); border-radius: var(--r-ctl); outline: none; background: var(--card); font: var(--t-doc); box-shadow: var(--hairline); }
  .input:focus { border-color: var(--brand); box-shadow: var(--ring); }
  .input.num { max-width: 240px; font: 400 16px/24px var(--mono); font-variant-numeric: tabular-nums; }
  .input.area { height: auto; min-height: 96px; padding-block: 6px; resize: vertical; }
  .form-err { margin: 0; font: var(--t-caption); color: var(--danger); }
  textarea::placeholder, input::placeholder { color: var(--ink-3); }

  /* Плашка на холсте — отдельный блок со скруглением острова, внутри острова — мельче */
  .note { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--r-island); font: var(--t-body); }
  .note > svg { flex: none; margin-top: 1px; }
  .note.warn { background: var(--warn-tint); color: var(--warn); font-weight: 600; }
  .note.ok { background: var(--ok-tint); color: var(--ok); font-weight: 600; }
  .note.info { background: var(--card); color: var(--ink-2); box-shadow: var(--island-shadow); }
  .panel .note, .price .note { border-radius: var(--r-card); }
  .panel .note.info, .price .note.info { background: var(--paper-2); box-shadow: none; }
  .note .link { color: inherit; }
  .note-title { margin: 0; }
  .note ul { margin: 4px 0 0; padding-left: 18px; font-weight: 500; }
  .note li + li { margin-top: 4px; }
  .notes { display: grid; gap: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 1px solid var(--edge-2); padding: 5px 12px; border-radius: var(--r-pill); background: var(--card); color: var(--ink); font: var(--t-label); text-align: left; box-shadow: var(--hairline); }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 28px; padding-inline: 10px 4px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font: 500 12px/16px var(--ui); }
  .file-chip > svg { flex: none; color: var(--ink-3); }
  .file-chip .fc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .x { appearance: none; border: 0; background: none; flex: none; width: 24px; height: 24px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .file-chip .x:hover { background: var(--paper-3); color: var(--ink); }
  .file-chip.plain { padding-inline: 12px; }
  .circle { appearance: none; border: 0; background: none; flex: none; width: 32px; height: 32px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .circle:hover { background: var(--hover); color: var(--ink); }
  .circle.send { background: var(--brand); color: var(--on-brand); }
  .circle.send:hover { background: var(--brand-press); }
  .sample { font: 600 12px/16px var(--ui); color: var(--ink-3); }

  /* ---------- панели ---------- */
  /* Заголовок острова — без черты: название, счётчик и справа одно действие */
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; min-height: 40px; padding: 10px var(--pad) 2px; }
  .panel-title { margin: 0; font: var(--t-section); }
  .panel-sub { margin: 0; font: var(--t-caption); color: var(--ink-3); }
  .panel-body { display: grid; gap: 12px; padding: 4px var(--pad) var(--pad); }
  .page-col { display: grid; gap: 8px; max-width: 880px; }
  .intro { margin: 0; max-width: 70ch; font: var(--t-body); color: var(--ink-2); }
  /* Пояснение прямо на холсте — по краю текста в островах */
  .page-col > .intro, .tab-lead, .redo-line { padding: 4px var(--pad); }
  .foot { margin: 12px 0 0; max-width: 90ch; padding-inline: var(--pad); font: var(--t-caption); color: var(--ink-3); }

  /* Строки списков: значок закона, название, строка под ним, справа — срок и отметки */
  /* Строки в острове — пункты, как в карточке меню Figma: скругление 8, подсветка, без разделителей */
  .plist { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 2px; }
  .prow {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; color: var(--ink);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-ctl);
  }
  .prow:hover { background: var(--hover); }
  .prow[aria-current] { background: var(--select); }
  .prow[aria-current] .law { background: var(--card); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 25%, transparent); }
  .prow-text { display: grid; gap: 4px; min-width: 0; }
  .prow-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--t-caption); color: var(--ink-3); }
  .prow-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: var(--t-strong); }
  .prow-side { display: grid; justify-items: end; gap: 4px; }
  .prow > .chev { color: var(--ink-3); }
  .days { font: var(--t-num); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .days.soon { color: var(--warn); font-weight: 600; }
  .law { flex: none; width: 32px; height: 32px; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); font: 700 12px/16px var(--mono); letter-spacing: -.03em; }
  .law.l223 { background: var(--paper-3); color: var(--ink-2); }
  .law.icon { background: var(--paper-2); color: var(--ink-2); }
  .law.big { width: 48px; height: 48px; border-radius: var(--r-surface); font: 700 16px/24px var(--mono); }
  .meter { height: 4px; margin-top: 4px; overflow: hidden; border-radius: var(--r-pill); background: var(--paper-3); }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
  .list-empty { margin: 0; padding: 4px var(--pad) 12px; font: var(--t-body); color: var(--ink-3); }

  /* ---------- главная ---------- */
  /* Главная — рабочий стол в одну колонку: самое срочное, закупки по этапам, данные компании */
  .home { display: grid; gap: 8px; max-width: 1040px; }
  .home .panel { container-type: inline-size; }
  /* Название с подписью занимает строку, действие остаётся справа и на телефоне */
  .home .panel-head > div:first-child { flex: 1 1 200px; min-width: 0; }
  .home .meter { max-width: 240px; }
  /* Бейдж статуса — пилюля: бледная заливка статуса, текст и иконка его цветом. Цвет всегда с подписью. */
  .badge { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 2px 8px; border-radius: var(--r-pill); font: var(--t-tag); letter-spacing: 0; white-space: nowrap; }
  .badge > svg { flex: none; }
  .badge.warn { background: var(--warn-tint); color: var(--warn); }
  .badge.bad { background: var(--danger-tint); color: var(--danger); }
  .badge.ok { background: var(--ok-tint); color: var(--ok); }
  .badge.brand { background: var(--brand-tint); color: var(--brand); }
  .badge.calm { background: var(--paper-2); color: var(--ink-2); }
  .now .badge.calm { background: var(--card); }
  /* Самое срочное дело — поверхностью внутри острова, с единственной главной кнопкой экрана */
  .now { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin: 4px 8px 8px; padding: 12px; border-radius: var(--r-surface); background: var(--paper-2); }
  .now-text { display: grid; gap: 6px; min-width: 0; flex: 1 1 320px; }
  .now-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .now-title { margin: 0; font: var(--t-title); letter-spacing: -.01em; }
  .now-sub { margin: 0; font: var(--t-body); color: var(--ink-2); }
  .prow.task { grid-template-columns: auto minmax(0, 1fr) auto auto; }
  /* На узком острове бейдж уходит под название — название не обрезается */
  @container (width < 520px) {
    .prow.task { grid-template-columns: auto minmax(0, 1fr) auto; row-gap: 6px; }
    .prow.task > .badge { grid-column: 2; grid-row: 2; justify-self: start; }
    .prow.task > :first-child, .prow.task > .chev { grid-row: 1 / 3; }
    .prow.task > .todo-dot { align-self: start; margin-top: 5px; }
    .prow.task > .chev { grid-column: 3; }
  }
  .all-done { display: flex; align-items: center; gap: 8px; margin: 0; padding: 4px var(--pad) 14px; font: var(--t-body); color: var(--ink-2); }
  /* Этапы — как колонки доски: сколько закупок и что на этапе ждёт вас. Нажатие оставляет в таблице только этап. */
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 4px var(--pad) 12px; }
  .lane { appearance: none; border: 0; display: grid; align-content: start; justify-items: start; gap: 2px; min-width: 0; padding: 10px 12px; border-radius: var(--r-surface); background: var(--paper-2); color: var(--ink); text-align: left; }
  .lane:hover:not(:disabled) { background: var(--paper-3); }
  .lane:disabled { cursor: default; }
  .lane:disabled .lane-count { color: var(--ink-3); }
  .lane[aria-pressed="true"] { background: var(--select); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 35%, transparent); }
  .lane-title { font: var(--t-caption); color: var(--ink-2); }
  .lane-count { font: 600 20px/28px var(--mono); font-variant-numeric: tabular-nums; }
  .lane-note { font: var(--t-tag); color: var(--ink-3); }
  .lane-note.warn { color: var(--warn); }
  .lane-note.bad { color: var(--danger); }
  .lane-note.ok { color: var(--ok); }
  .lane-note.brand { color: var(--brand); }
  /* На узком острове этапы — строками по 44: название и что ждёт вас слева, число справа */
  @container (width < 560px) {
    .lanes { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .lane { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 44px; padding: 6px 12px; border-radius: var(--r-card); }
    .lane-title { grid-column: 1; grid-row: 1; font: var(--t-body); color: var(--ink); }
    .lane-note { grid-column: 1; grid-row: 2; }
    .lane-count { grid-column: 2; grid-row: 1 / 3; font-size: 16px; line-height: 24px; }
  }
  /* Закупки таблицей: название, что сейчас, срок. На узком острове бейджи уходят под название. */
  .deals-head, .deal { display: grid; grid-template-columns: 32px minmax(0, 1fr) 184px 120px 16px; align-items: center; column-gap: 12px; }
  .deals-head { margin: 0 var(--pad); padding: 0 0 6px; border-bottom: 1px solid var(--line); font: var(--t-caption); color: var(--ink-3); }
  .deals-head span:first-child { grid-column: 2; }
  .deals { list-style: none; margin: 0; padding: 4px 8px 8px; display: grid; gap: 2px; }
  .deal { appearance: none; border: 0; background: none; width: 100%; row-gap: 6px; padding: 8px; border-radius: var(--r-ctl); color: var(--ink); text-align: left; }
  .deal:hover { background: var(--hover); }
  .deal-main { display: grid; gap: 2px; min-width: 0; }
  .deal-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: var(--t-strong); }
  .deal-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--t-caption); color: var(--ink-3); }
  .deal-tags { display: contents; }
  .deal-tags .badge { justify-self: start; }
  .deal > .chev { display: grid; color: var(--ink-3); }
  @container (width < 640px) {
    .deals-head { display: none; }
    .deal { grid-template-columns: 32px minmax(0, 1fr) 16px; }
    .deal > .chev { grid-column: 3; grid-row: 1; }
    .deal-tags { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 2; }
  }
  .home-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0; padding: 0 var(--pad) 12px; font: var(--t-caption); color: var(--ink-3); }
  .todo-dot { flex: none; width: 10px; height: 10px; margin: 0 11px; border-radius: 50%; background: var(--edge-2); box-shadow: 0 0 0 3px var(--paper-2); }
  .todo-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-tint); }
  .todo-dot.brand { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .todo-dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-tint); }
  .empty { display: grid; justify-items: start; gap: 12px; padding: var(--pad); }
  .empty p { margin: 0; max-width: 52ch; font: var(--t-body); color: var(--ink-2); }
  .or { font: var(--t-body); color: var(--ink-3); }

  /* ---------- закупки: список, закупка, сведения — острова ---------- */
  .ws {
    position: relative; flex: 1; min-height: 0;
    display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr) var(--info-w); gap: 8px;
  }
  .ws[data-sel="0"] { grid-template-columns: var(--list-w) minmax(0, 1fr); }
  .ws.solo { display: flex; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ws.solo > .pane { flex: 1; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .ws-list { overflow: hidden; }
  .ws-list .empty { padding: 8px; }
  /* Шапка закупки и тело шага оставляют справа одинаковое место под полосу прокрутки —
     острова шага встают ровно под шапкой */
  .pd-wrap { flex: none; margin: -4px -8px 0; padding: 4px 8px 6px; overflow: hidden; scrollbar-gutter: stable; }
  .ws-main > .pane-body { display: flex; flex-direction: column; margin-inline: -8px; padding: 2px 8px 8px; scrollbar-gutter: stable; }
  .ws-main > .empty { align-self: start; max-width: 560px; }
  /* Общий чат — тот же остров-разговор; справа место под полосу прокрутки, как у шапки */
  .ws.solo .pane-body { display: flex; flex-direction: column; margin: -4px -8px -8px; padding: 4px 8px 8px; overflow: hidden; scrollbar-gutter: stable; }
  /* Сведения: от 1560 px — столбик островов справа */
  .ws-info #info-body { display: grid; align-content: start; gap: 8px; margin: -4px -8px 0 0; padding: 4px 8px 8px 1px; scrollbar-gutter: stable; }
  .icon-btn.info-toggle, .icon-btn.info-close, .icon-btn.pd-back { display: none; }
  @media (max-width: 1559px) {
    .ws { grid-template-columns: var(--list-w) minmax(0, 1fr); }
    /* Уже — лист поверх закупки с теми же островами */
    .ws-info { position: absolute; inset-block: 0; right: 0; z-index: 6; width: min(320px, 100%); overflow: hidden; border-radius: var(--r-island); background: var(--canvas); box-shadow: var(--float); }
    .ws-info #info-body { margin: 0; padding: 8px; scrollbar-gutter: auto; }
    .ws:not([data-info="open"]) .ws-info { display: none; }
    .icon-btn.info-toggle, .icon-btn.info-close { display: grid; }
  }
  @media (max-width: 1179px) {
    .ws, .ws[data-sel="0"] { grid-template-columns: minmax(0, 1fr); }
    .ws[data-pane="list"] .ws-main, .ws[data-pane="main"] .ws-list { display: none; }
    .icon-btn.pd-back { display: grid; }
    .pd-head { padding-left: 8px; }
  }
  .list-head { flex: none; display: flex; align-items: center; padding: 8px 8px 4px; }
  /* Сверху 4 px — чтобы рамка фокуса первой строки не обрезалась краем прокрутки */
  .ws-list .pane-body { padding-top: 4px; }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding-inline: 10px; border: 1px solid var(--edge-2); border-radius: var(--r-ctl); background: var(--card); color: var(--ink-3); cursor: text; box-shadow: var(--hairline); }
  .search:focus-within { border-color: var(--brand); box-shadow: var(--ring); }
  .search > svg { flex: none; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font: var(--t-doc); color: var(--ink); }

  .pd-head { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 8px 8px var(--pad); }
  .pd-text { flex: 1; min-width: 0; }
  .pd-title, .pd-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pd-title { margin: 0; font: var(--t-title); letter-spacing: -.01em; }
  .pd-title:focus { outline: none; }
  .pd-sub { margin: 0; font: var(--t-caption); color: var(--ink-3); }
  /* Срок подачи в подзаголовке не обрезается: переносится на вторую строку */
  .pd-text .pd-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; }
  .pd-acts { flex: none; display: flex; align-items: center; gap: 4px; }
  .due-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-right: 8px; padding-inline: 10px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink-2); font: 600 12px/16px var(--ui); white-space: nowrap; }
  .due-chip > svg { flex: none; }
  .due-chip.soon { background: var(--warn-tint); color: var(--warn); }
  .due-chip.past { color: var(--ink-3); }
  .tabs { flex: none; display: flex; align-items: stretch; gap: 0; padding: 6px 8px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  /* Шаги подготовки заявки: номер или галочка, название, что на шаге сейчас — словами */
  .steps { flex: none; display: flex; align-items: stretch; margin: 0; padding: 0; list-style: none; }
  .steps > li { display: flex; align-items: stretch; }
  .tab.step { gap: 8px; min-height: 44px; padding: 4px 8px; }
  .step-sep { display: grid; place-items: center; margin-inline: 2px; color: var(--ink-3); opacity: .6; }
  .step-dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--mono); }
  .step-dot.done { background: var(--ok-tint); color: var(--ok); }
  .step-dot.fix { background: var(--warn-tint); color: var(--warn); }
  .step-dot.fix.bad { background: var(--danger-tint); color: var(--danger); }
  .step-dot.todo { background: var(--card); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--edge-2); }
  .step-text { display: grid; text-align: left; }
  .step-title { font: var(--t-label); color: var(--ink-2); }
  .tab[aria-current="page"] .step-title { font: var(--t-strong); color: var(--ink); }
  .stage { font: 600 12px/16px var(--ui); letter-spacing: 0; white-space: nowrap; }
  .stage.calm { color: var(--ink-3); font-weight: 500; }
  .stage.brand { color: var(--brand); }
  .stage.ok { color: var(--ok); }
  .stage.warn { color: var(--warn); }
  .stage.bad { color: var(--danger); }
  /* «Цена» и «Вопросы» — не шаги, а инструменты: стоят справа отдельно */
  .tab-tools { flex: none; display: flex; align-items: stretch; gap: 2px; margin-left: auto; }
  .tab.aside { gap: 8px; }
  .tab.aside > svg { color: var(--ink-3); }
  .next { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--pad); }
  .next-text { display: grid; gap: 2px; min-width: 0; }
  .next-text p { margin: 0; }
  .next-label { font: var(--t-over); letter-spacing: .04em; text-transform: uppercase; color: var(--brand); }
  .next-label.ok { color: var(--ok); }
  .next-title { font: var(--t-section); }
  .next-desc { font: var(--t-body); color: var(--ink-2); }
  .pd-head { container-type: inline-size; }
  .btn.info-toggle { display: none; }
  @media (max-width: 1559px) { .btn.info-toggle { display: inline-flex; } }
  /* Подписи кнопок шапки сокращаются по месту: сначала у «Добавить документы» и «Сведений», потом у всех */
  @container (width < 820px) { .pd-acts .pd-lbl.opt { display: none; } .pd-acts .btn.opt { width: 32px; padding: 0; } }
  @container (width < 560px) { .pd-acts .pd-lbl { display: none; } .pd-acts .btn { width: 32px; padding: 0; } }
  .start-steps { display: grid; gap: 16px 24px; margin: 0; padding: 8px var(--pad) 16px; list-style: none; }
  @media (min-width: 768px) { .start-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .start-steps > li { display: grid; align-content: start; gap: 4px; }
  .start-steps p { margin: 0; }
  .num { width: 24px; height: 24px; margin-bottom: 4px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); font: 700 12px/1 var(--mono); }
  .panel-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-inline: var(--pad); padding: 12px 0; border-top: 1px solid var(--line); }
  .plist.path { display: block; padding: 0 var(--pad); }
  .path > li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 12px 0; }
  .path > li + li { border-top: 1px solid var(--line); }
  .path .num { margin: 0; }
  .path p { margin: 0; }
  .path-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .path-where { font: var(--t-caption); color: var(--ink-3); }
  .path-text { font: var(--t-read); color: var(--ink-2); }
  .marks { display: grid; gap: 8px; margin: 0; padding: 4px var(--pad) 16px; list-style: none; }
  .marks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; gap: 12px; }
  .mark-dot { width: 10px; height: 10px; justify-self: center; border-radius: 50%; }
  /* Подписи в строке шагов сокращаются, только когда не помещаются (fitTabs): сначала «ТП», потом «Проверка»,
     потом у «Цены» и «Вопросов» остаются значки, потом пропадают стрелки между шагами. Диктор читает полное
     название. Не помещается и так (телефон) — инструменты с подписями уходят на свою строку, шаги листаются
     отдельно: иначе «Цена» и «Вопросы» оказываются за краем экрана. */
  .tab .short { display: none; }
  .tabs[data-short-tp] .full-tp, .tabs[data-short-check] .full-check, .tabs[data-icons] .aside-lbl {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .tabs[data-short-tp] .short-tp, .tabs[data-short-check] .short-check { display: inline; }
  .tabs[data-tight] .step-sep { display: none; }
  .tabs[data-stack] { flex-wrap: wrap; row-gap: 4px; }
  .tabs[data-stack] .steps { flex: 1 0 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs[data-stack] .steps::-webkit-scrollbar { display: none; }
  .tabs[data-stack] .tab-tools { margin-left: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  /* Шаг, «Цена» и «Вопросы» — пункты-пилюли, как пункты меню в острове: открытый — индиго-тинт */
  .tab {
    appearance: none; border: 0; background: none; flex: none;
    display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 6px 8px;
    border-radius: var(--r-ctl); color: var(--ink-3); font: var(--t-label); white-space: nowrap;
  }
  .tab:hover { color: var(--ink); background: var(--hover); }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--select); }
  .tab .count { margin-left: 0; padding: 0 6px; border-radius: 6px; background: var(--paper-2); }
  .tab[aria-current="page"] .count { background: var(--brand-tint); color: var(--brand); }
  /* Тело шага — стопка островов под шапкой закупки */
  .tab-body { display: grid; align-content: start; gap: 8px; }
  .tab-lead { margin: 0; max-width: 80ch; font: var(--t-body); color: var(--ink-2); }

  .info-top { position: relative; display: grid; justify-items: center; gap: 6px; padding: 20px var(--pad) 16px; text-align: center; }
  .info-top .info-close { position: absolute; top: 12px; right: 12px; }
  .info-title { margin: 4px 0 0; font: var(--t-section); text-wrap: balance; }
  .info-sub { margin: 0; font: var(--t-caption); color: var(--ink-3); }
  .fold-head {
    appearance: none; border: 0; background: none; width: 100%;
    display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 10px var(--pad); border-radius: var(--r-island);
    color: var(--ink); font: var(--t-section); text-align: left;
  }
  .fold-head > svg { margin-left: auto; flex: none; color: var(--ink-3); transition: transform .15s ease; }
  .fold-head[aria-expanded="false"] > svg { transform: rotate(-90deg); }
  .fold-head .count { margin-left: 0; }
  .fold-body { display: grid; gap: 12px; padding: 2px var(--pad) var(--pad); }
  .fact { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; font: var(--t-body); color: var(--ink-2); }
  .fact > svg { margin-top: 1px; color: var(--ink-3); }
  .fact-label { display: block; font: var(--t-caption); color: var(--ink-3); }
  .fact b { display: block; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .file { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; }
  .file-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--paper-2); color: var(--ink-3); }
  .file-ic.warn { background: var(--warn-tint); color: var(--warn); }
  .file-text { display: grid; min-width: 0; }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/20px var(--ui); }
  .file-meta { font: var(--t-caption); color: var(--ink-3); }
  .file-meta.warn { color: var(--warn); font-weight: 600; }
  .info-foot { padding: 4px var(--pad); font: var(--t-body); }
  .info-foot:has(.confirm) { padding: 0; }

  /* ---------- требования ---------- */
  .list { list-style: none; margin: 0; padding: 0 var(--pad) 4px; }
  .list > li { display: grid; gap: 4px; padding: 10px 0; font: var(--t-read); }
  .list > li + li { border-top: 1px solid var(--line); }
  .quote { margin: 4px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--paper-2); font: var(--t-read); }
  .unver { display: flex; align-items: center; gap: 8px; margin: 0; font: 500 12px/16px var(--ui); color: var(--warn); }
  .unver > svg { flex: none; }
  .empty-group { margin: 0; padding: 4px var(--pad) 12px; font: var(--t-body); color: var(--ink-3); }
  /* Как оценят заявку: критерии и строки, за которые дают баллы (web/src/components/criteria-island.tsx) */
  .list > li.crit-group { gap: 0; padding: 12px 0 0; }
  .crit-cap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .crit-cap .panel-sub { white-space: nowrap; }
  .crit-rows { list-style: none; margin: 0; padding: 0; }
  .crit-rows > li { display: grid; gap: 4px; padding: 10px 0; font: var(--t-read); }
  .crit-rows > li + li { border-top: 1px solid var(--line); }
  .crit-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .crit-name { display: grid; flex: 1; gap: 2px; min-width: 0; }
  .crit-title { font: var(--t-strong); }
  .crit-sub { font: var(--t-caption); color: var(--ink-3); }
  .crit-fact { margin: 0; }
  .crit-fact > span { color: var(--ink-3); }
  .crit-warn { padding: 0 var(--pad) 12px; }

  /* ---------- техническое предложение ---------- */
  .items { list-style: none; margin: 0; padding: 0 var(--pad) 4px; }
  .items > li { display: grid; gap: 6px; padding: 12px 0; }
  .items > li + li { border-top: 1px solid var(--line); }
  .item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .item-head h3, .item-head h4 { margin: 0; font: var(--t-section); }
  .qty { font: var(--t-caption); color: var(--ink-3); }
  .flag { font: 600 12px/16px var(--ui); color: var(--warn); }
  .need { margin: 0; font: var(--t-body); color: var(--ink-3); }
  .edit {
    appearance: none; border: 0; background: none; max-width: calc(80ch + 16px); margin-inline: -8px; padding: 4px 8px; border-radius: 10px;
    text-align: left; white-space: pre-wrap; font: var(--t-doc); color: var(--ink); cursor: text;
  }
  .edit:hover { background: var(--hover); }
  .edit-area {
    display: block; width: calc(100% + 16px); max-width: calc(80ch + 16px); margin-inline: -8px; padding: 4px 8px; min-height: 48px;
    border: 0; border-radius: 10px; outline: none; resize: none; field-sizing: content;
    background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--brand); font: var(--t-doc);
  }
  mark.fill { padding: 0 4px; border-radius: 6px; background: var(--warn-tint); color: var(--warn); font-weight: 600; }
  .price { display: grid; gap: 6px; padding: 12px var(--pad); }
  .price label { font: var(--t-strong); }
  .price-row { display: flex; align-items: center; gap: 8px; }
  .price p { margin: 0; }
  .parts { list-style: none; margin: 0; padding: 0 var(--pad); }
  .parts > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 4px; align-items: center; padding: 10px 0; }
  .parts > li + li { border-top: 1px solid var(--line); }
  .parts-foot { margin: 0 var(--pad); padding: 10px 0 12px; border-top: 1px solid var(--line); font: var(--t-body); color: var(--ink-3); }
  .part-gaps { grid-column: 1 / -1; display: grid; gap: 4px; margin: 4px 0 0; padding: 0; list-style: none; font: var(--t-caption); color: var(--warn); }
  .part-gaps > li { display: flex; align-items: flex-start; gap: 8px; }
  .part-gaps svg { flex: none; }
  .part-name { font: var(--t-strong); }
  .part-status { grid-column: 1; font: var(--t-caption); color: var(--ink-3); }
  .parts .btn { grid-column: 2; grid-row: 1 / span 2; }
  /* Документы заявки — все файлы в одном окне: название, статус бейджем, «Скачать»; строки с разделителями */
  .files-list { list-style: none; margin: 0; padding: 0; display: grid; }
  .file-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto auto; column-gap: 12px; row-gap: 6px; align-items: center; padding: 10px 0; }
  .file-row + .file-row, .file-note { border-top: 1px solid var(--line); }
  .file-title { font: var(--t-strong); }
  .file-sub { font: var(--t-caption); color: var(--ink-3); }
  .file-note { padding: 10px 0 0; font: var(--t-body); color: var(--ink-3); }
  @media (max-width: 559px) {
    .file-row { grid-template-columns: 32px minmax(0, 1fr) auto; }
    .file-row > .badge { grid-column: 2; grid-row: 2; justify-self: start; }
    .file-row > .btn { grid-column: 3; grid-row: 1 / 3; }
    .file-row > .law { grid-row: 1 / 3; align-self: start; }
  }
  /* Главное действие шага — плавающим островом внизу; полоса холста под ним закрывает черновик до края */
  .sticky-actions {
    position: sticky; bottom: -8px; z-index: 5; margin: auto -8px -8px; padding: 8px;
    background: linear-gradient(to top, var(--canvas) 8px, transparent 8px);
  }
  .sticky-actions .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border-radius: var(--r-island); background: var(--card); box-shadow: var(--float); }
  .confirm { display: grid; gap: 10px; padding: 12px; }
  .confirm p { margin: 0; font: var(--t-strong); }
  .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  /* Состав исполнителей: кто нужен — из ТЗ, люди — под эту закупку. Сверка с ТЗ — строками статуса с иконкой. */
  .cast-body { container-type: inline-size; display: grid; gap: 12px; padding: 0 var(--pad) var(--pad); }
  .cast-need { display: grid; gap: 4px; }
  .cast-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .cast-checks li { display: flex; align-items: flex-start; gap: 6px; font: var(--t-strong); }
  .cast-checks li > svg { flex: none; margin-top: 2px; }
  .cast-checks .ok { color: var(--ok); }
  .cast-checks .warn { color: var(--warn); }
  .cast-group { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .cast-group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .cast-group-head h4 { margin: 0; font: var(--t-section); }
  .cast-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .cast-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) 28px; align-items: start; gap: 6px 8px; }
  .cast-n { padding-top: 8px; text-align: right; font: var(--t-num); color: var(--ink-3); }
  .cast-fields { display: grid; gap: 6px; min-width: 0; }
  @container (width >= 520px) { .cast-fields { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
  .cast-field { position: relative; min-width: 0; }
  .cast-row .icon-btn { margin-top: 2px; }
  .cast-row-note { grid-column: 2 / -1; display: flex; align-items: flex-start; gap: 6px; margin: 0; font: var(--t-tag); color: var(--warn); }
  .cast-row-note > svg { flex: none; margin-top: 1px; }
  .cast-add { display: inline-flex; align-items: center; gap: 4px; justify-self: start; margin-left: 24px; font: var(--t-strong); text-decoration: none; }
  .cast-add > svg { flex: none; }
  .cast-foot { display: grid; gap: 4px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font: var(--t-body); color: var(--ink-2); }
  .icon-btn.xs { width: 28px; height: 28px; color: var(--ink-3); }
  /* Вставка списком — поверхность внутри острова */
  .paste-box { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-surface); background: var(--paper-2); }
  .paste-box label { font: var(--t-strong); }
  .paste-box textarea.input { display: block; height: auto; min-height: 112px; padding: 6px 10px; resize: none; }
  /* Подсказки при наборе — всплывающее меню: тень lg, пункты по 8 */
  .sug { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: min(360px, 80vw); max-height: 264px; overflow-y: auto; list-style: none; margin: 0; padding: 4px; border-radius: var(--r-surface); background: var(--card); box-shadow: var(--float); }
  .sug li { display: grid; padding: 6px 8px; border-radius: var(--r-ctl); cursor: pointer; font: var(--t-label); }
  .sug li:hover, .sug li[aria-selected="true"] { background: var(--hover); }
  .sug small { font: var(--t-caption); color: var(--ink-3); }
  /* На телефоне поле 16 px, иначе браузер увеличивает страницу при вводе */
  @media (pointer: coarse) { .cast-row .input, .paste-box textarea.input { font-size: 16px; } }

  /* ---------- до какой цены снижаться ---------- */
  .calc-body { container-type: inline-size; display: grid; gap: 16px; padding: 4px var(--pad) var(--pad); }
  .calc-grid, .calc-more { display: grid; gap: 16px; }
  @container (width >= 520px) { .calc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .num-field { display: grid; align-content: start; gap: 4px; }
  .num-field label { font: var(--t-strong); }
  @container (width >= 600px) { .calc-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .calc-group { display: grid; gap: 12px; }
  .more-body { gap: 20px; padding-top: 2px; }
  .more-head { min-height: 56px; }
  .more-text { display: grid; gap: 2px; min-width: 0; }
  .more-sum { font: var(--t-caption); color: var(--ink-3); }
  .more-sum.warn { color: var(--warn); }
  .disclosure { display: grid; gap: 12px; }
  .disc-btn { display: inline-flex; align-items: center; gap: 4px; justify-self: start; }
  .disc-btn > svg { transition: transform .15s ease; }
  .disc-btn[aria-expanded="false"] > svg { transform: rotate(-90deg); }
  .check-row .label-row { align-items: flex-start; }
  .input.calc { max-width: 176px; font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; }
  /* На телефоне поле 16 px, иначе браузер увеличивает страницу при вводе */
  @media (pointer: coarse) { .input.calc { font-size: 16px; } }
  .hint { margin: 0; font: var(--t-caption); color: var(--ink-3); }
  /* Подсказка «?»: кнопка рядом с подписью, по нажатию — карточка поверх. Нажатием, а не наведением: на телефоне наведения нет */
  .label-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .hint-btn { appearance: none; border: 0; background: none; flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; margin: -6px 0; padding: 0; border-radius: var(--r-ctl); color: var(--ink-3); cursor: pointer; }
  .hint-btn:hover { background: var(--hover); color: var(--ink); }
  .hint-btn[aria-expanded="true"] { color: var(--brand); }
  .hint-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .hint-pop { position: fixed; z-index: 60; display: grid; gap: 4px; width: max-content; max-width: min(320px, calc(100vw - 16px)); margin: 0; padding: 10px 12px; border-radius: var(--r-surface); background: var(--card); box-shadow: var(--float); font: var(--t-body); color: var(--ink-2); }
  .hint-pop[hidden] { display: none; }
  .hint-pop p { margin: 0; }
  .hint-pop-title { font: var(--t-strong); color: var(--ink); }
  .check-row { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 10px; }
  .check-row input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--brand); }
  .check-row label { font: var(--t-body); color: var(--ink); }
  .check-row .hint { grid-column: 2; }
  .pills-set { min-width: 0; margin: 0; padding: 0; border: 0; }
  .pills-set legend { margin-bottom: 6px; padding: 0; font: var(--t-strong); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; min-height: 32px; padding-inline: 14px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font: var(--t-strong); }
  .pill:hover { background: var(--paper-3); }
  .pill:has(input:checked) { background: var(--brand); color: var(--on-brand); }
  .pill:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
  .calc-out { display: grid; gap: 12px; }
  .calc-out:empty { display: none; }
  /* Таблица «нижняя цена и ваша»: на узком экране прокручивается сама, страница — нет */
  .calc-table-wrap { overflow-x: auto; }
  .calc-table { width: 100%; max-width: 576px; border-collapse: collapse; font: var(--t-body); }
  .calc-table thead th { padding: 0 0 4px 12px; text-align: right; font: var(--t-caption); color: var(--ink-3); }
  .calc-table tbody tr + tr { border-top: 1px solid var(--line); }
  .calc-table tbody th { padding: 8px 12px 8px 0; text-align: left; vertical-align: top; font-weight: 500; color: var(--ink-2); }
  .calc-table td { padding: 8px 0 8px 12px; text-align: right; vertical-align: top; }
  .cell-num { display: block; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .cell-sub { display: block; font: var(--t-caption); color: var(--ink-3); }
  .calc-table tr.strong th { font-weight: 600; color: var(--ink); }
  .calc-table tr.strong .cell-num { font-weight: 600; }
  /* Ответ — плавающим островом внизу, как «Скачать ТП» */
  .result-bar { display: grid; gap: 2px; padding: 12px var(--pad); border-radius: var(--r-island); background: var(--card); box-shadow: var(--float); }
  .result-bar p { margin: 0; }
  .res-label { font: var(--t-caption); color: var(--ink-3); }
  .res-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .res-num { font: 600 16px/24px var(--mono); font-variant-numeric: tabular-nums; }
  .res-text { font: var(--t-body); color: var(--ink-2); }
  .res-warn { font: var(--t-strong); color: var(--warn); }
  .hint, .cell-sub, .res-label, .calc-table thead th { letter-spacing: 0; }
  /* Шкала цены: зоны убытка и без убытка — бледные заливки статусов с иконкой и подписью, граница антидемпинга,
     круглая ручка — ваша цена. Ползунок поверх прозрачный, бегунок в 1 px — чтобы цена совпадала со шкалой. */
  .scale-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
  .profit { display: grid; align-content: start; gap: 2px; }
  .profit-head { font: var(--t-strong); }
  .profit-line { display: flex; align-items: center; gap: 6px; font: var(--t-body); }
  .ok-ic, .bad-ic { display: inline-flex; }
  .ok-ic { color: var(--ok); }
  .bad-ic { color: var(--danger); }
  .scale { display: grid; gap: 6px; }
  .scale-top { position: relative; height: 20px; }
  .scale-floor, .scale-tip { position: absolute; top: 0; margin: 0; padding: 2px 4px; border-radius: 6px; white-space: nowrap; font: var(--t-caption); color: var(--ink-2); }
  button.scale-floor { border: 0; background: none; cursor: pointer; }
  button.scale-floor:hover { background: var(--hover); }
  .scale-floor b, .scale-tip b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
  .scale-tip { padding-inline: 6px; background: var(--card); box-shadow: var(--float); pointer-events: none; }
  .scale-track { position: relative; height: 32px; }
  .zones { position: absolute; inset: 4px 0; display: flex; gap: 2px; }
  .zone { container-type: inline-size; display: flex; align-items: center; min-width: 0; }
  .zone.loss { border-radius: 6px 0 0 6px; background: color-mix(in srgb, var(--danger) 14%, var(--paper)); }
  .zone.ok { flex: 1; justify-content: flex-end; border-radius: 0 6px 6px 0; background: var(--ok-tint); }
  .zone.none { flex: 1; border-radius: 6px; background: var(--paper-2); }
  .zone.all { flex: 1; border-radius: 6px; }
  .zone-label { display: none; align-items: center; gap: 4px; padding: 0 8px; white-space: nowrap; font: var(--t-tag); color: var(--ink-2); }
  /* Справа — место под ручку: без вашей цены она стоит на начальной */
  .zone.ok .zone-label { padding-right: 16px; }
  .zone.loss .zone-label svg { color: var(--danger); }
  .zone.ok .zone-label svg { color: var(--ok); }
  @container (width >= 92px) { .zone.loss .zone-label { display: flex; } }
  @container (width >= 124px) { .zone.ok .zone-label { display: flex; } }
  .scale-caret { position: absolute; top: 0; width: 1px; height: 4px; background: var(--ink-3); }
  .scale-hover { position: absolute; top: 4px; width: 1px; height: 24px; background: var(--ink-2); pointer-events: none; }
  .scale-range { position: absolute; inset: 0; z-index: 1; width: 100%; height: 32px; margin: 0; opacity: 0; cursor: pointer; appearance: none; background: transparent; }
  .scale-range::-webkit-slider-thumb { appearance: none; width: 1px; height: 32px; }
  .scale-range::-moz-range-thumb { width: 1px; height: 32px; border: 0; }
  .scale-pin { position: absolute; top: 8px; width: 16px; height: 16px; translate: -50% 0; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--paper), 0 1px 3px rgb(16 18 39 / .3); pointer-events: none; }

<script>
(() => {
  "use strict";

  // Сроки в примере считаются от этой даты — прототип не «стареет».
  const TODAY = new Date(2026, 8, 25);
  const quick = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, quick ? 0 : ms));

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = (x) => JSON.parse(JSON.stringify(x));
  // Какие файлы закупки распознаны со скана: ошибка в цифре ТЗ перейдёт в требования и ТП.
  const scanWarning = (p) => {
    const names = (p.scans || []).map((n) => `«${esc(n)}»`);
    if (!names.length) return "";
    const one = names.length === 1;
    return `${one ? "Файл" : "Файлы"} ${names.join(", ")} ${one ? "распознан" : "распознаны"} со скана — цифры, даты и суммы сверьте с оригиналом.`;
  };
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };

  /* ---------- иконки: набор Craftwork Outline из Figma (узел 8029:378), недостающие дорисованы в том же стиле ---------- */
  // Первая буква пути: f — заливка, e — заливка чёт-нечет, s — обводка 1,5 (в мелком кружке шага галочку делаем жирнее).

   "44-44-4": {

    "title": "Обеспечение заявки на участие в закупке",
    "label": "ч. 4",
    "text": "4. Обеспечение заявки на участие в закупке может предоставляться участником закупки в виде денежных средств или независимой гарантии, предусмотренной статьей 45 настоящего Федерального закона. Выбор способа обеспечения осуществляется участником закупки самостоятельно. Срок действия независимой гарантии должен составлять не менее месяца с даты окончания срока подачи заявок.",
    "edition": "44-ФЗ в редакции от 04.08.2026 № 330-ФЗ",

   "44-44-10": {
    "law": "44-ФЗ",
    "art": "44",
    "title": "Обеспечение заявки на участие в закупке",
    "label": "ч. 10–12",
    "text": "10. Оператор электронной площадки направляет в банк информацию о реквизитах специального счета для осуществления банком по такому счету операции, предусмотренной частью 9 настоящей статьи, в течение одного часа с момента наступления следующих случаев:\n1) отклонение заявки на участие в закупке (за исключением случая, предусмотренного частью 13 настоящей статьи), отстранение участника закупки от участия в определении поставщика (подрядчика, исполнителя) в соответствии с настоящим Федеральным законом;\n2) отзыв заявки участником закупки в соответствии с настоящим Федеральным законом;\n3) заключение контракта в соответствии с настоящим Федеральным законом с участником закупки. В этом случае оператор электронной площадки направляет также информацию о реквизитах специальных счетов всех участников закупки, заявки которых не были отклонены, отстранены, отозваны в соответствии с настоящим Федеральным законом, за исключением участников закупки, признанных в соответствии с настоящим Федеральным законом уклонившимися от заключения контракта;\n4) отмена закупки в соответствии со статьей 36 настоящего Федерального закона. В этом случае оператор электронной площадки направляет информацию о реквизитах специальных счетов всех участников закупки, подавших заявки на участие в закупке;\n5) получение решения контрольного органа в сфере закупок об отказе в согласовании заключения контракта с единственным поставщиком (подрядчиком, исполнителем);\n6) получение предусмотренного настоящим Федеральным законом решения об отказе во включении информации об участнике закупки в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в связи с его уклонением от заключения контракта;\n7) включение информации об участнике закупки в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в соответствии со статьей 104 настоящего Федерального закона в связи с его уклонением от заключения контракта.\n11. Банк не позднее одного часа с момента получения информации, предусмотренной пунктами 1 - 6 части 10 настоящей статьи, прекращает осуществленное в соответствии с подпунктом \"в\" пункта 3 части 5 настоящей статьи блокирование денежных средств на специальном счете (специальных счетах), реквизиты которого (которых) направлены оператором электронной площадки, и направляет информацию о прекращении такого блокирования оператору электронной площадки. Не позднее одного часа с момента получения информации, предусмотренной пунктом 7 части 10 настоящей статьи, банк осуществляет перевод заблокированных в соответствии с подпунктом \"в\" пункта 3 части 5 настоящей статьи денежных средств на счет, на котором в соответствии с законодательством Российской Федерации учитываются операции со средствами, поступающими заказчику, и направляет информацию о таком переводе оператору электронной площадки.\n12. Возврат независимой гарантии, предоставленной для обеспечения заявки на участие в закупке, в случаях, предусмотренных пунктами 1 - 6 части 10 настоящей статьи, заказчиком лицу или гаранту, предоставившим независимую гарантию, не осуществляется, взыскание по ней не производится. В случае, предусмотренном пунктом 7 части 10 настоящей статьи, заказчик предъявляет требование об уплате денежной суммы по независимой гарантии, предоставленной для обеспечения заявки на участие в закупке участником закупки, информация о котором включена в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в связи с уклонением такого участника от заключения контракта.",
    "edition": "44-ФЗ в редакции от 04.08.2026 № 330-ФЗ",
    "url": "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102164547&rdk=157"
   },
   "44-94-13": {
    "law": "44-ФЗ",
    "art": "94",
    "title": "Особенности исполнения контракта",
    "label": "ч. 13",
    "text": "13. При исполнении контракта, заключенного по результатам проведения электронных процедур, закрытых электронных процедур (за исключением закрытых электронных процедур, проводимых федеральными органами исполнительной власти, осуществляющими функции по выработке и реализации государственной политики в области обороны, в области государственной охраны, государственного управления в области обеспечения безопасности Российской Федерации, в сфере деятельности войск национальной гвардии Российской Федерации, подведомственными им государственными учреждениями, государственными унитарными предприятиями, в случае, предусмотренном пунктом 5 части 11 статьи 24 настоящего Федерального закона): (В редакции Федерального закона от 28.06.2022 № 231-ФЗ)\n…\n3) документ о приемке, подписанный поставщиком (подрядчиком, исполнителем), не позднее одного часа с момента его размещения в единой информационной системе в соответствии с пунктом 1 настоящей части автоматически с использованием единой информационной системы направляется заказчику. Датой поступления заказчику документа о приемке, подписанного поставщиком (подрядчиком, исполнителем), считается дата размещения в соответствии с настоящим пунктом такого документа в единой информационной системе в соответствии с часовой зоной, в которой расположен заказчик;\n4) в срок, установленный контрактом, но не позднее двадцати рабочих дней, следующих за днем поступления документа о приемке в соответствии с пунктом 3 настоящей части, заказчик (за исключением случая создания приемочной комиссии в соответствии с частью 6 настоящей статьи) осуществляет одно из следующих действий:\nа) подписывает усиленной электронной подписью лица, имеющего право действовать от имени заказчика, и размещает в единой информационной системе документ о приемке;\nб) формирует с использованием единой информационной системы, подписывает усиленной электронной подписью лица, имеющего право действовать от имени заказчика, и размещает в единой информационной системе мотивированный отказ от подписания документа о приемке с указанием причин такого отказа;\n…\n7) в случае получения в соответствии с пунктом 6 настоящей части мотивированного отказа от подписания документа о приемке поставщик (подрядчик, исполнитель) вправе устранить причины, указанные в таком мотивированном отказе, и направить заказчику документ о приемке в порядке, предусмотренном настоящей частью;\n8) датой приемки поставленного товара, выполненной работы, оказанной услуги считается дата размещения в единой информационной системе документа о приемке, подписанного заказчиком.",
    "edition": "44-ФЗ в редакции от 04.08.2026 № 330-ФЗ",
    "url": "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102164547&rdk=157"
   },
   "44-37-2": {
    "law": "44-ФЗ",
    "art": "37",
    "title": "Антидемпинговые меры при проведении конкурса и аукциона",
    "label": "ч. 2–3",
    "text": "2. Если при проведении конкурса или аукциона начальная (максимальная) цена контракта составляет пятнадцать миллионов рублей и менее и участником закупки, с которым заключается контракт, предложена цена контракта, которая на двадцать пять и более процентов ниже начальной (максимальной) цены контракта, либо предложена сумма цен единиц товара, работы, услуги, которая на двадцать пять и более процентов ниже начальной суммы цен указанных единиц, контракт заключается только после предоставления таким участником обеспечения исполнения контракта (если требование обеспечения исполнения контракта установлено в соответствии со статьей 96 настоящего Федерального закона) в размере, указанном в части 1 настоящей статьи, или информации, подтверждающей добросовестность такого участника в соответствии с частью 3 настоящей статьи, с одновременным предоставлением таким участником обеспечения исполнения контракта в размере обеспечения исполнения контракта, указанном в извещении об осуществлении закупки, приглашении, документации о закупке (в случае, если настоящим Федеральным законом предусмотрена документация о закупке). (В редакции федеральных законов от 27.12.2018 № 502-ФЗ, от 01.05.2019 № 71-ФЗ, от 02.07.2021 № 360-ФЗ, от 26.12.2024 № 484-ФЗ)\n3. К информации, подтверждающей добросовестность участника закупки, относится информация, содержащаяся в реестре контрактов, заключенных заказчиками, и подтверждающая исполнение таким участником в течение трех лет до даты подачи заявки на участие в закупке трех контрактов (с учетом правопреемства), исполненных без применения к такому участнику неустоек (штрафов, пеней). При этом цена одного из таких контрактов должна составлять не менее чем двадцать процентов начальной (максимальной) цены контракта, указанной в извещении об осуществлении закупки, приглашении и документации о закупке (в случае, если настоящим Федеральным законом предусмотрена документация о закупке). (В редакции федеральных законов от 01.05.2019 № 71-ФЗ, от 02.07.2021 № 360-ФЗ)",
    "edition": "44-ФЗ в редакции от 04.08.2026 № 330-ФЗ",

   "44-43-1": {
    "law": "44-ФЗ",
    "art": "43",

  /* ---------- даты и деньги — как в web/src/lib/deadline.ts и rub-words.ts ---------- */
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

  // Срок подачи — самое важное в закупке: обратный отсчёт, янтарный за неделю до срока.
  function dueLine(dl, withTime) {

    if (!m) return null;
    const [y, mo, d] = [Number(m[1]), Number(m[2]), Number(m[3])];
    const days = Math.round((new Date(y, mo - 1, d) - TODAY) / 86400000);
    const day = `${d} ${MONTHS[mo - 1]}${y !== TODAY.getFullYear() ? ` ${y}` : ""}`;
    const at = withTime && dl.time ? [dl.time, dl.zone].filter(Boolean).join(" ") : "";
    if (days < 0) return { head: `Приём заявок закончился ${day}`, tone: "past", days };
    if (days === 0) return { head: `Подать сегодня${at ? `, до ${at}` : ""}`, tone: "soon", days };
    return { head: `Подать до ${day}${at ? `, ${at}` : ""}`, left: `осталось ${days} ${plural(days, "день", "дня", "дней")}`, tone: days <= 7 ? "soon" : "calm", days };
