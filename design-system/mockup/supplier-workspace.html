  /* ---------- сайдбар ---------- */
  function sideHTML() {
    const inP = PURCHASE_SCREENS.includes(S.screen);
    const list = [...S.purchases].sort(byUrgency);
    const nav = (screen, icon, label, count) => `<button class="nav-item" type="button" data-go="${screen}"${S.screen === screen ? ' aria-current="page"' : ""}>${ic(icon)}<span>${label}</span>${count !== undefined ? `<span class="count">${count}</span>` : ""}</button>`;
    return `
      <button class="btn side-new" type="button" data-go="new">${ic("plus")}Новая закупка</button>
      <nav class="nav" aria-label="Разделы">
        ${nav("home", "home", "Главная")}
        ${nav("ask", "chat", "Спросить про тендер")}
      </nav>
      <section aria-labelledby="side-p">
        <h2 class="sec-label" id="side-p">Мои закупки<span class="count">${list.length}</span></h2>
        ${list.length ? `<ul class="pur-list">${list.map((p) => purItemHTML(p, inP && p.id === S.id)).join("")}</ul>` : '<p class="side-empty">Закупок пока нет.</p>'}
      </section>
      <section aria-labelledby="side-me">
        <h2 class="sec-label" id="side-me">Мои данные</h2>
        <div class="nav">
          ${nav("profile", "user", "Реквизиты", `${filledCount()}/${PROFILE_KEYS.length}`)}
          ${nav("docs", "folder", "Мои документы", S.docs.length)}
        </div>
      </section>`;
  }

  function purItemHTML(p, open) {
    const due = dueLine(p.deadline, false);
    const law = p.kind.split(" · ")[0];
    const badge = due && due.days >= 0 ? `<span class="days${due.tone === "soon" ? " soon" : ""}">${due.days === 0 ? "сегодня" : `${due.days} ${plural(due.days, "день", "дня", "дней")}`}</span>` : "";
    const meta = [law, due && due.days < 0 ? "приём закончился" : "", p.sample ? "пример" : ""].filter(Boolean).join(" · ");
    const current = open ? (S.screen === "p" ? ' aria-current="page"' : ' aria-current="true"') : "";
    return `<li>
      <button class="pur" type="button" data-go="p" data-id="${p.id}"${current}>
        <span class="pur-title">${esc(p.short)}</span>${badge}
        <span class="pur-meta">${esc(meta)}</span>
      </button>
      ${open ? subNavHTML(p) : ""}
    </li>`;
  }

  function subNavHTML(p) {
    const fill = p.tp ? fillCount(p.tp) : 0;
    const n = asked(p);
    const item = (screen, label, extra) => `<li><button class="sub-item" type="button" data-go="${screen}" data-id="${p.id}"${S.screen === screen ? ' aria-current="page"' : ""}><span>${label}</span>${extra}</button></li>`;
    const tpMark = !p.tp ? "" : fill ? `<span class="mark-n"><span class="sr-only">впишите данные: </span>${fill}</span>` : `<span class="mark-ok">${ic("check", 16)}<span class="sr-only">готово</span></span>`;
    return `<ul class="sub">
      ${item("req", "Требования", `<span class="count">${reqCount(p)}</span>`)}
      ${item("tp", "Техническое предложение", tpMark)}
      ${item("check", "Проверка заявки", '<span class="soon-tag">скоро</span>')}
      ${item("chat", "Вопросы", n ? `<span class="count">${n}</span>` : "")}
    </ul>`;
  }

  /* ---------- главная ---------- */
  function dueText(p) {
    const due = dueLine(p.deadline, false);
    if (!due) return "Срок подачи не найден в документах";
    const soon = due.tone === "soon" ? ' class="warn-t"' : "";
    if (!due.left) return `<span${soon}>${esc(due.head)}</span>`;
    return `${esc(due.head)} · <span${soon}>${esc(due.left)}</span>`;
  }
  function tpTag(p) {
    if (!p.tp) return '<span class="tag">ТП не составлено</span>';
    const fill = fillCount(p.tp);
    if (!fill) return '<span class="tag ok">ТП готово</span>';
    return `<span class="tag warn">ТП: впишите ${fill} ${plural(fill, "пункт", "пункта", "пунктов")}</span>`;
  }

  function homeHTML() {
    const list = [...S.purchases].sort(byUrgency);
    const files = S.home.files;
    return `<h1 class="sr-only">Главная</h1>
      <section class="ask" aria-labelledby="ask-title">
        <h2 class="h2" id="ask-title">Спросите про тендер</h2>
        <p class="ask-lead">Отвечу по 44-ФЗ, 223-ФЗ и вашим документам — со ссылкой на статью и пункт.</p>
        <form class="askbox" id="home-form">
          <label class="circle" for="home-file" title="Приложить документ">${ic("clip", 19)}<span class="sr-only">Приложить документ</span><input id="home-file" type="file" multiple class="sr-only"></label>
          <textarea id="home-q" rows="1" placeholder="Ваш вопрос…" aria-label="Вопрос" data-enter>${esc(S.home.text)}</textarea>
          <button class="circle send" type="submit" aria-label="Спросить">${ic("up")}</button>
        </form>
        ${files.length ? `<div class="chips">${files.map((n, i) => `<span class="file-chip">${ic("file", 14)}<span class="fc-name">${esc(n)}</span><button class="x" type="button" data-act="home-file-x" data-i="${i}" aria-label="Убрать ${esc(n)}">${ic("x", 14)}</button></span>`).join("")}</div>` : ""}
        <div class="chips">${GENERAL_SUGGEST.map((q) => `<button class="chip" type="button" data-act="home-q" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      </section>

      <section aria-labelledby="list-title">
        <div class="sec-head">
          <h2 class="h2" id="list-title">Мои закупки</h2>
          ${list.length ? `<button class="btn sm" type="button" data-go="new">${ic("plus")}Новая закупка</button>` : ""}
        </div>
        ${list.length ? `<ul class="cards">${list.map((p) => `<li>
          <button class="card" type="button" data-go="p" data-id="${p.id}">
            <span class="card-title">${esc(p.short)}${p.sample ? '<span class="sample">пример</span>' : ""}</span>
            ${CHEV}
            <span class="card-sub">${dueText(p)}</span>
            <span class="tags">${tpTag(p)}</span>
          </button></li>`).join("")}</ul>` : `
          <p class="lead">Загрузите документы закупки — выпишу требования и сроки, составлю черновик технического предложения и отвечу на вопросы по документам.</p>
          <div class="btn-row mt-6" style="align-items:center;gap:12px 16px">
            <button class="btn" type="button" data-go="new">Новая закупка</button>
            <span class="or">или <button class="link" type="button" data-act="sample">посмотреть на примере</button></span>
          </div>`}
      </section>
      <p class="foot">Закупки хранятся в этом браузере. Ответы ИИ не являются юридической консультацией — проверяйте нормы по первоисточнику.</p>`;
  }

  /* ---------- вопросы: общий чат и чат закупки ---------- */
  function msgHTML(m, p) {
    if (m.role === "user") {
      const files = (m.files || []).length ? `<div class="msg-files">${m.files.map((n) => `<span class="file-chip plain">${ic("file", 14)}<span class="fc-name">${esc(n)}</span></span>`).join("")}</div>` : "";
      return files + (m.text ? `<div class="msg user">${esc(m.text)}</div>` : "");
    }
    const done = m.done !== false;
    const refs = (m.src || []).map((r) => refBtn(r, p)).join("");
    return `<div class="msg bot">${md(done ? m.text : m.shown)}${done && m.note ? `<p class="note-line">${esc(m.note)}</p>` : ""}${done ? `<div class="msg-meta">${refs ? `<span class="refs">Источники: ${refs}</span>` : ""}<button class="link quiet" type="button" data-act="lawyer">Спросить юриста</button></div>` : ""}</div>`;
  }
  const feedInner = (messages, thinking, p) => messages.map((m) => msgHTML(m, p)).join("") + (thinking ? '<p class="thinking">Изучаю документы и закон…</p>' : "");

  function chipsHTML(list, used) {
    const left = list.filter((q) => !used.includes(q));
    return left.map((q) => `<button class="chip" type="button" data-act="q" data-q="${esc(q)}">${esc(q)}</button>`).join("");
  }

  function composerHTML(kind, placeholder, attach) {
    const g = S.general;
    const talk = attach && g.docs.length ? `<div class="in-talk"><span>В разговоре:</span>${g.docs.map((n, i) => `<span class="file-chip">${ic("file", 14)}<span class="fc-name">${esc(n)}</span><button class="x" type="button" data-act="gdoc-x" data-i="${i}" aria-label="Убрать ${esc(n)} из разговора">${ic("x", 14)}</button></span>`).join("")}</div>` : "";
    return `<form class="composer" id="${kind}-form">
      ${talk}
      <div class="prompt">
        <textarea id="${kind}-q" rows="1" placeholder="${placeholder}" aria-label="Вопрос" data-enter>${esc(S.drafts[kind] || "")}</textarea>
        <div class="prompt-foot">
          ${attach ? `<label class="tool-btn" for="g-file">${ic("clip", 14)}Документ<input id="g-file" type="file" multiple class="sr-only"></label>` : "<span></span>"}
          <button class="circle send" type="submit" aria-label="Отправить">${ic("up")}</button>
        </div>
      </div>
      <p class="disclaimer">Ответы ИИ не являются юридической консультацией. Проверяйте нормы по первоисточнику.</p>
    </form>`;
  }

  function askHTML() {
    const g = S.general;
    const empty = !g.messages.length && !g.thinking;
    return `<h1>Спросите про тендер</h1>
      <p class="lead">Отвечу по 44-ФЗ и 223-ФЗ со ссылкой на статью: тексты законов — в действующей редакции с официального портала. Приложите документ — отвечу и по нему.</p>
      <div class="feed" id="feed"${empty ? " hidden" : ""}>${feedInner(g.messages, g.thinking, null)}</div>
      <div class="chips on-ground mt-4" id="chips">${chipsHTML(GENERAL_SUGGEST, g.messages.filter((m) => m.role === "user").map((m) => m.text))}</div>
      ${composerHTML("ask", g.docs.length ? "Спросите про приложенные документы…" : "Задайте вопрос по закупкам…", true)}`;
  }

  function chatHTML(p) {
    const empty = !p.chat.length && !p.thinking;
    return `${back(p.short, "p")}
      <h1>Вопросы по закупке</h1>
      <p class="lead">Отвечу по документам закупки со ссылкой на пункт и статью закона.</p>
      <p class="small muted mt-2">Документы: ${p.files.map(esc).join(", ")}</p>
      <div class="feed" id="feed"${empty ? " hidden" : ""}>${feedInner(p.chat, p.thinking, p)}</div>
      <div class="chips on-ground mt-4" id="chips">${chipsHTML(CHAT_SUGGEST, p.chat.filter((m) => m.role === "user").map((m) => m.text))}</div>
      ${composerHTML("chat", "Спросите про документы закупки…", false)}`;
  }

  /* ---------- закупка ---------- */
  function purchaseHTML(p) {
    const due = dueLine(p.deadline, true);
    const reqN = reqCount(p);
    const fill = p.tp ? fillCount(p.tp) : 0;
    const n = asked(p);
    const tpSub = !p.tp ? "Ещё не составлено — составлю по ТЗ за пару минут"
      : fill ? `<span class="warn-t">Черновик готов · впишите ${fill} ${plural(fill, "пункт", "пункта", "пунктов")}</span>`
      : '<span class="ok-t">Черновик готов</span>';
    const row = (screen, title, sub) => `<li><button class="row" type="button" data-go="${screen}" data-id="${p.id}"><span class="row-title">${title}</span>${CHEV}<span class="row-sub">${sub}</span></button></li>`;
    const body = S.busy ? busyHTML() : `
      ${S.ui.error ? noteHTML("warn", esc(S.ui.error), "mt-5", "alert") : ""}
      <ul class="menu">
        ${row("req", "Требования", `${reqN} ${plural(reqN, "пункт", "пункта", "пунктов")}: кто может участвовать, что подать, сроки и деньги`)}
        ${row("tp", "Техническое предложение", tpSub)}
        ${row("check", 'Проверка заявки<span class="soon-tag">скоро</span>', checkSub(p))}
        ${row("chat", "Вопросы по закупке", n ? `${n} ${plural(n, "вопрос", "вопроса", "вопросов")} · спросите ещё` : "Сроки, обеспечение, требования — отвечу со ссылкой на пункт")}
      </ul>
      <p class="docs-line">Документы: ${p.files.map(esc).join(", ")} · <label class="link" for="add-doc">добавить<input id="add-doc" type="file" multiple class="sr-only"></label></p>
      ${scanWarning(p) ? `<p class="docs-line warn-t">${scanWarning(p)}</p>` : ""}
      ${p.unreadable.length ? `<p class="docs-line warn-t">Не прочитаны: ${p.unreadable.map((f) => `${esc(f.name)} — ${esc(f.reason)}`).join("; ")}</p>` : ""}
      <div class="mt-10">${S.ui.confirmDelete ? `<div class="confirm">
          <p>Удалить закупку вместе с документами, черновиком и вопросами? Вернуть её не получится.</p>
          <div class="btn-row"><button class="btn xs danger" type="button" data-act="delete">Удалить</button><button class="btn xs soft" type="button" data-act="cancel-delete">Отмена</button></div>
        </div>` : '<button class="link quiet del" type="button" data-act="ask-delete">Удалить закупку</button>'}</div>`;
    return `${back("Мои закупки", "home")}
      ${p.kind ? `<p class="kind">${esc(p.kind)}</p>` : ""}
      <h1>${esc(p.subject || p.short)}</h1>
      ${due ? `<p class="due ${due.tone}">${ic("clock")}${esc(due.left ? `${due.head} · ${due.left}` : due.head)}</p>` : ""}
      <dl class="facts">
        ${p.customer ? `<div><dt>Заказчик: </dt><dd>${esc(p.customer)}</dd></div>` : ""}
        ${p.price ? `<div><dt>Начальная цена: </dt><dd>${esc(p.price)}</dd></div>` : ""}
      </dl>
      ${p.sample ? noteHTML("info", "Это пример на вымышленной закупке — нажимайте на всё, ничего не сломается.", "mt-5") : ""}
      ${body}`;
  }

  function checkCounts(p) {
    return { bad: p.check.findings.filter((f) => f.kind === "bad").length, warn: p.check.findings.filter((f) => f.kind === "warn").length };
  }
  function checkSub(p) {
    if (p.check.state !== "done") return "Сверю вашу заявку с ТЗ и скажу, за что могут отклонить";
    const { bad, warn } = checkCounts(p);
    if (bad) return `<span class="bad-t">${bad} ${plural(bad, "ошибка", "ошибки", "ошибок")}${warn ? `, ${warn} ${plural(warn, "замечание", "замечания", "замечаний")}` : ""}</span>`;
    if (warn) return `<span class="warn-t">${warn} ${plural(warn, "замечание", "замечания", "замечаний")}</span>`;
    return '<span class="ok-t">Ошибок нет</span>';
  }

  /* ---------- требования ---------- */
  function reqHTML(p) {
    const unverified = REQ_KEYS.reduce((n, k) => n + p.requirements[k].filter((it) => !it.verified).length, 0);
    return `${back(p.short, "p")}
      <h1>Требования</h1>
      <p class="lead">Всё, что нужно для заявки, — из документов закупки. Нажмите на ссылку под пунктом, чтобы увидеть точную цитату.</p>
      ${p.unreadable.length ? noteHTML("warn", `Не получилось прочитать: ${p.unreadable.map((f) => `${esc(f.name)} — ${esc(f.reason)}`).join("; ")}. Требования выписаны по остальным файлам.`, "mt-5", "alert") : ""}
      ${scanWarning(p) ? noteHTML("warn", scanWarning(p), p.unreadable.length ? "mt-2" : "mt-5", "alert") : ""}
      ${unverified ? noteHTML("warn", `В ${unverified} ${plural(unverified, "пункте", "пунктах", "пунктах")} цитата не найдена в документах дословно — сверьте их вручную.`, p.unreadable.length || scanWarning(p) ? "mt-2" : "mt-5", "alert") : ""}
      ${REQ_KEYS.map((key) => {
        const items = p.requirements[key];
        return `<section class="group"><h2 class="group-title">${GROUPS[key].title}</h2>
          ${items.length ? `<ul class="list">${items.map((it, i) => `<li><span>${esc(it.text)}</span>${sourceHTML(`${key}-${i}`, it.source, it.quote, it.verified, "пункт")}</li>`).join("")}</ul>` : `<p class="empty-group">${GROUPS[key].empty}</p>`}
        </section>`;
      }).join("")}`;
  }

  // Ссылка на источник: нажали — под ней точная цитата; ненайденная дословно помечена янтарём.
  function sourceHTML(id, source, quote, verified, what) {
    const open = S.ui.open === id;
    return `<button class="src" type="button" data-act="toggle" data-open="${id}" aria-expanded="${open}">${esc(source || "цитата из ТЗ")}</button>
      ${open ? `<blockquote class="quote">${esc(quote)}</blockquote>` : ""}
      ${verified ? "" : `<p class="unver">${ic("alert", 16)}Не нашёл эту цитату в документах дословно — сверьте ${what} вручную.</p>`}`;
  }

  /* ---------- техническое предложение ---------- */
  const TP_STEPS = ["Ищу в документах форму заявки…", "Читаю ТЗ…", "Выписываю товары и характеристики…", "Готовлю предложение по пунктам…", "Сверяю цитаты с ТЗ…"];

  function tpNotes(p) {
    const tp = p.tp;
    const fill = fillCount(tp);
    const leaks = leaksOf(tp);
    const unverified = [...tp.goods, ...tp.items].filter((r) => !r.verified).length;
    let h = fill
      ? noteHTML("warn", `Впишите свои данные в ${fill} ${plural(fill, "пункт", "пункта", "пунктов")} — они выделены жёлтым. Нажмите на текст, чтобы исправить.`, "mt-4", "pen")
      : noteHTML("ok", "Все пункты заполнены.", "mt-4", "check");
    if (leaks.length) h += noteHTML("warn", `В техническом предложении есть ваши данные: ${leaks.map((v) => `«${esc(v)}»`).join(", ")}. Уберите их — ТП подают в первую часть заявки анонимно, иначе заявку отклонят.`, "mt-2", "alert");
    if (unverified) h += noteHTML("warn", `В ${unverified} ${plural(unverified, "строке", "строках", "строках")} цитата не найдена в документах дословно — сверьте их вручную.`, "mt-2", "alert");
    if (scanWarning(p)) h += noteHTML("warn", scanWarning(p), "mt-2", "alert");
    return h;
  }

  function editHTML(key, value, label) {
    if (S.ui.editing === key) return `<textarea class="edit-area" id="edit-${key.replace(":", "-")}" data-edit="${key}" data-label="${esc(label)}" aria-label="${esc(label)}">${esc(value)}</textarea>`;
    return `<button class="edit" type="button" data-act="edit" data-edit="${key}" data-label="${esc(label)}" aria-label="Изменить: ${esc(label)}">${fields(value)}</button>`;
  }

  function priceInfo(p) {
    const nmck = parseRub(p.price);
    const price = p.tpPrice;
    const drop = nmck && price ? (1 - price / nmck) * 100 : null;
    const percent = drop !== null ? drop.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) : "";
    let h = "";
    if (price) h += `<p class="small ink2">Прописью: ${esc(rublesInWords(price))}</p>`;
    if (nmck) h += `<p class="small muted">Начальная цена — ${fmtRub(nmck)} ₽${drop !== null && drop > 0 ? ` · снижение ${percent}%` : ""}</p>`;
    if (drop !== null && drop < 0) h += noteHTML("warn", "Цена выше начальной — такую заявку отклонят.", "", "alert");
    if (drop !== null && drop >= 25) h += noteHTML("warn", `Снижение ${percent}% — это 25% и больше. ${esc(p.tp.antiDumping.rule || "В таких случаях обычно действуют антидемпинговые меры: обеспечение исполнения в полтора раза больше или подтверждение опыта. Проверьте условия в извещении.")}`, "", "alert");
    return h;
  }

  // Готовая часть заявки актуальна, пока не изменились цена, реквизиты и образцы, по которым она составлена.
  const basisKey = (p, k) => JSON.stringify({ price: p.tp.form.hasPrice ? p.tpPrice || null : null, profile: S.profile, samples: samplesOf(PART_SAMPLE_KIND[k]).map((d) => d.id) });
  function basisText(p, k) {
    const form = p.tp.form.partForms && p.tp.form.partForms[k];
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    if (form && samples.length) return `по форме заказчика (${form}) и вашему образцу «${samples[0].name}»`;
    if (samples.length) return `по вашему образцу «${samples[0].name}»`;
    if (form) return `по форме заказчика (${form})`;
    return "по обычной форме — ни формы заказчика, ни образца нет";
  }
  function partRow(p, k) {
    const made = p.parts[k];
    const fresh = made && made.key === basisKey(p, k);
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    const writing = S.ui.writing === k;
    const status = p.sample ? "в примере — по стандартному шаблону"
      : writing ? "Пишу документ — это около минуты…"
      : fresh ? esc(made.basis)
      : made ? "реквизиты, цена или образцы изменились — составлю заново"
      : samples.length ? `составлю по вашему образцу «${esc(samples[0].name)}»${samples.length > 1 ? ` и ещё ${samples.length - 1}` : ""}`
      : "ваших образцов нет — составлю по форме заказчика";
    return `<li>
      <span class="part-name">${esc(PART_TITLES[k])}</span>
      <button class="btn soft xs" type="button" data-act="part" data-part="${k}"${S.ui.writing ? " disabled" : ""}>${writing ? "Пишу…" : "Скачать"}</button>
      <span class="part-status">${status}${fresh && !p.sample && !writing ? ` · <button class="link quiet" type="button" data-act="part-redo" data-part="${k}">составить заново</button>` : ""}</span>
    </li>`;
  }
  const partsRows = (p) => partsOf(p.tp.form).filter((k) => k !== "tp").map((k) => partRow(p, k)).join("");

  function tpHTML(p) {
    const head = `${back(p.short, "p")}<h1>Техническое предложение</h1>`;
    if (S.busy) return head + busyHTML();
    if (!p.tp) {
      const tpSamples = samplesOf("tp");
      return `${head}
        <p class="lead">Найду в документах форму заявки и заполню её, как тендерный юрист: товары с конкретными характеристиками, предложение по пунктам ТЗ, цена. Вам останется вписать то, что знаете только вы.</p>
        ${p.sample ? "" : `<p class="small muted mt-4">${tpSamples.length
          ? `Пишу по вашим техническим предложениям: ${tpSamples.length} ${plural(tpSamples.length, "документ", "документа", "документов")} из <button class="link" type="button" data-go="docs">«Моих документов»</button>.`
          : 'Черновик будет в общем стиле. <button class="link" type="button" data-go="docs">Загрузите свои документы</button> — и ТП будет написано так, как пишете вы.'}</p>`}
        <button class="btn mt-6" type="button" data-act="compose">Составить черновик</button>`;
    }
    const tp = p.tp;
    const goods = tp.goods.length ? `<section class="mt-7">
        <h2 class="group-title">Товары и оборудование — ${tp.goods.length}</h2>
        <ol class="items">${tp.goods.map((g, i) => `<li>
          <div class="item-head"><h3>${i + 1}. ${esc(g.name)}</h3>${g.quantity ? `<span class="qty">${esc(g.quantity)}</span>` : ""}${needsFill(g.characteristics) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          ${sourceHTML(`g${i}`, g.source, g.quote, g.verified, "строку")}
          ${editHTML(`good:${i}`, g.characteristics, `Характеристики: ${g.name}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    const items = tp.items.length ? `<section class="mt-7">
        <h2 class="group-title">Предложение по пунктам ТЗ — ${tp.items.length}</h2>
        <ol class="items">${tp.items.map((it, i) => `<li>
          <div class="item-head"><h3>${i + 1}. ${esc(it.topic)}</h3>${needsFill(it.offer) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          <p class="need">В ТЗ${it.clause ? `, п. ${esc(it.clause)}` : ""}: ${esc(it.requirement)}</p>
          ${sourceHTML(`i${i}`, "", it.quote, it.verified, "строку")}
          ${editHTML(`item:${i}`, it.offer, `Предложение: ${it.topic}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    return `${head}
      <p class="small muted mt-3">${tp.form.source
        ? `По форме заказчика: ${esc(tp.form.title)} (${esc(tp.form.source)}). Каждая часть заявки — отдельным файлом.`
        : "Формы заявки в документах нет — составлено как техническое предложение по пунктам ТЗ."} Техническое предложение идёт в первую часть заявки, поэтому в нём нет ни названия, ни ИНН, ни подписи участника.</p>
      <div id="tp-notes">${tpNotes(p)}</div>
      ${tp.form.hasPrice ? `<section class="price">
          <label for="tp-price">Цена вашего предложения</label>
          <div class="price-row"><input class="input num" id="tp-price" inputmode="decimal" autocomplete="off" placeholder="например, 690000" value="${esc(p.tpPriceText)}"><span class="muted">₽</span></div>
          <div class="grid-gap" id="price-info" style="display:grid;gap:8px">${priceInfo(p)}</div>
        </section>` : ""}
      ${goods}
      ${items}
      <div class="mt-5">${S.ui.confirmRedo ? `<div class="confirm">
          <p>Составить черновик заново? Ваши правки в этом черновике пропадут.</p>
          <div class="btn-row"><button class="btn xs" type="button" data-act="redo">Составить заново</button><button class="btn xs soft" type="button" data-act="cancel-redo">Отмена</button></div>
        </div>` : '<p class="small muted m0">Добавили документы или черновик не подходит? <button class="link" type="button" data-act="ask-redo">Составить заново</button></p>'}</div>
      <section class="mt-8">
        <h2 class="group-title">Остальные части заявки — отдельными файлами</h2>
        <ul class="parts" id="parts-list">${partsRows(p)}</ul>
        <p class="small muted mt-3">Реквизиты берутся из <button class="link" type="button" data-go="profile">«Реквизитов»</button>, образцы — из <button class="link" type="button" data-go="docs">«Моих документов»</button>. Чего там нет — выделено в Word жёлтым.</p>
      </section>
      <div class="sticky-actions"><button class="btn" type="button" data-act="preview-tp">Скачать техническое предложение</button></div>`;
  }

  /* ---------- проверка заявки (экран из плана, в коде его ещё нет) ---------- */
  function checkHTML(p) {
    const head = back(p.short, "p");
    const soon = noteHTML("info", "Проверки заявки пока нет в приложении: экран показывает, как она будет работать.", "mt-4", "info");
    if (S.busy) return `${head}<h1>Проверим заявку перед подачей</h1>${busyHTML()}`;
    if (p.check.state !== "done") {
      return `${head}
        <h1>Проверим заявку перед подачей</h1>
        ${soon}
        <p class="lead">Загрузите свою заявку или техническое предложение. Я сверю их с ТЗ по каждому пункту и скажу, за что могут отклонить.</p>
        ${dropHTML("app", "Перетащите файл заявки сюда", "Загрузить заявку", { act: "sample-check", text: "проверить пример" })}`;
    }
    const { bad, warn } = checkCounts(p);
    const parts = [];
    if (bad) parts.push(`<span class="bad-t">${bad} ${plural(bad, "ошибку", "ошибки", "ошибок")}</span>`);
    if (warn) parts.push(`<span class="warn-t">${warn} ${plural(warn, "замечание", "замечания", "замечаний")}</span>`);
    const title = parts.length ? `Нашёл ${parts.join(" и ")}` : "Ошибок нет";
    const lead = bad ? "Исправьте ошибку до подачи — замечания тоже лучше поправить." : warn ? "Отклонять не за что, но замечания лучше поправить." : "Заявка соответствует ТЗ по всем пунктам.";
    const ok = p.check.ok;
    return `${head}
      <h1>${title}</h1>
      ${soon}
      <p class="lead">${lead}</p>
      <ul class="findings">${p.check.findings.map((f) => `<li class="finding ${f.kind}">
          <span class="ico" aria-hidden="true">${f.kind === "bad" ? "✕" : "!"}</span>
          <div style="display:grid;gap:4px"><p class="what">${esc(f.what)}</p><p class="todo">${esc(f.todo)}</p>${f.src && p.sources[f.src] ? refBtn({ doc: f.src }, p) : ""}</div>
        </li>`).join("")}
        <li class="finding ok"><span class="ico" aria-hidden="true">✓</span><div><p class="what">${p.check.findings.length ? "Остальные" : "Все"} ${ok} ${plural(ok, "пункт", "пункта", "пунктов")} — в порядке.</p></div></li>
      </ul>
      <p class="under"><span>Сомневаетесь? <button class="link" type="button" data-act="lawyer">Спросить юриста</button></span><button class="link" type="button" data-act="recheck">Проверить другой файл</button></p>`;
  }

  /* ---------- новая закупка ---------- */
  const NEW_STEPS = ["Читаю документы…", "Смотрю, кто может участвовать…", "Выписываю, что подать в заявке…", "Разбираю требования ТЗ…", "Проверяю сроки и суммы…", "Сверяю цитаты с документами…"];
  const ADDING_STEPS = ["Читаю новые документы…", "Перечитываю закупку целиком…", "Обновляю требования и сроки…", "Сверяю цитаты с документами…"];

  function newHTML() {
    return `<h1>Новая закупка</h1>
      ${S.busy ? busyHTML() : `
        <p class="lead">Загрузите извещение, ТЗ и проект контракта — выпишу требования и сроки, а потом помогу с техническим предложением.</p>
        ${dropHTML("new", "Перетащите сюда документы закупки — можно сразу несколько: PDF, Word, сканы и фото", "Загрузить документы", { act: "sample", text: "посмотреть на примере" })}`}`;
  }

  /* ---------- реквизиты ---------- */
  function groupSuggestions(items) {
    const groups = [];
    for (const item of items) {
      const bank = BANK_KEYS.includes(item.key);
      const group = bank ? groups.find((g) => BANK_KEYS.includes(g[0].key) && g[0].source === item.source && !g.some((i) => i.key === item.key)) : undefined;
      if (group) group.push(item); else groups.push([item]);
    }
    return groups;
  }

  function profileHTML() {
    const sourceDocs = S.docs.filter((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
    const groups = groupSuggestions(S.suggestions);
    return `<h1>Реквизиты</h1>
      <p class="lead">Впишите один раз — дальше они сами попадут в анкету, декларацию, предложение о цене и подпись. В техническое предложение реквизиты не попадают никогда: его подают анонимно.</p>
      ${sourceDocs.length
        ? `<button class="btn line sm mt-4" type="button" data-act="fill"${S.ui.filling ? " disabled" : ""}>${S.ui.filling ? "Ищу реквизиты в документах…" : "Заполнить из моих документов"}</button>`
        : '<p class="small muted mt-4">Можно не вписывать руками: загрузите анкету или карточку предприятия в <button class="link" type="button" data-go="docs">«Мои документы»</button> — реквизиты заполнятся сами.</p>'}
      ${S.ui.fillNote ? noteHTML(S.ui.fillNote.tone, esc(S.ui.fillNote.text), "mt-3", S.ui.fillNote.tone === "ok" ? "check" : "") : ""}
      ${groups.length ? `<section class="suggest" aria-labelledby="sug-title">
          <p class="suggest-head" id="sug-title">${ic("alert", 20)}В ваших документах есть другие значения — проверьте, какое верное</p>
          <ul>${groups.map((g, i) => `<li>
            <span>${g.length > 1 ? `<b>Банковские реквизиты:</b> ${esc(g.map((it) => it.value).join(", "))}` : `<b>${esc(LABELS[g[0].key])}:</b> ${esc(g[0].value)}`} <span class="muted">— из «${esc(g[0].source)}»</span></span>
            <span class="acts"><button class="link" type="button" data-act="sug-accept" data-i="${i}">${g.length > 1 ? "Подставить все" : "Подставить"}</button><button class="link quiet" type="button" data-act="sug-dismiss" data-i="${i}">Оставить как есть</button></span>
          </li>`).join("")}</ul>
        </section>` : ""}
      ${PROFILE_GROUPS.map((g) => `<section class="group"><h2 class="group-title">${g.title}</h2>
        <div class="fields">${g.fields.map((f) => `<div class="field">
          <label class="field-label" for="pf-${f.key}">${esc(f.label)}</label>
          <input class="input" id="pf-${f.key}" data-pf="${f.key}" value="${esc(S.profile[f.key])}" placeholder="${esc(f.example || "")}" autocomplete="off">
          ${S.sources[f.key] ? `<span class="field-src" data-src-of="${f.key}">из «${esc(S.sources[f.key])}»</span>` : ""}
        </div>`).join("")}</div>
      </section>`).join("")}
      <p class="save-state" id="save-state" aria-live="polite">${esc(S.ui.saved || "")}</p>`;
  }

  /* ---------- мои документы ---------- */
  function countLine(docs) {
    return DOC_KIND_KEYS.map((k) => [k, docs.filter((d) => d.kinds.includes(k)).length]).filter(([, n]) => n > 0).map(([k, n]) => `${DOC_KINDS[k].few} — ${n}`).join(", ");
  }
  function docRowHTML(d, kind) {
    const key = `${kind}:${d.id}`;
    const others = d.kinds.filter((k) => k !== kind);
    const meta = [
      `≈ ${d.pages} ${plural(d.pages, "страница", "страницы", "страниц")}`,
      `добавлен ${d.added}`,
      ...(d.scan ? ["распознан со скана — сверьте цифры"] : []),
      ...(others.length ? [`в файле также: ${others.map((k) => DOC_KINDS[k].few).join(", ")}`] : []),
    ].join(" · ");
    let acts;
    if (S.ui.editKind === key) {
      const draft = S.ui.kindDraft || d.kinds;
      acts = `<div class="kinds"><p>Что в этом файле? Можно выбрать несколько.</p>
        <div class="chips">${DOC_KIND_KEYS.map((k) => `<button class="kind-pill" type="button" data-act="kind-toggle" data-kind="${k}" aria-pressed="${draft.includes(k)}">${DOC_KINDS[k].group}</button>`).join("")}</div>
        <div class="btn-row"><button class="btn xs" type="button" data-act="kind-save" data-key="${key}">Готово</button><button class="btn xs soft" type="button" data-act="kind-cancel">Отмена</button></div></div>`;
    } else if (S.ui.confirmDoc === key) {
      acts = `<div class="doc-acts"><span>${others.length ? "Удалить файл целиком, из всех групп?" : "Удалить документ?"}</span><button class="btn xs danger" type="button" data-act="doc-del-yes" data-key="${key}">Удалить</button><button class="btn xs soft" type="button" data-act="doc-del-no">Отмена</button></div>`;
    } else {
      acts = `<div class="doc-acts"><button class="link" type="button" data-act="kind-edit" data-key="${key}">Изменить вид</button><button class="link quiet del" type="button" data-act="doc-del" data-key="${key}">Удалить</button></div>`;
    }
    return `<li>
      <div class="doc-main">${ic("file", 20)}<div class="doc-text">
        <span class="doc-name">${esc(d.name)}</span>
        ${d.about ? `<span class="doc-about">${esc(d.about)}</span>` : ""}
        <span class="doc-meta">${esc(meta)}</span>
      </div></div>
      ${acts}
    </li>`;
  }

  function docsHTML() {
    const groups = DOC_KIND_KEYS.map((k) => [k, S.docs.filter((d) => d.kinds.includes(k))]).filter(([, list]) => list.length);
    const rep = S.ui.report;
    const report = rep ? `<div class="mt-5" style="display:grid;gap:8px" aria-live="polite">
        ${noteHTML("ok", `Добавил ${rep.added.length} ${plural(rep.added.length, "документ", "документа", "документов")}: ${esc(countLine(rep.added))}.`, "", "check")}
        ${noteHTML("info", "Разложил по названиям файлов — прототип не читает их содержимое. Проверьте виды и поправьте, где нужно.", "", "info")}
        ${rep.requisites ? noteHTML("info", 'Реквизиты: в приложении они заполнятся из новых анкет и карточек сами. В прототипе файлы не читаются, поэтому <button class="link" type="button" data-go="profile">реквизиты</button> не изменились.', "", "info") : ""}
      </div>` : "";
    return `<h1>Мои документы</h1>
      <p class="lead">Загрузите всё, что подавали раньше: заявки целиком или по частям, анкеты, декларации, ценовые предложения, договоры и акты, протоколы. Приложение разложит их по видам — и новые документы будет писать так же, как ваши.</p>
      ${report}
      ${groups.map(([k, list]) => `<section class="group">
        <h2 class="group-title m0">${DOC_KINDS[k].group} — ${list.length}</h2>
        <p class="use">${DOC_KINDS[k].use}</p>
        <ul class="list docs-list">${list.map((d) => docRowHTML(d, k)).join("")}</ul>
      </section>`).join("")}
      ${S.busy ? busyHTML() : dropHTML("mydocs", "Перетащите сюда свои документы — PDF, Word, сканы и фото. Можно сразу все.", S.docs.length ? "Добавить документы" : "Загрузить документы")}`;
  }

  /* ---------- предпросмотр файлов Word ---------- */
  const docFields = (t) => esc(t).replace(/\[[^\]]+\]/g, (m) => `<mark>${m}</mark>`);
  const paras = (text, indent) => (text || "").split(/\n+/).filter((l) => l.trim()).map((l) => `<p${indent ? ' class="jst"' : ""}>${docFields(l.trim())}</p>`).join("");
  const signature = () => `<p class="sig">Участник закупки  ______________________ / ${esc(S.profile.signer.trim() || "______________________")} /</p>
    <p class="sub-sig">(подпись)  /  (расшифровка подписи)</p>
    <p>М.П. (при наличии)          «____» ________________ 20___ г.</p>`;

  function tpDoc(p) {
    const { form, goods, items } = p.tp;
    let h = `<h3>${esc(PART_TITLES.tp)}</h3>`;
    if (p.subject) h += `<p class="c">Предмет закупки: ${esc(p.subject)}</p>`;
    if (goods.length) {
      h += paras(form.consent, true);
      h += `<table><thead><tr><th style="width:7%">№ п/п</th><th style="width:25%">Наименование товара</th><th>Характеристики товара</th><th style="width:16%">Количество</th></tr></thead><tbody>${goods.map((g, i) => `<tr><td>${i + 1}</td><td>${esc(g.name)}</td><td>${paras(g.characteristics)}</td><td>${esc(g.quantity)}</td></tr>`).join("")}</tbody></table>`;
    }
    if (items.length) {
      h += `<table><thead><tr><th style="width:6%">№</th><th style="width:40%">Требование заказчика</th><th>Предложение участника закупки</th></tr></thead><tbody>${items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.requirement)}${it.clause ? ` (п. ${esc(it.clause)} ТЗ)` : ""}</td><td>${paras(it.offer)}</td></tr>`).join("")}</tbody></table>`;
    }
    return h;
  }
  function anketaDoc(p) {
    const extra = p.tp.form.participantFields.filter((f, i, all) => all.indexOf(f) === i && !COVERED.some((re) => re.test(f.trim())));
    const rows = [...ANKETA.map(([key, label]) => ({ label, value: S.profile[key].trim() })), ...extra.map((label) => ({ label, value: "" }))];
    return `<h3>${esc(PART_TITLES.participant)}</h3>
      <table><thead><tr><th style="width:6%">№</th><th style="width:44%">Наименование сведений</th><th>Сведения об участнике</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.label)}</td><td>${r.value ? esc(r.value) : "<mark>[заполните]</mark>"}</td></tr>`).join("")}</tbody></table>
      <p class="hint">Строки, которые к вам не относятся, удалите.</p>
      ${signature()}`;
  }
  const declDoc = (p) => `<h3>${esc(PART_TITLES.declaration)}</h3>${paras(fillFromProfile(p.tp.form.smeDeclaration), true)}${signature()}`;
  function priceDoc(p) {
    const price = p.tpPrice;
    const amount = price ? `${fmtRub(price)} руб. (${rublesInWords(price)})` : "[цена договора цифрами] руб. ([цена прописью])";
    const vat = S.profile.vatNote.trim() || "[в том числе НДС по ставке __% — сумма НДС, либо «НДС не облагается» с указанием основания]";
    return `<h3>${esc(PART_TITLES.price)}</h3><p class="c">Предмет закупки: ${esc(p.subject)}</p>${paras(`Предлагаемая цена договора составляет ${amount}, ${vat}.`, true)}${paras(p.tp.form.priceNote, true)}${signature()}`;
  }

  function openPreview(p, part) {
    const body = part === "tp" ? tpDoc(p) : part === "participant" ? anketaDoc(p) : part === "declaration" ? declDoc(p) : priceDoc(p);
    const basis = part === "tp" ? "" : p.sample ? "По стандартному шаблону: в документах примера нет формы заказчика." : `Составлено ${p.parts[part] ? p.parts[part].basis : basisText(p, part)}. Реквизиты — из «Реквизитов».`;
    openModal(`<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">Файл Word · предпросмотр</span>
      <h2 id="m-title">${esc(PART_TITLES[part])}.docx</h2>
      ${basis ? `<p class="small muted m0">${esc(basis)}</p>` : ""}
      <div class="sheet">${body}</div>
      <p class="small muted m0">В приложении этот файл скачивается на компьютер. Жёлтые поля остаются жёлтыми и в Word — сразу видно, что осталось вписать.</p>
    </div>`);
  }

  /* ---------- окна ---------- */
  let lastFocus = null;
  function openModal(html) {
    lastFocus = document.activeElement;
    const m = $("#modal");
    m.innerHTML = html;
    m.hidden = false;
    document.documentElement.style.overflow = "hidden";
    const close = m.querySelector(".x-close");
    if (close) close.focus();
  }
  function closeModal() {
    const m = $("#modal");
    if (m.hidden) return false;
    m.hidden = true;
    m.innerHTML = "";
    document.documentElement.style.overflow = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    return true;
  }
  function markIn(text, phrase) {
    const safe = esc(text);
    if (!phrase) return safe;
    const m = esc(phrase), i = safe.indexOf(m);
    return i < 0 ? safe : `${safe.slice(0, i)}<mark>${m}</mark>${safe.slice(i + m.length)}`;
  }
  function openRef(ref, hl) {
    const [type, a, b] = ref.split(":");
    if (type === "law") {
      const L = LAW[a];
      openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
        <span class="eyebrow">Закон · действующая редакция</span>
        <h2 id="m-title">${esc(`${L.law}, ст. ${L.art}, ${L.label}`)}</h2>
        <p class="small ink2 m0">Статья ${esc(L.art)}. ${esc(L.title)}</p>
        <div class="law-text">${markIn(L.text, hl)}</div>
        <p class="small muted m0">${esc(L.edition)}. Текст — с официального портала <a href="${esc(L.url)}" target="_blank" rel="noopener">pravo.gov.ru</a>. Многоточием отмечены пропущенные пункты.</p>
      </div>`);
      const box = $("#modal .law-text"), mark = box.querySelector("mark");
      if (mark) box.scrollTop = mark.offsetTop - box.offsetTop - 44;
      return;
    }
    const p = S.purchases.find((x) => x.id === a);
    const s = p && p.sources[b];
    if (!s) return;
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">Цитата из документа</span>
      <h2 id="m-title">${esc(s.label)}</h2>
      <blockquote class="law-text">${esc(s.quote)}</blockquote>
      <p class="small muted m0">Файл: ${esc(s.file)}</p>
    </div>`);
  }

  let toastTimer;
  function toast(text) {
    const t = $("#toast");
    t.textContent = text;
    t.dataset.show = "true";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.dataset.show = "false"; }, 4200);
  }

  /* ---------- отрисовка и навигация ---------- */
  function screenHTML() {
    const p = cur();
    switch (S.screen) {
      case "ask": return askHTML();
      case "new": return newHTML();
      case "profile": return profileHTML();
      case "docs": return docsHTML();
      case "p": return purchaseHTML(p);
      case "req": return reqHTML(p);
      case "tp": return tpHTML(p);
      case "check": return checkHTML(p);
      case "chat": return chatHTML(p);
      default: return homeHTML();
    }
  }
  function autosize(el) {
    const max = el.classList.contains("edit-area") ? 600 : el.closest(".prompt") ? 160 : 140;
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, max)}px`;
  }
  const renderSide = () => { $("#side-body").innerHTML = sideHTML(); };
  function render() {
    renderSide();
    $("#view").innerHTML = screenHTML();
    document.querySelectorAll("#view textarea").forEach(autosize);
  }
  // Перерисовка на месте: фокус остаётся на том же элементе.
  function focusKey(el) {
    if (!el || el === document.body) return null;
    const scope = el.closest("#view") ? "#view " : el.closest("#side") ? "#side " : "";
    if (el.id) return `#${CSS.escape(el.id)}`;
    const act = el.getAttribute("data-act");
    const goTo = el.getAttribute("data-go");
    if (!act && !goTo) return null;
    let sel = scope + (act ? `[data-act="${act}"]` : `[data-go="${goTo}"]`);
    for (const k of ["data-open", "data-q", "data-part", "data-edit", "data-key", "data-kind", "data-i", "data-id"]) {
      const v = el.getAttribute(k);
      if (v !== null) sel += `[${k}="${CSS.escape(v)}"]`;
    }
    return sel;
  }
  function rerender() {
    const key = focusKey(document.activeElement);
    render();
    const el = key && document.querySelector(key);
    if (el) el.focus({ preventScroll: true });
  }

  let busyToken = 0;
  function go(screen, id) {
    busyToken++;
    S.busy = null;
    S.screen = screen;
    if (id) S.id = id;
    if (PURCHASE_SCREENS.includes(screen) && !cur()) S.screen = "home";
    S.ui = {};
    S.visit++;
    S.drawer = false;
    render();
    applyDrawer();
    window.scrollTo(0, 0);
    const h = $("#view h1");
    if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  }

  // Шаги работы ИИ. Если за это время ушли на другой экран, результат не применяется.
  async function runSteps(lines, sub) {
    const token = ++busyToken;
    S.busy = { lines, sub: sub || "В приложении это занимает 1–2 минуты." };
    render();
    for (let i = 0; i < lines.length; i++) {
      if (token !== busyToken) return false;
      const text = $("#busy-text"), bar = $("#busy-bar");
      if (text) text.textContent = lines[i];
      if (bar) bar.style.width = `${Math.round(((i + 1) / lines.length) * 100)}%`;
      await wait(750);
    }
    if (token !== busyToken) return false;
    S.busy = null;
    return true;
  }

  /* ---------- боковое меню на телефоне ---------- */
  const narrow = window.matchMedia("(max-width: 1023px)");
  function applyDrawer() {
    const open = S.drawer && narrow.matches;
    $("#app").dataset.drawer = open ? "open" : "closed";
    $("#scrim").hidden = !open;
    $("#menu-btn").setAttribute("aria-expanded", String(open));
    $("#main").inert = open;
  }
  function setDrawer(open) {
    S.drawer = open;
    applyDrawer();
    if (open) { const first = $("#side .side-new"); if (first) first.focus(); }
    else if (narrow.matches) $("#menu-btn").focus();
  }
  narrow.addEventListener("change", () => { S.drawer = false; applyDrawer(); });

  /* ---------- вопросы ---------- */
  function answerFor(p, question) {
    const map = p ? p.answers : GENERAL_QA;
    const q = question.trim().toLowerCase();
    const key = Object.keys(map).find((k) => k.toLowerCase() === q);
    if (key) return clone(map[key]);
    return {
      text: `**Тестовый режим.** В прототипе ответы заготовлены только для вопросов-подсказок. В приложении с подключённой моделью я отвечу и на этот вопрос — по ${p ? "документам закупки и закону" : "44-ФЗ, 223-ФЗ и приложенным документам"}, со ссылкой на статью и пункт.\n\nВаш вопрос: «${question.trim()}»`,
      src: [],
    };
  }
  function showsThread(p) {
    return p ? S.screen === "chat" && cur() === p : S.screen === "ask";
  }
  function refreshFeed(p, toBottom) {
    if (!showsThread(p)) return;
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const feed = $("#feed");
    if (!feed) return;
    const near = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200;
    feed.innerHTML = feedInner(messages, holder.thinking, p);
    feed.hidden = !messages.length && !holder.thinking;
    const used = messages.filter((m) => m.role === "user").map((m) => m.text);
    $("#chips").innerHTML = chipsHTML(p ? CHAT_SUGGEST : GENERAL_SUGGEST, used);
    if (toBottom || near) window.scrollTo(0, document.documentElement.scrollHeight);
  }
  async function ask(p, question, files) {
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const last = messages[messages.length - 1];
    if (holder.thinking || (last && last.done === false)) { toast("Дождитесь ответа на предыдущий вопрос."); return; }
    messages.push({ role: "user", text: question.trim(), files: files || [] });
    holder.thinking = true;
    refreshFeed(p, true);
    renderSide();
    await wait(800);
    holder.thinking = false;
    const a = answerFor(p, question);
    const m = { role: "assistant", text: a.text, src: a.src || [], note: a.note || "", shown: "", done: false };
    messages.push(m);
    const tokens = a.text.match(/\*\*[^*]+\*\*[^\S\n]*|\S+[^\S\n]*|\n+/g) || [a.text];
    for (let k = 0; k < tokens.length; k++) {
      m.shown += tokens[k];
      if (k % 2 === 0) { refreshFeed(p); await wait(28); }
    }
    m.done = true;
    refreshFeed(p);
  }
  function homeAsk(text) {
    const q = text.trim();
    const files = S.home.files;
    if (!q && !files.length) { $("#home-q").focus(); return; }
    S.general.docs = [...new Set([...S.general.docs, ...files])];
    S.home = { text: "", files: [] };
    go("ask");
    if (q) ask(null, q, files);
    else toast("Документы в разговоре — задайте вопрос по ним.");
  }

  /* ---------- действия ---------- */
  async function createPurchase() {
    if (S.purchases.some((p) => p.id === TEMPLATE.id)) {
      go("p", TEMPLATE.id);
      toast("Пример новой закупки уже добавлен — открыл его.");
      return;
    }
    if (!(await runSteps(NEW_STEPS))) return;
    S.purchases.push(prepare(TEMPLATE, false));
    go("p", TEMPLATE.id);
    toast("Закупка добавлена. Прототип не читает файлы, поэтому показан пример «Концерт ко Дню матери».");
  }
  function openSample() {
    if (!S.purchases.some((p) => p.id === P1.id)) S.purchases.push(prepare(P1, true));
    go("p", P1.id);
  }
  async function addToPurchase(p, names) {
    if (!(await runSteps(ADDING_STEPS))) return;
    names.forEach((n) => { if (!p.files.includes(n)) p.files.push(n); });
    p.unreadable = p.unreadable.filter((f) => !names.includes(f.name));
    rerender();
    toast(`Добавлено: ${names.join(", ")}. В приложении требования и сроки перечитываются с учётом нового файла.`);
  }
  async function compose(p) {
    if (!p.sample && !(await runSteps(TP_STEPS))) return;
    S.busy = null;
    p.tp = clone(p.tpDraft);
    p.parts = {};
    S.ui = {};
    render();
    window.scrollTo(0, 0);
  }
  async function writePart(p, k) {
    const visit = S.visit;
    if (!p.sample) {
      S.ui.writing = k;
      $("#parts-list").innerHTML = partsRows(p);
      await wait(1600);
      if (S.visit !== visit) return;
      p.parts[k] = { key: basisKey(p, k), basis: basisText(p, k) };
      S.ui.writing = null;
      $("#parts-list").innerHTML = partsRows(p);
    }
    openPreview(p, k);
  }
  function onPartClick(p, k, redo) {
    const made = p.parts[k];
    if (!redo && (p.sample || (made && made.key === basisKey(p, k)))) { openPreview(p, k); return; }
    writePart(p, k);
  }
  async function runCheck(p) {
    if (!(await runSteps(["Читаю вашу заявку…", "Сверяю с ТЗ по каждому пункту…", "Смотрю, за что могут отклонить…"]))) return;
    p.check.state = "done";
    rerender();
    window.scrollTo(0, 0);
  }
  async function fillFromDocs() {
    const visit = S.visit;
    S.ui.filling = true;
    rerender();
    await wait(1200);
    const filled = FOUND.filter((f) => !S.profile[f.key].trim());
    filled.forEach((f) => { S.profile[f.key] = f.value; S.sources[f.key] = f.source; });
    if (S.visit !== visit) { renderSide(); return; }
    S.ui.filling = false;
    S.ui.fillNote = filled.length
      ? { tone: "ok", text: `Заполнил ${filled.length} ${plural(filled.length, "поле", "поля", "полей")} из ваших документов — под ними написано, откуда. Проверьте.` }
      : { tone: "info", text: "Нового в документах не нашлось: всё, что там есть, уже вписано." };
    rerender();
  }
  async function addMyDocs(files) {
    const added = files.map((f) => ({ id: uid(), name: f.name, kinds: guessKinds(f.name), about: "", pages: Math.max(1, Math.round(f.size / 60000)), added: "25.09.2026" }));
    const requisites = added.some((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
    const steps = ["Читаю файлы…", "Раскладываю по видам…", ...(requisites ? ["Заполняю реквизиты…"] : [])];
    if (!(await runSteps(steps, "Сканы и фото распознаются дольше — примерно минута на каждые 10 страниц."))) return;
    S.docs.unshift(...added);
    S.ui.report = { added, requisites };
    render();
    window.scrollTo(0, 0);
  }

  let saveTimer;
  function onProfileInput(input) {
    const key = input.dataset.pf;
    S.profile[key] = input.value;
    if (S.sources[key]) {
      delete S.sources[key];
      const src = $(`[data-src-of="${key}"]`);
      if (src) src.remove();
    }
    const state = $("#save-state");
    if (state) state.textContent = "Сохраняю…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      S.ui.saved = "Сохранено.";
      const st = $("#save-state");
      if (st && S.screen === "profile") st.textContent = S.ui.saved;
    }, 400);
    renderSide();
  }
  function onEditInput(area) {
    const p = cur();
    const [type, i] = area.dataset.edit.split(":");
    if (type === "good") p.tp.goods[Number(i)].characteristics = area.value;
    else p.tp.items[Number(i)].offer = area.value;
    const li = area.closest("li");
    const flag = li.querySelector("[data-flag]");
    if (needsFill(area.value)) { if (!flag) li.querySelector(".item-head").insertAdjacentHTML("beforeend", '<span class="flag" data-flag>впишите данные</span>'); }
    else if (flag) flag.remove();
    $("#tp-notes").innerHTML = tpNotes(p);
    renderSide();
  }
  function onPriceInput(input) {
    const p = cur();
    const value = Number(input.value.replace(/[\s ]/g, "").replace(",", "."));
    p.tpPriceText = input.value;
    p.tpPrice = Number.isFinite(value) && value > 0 ? value : null;
    $("#price-info").innerHTML = priceInfo(p);
    if (!S.ui.writing) $("#parts-list").innerHTML = partsRows(p);
  }

  function handleAct(act, el) {
    const p = cur();
    switch (act) {
      case "drawer": setDrawer(!S.drawer); break;
      case "drawer-close": setDrawer(false); break;
      case "close": closeModal(); break;
      case "sample": openSample(); break;
      case "home-q": homeAsk(el.dataset.q); break;
      case "home-file-x": S.home.text = $("#home-q").value; S.home.files.splice(Number(el.dataset.i), 1); rerender(); break;
      case "gdoc-x": {
        const [name] = S.general.docs.splice(Number(el.dataset.i), 1);
        S.general.pending = S.general.pending.filter((n) => n !== name);
        rerender();
        break;
      }
      case "q": {
        if (S.screen === "ask") { const pending = S.general.pending; S.general.pending = []; ask(null, el.dataset.q, pending); }
        else ask(p, el.dataset.q);
        break;
      }
      case "toggle": S.ui.open = S.ui.open === el.dataset.open ? null : el.dataset.open; rerender(); break;
      case "ref": openRef(el.dataset.ref, el.dataset.hl); break;
      case "lawyer": toast("В рабочей версии вопрос уйдёт юристу по закупкам, ответ — в течение дня. Сейчас ничего не отправляется."); break;
      case "ask-delete": S.ui.confirmDelete = true; rerender(); { const b = $('[data-act="cancel-delete"]'); if (b) b.focus(); } break;
      case "cancel-delete": S.ui.confirmDelete = false; rerender(); break;
      case "delete": S.purchases = S.purchases.filter((x) => x !== p); go("home"); toast("Закупка удалена."); break;
      case "compose": compose(p); break;
      case "ask-redo": S.ui.confirmRedo = true; rerender(); { const b = $('[data-act="redo"]'); if (b) b.focus(); } break;
      case "cancel-redo": S.ui.confirmRedo = false; rerender(); break;
      case "redo": compose(p); break;
      case "edit": {
        S.ui.editing = el.dataset.edit;
        const [type, i] = el.dataset.edit.split(":");
        const value = type === "good" ? p.tp.goods[Number(i)].characteristics : p.tp.items[Number(i)].offer;
        el.outerHTML = editHTML(el.dataset.edit, value, el.dataset.label);
        const area = $(`#edit-${el.dataset.edit.replace(":", "-")}`);
        if (area) { autosize(area); area.focus(); area.setSelectionRange(area.value.length, area.value.length); }
        break;
      }
      case "part": onPartClick(p, el.dataset.part, false); break;
      case "part-redo": onPartClick(p, el.dataset.part, true); break;
      case "preview-tp": openPreview(p, "tp"); break;
      case "sample-check": runCheck(p); break;
      case "recheck": p.check.state = "none"; rerender(); window.scrollTo(0, 0); break;
      case "fill": fillFromDocs(); break;
      case "sug-accept": case "sug-dismiss": {
        const group = groupSuggestions(S.suggestions)[Number(el.dataset.i)];
        if (!group) break;
        if (act === "sug-accept") group.forEach((it) => { S.profile[it.key] = it.value; S.sources[it.key] = it.source; });
        S.suggestions = S.suggestions.filter((s) => !group.includes(s));
        if (act === "sug-accept") S.ui.saved = "Сохранено.";
        rerender();
        break;
      }
      case "kind-edit": {
        const d = S.docs.find((x) => x.id === el.dataset.key.split(":")[1]);
        S.ui.editKind = el.dataset.key; S.ui.confirmDoc = null; S.ui.kindDraft = [...d.kinds];
        rerender();
        break;
      }
      case "kind-toggle": {
        const k = el.dataset.kind, draft = S.ui.kindDraft;
        S.ui.kindDraft = draft.includes(k) ? draft.filter((x) => x !== k) : [...draft, k];
        rerender();
        break;
      }
      case "kind-save": {
        const d = S.docs.find((x) => x.id === el.dataset.key.split(":")[1]);
        const kinds = DOC_KIND_KEYS.filter((k) => S.ui.kindDraft.includes(k));
        d.kinds = kinds.length ? kinds : ["other"];
        S.ui.editKind = null;
        render();
        break;
      }
      case "kind-cancel": S.ui.editKind = null; rerender(); break;
      case "doc-del": S.ui.confirmDoc = el.dataset.key; S.ui.editKind = null; rerender(); break;
      case "doc-del-no": S.ui.confirmDoc = null; rerender(); break;
      case "doc-del-yes": {
        const id = el.dataset.key.split(":")[1];
        S.docs = S.docs.filter((d) => d.id !== id);
        S.ui.confirmDoc = null;
        render();
        toast("Документ удалён.");
        break;
      }
    }
  }

  /* ---------- события ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.id === "modal") { closeModal(); return; }
    if (t.id === "scrim") { setDrawer(false); return; }
    const nav = t.closest("[data-go]");
    if (nav) { go(nav.dataset.go, nav.dataset.id); return; }
    const act = t.closest("[data-act]");
    if (act && !act.disabled) handleAct(act.dataset.act, act);
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "home-form") { homeAsk($("#home-q").value); return; }
    const area = f.querySelector("textarea");
    const q = area ? area.value.trim() : "";
    if (!q) { if (area) area.focus(); return; }
    if (f.id === "ask-form") {
      const pending = S.general.pending;
      S.general.pending = [];
      S.drafts.ask = "";
      area.value = "";
      autosize(area);
      ask(null, q, pending);
    } else if (f.id === "chat-form") {
      S.drafts.chat = "";
      area.value = "";
      autosize(area);
      ask(cur(), q);
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.tagName === "TEXTAREA") autosize(t);
    if (t.id === "home-q") S.home.text = t.value;
    else if (t.id === "ask-q") S.drafts.ask = t.value;
    else if (t.id === "chat-q") S.drafts.chat = t.value;
    else if (t.dataset.edit) onEditInput(t);
    else if (t.id === "tp-price") onPriceInput(t);
    else if (t.dataset.pf) onProfileInput(t);
  });

  // Правка закончилась — поле снова становится текстом. Заменяем только его, чтобы не сорвать нажатие рядом.
  document.addEventListener("focusout", (e) => {
    const area = e.target;
    if (!area.classList || !area.classList.contains("edit-area")) return;
    const p = cur();
    if (!p || !p.tp) return;
    S.ui.editing = null;
    const [type, i] = area.dataset.edit.split(":");
    const value = type === "good" ? p.tp.goods[Number(i)].characteristics : p.tp.items[Number(i)].offer;
    area.outerHTML = editHTML(area.dataset.edit, value, area.dataset.label);
  });

  document.addEventListener("change", (e) => {
    const input = e.target;
    if (input.type !== "file") return;
    const files = [...input.files];
    input.value = "";
    if (!files.length) return;
    const names = files.map((f) => f.name);
    if (input.id === "home-file") { S.home.text = $("#home-q").value; S.home.files = [...new Set([...S.home.files, ...names])]; rerender(); }
    else if (input.id === "g-file") { S.general.docs = [...new Set([...S.general.docs, ...names])]; S.general.pending = [...new Set([...S.general.pending, ...names])]; rerender(); }
    else if (input.id === "file-new") createPurchase();
    else if (input.id === "add-doc") addToPurchase(cur(), names);
    else if (input.id === "file-app") runCheck(cur());
    else if (input.id === "file-mydocs") addMyDocs(files);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (closeModal()) return;
      if (S.drawer && narrow.matches) { setDrawer(false); return; }
      if (e.target.classList && e.target.classList.contains("edit-area")) e.target.blur();
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.matches && e.target.matches("textarea[data-enter]")) {
      e.preventDefault();
      e.target.form.requestSubmit();
      return;
    }
    // Фокус не уходит из открытого окна.
    if (e.key === "Tab" && !$("#modal").hidden) {
      const items = [...$("#modal").querySelectorAll("button, a[href], [tabindex]:not([tabindex='-1'])")];
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  document.addEventListener("dragover", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone) zone.classList.add("over");
  });
  document.addEventListener("dragleave", (e) => {
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over");
  });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (!zone) return;
    zone.classList.remove("over");
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    if (!files.length) return;
    const kind = zone.dataset.drop;
    if (kind === "new") createPurchase();
    else if (kind === "app") runCheck(cur());
    else if (kind === "mydocs") addMyDocs(files);
  });

  $("#logo-mark").innerHTML = ic("scale", 16);
  $("#logo-mark-2").innerHTML = ic("scale", 16);
  $("#side-close").innerHTML = ic("x", 20);
  $("#menu-btn").innerHTML = ic("menu", 22);
  render();
  applyDrawer();
})();
</script>
