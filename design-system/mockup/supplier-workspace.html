<title>Рабочее место поставщика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap">
<style>
  /* Токены — design-system/brand.css («Индиго + мягкая») */
  :root {
    --ground: #eeeef6; --ground-2: #e4e4f0; --ink: #14142b; --ink-2: #474763; --ink-3: #666680; --rule: #dcdcea;
    --paper: #ffffff; --paper-2: #f6f6fb; --paper-3: #ecebf6; --edge: #e3e2f0; --edge-2: #d0cfe4;
    --brand: #312e81; --brand-press: #26246a; --brand-tint: #e2e1f3; --on-brand: #ffffff;
    --ok: #087a54; --ok-tint: #d8f5e9;
    --warn: #9a590b; --warn-tint: #fbeeda;
    --danger: #cf2f24;
    --danger-tint: color-mix(in srgb, var(--danger) 12%, var(--paper));
    --scrim: rgb(20 20 43 / .42);
    --r-surface: 24px; --r-card: 18px; --r-bubble: 22px; --r-ctl: 14px; --r-pill: 999px;
    --lift: 0 2px 6px rgb(20 20 43 / .05), 0 18px 40px -20px rgb(20 20 43 / .25);
    --lift-lg: 0 3px 8px rgb(20 20 43 / .05), 0 48px 84px -36px rgb(20 20 43 / .38);
    --display: "Montserrat", ui-sans-serif, system-ui, sans-serif;
    --ui: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    /* Предпросмотр файла Word: белый лист и Times-совместимый шрифт в обеих темах, как настоящий документ */
    --doc: "Tinos", "Times New Roman", Times, serif;
    --sheet: #ffffff; --sheet-ink: #111111; --sheet-mark: #ffff00;
    /* Рабочее место: рамка с сайдбаром, холст за панелями, панели с тонкой рамкой */
    --frame: #ffffff; --canvas: #f6f6fb; --card: #ffffff; --line: #e5e4ef; --hover: #f3f3f9; --select: #ecebf8;
    --side-w: 256px; --list-w: 320px; --info-w: 300px;

    /* Шкала шрифтов: пять кеглей 12 · 14 · 16 · 20 · 28, интерлиньяж кратен 4 —
       по образцу Material 3 и Carbon. Иерархию ведут кегль, насыщенность и цвет вместе. */
    --t-page: 700 28px/36px var(--display);   /* заголовок экрана */
    --t-title: 600 20px/28px var(--display);  /* открытая закупка, заголовок разговора и окна */
    --t-section: 600 16px/24px var(--ui);     /* заголовки панелей, разделов, пунктов ТП */
    --t-doc: 400 16px/24px var(--ui);         /* текст документа и поля ввода */
    --t-body: 400 14px/20px var(--ui);        /* основной текст интерфейса */
    --t-read: 400 14px/24px var(--ui);        /* длинное чтение: статьи закона, цитаты */
    --t-strong: 600 14px/20px var(--ui);      /* названия в списках, важное в тексте */
    --t-label: 500 14px/20px var(--ui);       /* пункты меню, вкладки, подсказки-вопросы */
    --t-caption: 400 12px/16px var(--ui);     /* подписи: заказчик, даты, пометки файлов */
    --t-over: 600 12px/16px var(--ui);        /* надписи разделов капсом, метки */
    --t-num: 500 12px/16px var(--mono);       /* счётчики и сроки: цифры одной ширины */
    /* Поля: 24 — у экрана и открытой закупки, 20 — внутри панелей. Шаг отступов — 4. */
    --gutter: 24px; --pad: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0b0b16; --ground-2: #111124; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #9292ad; --rule: #22223c;
      --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge: #262645; --edge-2: #333359;
      --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
      --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
      --scrim: rgb(0 0 0 / .6);
      --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
      --lift-lg: 0 3px 8px rgb(0 0 0 / .45), 0 48px 84px -36px rgb(0 0 0 / .9);
      --frame: #131324; --canvas: #0c0c18; --card: #131324; --line: #25253f; --hover: #1a1a30; --select: #22224a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b0b16; --ground-2: #111124; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #9292ad; --rule: #22223c;
    --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge: #262645; --edge-2: #333359;
    --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
    --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
    --scrim: rgb(0 0 0 / .6);
    --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
    --lift-lg: 0 3px 8px rgb(0 0 0 / .45), 0 48px 84px -36px rgb(0 0 0 / .9);
    --frame: #131324; --canvas: #0c0c18; --card: #131324; --line: #25253f; --hover: #1a1a30; --select: #22224a;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: var(--t-body); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button, label[for] { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .m0 { margin: 0; }
  .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-5 { margin-top: 20px; }
  .mt-6 { margin-top: 24px; } .mt-7 { margin-top: 28px; } .mt-8 { margin-top: 32px; } .mt-10 { margin-top: 40px; }
  .small { font: var(--t-body); }
  .muted { color: var(--ink-3); }
  .ink2 { color: var(--ink-2); }
  .warn-t { color: var(--warn); font-weight: 600; }
  .ok-t { color: var(--ok); font-weight: 600; }
  .bad-t { color: var(--danger); font-weight: 600; }

  /* ---------- рамка: сайдбар и основная часть ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; background: var(--frame); }
  @media (min-width: 1280px) {
    body { padding: 12px; }
    .app { border: 1px solid var(--line); border-radius: var(--r-surface); overflow: hidden; box-shadow: var(--lift); }
  }

  .side { display: flex; flex-direction: column; min-height: 0; background: var(--frame); border-right: 1px solid var(--line); }
  .side-head { display: flex; align-items: center; gap: 8px; min-height: 80px; padding: 16px 12px 16px var(--pad); }
  .logo {
    appearance: none; border: 0; background: none; padding: 0;
    display: inline-flex; align-items: center; gap: 12px; min-width: 0; text-align: left;
    font: 700 16px/20px var(--display); letter-spacing: -.01em; color: var(--ink);
  }
  .logo-mark { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); }
  .logo-text { display: grid; gap: 2px; }
  .proto { font: var(--t-caption); letter-spacing: 0; color: var(--ink-3); }
  .icon-btn.side-close { display: none; margin-left: auto; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 24px; padding: 8px 12px 16px; }
  .nav { display: grid; gap: 4px; }
  .nav-item {
    appearance: none; border: 0; background: none; width: 100%;
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 12px;
    border-radius: var(--r-ctl); text-align: left; font: var(--t-label); color: var(--ink-2);
  }
  .nav-item > svg { flex: none; color: var(--ink-3); }
  .nav-item:hover { background: var(--hover); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
  .nav-item[aria-current="page"] > svg, .nav-item[aria-current="page"] .count { color: color-mix(in srgb, var(--on-brand) 78%, transparent); }
  .count { margin-left: auto; font: var(--t-num); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sec-label { margin: 0 12px 8px; font: var(--t-over); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .side-foot { display: grid; gap: 4px; padding: 12px; border-top: 1px solid var(--line); }
  .switch { position: relative; flex: none; width: 36px; height: 20px; margin-left: auto; border-radius: var(--r-pill); background: var(--edge-2); transition: background .15s ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s ease; }
  [aria-checked="true"] > .switch { background: var(--brand); }
  [aria-checked="true"] > .switch::after { transform: translateX(16px); background: var(--on-brand); }
  .me {
    appearance: none; border: 0; background: none; width: 100%;
    display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 8px; border-radius: var(--r-ctl); color: var(--ink); text-align: left;
  }
  .me:hover { background: var(--hover); }
  .me > svg { color: var(--ink-3); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); font: 700 12px/16px var(--ui); }
  .me-text { display: grid; min-width: 0; }
  .me-name, .me-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-name { font: var(--t-strong); }
  .me-sub { font: var(--t-caption); color: var(--ink-3); }

  .scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
  .head { flex: none; display: flex; align-items: center; gap: 12px 16px; min-height: 80px; padding: 16px var(--gutter); }
  .icon-btn.menu-btn { display: none; }
  .head-text { flex: 1; min-width: 0; }
  .head h1 { margin: 0; font: var(--t-page); letter-spacing: -.02em; }
  .head h1:focus { outline: none; }
  .head-sub { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--t-body); color: var(--ink-3); }
  .head-acts { flex: none; display: flex; align-items: center; gap: 12px; }
  .view { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--gutter) var(--gutter); }
  .view.fill { display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- кнопки, ссылки, поля ---------- */
  .btn {
    appearance: none; border: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 40px; padding-inline: 16px; border-radius: var(--r-ctl);
    background: var(--brand); color: var(--on-brand); font: 600 14px/20px var(--ui); text-align: center; white-space: nowrap;
  }
  .btn > svg { flex: none; }
  .btn:hover { background: var(--brand-press); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.line { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.line:hover { background: var(--hover); }
  .btn.soft { background: var(--paper-2); color: var(--ink); }
  .btn.soft:hover { background: var(--paper-3); }
  .btn.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .btn.danger:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); }
  .btn.lg { min-height: 48px; padding-inline: 24px; font: 600 16px/24px var(--ui); }
  .btn.xs { min-height: 32px; padding-inline: 12px; border-radius: 10px; }
  .icon-btn { appearance: none; border: 0; background: none; flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--ink-2); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.line { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .btn:has(input:focus-visible), .link:has(input:focus-visible), .circle:has(input:focus-visible),
  .tool-btn:has(input:focus-visible), .icon-btn:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 3px; }
  .link {
    appearance: none; border: 0; background: none; padding: 0; text-align: left;
    color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .link.quiet { color: var(--ink-3); font-weight: 500; text-decoration-color: color-mix(in srgb, var(--ink-3) 45%, transparent); }
  .link.quiet:hover { color: var(--ink); }
  .link.del:hover { color: var(--danger); }
  .src {
    appearance: none; border: 0; background: none; padding: 0; justify-self: start; text-align: left;
    color: var(--brand); font: 500 12px/16px var(--ui);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .input { width: 100%; height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: var(--card); font: var(--t-doc); }
  .input:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .input.num { max-width: 240px; font: 400 16px/24px var(--mono); font-variant-numeric: tabular-nums; }
  textarea::placeholder, input::placeholder { color: var(--ink-3); }

  .note { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: var(--r-ctl); font: var(--t-body); }
  .note > svg { flex: none; margin-top: 1px; }
  .note.warn { background: var(--warn-tint); color: var(--warn); font-weight: 600; }
  .note.ok { background: var(--ok-tint); color: var(--ok); font-weight: 600; }
  .note.info { background: var(--paper-2); color: var(--ink-2); }
  .note .link { color: inherit; }
  .notes { display: grid; gap: 8px; margin-bottom: 24px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 0; padding: 8px 16px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font: var(--t-label); text-align: left; }
  .chip:hover { background: var(--paper-3); }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; padding-inline: 12px 4px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font: 500 12px/16px var(--ui); }
  .file-chip > svg { flex: none; color: var(--ink-3); }
  .file-chip .fc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .x { appearance: none; border: 0; background: none; flex: none; width: 24px; height: 24px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .file-chip .x:hover { background: var(--paper-3); color: var(--ink); }
  .file-chip.plain { padding-inline: 12px; }
  .circle { appearance: none; border: 0; background: none; flex: none; width: 36px; height: 36px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .circle:hover { background: var(--hover); color: var(--ink); }
  .circle.send { background: var(--brand); color: var(--on-brand); }
  .circle.send:hover { background: var(--brand-press); }
  .tag { padding: 4px 12px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink-2); font: 600 12px/16px var(--ui); white-space: nowrap; }
  .tag.warn { background: var(--warn-tint); color: var(--warn); }
  .tag.ok { background: var(--ok-tint); color: var(--ok); }
  .soon-tag { padding: 2px 8px; border-radius: var(--r-pill); background: var(--paper-3); color: var(--ink-3); font: 600 12px/16px var(--ui); letter-spacing: 0; text-transform: none; }
  .bubble { min-width: 20px; height: 20px; padding-inline: 6px; border-radius: var(--r-pill); display: inline-grid; place-items: center; background: var(--warn-tint); color: var(--warn); font: 600 12px/1 var(--mono); }
  .bubble.ok { padding-inline: 0; width: 20px; background: var(--ok-tint); color: var(--ok); }
  .sample { font: 600 12px/16px var(--ui); color: var(--ink-3); }

  /* ---------- панели ---------- */
  .panel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; min-height: 64px; padding: 16px var(--pad); border-bottom: 1px solid var(--line); }
  .panel-title { margin: 0; font: var(--t-section); }
  .panel-sub { margin: 0; font: var(--t-caption); color: var(--ink-3); }
  .panel-body { display: grid; gap: 16px; padding: var(--pad); }
  .page-col { display: grid; gap: 16px; max-width: 880px; }
  .intro { margin: 0; max-width: 70ch; font: var(--t-body); color: var(--ink-2); }
  .foot { margin: 16px 0 0; max-width: 90ch; font: var(--t-caption); color: var(--ink-3); }

  /* Строки списков: значок закона, название, строка под ним, справа — срок и отметки */
  .plist { list-style: none; margin: 0; padding: 0; }
  .plist > li + li { border-top: 1px solid var(--line); }
  .prow {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; color: var(--ink);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 12px var(--pad);
  }
  .prow:hover { background: var(--hover); }
  .prow[aria-current] { background: var(--select); }
  .prow-text { display: grid; gap: 4px; min-width: 0; }
  .prow-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--t-caption); color: var(--ink-3); }
  .prow-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: var(--t-strong); }
  .prow-side { display: grid; justify-items: end; gap: 4px; }
  .prow > .chev { color: var(--ink-3); }
  .days { font: var(--t-num); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .days.soon { color: var(--warn); font-weight: 600; }
  .law { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); font: 700 12px/16px var(--mono); letter-spacing: -.03em; }
  .law.l223 { background: var(--paper-3); color: var(--ink-2); }
  .law.icon { background: var(--paper-2); color: var(--ink-2); }
  .law.big { width: 64px; height: 64px; border-radius: var(--r-card); font: 700 20px/28px var(--mono); }
  .meter { height: 4px; margin-top: 4px; overflow: hidden; border-radius: var(--r-pill); background: var(--paper-3); }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
  .list-empty { margin: 0; padding: var(--pad); font: var(--t-body); color: var(--ink-3); }

  /* ---------- главная ---------- */
  .dash { display: grid; gap: 16px; align-items: start; max-width: 1240px; }
  @media (min-width: 1180px) { .dash { grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); } }
  .dash-side { display: grid; gap: 16px; min-width: 0; }
  .ask-lead { margin: 0; font: var(--t-body); color: var(--ink-2); }
  .askbox { display: flex; align-items: flex-end; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card); }
  .askbox:focus-within { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .askbox textarea { flex: 1; min-width: 0; min-height: 36px; max-height: 140px; padding-block: 6px; border: 0; outline: none; resize: none; background: transparent; font: var(--t-doc); }
  .empty { display: grid; justify-items: start; gap: 16px; padding: var(--pad); }
  .empty p { margin: 0; max-width: 52ch; font: var(--t-body); color: var(--ink-2); }
  .or { font: var(--t-body); color: var(--ink-3); }

  /* ---------- закупки: список, закупка, сведения ---------- */
  .ws {
    position: relative; flex: 1; min-height: 0;
    display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr) var(--info-w);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden;
  }
  .ws[data-sel="0"] { grid-template-columns: var(--list-w) minmax(0, 1fr); }
  .ws.solo { display: flex; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ws.solo > .pane { flex: 1; }

  function dueLine(dl, withTime) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dl.date || "");

    const [y, mo, d] = [Number(m[1]), Number(m[2]), Number(m[3])];

    sources: { "tz-2": D("ТЗ, п. 2", "Техническое задание.docx", "2. Концертная программа продолжительностью не менее 90 минут, не менее 6 номеров.") },
    answers: {},
    chat: [],
    check: { state: "none", ok: 3, findings: [{ kind: "warn", what: "Номера программы не перечислены, а по ТЗ их должно быть не меньше шести.", todo: "Перечислите номера концерта.", src: "tz-2" }] },
  };

  // Готовит закупку к работе: черновик ТП, ответы в истории вопросов.
  function prepare(raw, composed) {
    const p = clone(raw);
    p.tp = composed ? clone(p.tpDraft) : null;
    p.tpPrice = null; p.tpPriceText = ""; p.parts = {}; p.thinking = false;
    const qs = [];
    p.chat = p.chat.map((m) => {
      if (m !== "answer") { qs.push(m.text); return m; }
      return { role: "assistant", ...clone(p.answers[qs[qs.length - 1]]) };
    });
    return p;
  }

  /* ---------- состояние ---------- */
  const S = {
    screen: "home", id: null, drawer: false, visit: 0,
    purchases: [prepare(P1, true), prepare(P2, false), prepare(P3, true)],
    profile: clone(PROFILE0), sources: clone(SOURCES0), suggestions: clone(SUGGEST0),
    docs: clone(DOCS0),
    general: { messages: [], docs: [], pending: [], thinking: false },
    home: { text: "", files: [] },
    drafts: {},
    ui: {},
    busy: null,
    info: false, fold: {}, q: "", tabs: {},
  };
  const PURCHASE_SCREENS = ["req", "tp", "check", "chat"];
  const WORK = ["list", ...PURCHASE_SCREENS];
  const narrow = window.matchMedia("(max-width: 1023px)"); // сайдбар выезжает по кнопке
  const single = window.matchMedia("(max-width: 1179px)"); // закупки — по одной панели
  const wide = window.matchMedia("(min-width: 1560px)"); // сведения о закупке видны всегда
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : darkQuery.matches; };
  const cur = () => S.purchases.find((p) => p.id === S.id);
  let seq = 100;
  const uid = () => `x${++seq}`;

  const reqCount = (p) => REQ_KEYS.reduce((n, k) => n + p.requirements[k].length, 0);
  const needsFill = (t) => /\[[^\]]+\]/.test(t || "");
  const fillCount = (tp) => tp.goods.filter((g) => needsFill(g.characteristics)).length + tp.items.filter((it) => needsFill(it.offer)).length + (needsFill(tp.form.consent) ? 1 : 0);
  const fields = (t) => esc(t).replace(/\[[^\]]+\]/g, (m) => `<mark class="fill">${m}</mark>`);
  const filledCount = () => PROFILE_KEYS.filter((k) => S.profile[k].trim()).length;
  const samplesOf = (kind) => S.docs.filter((d) => d.kinds.includes(kind));
  const asked = (p) => p.chat.filter((m) => m.role === "user").length;

  // То, по чему комиссия узнает участника. Если что-то из этого есть в ТП, заявку отклонят.
  function leaksOf(tp) {
    const pr = S.profile;
    const text = [tp.form.consent, ...tp.goods.flatMap((g) => [g.name, g.characteristics]), ...tp.items.map((it) => it.offer)].join(" ");
    const surname = pr.signer.trim().split(/\s+/)[0] || "";
    return [pr.fullName, pr.shortName, pr.inn, pr.ogrn, pr.kpp, pr.phone, pr.email, pr.account, surname]
      .map((v) => v.trim()).filter((v) => v.length >= 4 && text.includes(v));
  }
  function fillFromProfile(text) {
    return text.replace(/\[([^\]]+)\]/g, (field, hint) => {
      const rule = FIELD_RULES.find(([re]) => re.test(hint));
      return (rule && S.profile[rule[1]].trim()) || field;
    });
  }

  /* ---------- кусочки разметки ---------- */
  const noteHTML = (tone, text, cls = "", icon = "") => `<div class="note ${tone} ${cls}">${icon ? ic(icon, 18) : ""}<div>${text}</div></div>`;
  const busyHTML = () => `<div class="busy" aria-live="polite"><p class="busy-text" id="busy-text">${esc(S.busy.lines[0])}</p><p class="busy-sub">${esc(S.busy.sub)}</p><div class="track"><i id="busy-bar"></i></div></div>`;
  const dropHTML = (id, hint, button, sample) => `<div class="drop" data-drop="${id}">
      <span class="drop-ic">${ic("upload", 26)}</span>
      <p>${hint}</p>
      <label class="btn lg" for="file-${id}">${button}<input id="file-${id}" type="file" multiple class="sr-only"></label>
      ${sample ? `<span class="or">или <button class="link" type="button" data-act="${sample.act}">${sample.text}</button></span>` : ""}
    </div>`;

  function md(text) {
    const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return text.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n").filter((l) => l.trim());
      if (!lines.length) return "";
      const head = lines[0].startsWith("- ") ? "" : lines.shift();
      const list = lines.filter((l) => l.startsWith("- "));
      const rest = lines.filter((l) => !l.startsWith("- "));
      return (head ? `<p>${inline(head)}</p>` : "") + (list.length ? `<ul>${list.map((l) => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>` : "") + (rest.length ? `<p>${rest.map(inline).join("<br>")}</p>` : "");
    }).join("");
  }

  function refBtn(r, p) {
    if (r.law) {
      const L = LAW[r.law];
      return `<button class="src" type="button" data-act="ref" data-ref="law:${r.law}"${r.hl ? ` data-hl="${esc(r.hl)}"` : ""}>${esc(`${L.law}, ст. ${L.art}, ${L.label}`)}</button>`;
    }
    return `<button class="src" type="button" data-act="ref" data-ref="doc:${p.id}:${r.doc}">${esc(p.sources[r.doc].label)}</button>`;
  }

  // Значок закупки — номер закона: 44-ФЗ и 223-ФЗ поставщик различает с первого взгляда.
  const lawOf = (p) => (/^(44|223)-ФЗ/.exec(p.kind || "") || [])[1] || "";
  const lawBadge = (p, big) => {
    const n = lawOf(p);
    return `<span class="law${n === "223" ? " l223" : ""}${big ? " big" : ""}" title="${n ? `${n}-ФЗ` : "Закон не указан"}" aria-hidden="true">${n || "—"}</span>`;
  };
  const daysText = (n) => `${n} ${plural(n, "день", "дня", "дней")}`;
  function initials(name) {
    const inner = (/«([^»]+)»/.exec(name) || [])[1] || name;
    return (inner.split(/[\s-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "?").toUpperCase();
  }
  // Отметка у закупки: сколько полей осталось вписать в ТП или что ТП готово.
  function tpMark(p) {
    if (!p.tp) return "";
    const fill = fillCount(p.tp);
    if (fill) return `<span class="bubble" title="В ТП впишите ${fill} ${plural(fill, "пункт", "пункта", "пунктов")}">${fill}<span class="sr-only"> — впишите данные в ТП</span></span>`;
    return `<span class="bubble ok" title="ТП готово">${ic("check", 12)}<span class="sr-only">ТП готово</span></span>`;
  }
  function dueText(p) {
    const due = dueLine(p.deadline, false);
    if (!due) return "Срок подачи не найден в документах";
    const soon = due.tone === "soon" ? ' class="warn-t"' : "";
    if (!due.left) return `<span${soon}>${esc(due.head)}</span>`;
    return `${esc(due.head)} · <span${soon}>${esc(due.left)}</span>`;
  }
  function tpTag(p) {
    if (!p.tp) return '<span class="tag">ТП не составлено</span>';
    const fill = fillCount(p.tp);
    if (!fill) return '<span class="tag ok">ТП готово</span>';
    return `<span class="tag warn">ТП: впишите ${fill} ${plural(fill, "пункт", "пункта", "пунктов")}</span>`;
  }
  const nextDue = () => [...S.purchases].sort(byUrgency).map((p) => ({ p, d: dueLine(p.deadline, false) })).find((x) => x.d && x.d.days >= 0);

  /* ---------- сайдбар: только разделы ---------- */
  function sideHTML() {
    const nav = (screen, icon, label, count, current) => `<button class="nav-item" type="button" data-go="${screen}"${current ? ' aria-current="page"' : ""}>${ic(icon)}<span>${label}</span>${count !== undefined ? `<span class="count">${count}</span>` : ""}</button>`;
    const pr = S.profile;
    const name = pr.shortName.trim() || pr.fullName.trim() || "Участник закупок";
    const sub = pr.email.trim() || (pr.inn.trim() ? `ИНН ${pr.inn.trim()}` : "реквизиты не заполнены");
    return `
      <div class="side-head">
        <button class="logo" type="button" data-go="home" aria-label="Тендерный юрист — на главную"><span class="logo-mark">${ic("scale", 16)}</span><span class="logo-text">Тендерный юрист<span class="proto">прототип</span></span></button>
        <button class="icon-btn side-close" type="button" data-act="drawer-close" aria-label="Закрыть меню">${ic("x", 20)}</button>
      </div>
      <div class="side-body">
        <nav class="nav" aria-label="Разделы">
          ${nav("home", "home", "Главная", undefined, S.screen === "home")}
          ${nav("list", "list", "Закупки", S.purchases.length, WORK.includes(S.screen))}
          ${nav("ask", "chat", "Спросить про тендер", undefined, S.screen === "ask")}
        </nav>
        <section aria-labelledby="side-me">
          <h2 class="sec-label" id="side-me">Мои данные</h2>
          <div class="nav">
            ${nav("profile", "user", "Реквизиты", `${filledCount()}/${PROFILE_KEYS.length}`, S.screen === "profile")}
            ${nav("docs", "folder", "Мои документы", S.docs.length, S.screen === "docs")}
          </div>
        </section>
      </div>
      <div class="side-foot">
        <button class="nav-item" type="button" role="switch" aria-checked="${isDark()}" data-act="theme">${ic("moon")}<span>Тёмная тема</span><span class="switch" aria-hidden="true"></span></button>
        <button class="me" type="button" data-go="profile" aria-label="Реквизиты: ${esc(name)}">
          <span class="avatar" aria-hidden="true">${esc(initials(name))}</span>
          <span class="me-text"><span class="me-name">${esc(name)}</span><span class="me-sub">${esc(sub)}</span></span>
          ${ic("chev", 16)}
        </button>
      </div>`;
  }

  /* ---------- шапка экрана: заголовок, подзаголовок, главное действие ---------- */
  const newBtn = () => `<button class="btn" type="button" data-go="new" aria-label="Новая закупка">${ic("plus")}<span class="lbl">Новая закупка</span></button>`;
  function headInfo() {
    const n = S.purchases.length;
    const next = nextDue();
    const when = next ? (next.d.days === 0 ? "сегодня" : `через ${daysText(next.d.days)}`) : "";
    switch (S.screen) {
      case "home":
        return { title: "Главная", sub: next ? `Ближайший срок — «${next.p.short}», ${when}` : n ? "Сроков подачи впереди нет" : "Загрузите документы первой закупки", acts: newBtn() };
      case "ask":
        return { title: "Спросить про тендер", sub: "Ответы по 44-ФЗ и 223-ФЗ в действующей редакции — со ссылкой на статью" };
      case "new":
        return { title: "Новая закупка", sub: "Извещение, ТЗ и проект контракта — PDF, Word, сканы и фото" };
      case "profile": {
        const canFill = S.docs.some((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
        return {
          title: "Реквизиты",
          sub: `Заполнено ${filledCount()} из ${PROFILE_KEYS.length} · попадают в анкету, декларацию и цену`,
          acts: `<span class="save-state" id="save-state" aria-live="polite">${esc(S.ui.saved || "")}</span>${canFill ? `<button class="btn line" type="button" data-act="fill" aria-label="Заполнить из моих документов"${S.ui.filling ? " disabled" : ""}>${ic("upload")}<span class="lbl">${S.ui.filling ? "Ищу реквизиты в документах…" : "Заполнить из документов"}</span></button>` : ""}`,
        };
      }
      case "docs":
        return {
          title: "Мои документы",
          sub: S.docs.length ? `${S.docs.length} ${plural(S.docs.length, "документ", "документа", "документов")} · по ним пишутся анкеты, декларации и цены` : "Загрузите то, что подавали раньше",
          acts: `<label class="btn" for="file-mydocs-top">${ic("plus")}<span class="lbl">Добавить документы</span><input id="file-mydocs-top" type="file" multiple class="sr-only" aria-label="Добавить документы"></label>`,
        };
      default:
        return { title: "Закупки", sub: n ? `${n} ${plural(n, "закупка", "закупки", "закупок")}${next ? ` · ближайший срок подачи ${when}` : ""}` : "Закупок пока нет", acts: newBtn() };
    }
  }
  function headHTML() {
    const h = headInfo();
    return `<button class="icon-btn menu-btn" type="button" id="menu-btn" data-act="drawer" aria-label="Открыть меню" aria-controls="side" aria-expanded="${S.drawer && narrow.matches}">${ic("menu", 22)}</button>
      <div class="head-text"><h1 id="page-title" tabindex="-1">${esc(h.title)}</h1>${h.sub ? `<p class="head-sub">${esc(h.sub)}</p>` : ""}</div>
      ${h.acts ? `<div class="head-acts">${h.acts}</div>` : ""}`;
  }

  /* ---------- главная: сроки, вопрос, свои данные ---------- */
  function homeHTML() {
    const list = [...S.purchases].sort(byUrgency);
    const files = S.home.files;
    const filled = filledCount(), total = PROFILE_KEYS.length;
    const rows = list.map((p) => `<li><button class="prow wide" type="button" data-go="p" data-id="${p.id}">
        ${lawBadge(p)}
        <span class="prow-text"><span class="prow-title">${esc(p.short)}${p.sample ? ' <span class="sample">пример</span>' : ""}</span><span class="prow-sub">${dueText(p)}</span></span>
        <span class="prow-side">${tpTag(p)}</span>
      </button></li>`).join("");
    const dataRow = (screen, icon, title, sub, extra = "") => `<li><button class="prow" type="button" data-go="${screen}">
        <span class="law icon" aria-hidden="true">${ic(icon, 18)}</span>
        <span class="prow-text"><span class="prow-title">${title}</span><span class="prow-sub">${sub}</span>${extra}</span>
        <span class="chev">${ic("chev", 18)}</span>
      </button></li>`;
    return `<div class="dash">
      <section class="panel" aria-labelledby="deals-title">
        <div class="panel-head"><h2 class="panel-title" id="deals-title">Мои закупки</h2>${list.length ? '<button class="link" type="button" data-go="list">Все закупки</button>' : ""}</div>
        ${list.length ? `<ul class="plist">${rows}</ul>` : `<div class="empty">
          <p>Загрузите документы закупки — выпишу требования и сроки, составлю черновик технического предложения и отвечу на вопросы по документам.</p>
          <div class="btn-row"><button class="btn" type="button" data-go="new">${ic("plus")}Новая закупка</button><span class="or">или <button class="link" type="button" data-act="sample">посмотреть на примере</button></span></div>
        </div>`}
      </section>
      <div class="dash-side">
        <section class="panel" aria-labelledby="ask-title">
          <div class="panel-head"><h2 class="panel-title" id="ask-title">Спросить про тендер</h2></div>
          <div class="panel-body">
            <p class="ask-lead">Отвечу по 44-ФЗ, 223-ФЗ и вашим документам — со ссылкой на статью и пункт.</p>
            <form class="askbox" id="home-form">
              <label class="circle" for="home-file" title="Приложить документ">${ic("clip", 18)}<span class="sr-only">Приложить документ</span><input id="home-file" type="file" multiple class="sr-only"></label>
              <textarea id="home-q" rows="1" placeholder="Ваш вопрос…" aria-label="Вопрос" data-enter>${esc(S.home.text)}</textarea>
              <button class="circle send" type="submit" aria-label="Спросить">${ic("up")}</button>
            </form>
            ${files.length ? `<div class="chips">${files.map((n, i) => `<span class="file-chip">${ic("file", 14)}<span class="fc-name">${esc(n)}</span><button class="x" type="button" data-act="home-file-x" data-i="${i}" aria-label="Убрать ${esc(n)}">${ic("x", 14)}</button></span>`).join("")}</div>` : ""}
            <div class="chips">${GENERAL_SUGGEST.map((q) => `<button class="chip" type="button" data-act="home-q" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
          </div>
        </section>
        <section class="panel" aria-labelledby="mine-title">
          <div class="panel-head"><h2 class="panel-title" id="mine-title">Мои данные</h2></div>
          <ul class="plist">
            ${dataRow("profile", "user", "Реквизиты", `Заполнено ${filled} из ${total}`, `<span class="meter" aria-hidden="true"><i style="width:${Math.round((filled / total) * 100)}%"></i></span>`)}
            ${dataRow("docs", "folder", "Мои документы", S.docs.length ? `${S.docs.length} ${plural(S.docs.length, "документ", "документа", "документов")} · по ним пишутся новые` : "Загрузите то, что подавали раньше")}
          </ul>
        </section>
      </div>
    </div>
    <p class="foot">Прототип: закупки, документы и ответы вымышленные. Файлы не читаются, ничего не сохраняется и никуда не отправляется. Ответы ИИ не являются юридической консультацией — проверяйте нормы по первоисточнику.</p>`;
  }

  /* ---------- вопросы: общий чат и чат закупки ---------- */
  function msgHTML(m, p) {
    if (m.role === "user") {
      const files = (m.files || []).length ? `<div class="msg-files">${m.files.map((n) => `<span class="file-chip plain">${ic("file", 14)}<span class="fc-name">${esc(n)}</span></span>`).join("")}</div>` : "";
      return files + (m.text ? `<div class="msg user">${esc(m.text)}</div>` : "");
    }
    const done = m.done !== false;
    const refs = (m.src || []).map((r) => refBtn(r, p)).join("");
    return `<div class="msg bot">${md(done ? m.text : m.shown)}${done && m.note ? `<p class="note-line">${esc(m.note)}</p>` : ""}${done ? `<div class="msg-meta">${refs ? `<span class="refs">Источники: ${refs}</span>` : ""}<button class="link quiet" type="button" data-act="lawyer">Спросить юриста</button></div>` : ""}</div>`;
  }
  const feedInner = (messages, thinking, p) => messages.map((m) => msgHTML(m, p)).join("") + (thinking ? '<p class="thinking">Изучаю документы и закон…</p>' : "");

  function chipsHTML(list, used) {
    const left = list.filter((q) => !used.includes(q));
    return left.map((q) => `<button class="chip" type="button" data-act="q" data-q="${esc(q)}">${esc(q)}</button>`).join("");
  }

  function composerHTML(kind, placeholder, attach) {
    const g = S.general;
    const talk = attach && g.docs.length ? `<div class="in-talk"><span>В разговоре:</span>${g.docs.map((n, i) => `<span class="file-chip">${ic("file", 14)}<span class="fc-name">${esc(n)}</span><button class="x" type="button" data-act="gdoc-x" data-i="${i}" aria-label="Убрать ${esc(n)} из разговора">${ic("x", 14)}</button></span>`).join("")}</div>` : "";
    return `<form class="composer" id="${kind}-form">
      ${talk}
      <div class="prompt">
        <textarea id="${kind}-q" rows="1" placeholder="${placeholder}" aria-label="Вопрос" data-enter>${esc(S.drafts[kind] || "")}</textarea>
        <div class="prompt-foot">
          ${attach ? `<label class="tool-btn" for="g-file">${ic("clip", 14)}Документ<input id="g-file" type="file" multiple class="sr-only"></label>` : "<span></span>"}
          <button class="circle send" type="submit" aria-label="Отправить">${ic("up")}</button>
        </div>
      </div>
      <p class="disclaimer">Ответы ИИ не являются юридической консультацией. Проверяйте нормы по первоисточнику.</p>
    </form>`;
  }

  // Разговор: сообщения прокручиваются, поле ввода прижато к низу панели.
  function chatHTML(kind, p, placeholder) {
    const holder = p || S.general;
    const messages = p ? p.chat : S.general.messages;
    const empty = !messages.length && !holder.thinking;
    const used = messages.filter((m) => m.role === "user").map((m) => m.text);
    const intro = p
      ? `<h2 class="chat-title">Спросите про эту закупку</h2><p>Отвечу по документам закупки со ссылкой на пункт и статью закона.</p><p class="chat-docs">Документы: ${p.files.map(esc).join(", ")}</p>`
      : '<h2 class="chat-title">Задайте вопрос по закупкам</h2><p>Отвечу по 44-ФЗ и 223-ФЗ со ссылкой на статью: тексты законов — в действующей редакции с официального портала. Приложите документ — отвечу и по нему.</p>';
    return `<div class="chat">
      <div class="chat-main">
        <div class="chat-empty" id="chat-intro"${empty ? "" : " hidden"}>${intro}</div>
        <div class="feed" id="feed"${empty ? " hidden" : ""}>${feedInner(messages, holder.thinking, p)}</div>
        <div class="chips" id="chips">${chipsHTML(p ? CHAT_SUGGEST : GENERAL_SUGGEST, used)}</div>
      </div>
      ${composerHTML(kind, placeholder, kind === "ask")}
    </div>`;
  }

  function askHTML() {
    const g = S.general;
    return `<div class="ws solo"><section class="pane" aria-label="Разговор"><div class="pane-body" id="pane-main" data-scroll>${chatHTML("ask", null, g.docs.length ? "Спросите про приложенные документы…" : "Задайте вопрос по закупкам…")}</div></section></div>`;
  }

  /* ---------- закупки: список, закупка, сведения ---------- */
  function plistBodyHTML(sel) {
    if (!S.purchases.length) return `<div class="empty">
        <p>Закупок пока нет. Загрузите документы — выпишу требования и сроки.</p>
        <div class="btn-row"><button class="btn" type="button" data-go="new">${ic("plus")}Новая закупка</button><span class="or">или <button class="link" type="button" data-act="sample">пример</button></span></div>
      </div>`;
    const q = S.q.trim().toLowerCase();
    const list = [...S.purchases].sort(byUrgency).filter((p) => !q || [p.short, p.subject, p.customer, p.kind].join(" ").toLowerCase().includes(q));
    if (!list.length) return '<p class="list-empty">Ничего не нашлось. Поиск идёт по названию, заказчику и закону.</p>';
    return `<ul class="plist">${list.map((p) => {
      const due = dueLine(p.deadline, false);
      const days = !due ? "" : due.days < 0 ? '<span class="days">срок прошёл</span>' : `<span class="days${due.tone === "soon" ? " soon" : ""}">${due.days === 0 ? "сегодня" : daysText(due.days)}</span>`;
      return `<li><button class="prow" type="button" data-go="p" data-id="${p.id}"${sel === p ? ' aria-current="true"' : ""}>
        ${lawBadge(p)}
        <span class="prow-text"><span class="prow-title">${esc(p.short)}</span><span class="prow-sub">${esc([p.sample ? "пример" : "", p.customer].filter(Boolean).join(" · "))}</span></span>
        <span class="prow-side">${days}${tpMark(p)}</span>
      </button></li>`;
    }).join("")}</ul>`;
  }

  function tabsHTML(p) {
    const n = asked(p);
    const tab = (screen, label, extra) => `<button class="tab" type="button" data-go="${screen}" data-id="${p.id}"${S.screen === screen ? ' aria-current="page"' : ""}>${label}${extra}</button>`;
    return `<nav class="tabs" id="tabs" aria-label="Разделы закупки">
      ${tab("req", "Требования", `<span class="count">${reqCount(p)}</span>`)}
      ${tab("tp", "Техническое предложение", tpMark(p))}
      ${tab("check", "Проверка заявки", '<span class="soon-tag">скоро</span>')}
      ${tab("chat", "Вопросы", n ? `<span class="count">${n}</span>` : "")}
    </nav>`;
  }

  function tabHTML(p) {
    switch (S.screen) {
      case "tp": return tpHTML(p);
      case "check": return checkHTML(p);
      case "chat": return chatHTML("chat", p, "Спросите про документы закупки…");
      default: return reqHTML(p);
    }
  }

  function dueChip(due) {
    if (!due) return "";
    const text = due.days < 0 ? "приём закончился" : due.days === 0 ? "подать сегодня" : `${daysText(due.days)} до подачи`;
    return `<span class="due-chip ${due.tone}">${ic("clock", 15)}${esc(text)}</span>`;
  }

  function detailHTML(p) {
    return `<div class="pd-head">
        <button class="icon-btn pd-back" type="button" data-go="list" aria-label="Все закупки">${ic("back", 18)}</button>
        ${lawBadge(p)}
        <div class="pd-text"><h2 class="pd-title" id="pd-title" tabindex="-1">${esc(p.short)}</h2><p class="pd-sub">${esc([p.kind, p.sample ? "пример" : ""].filter(Boolean).join(" · "))}</p></div>
        <div class="pd-acts">
          ${dueChip(dueLine(p.deadline, false))}
          <label class="icon-btn" for="add-doc" title="Добавить документы">${ic("clip", 18)}<input id="add-doc" type="file" multiple class="sr-only" aria-label="Добавить документы"></label>
          <button class="icon-btn info-toggle" id="info-toggle" type="button" data-act="info" aria-controls="ws-info" aria-expanded="${S.info}" title="Сведения о закупке">${ic("panel", 18)}<span class="sr-only">Сведения о закупке</span></button>
        </div>
      </div>
      ${tabsHTML(p)}
      <div class="pane-body" id="pane-main" data-scroll>${S.busy ? `<div class="tab-body">${busyHTML()}</div>` : tabHTML(p)}</div>`;
  }

  function infoHTML(p) {
    const due = dueLine(p.deadline, true);
    const fold = (key, title, body, count) => {
      const open = !S.fold[key];
      return `<section class="fold">
        <h3 class="m0"><button class="fold-head" type="button" data-act="fold" data-fold="${key}" aria-expanded="${open}">${title}${count !== undefined ? `<span class="count">${count}</span>` : ""}${ic("down", 18)}</button></h3>
        ${open ? `<div class="fold-body">${body}</div>` : ""}
      </section>`;
    };
    const fact = (icon, label, value, extra = "") => (value ? `<div class="fact">${ic(icon, 18)}<div><span class="fact-label">${label}</span><b>${esc(value)}</b>${extra}</div></div>` : "");
    const facts = [
      due ? fact("clock", "Срок подачи", due.head.replace(/^Подать /, "").replace(/^Приём заявок /, ""), due.left ? `<span class="${due.tone === "soon" ? "warn-t" : "muted"}">${esc(due.left)}</span>` : "") : "",
      fact("landmark", "Заказчик", p.customer),
      fact("ruble", "Начальная цена", p.price),
      fact("scale", "Закон и способ", p.kind),
    ].join("");
    const scans = p.scans || [];
    const files = p.files.map((name) => {
      const scan = scans.includes(name);
      const ext = (name.split(".").pop() || "").toUpperCase();
      return `<li class="file"><span class="file-ic${scan ? " warn" : ""}">${ic(scan ? "alert" : "file", 16)}</span><span class="file-text"><span class="file-name" title="${esc(name)}">${esc(name)}</span><span class="file-meta${scan ? " warn" : ""}">${scan ? "со скана — сверьте цифры" : `${esc(ext)} · прочитан`}</span></span></li>`;
    }).join("") + p.unreadable.map((f) => `<li class="file"><span class="file-ic warn">${ic("alert", 16)}</span><span class="file-text"><span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span><span class="file-meta warn">не прочитан: ${esc(f.reason)}</span></span></li>`).join("");
    const del = S.ui.confirmDelete ? `<div class="confirm">
        <p>Удалить закупку вместе с документами, черновиком и вопросами? Вернуть её не получится.</p>
        <div class="btn-row"><button class="btn xs danger" type="button" data-act="delete">Удалить</button><button class="btn xs soft" type="button" data-act="cancel-delete">Отмена</button></div>
      </div>` : '<button class="link quiet del" type="button" data-act="ask-delete">Удалить закупку</button>';
    return `<div class="pane-body" id="info-body" data-scroll>
      <div class="info-top">
        <button class="icon-btn info-close" id="info-close" type="button" data-act="info-close" aria-label="Скрыть сведения">${ic("x", 18)}</button>
        ${lawBadge(p, true)}
        <p class="info-title">${esc(p.subject || p.short)}</p>
        ${dueChip(due)}
        ${p.sample ? '<p class="info-sub">Пример на вымышленной закупке — нажимайте на всё, ничего не сломается.</p>' : ""}
      </div>
      ${fold("facts", "Сведения", facts)}
      ${fold("files", "Документы", `<ul class="files">${files}</ul><label class="link" for="add-doc-2">Добавить документы<input id="add-doc-2" type="file" multiple class="sr-only"></label>`, p.files.length + p.unreadable.length)}
      <div class="info-foot">${del}</div>
    </div>`;
  }

  function workspaceHTML() {
    const p = PURCHASE_SCREENS.includes(S.screen) ? cur() : null;
    const empty = S.purchases.length
      ? '<div class="empty"><p>Выберите закупку в списке.</p></div>'
      : `<div class="empty"><p>Загрузите документы закупки — выпишу требования и сроки, составлю черновик технического предложения и отвечу на вопросы по документам.</p><div class="btn-row"><button class="btn" type="button" data-go="new">${ic("plus")}Новая закупка</button><span class="or">или <button class="link" type="button" data-act="sample">посмотреть на примере</button></span></div></div>`;
    return `<div class="ws" id="ws" data-pane="${p ? "main" : "list"}" data-sel="${p ? 1 : 0}" data-info="${S.info ? "open" : "closed"}">
      <section class="pane ws-list" aria-label="Мои закупки">
        <div class="list-head">
          <label class="search" for="plist-q">${ic("search", 16)}<input id="plist-q" type="search" placeholder="Найти закупку…" value="${esc(S.q)}" autocomplete="off"></label>
        </div>
        <div class="pane-body" id="plist-body" data-scroll>${plistBodyHTML(p)}</div>
      </section>
      <section class="pane ws-main" aria-labelledby="${p ? "pd-title" : "page-title"}">${p ? detailHTML(p) : empty}</section>
      ${p ? `<aside class="pane ws-info" id="ws-info" aria-label="Сведения о закупке">${infoHTML(p)}</aside>` : ""}
    </div>`;
  }

  function checkCounts(p) {
    return { bad: p.check.findings.filter((f) => f.kind === "bad").length, warn: p.check.findings.filter((f) => f.kind === "warn").length };
  }

  /* ---------- требования ---------- */
  function reqHTML(p) {
    const unverified = REQ_KEYS.reduce((n, k) => n + p.requirements[k].filter((it) => !it.verified).length, 0);
    const notes = [
      p.unreadable.length ? noteHTML("warn", `Не получилось прочитать: ${p.unreadable.map((f) => `${esc(f.name)} — ${esc(f.reason)}`).join("; ")}. Требования выписаны по остальным файлам.`, "", "alert") : "",
      scanWarning(p) ? noteHTML("warn", scanWarning(p), "", "alert") : "",
      unverified ? noteHTML("warn", `В ${unverified} ${plural(unverified, "пункте", "пунктах", "пунктах")} цитата не найдена в документах дословно — сверьте их вручную.`, "", "alert") : "",
    ].join("");
    return `<div class="tab-body">
      <p class="tab-lead">Всё, что нужно для заявки, — из документов закупки. Нажмите на ссылку под пунктом, чтобы увидеть точную цитату.</p>
      ${notes ? `<div class="notes">${notes}</div>` : ""}
      ${REQ_KEYS.map((key) => {
        const items = p.requirements[key];
        return `<section class="group"><h3 class="group-title">${GROUPS[key].title}</h3>
          ${items.length ? `<ul class="list">${items.map((it, i) => `<li><span>${esc(it.text)}</span>${sourceHTML(`${key}-${i}`, it.source, it.quote, it.verified, "пункт")}</li>`).join("")}</ul>` : `<p class="empty-group">${GROUPS[key].empty}</p>`}
        </section>`;
      }).join("")}
    </div>`;
  }

  // Ссылка на источник: нажали — под ней точная цитата; ненайденная дословно помечена янтарём.
  function sourceHTML(id, source, quote, verified, what) {
    const open = S.ui.open === id;
    return `<button class="src" type="button" data-act="toggle" data-open="${id}" aria-expanded="${open}">${esc(source || "цитата из ТЗ")}</button>
      ${open ? `<blockquote class="quote">${esc(quote)}</blockquote>` : ""}
      ${verified ? "" : `<p class="unver">${ic("alert", 16)}Не нашёл эту цитату в документах дословно — сверьте ${what} вручную.</p>`}`;
  }

  /* ---------- техническое предложение ---------- */
  const TP_STEPS = ["Ищу в документах форму заявки…", "Читаю ТЗ…", "Выписываю товары и характеристики…", "Готовлю предложение по пунктам…", "Сверяю цитаты с ТЗ…"];

  function tpNotes(p) {
    const tp = p.tp;
    const fill = fillCount(tp);
    const leaks = leaksOf(tp);
    const unverified = [...tp.goods, ...tp.items].filter((r) => !r.verified).length;
    let h = fill
      ? noteHTML("warn", `Впишите свои данные в ${fill} ${plural(fill, "пункт", "пункта", "пунктов")} — они выделены жёлтым. Нажмите на текст, чтобы исправить.`, "", "pen")
      : noteHTML("ok", "Все пункты заполнены.", "", "check");
    if (leaks.length) h += noteHTML("warn", `В техническом предложении есть ваши данные: ${leaks.map((v) => `«${esc(v)}»`).join(", ")}. Уберите их — ТП подают в первую часть заявки анонимно, иначе заявку отклонят.`, "", "alert");
    if (unverified) h += noteHTML("warn", `В ${unverified} ${plural(unverified, "строке", "строках", "строках")} цитата не найдена в документах дословно — сверьте их вручную.`, "", "alert");
    if (scanWarning(p)) h += noteHTML("warn", scanWarning(p), "", "alert");
    return h;
  }

  function editHTML(key, value, label) {
    if (S.ui.editing === key) return `<textarea class="edit-area" id="edit-${key.replace(":", "-")}" data-edit="${key}" data-label="${esc(label)}" aria-label="${esc(label)}">${esc(value)}</textarea>`;
    return `<button class="edit" type="button" data-act="edit" data-edit="${key}" data-label="${esc(label)}" aria-label="Изменить: ${esc(label)}">${fields(value)}</button>`;
  }

  function priceInfo(p) {
    const nmck = parseRub(p.price);
    const price = p.tpPrice;
    const drop = nmck && price ? (1 - price / nmck) * 100 : null;
    const percent = drop !== null ? drop.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) : "";
    let h = "";
    if (price) h += `<p class="small ink2">Прописью: ${esc(rublesInWords(price))}</p>`;
    if (nmck) h += `<p class="small muted">Начальная цена — ${fmtRub(nmck)} ₽${drop !== null && drop > 0 ? ` · снижение ${percent}%` : ""}</p>`;
    if (drop !== null && drop < 0) h += noteHTML("warn", "Цена выше начальной — такую заявку отклонят.", "", "alert");
    if (drop !== null && drop >= 25) h += noteHTML("warn", `Снижение ${percent}% — это 25% и больше. ${esc(p.tp.antiDumping.rule || "В таких случаях обычно действуют антидемпинговые меры: обеспечение исполнения в полтора раза больше или подтверждение опыта. Проверьте условия в извещении.")}`, "", "alert");
    return h;
  }

  // Готовая часть заявки актуальна, пока не изменились цена, реквизиты и образцы, по которым она составлена.
  const basisKey = (p, k) => JSON.stringify({ price: p.tp.form.hasPrice ? p.tpPrice || null : null, profile: S.profile, samples: samplesOf(PART_SAMPLE_KIND[k]).map((d) => d.id) });
  function basisText(p, k) {
    const form = p.tp.form.partForms && p.tp.form.partForms[k];
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    if (form && samples.length) return `по форме заказчика (${form}) и вашему образцу «${samples[0].name}»`;
    if (samples.length) return `по вашему образцу «${samples[0].name}»`;
    if (form) return `по форме заказчика (${form})`;
    return "по обычной форме — ни формы заказчика, ни образца нет";
  }
  function partRow(p, k) {
    const made = p.parts[k];
    const fresh = made && made.key === basisKey(p, k);
    const samples = samplesOf(PART_SAMPLE_KIND[k]);
    const writing = S.ui.writing === k;
    const status = p.sample ? "в примере — по стандартному шаблону"
      : writing ? "Пишу документ — это около минуты…"
      : fresh ? esc(made.basis)
      : made ? "реквизиты, цена или образцы изменились — составлю заново"
      : samples.length ? `составлю по вашему образцу «${esc(samples[0].name)}»${samples.length > 1 ? ` и ещё ${samples.length - 1}` : ""}`
      : "ваших образцов нет — составлю по форме заказчика";
    return `<li>
      <span class="part-name">${esc(PART_TITLES[k])}</span>
      <button class="btn soft xs" type="button" data-act="part" data-part="${k}"${S.ui.writing ? " disabled" : ""}>${writing ? "Пишу…" : "Скачать"}</button>
      <span class="part-status">${status}${fresh && !p.sample && !writing ? ` · <button class="link quiet" type="button" data-act="part-redo" data-part="${k}">составить заново</button>` : ""}</span>
    </li>`;
  }
  const partsRows = (p) => partsOf(p.tp.form).filter((k) => k !== "tp").map((k) => partRow(p, k)).join("");

  function tpHTML(p) {
    if (!p.tp) {
      const tpSamples = samplesOf("tp");
      return `<div class="tab-body">
        <p class="tab-lead">Найду в документах форму заявки и заполню её, как тендерный юрист: товары с конкретными характеристиками, предложение по пунктам ТЗ, цена. Вам останется вписать то, что знаете только вы.</p>
        ${p.sample ? "" : `<p class="small muted m0">${tpSamples.length
          ? `Пишу по вашим техническим предложениям: ${tpSamples.length} ${plural(tpSamples.length, "документ", "документа", "документов")} из <button class="link" type="button" data-go="docs">«Моих документов»</button>.`
          : 'Черновик будет в общем стиле. <button class="link" type="button" data-go="docs">Загрузите свои документы</button> — и ТП будет написано так, как пишете вы.'}</p>`}
        <button class="btn lg mt-5" type="button" data-act="compose">Составить черновик</button>
      </div>`;
    }
    const tp = p.tp;
    const goods = tp.goods.length ? `<section class="group mt-6">
        <h3 class="group-title">Товары и оборудование — ${tp.goods.length}</h3>
        <ol class="items">${tp.goods.map((g, i) => `<li>
          <div class="item-head"><h4 class="m0">${i + 1}. ${esc(g.name)}</h4>${g.quantity ? `<span class="qty">${esc(g.quantity)}</span>` : ""}${needsFill(g.characteristics) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          ${sourceHTML(`g${i}`, g.source, g.quote, g.verified, "строку")}
          ${editHTML(`good:${i}`, g.characteristics, `Характеристики: ${g.name}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    const items = tp.items.length ? `<section class="group mt-6">
        <h3 class="group-title">Предложение по пунктам ТЗ — ${tp.items.length}</h3>
        <ol class="items">${tp.items.map((it, i) => `<li>
          <div class="item-head"><h4 class="m0">${i + 1}. ${esc(it.topic)}</h4>${needsFill(it.offer) ? '<span class="flag" data-flag>впишите данные</span>' : ""}</div>
          <p class="need">В ТЗ${it.clause ? `, п. ${esc(it.clause)}` : ""}: ${esc(it.requirement)}</p>
          ${sourceHTML(`i${i}`, "", it.quote, it.verified, "строку")}
          ${editHTML(`item:${i}`, it.offer, `Предложение: ${it.topic}`)}
        </li>`).join("")}</ol>
      </section>` : "";
    return `<div class="tab-body">
      <p class="tab-lead">${tp.form.source
        ? `По форме заказчика: ${esc(tp.form.title)} (${esc(tp.form.source)}). Каждая часть заявки — отдельным файлом.`
        : "Формы заявки в документах нет — составлено как техническое предложение по пунктам ТЗ."} Техническое предложение идёт в первую часть заявки, поэтому в нём нет ни названия, ни ИНН, ни подписи участника.</p>
      <div class="notes" id="tp-notes">${tpNotes(p)}</div>
      ${tp.form.hasPrice ? `<section class="price">
          <label for="tp-price">Цена вашего предложения</label>
          <div class="price-row"><input class="input num" id="tp-price" inputmode="decimal" autocomplete="off" placeholder="например, 690000" value="${esc(p.tpPriceText)}"><span class="muted">₽</span></div>
          <div id="price-info" style="display:grid;gap:8px">${priceInfo(p)}</div>
        </section>` : ""}
      ${goods}
      ${items}
      <div class="mt-5">${S.ui.confirmRedo ? `<div class="confirm">
          <p>Составить черновик заново? Ваши правки в этом черновике пропадут.</p>
          <div class="btn-row"><button class="btn xs" type="button" data-act="redo">Составить заново</button><button class="btn xs soft" type="button" data-act="cancel-redo">Отмена</button></div>
        </div>` : '<p class="small muted m0">Добавили документы или черновик не подходит? <button class="link" type="button" data-act="ask-redo">Составить заново</button></p>'}</div>
      <section class="group mt-6">
        <h3 class="group-title">Остальные части заявки — отдельными файлами</h3>
        <ul class="parts" id="parts-list">${partsRows(p)}</ul>
        <p class="small muted mt-3 m0">Реквизиты берутся из <button class="link" type="button" data-go="profile">«Реквизитов»</button>, образцы — из <button class="link" type="button" data-go="docs">«Моих документов»</button>. Чего там нет — выделено в Word жёлтым.</p>
      </section>
    </div>
    <div class="sticky-actions"><button class="btn" type="button" data-act="preview-tp">Скачать техническое предложение</button></div>`;
  }

  /* ---------- проверка заявки (экран из плана, в коде его ещё нет) ---------- */
  function checkHTML(p) {
    const soon = `<div class="notes">${noteHTML("info", "Проверки заявки пока нет в приложении: экран показывает, как она будет работать.", "", "info")}</div>`;
    if (p.check.state !== "done") {
      return `<div class="tab-body">
        ${soon}
        <p class="tab-lead">Загрузите свою заявку или техническое предложение. Я сверю их с ТЗ по каждому пункту и скажу, за что могут отклонить.</p>
        ${dropHTML("app", "Перетащите файл заявки сюда", "Загрузить заявку", { act: "sample-check", text: "проверить пример" })}
      </div>`;
    }
    const { bad, warn } = checkCounts(p);
    const parts = [];
    if (bad) parts.push(`<span class="bad-t">${bad} ${plural(bad, "ошибку", "ошибки", "ошибок")}</span>`);
    if (warn) parts.push(`<span class="warn-t">${warn} ${plural(warn, "замечание", "замечания", "замечаний")}</span>`);
    const title = parts.length ? `Нашёл ${parts.join(" и ")}` : "Ошибок нет";
    const lead = bad ? "Исправьте ошибку до подачи — замечания тоже лучше поправить." : warn ? "Отклонять не за что, но замечания лучше поправить." : "Заявка соответствует ТЗ по всем пунктам.";
    const ok = p.check.ok;
    return `<div class="tab-body">
      ${soon}
      <h3 class="check-title">${title}</h3>
      <p class="tab-lead m0">${lead}</p>
      <ul class="findings">${p.check.findings.map((f) => `<li class="finding ${f.kind}">
          <span class="ico" aria-hidden="true">${f.kind === "bad" ? "✕" : "!"}</span>
          <div style="display:grid;gap:4px"><p class="what">${esc(f.what)}</p><p class="todo">${esc(f.todo)}</p>${f.src && p.sources[f.src] ? refBtn({ doc: f.src }, p) : ""}</div>
        </li>`).join("")}
        <li class="finding ok"><span class="ico" aria-hidden="true">✓</span><div><p class="what">${p.check.findings.length ? "Остальные" : "Все"} ${ok} ${plural(ok, "пункт", "пункта", "пунктов")} — в порядке.</p></div></li>
      </ul>
      <p class="under"><span>Сомневаетесь? <button class="link" type="button" data-act="lawyer">Спросить юриста</button></span><button class="link" type="button" data-act="recheck">Проверить другой файл</button></p>
    </div>`;
  }

  /* ---------- новая закупка ---------- */
  const NEW_STEPS = ["Читаю документы…", "Смотрю, кто может участвовать…", "Выписываю, что подать в заявке…", "Разбираю требования ТЗ…", "Проверяю сроки и суммы…", "Сверяю цитаты с документами…"];
  const ADDING_STEPS = ["Читаю новые документы…", "Перечитываю закупку целиком…", "Обновляю требования и сроки…", "Сверяю цитаты с документами…"];

  function newHTML() {
    return `<div class="page-col"><section class="panel"><div class="panel-body">
      ${S.busy ? busyHTML() : `<p class="intro">Загрузите извещение, ТЗ и проект контракта — выпишу требования и сроки, а потом помогу с техническим предложением.</p>
      ${dropHTML("new", "Перетащите сюда документы закупки — можно сразу несколько: PDF, Word, сканы и фото", "Загрузить документы", { act: "sample", text: "посмотреть на примере" })}`}
    </div></section></div>`;
  }

  /* ---------- реквизиты ---------- */
  function groupSuggestions(items) {
    const groups = [];
    for (const item of items) {
      const bank = BANK_KEYS.includes(item.key);
      const group = bank ? groups.find((g) => BANK_KEYS.includes(g[0].key) && g[0].source === item.source && !g.some((i) => i.key === item.key)) : undefined;
      if (group) group.push(item); else groups.push([item]);
    }
    return groups;
  }

  function profileHTML() {
    const sourceDocs = S.docs.filter((d) => d.kinds.some((k) => REQUISITE_KINDS.includes(k)));
    const groups = groupSuggestions(S.suggestions);
    return `<div class="page-col">
      <p class="intro">Впишите один раз — дальше они сами попадут в анкету, декларацию, предложение о цене и подпись. В техническое предложение реквизиты не попадают никогда: его подают анонимно.</p>
      ${sourceDocs.length ? "" : '<p class="intro">Можно не вписывать руками: загрузите анкету или карточку предприятия в <button class="link" type="button" data-go="docs">«Мои документы»</button> — реквизиты заполнятся сами.</p>'}
      ${S.ui.fillNote ? noteHTML(S.ui.fillNote.tone, esc(S.ui.fillNote.text), "", S.ui.fillNote.tone === "ok" ? "check" : "") : ""}
      ${groups.length ? `<section class="suggest" aria-labelledby="sug-title">
          <p class="suggest-head" id="sug-title">${ic("alert", 18)}В ваших документах есть другие значения — проверьте, какое верное</p>
          <ul>${groups.map((g, i) => `<li>
            <span>${g.length > 1 ? `<b>Банковские реквизиты:</b> ${esc(g.map((it) => it.value).join(", "))}` : `<b>${esc(LABELS[g[0].key])}:</b> ${esc(g[0].value)}`} <span class="muted">— из «${esc(g[0].source)}»</span></span>
            <span class="acts"><button class="link" type="button" data-act="sug-accept" data-i="${i}">${g.length > 1 ? "Подставить все" : "Подставить"}</button><button class="link quiet" type="button" data-act="sug-dismiss" data-i="${i}">Оставить как есть</button></span>
          </li>`).join("")}</ul>
        </section>` : ""}
      ${PROFILE_GROUPS.map((g, gi) => `<section class="panel" aria-labelledby="pg-${gi}">
        <div class="panel-head"><h2 class="panel-title" id="pg-${gi}">${g.title}</h2></div>
        <div class="form-rows">${g.fields.map((f) => `<div class="field">
          <label class="field-label" for="pf-${f.key}">${esc(f.label)}</label>
          <input class="input" id="pf-${f.key}" data-pf="${f.key}" value="${esc(S.profile[f.key])}" placeholder="${esc(f.example || "")}" autocomplete="off">
          ${S.sources[f.key] ? `<span class="field-src" data-src-of="${f.key}">из «${esc(S.sources[f.key])}»</span>` : ""}
        </div>`).join("")}</div>
      </section>`).join("")}
    </div>`;
  }

  /* ---------- мои документы ---------- */
  function countLine(docs) {
    return DOC_KIND_KEYS.map((k) => [k, docs.filter((d) => d.kinds.includes(k)).length]).filter(([, n]) => n > 0).map(([k, n]) => `${DOC_KINDS[k].few} — ${n}`).join(", ");
  }
  function docRowHTML(d, kind) {
    const key = `${kind}:${d.id}`;
    const others = d.kinds.filter((k) => k !== kind);
    const meta = [
      `≈ ${d.pages} ${plural(d.pages, "страница", "страницы", "страниц")}`,
      `добавлен ${d.added}`,
      ...(d.scan ? ["распознан со скана — сверьте цифры"] : []),
      ...(others.length ? [`в файле также: ${others.map((k) => DOC_KINDS[k].few).join(", ")}`] : []),
    ].join(" · ");
    let acts;
    if (S.ui.editKind === key) {
      const draft = S.ui.kindDraft || d.kinds;
      acts = `<div class="kinds"><p>Что в этом файле? Можно выбрать несколько.</p>
        <div class="chips">${DOC_KIND_KEYS.map((k) => `<button class="kind-pill" type="button" data-act="kind-toggle" data-kind="${k}" aria-pressed="${draft.includes(k)}">${DOC_KINDS[k].group}</button>`).join("")}</div>
        <div class="btn-row"><button class="btn xs" type="button" data-act="kind-save" data-key="${key}">Готово</button><button class="btn xs soft" type="button" data-act="kind-cancel">Отмена</button></div></div>`;
    } else if (S.ui.confirmDoc === key) {
      acts = `<div class="doc-acts"><span>${others.length ? "Удалить файл целиком, из всех групп?" : "Удалить документ?"}</span><button class="btn xs danger" type="button" data-act="doc-del-yes" data-key="${key}">Удалить</button><button class="btn xs soft" type="button" data-act="doc-del-no">Отмена</button></div>`;
    } else {
      acts = `<div class="doc-acts"><button class="link" type="button" data-act="kind-edit" data-key="${key}">Изменить вид</button><button class="link quiet del" type="button" data-act="doc-del" data-key="${key}">Удалить</button></div>`;
    }
    return `<li>
      <div class="doc-main"><span class="file-ic${d.scan ? " warn" : ""}">${ic("file", 16)}</span><div class="doc-text">
        <span class="doc-name">${esc(d.name)}</span>
        ${d.about ? `<span class="doc-about">${esc(d.about)}</span>` : ""}
        <span class="doc-meta">${esc(meta)}</span>
      </div></div>
      ${acts}
    </li>`;
  }

  function docsHTML() {
    const groups = DOC_KIND_KEYS.map((k) => [k, S.docs.filter((d) => d.kinds.includes(k))]).filter(([, list]) => list.length);
    const rep = S.ui.report;
    const report = rep ? `<div style="display:grid;gap:8px" aria-live="polite">
        ${noteHTML("ok", `Добавил ${rep.added.length} ${plural(rep.added.length, "документ", "документа", "документов")}: ${esc(countLine(rep.added))}.`, "", "check")}
        ${noteHTML("info", "Разложил по названиям файлов — прототип не читает их содержимое. Проверьте виды и поправьте, где нужно.", "", "info")}
        ${rep.requisites ? noteHTML("info", 'Реквизиты: в приложении они заполнятся из новых анкет и карточек сами. В прототипе файлы не читаются, поэтому <button class="link" type="button" data-go="profile">реквизиты</button> не изменились.', "", "info") : ""}
      </div>` : "";
    return `<div class="page-col">
      <p class="intro">Загрузите всё, что подавали раньше: заявки целиком или по частям, анкеты, декларации, ценовые предложения, договоры и акты, протоколы. Приложение разложит их по видам — и новые документы будет писать так же, как ваши.</p>
      ${report}
      ${S.busy ? `<section class="panel"><div class="panel-body">${busyHTML()}</div></section>` : ""}
      ${groups.map(([k, list], gi) => `<section class="panel" aria-labelledby="dg-${gi}">
        <div class="panel-head"><div><h2 class="panel-title" id="dg-${gi}">${DOC_KINDS[k].group} <span class="count">${list.length}</span></h2><p class="panel-sub">${DOC_KINDS[k].use}</p></div></div>
        <ul class="docs-list">${list.map((d) => docRowHTML(d, k)).join("")}</ul>
      </section>`).join("")}
      ${S.busy ? "" : dropHTML("mydocs", "Перетащите сюда свои документы — PDF, Word, сканы и фото. Можно сразу все.", S.docs.length ? "Добавить документы" : "Загрузить документы")}
    </div>`;
  }

  /* ---------- предпросмотр файлов Word ---------- */
  const docFields = (t) => esc(t).replace(/\[[^\]]+\]/g, (m) => `<mark>${m}</mark>`);
  const paras = (text, indent) => (text || "").split(/\n+/).filter((l) => l.trim()).map((l) => `<p${indent ? ' class="jst"' : ""}>${docFields(l.trim())}</p>`).join("");
  const signature = () => `<p class="sig">Участник закупки  ______________________ / ${esc(S.profile.signer.trim() || "______________________")} /</p>
    <p class="sub-sig">(подпись)  /  (расшифровка подписи)</p>
    <p>М.П. (при наличии)          «____» ________________ 20___ г.</p>`;

  function tpDoc(p) {
    const { form, goods, items } = p.tp;
    let h = `<h3>${esc(PART_TITLES.tp)}</h3>`;
    if (p.subject) h += `<p class="c">Предмет закупки: ${esc(p.subject)}</p>`;
    if (goods.length) {
      h += paras(form.consent, true);
      h += `<table><thead><tr><th style="width:7%">№ п/п</th><th style="width:25%">Наименование товара</th><th>Характеристики товара</th><th style="width:16%">Количество</th></tr></thead><tbody>${goods.map((g, i) => `<tr><td>${i + 1}</td><td>${esc(g.name)}</td><td>${paras(g.characteristics)}</td><td>${esc(g.quantity)}</td></tr>`).join("")}</tbody></table>`;
    }
    if (items.length) {
      h += `<table><thead><tr><th style="width:6%">№</th><th style="width:40%">Требование заказчика</th><th>Предложение участника закупки</th></tr></thead><tbody>${items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.requirement)}${it.clause ? ` (п. ${esc(it.clause)} ТЗ)` : ""}</td><td>${paras(it.offer)}</td></tr>`).join("")}</tbody></table>`;
    }
    return h;
  }
  function anketaDoc(p) {
    const extra = p.tp.form.participantFields.filter((f, i, all) => all.indexOf(f) === i && !COVERED.some((re) => re.test(f.trim())));
    const rows = [...ANKETA.map(([key, label]) => ({ label, value: S.profile[key].trim() })), ...extra.map((label) => ({ label, value: "" }))];
    return `<h3>${esc(PART_TITLES.participant)}</h3>
      <table><thead><tr><th style="width:6%">№</th><th style="width:44%">Наименование сведений</th><th>Сведения об участнике</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.label)}</td><td>${r.value ? esc(r.value) : "<mark>[заполните]</mark>"}</td></tr>`).join("")}</tbody></table>
      <p class="hint">Строки, которые к вам не относятся, удалите.</p>
      ${signature()}`;
  }
  const declDoc = (p) => `<h3>${esc(PART_TITLES.declaration)}</h3>${paras(fillFromProfile(p.tp.form.smeDeclaration), true)}${signature()}`;
  function priceDoc(p) {
    const price = p.tpPrice;
    const amount = price ? `${fmtRub(price)} руб. (${rublesInWords(price)})` : "[цена договора цифрами] руб. ([цена прописью])";
    const vat = S.profile.vatNote.trim() || "[в том числе НДС по ставке __% — сумма НДС, либо «НДС не облагается» с указанием основания]";
    return `<h3>${esc(PART_TITLES.price)}</h3><p class="c">Предмет закупки: ${esc(p.subject)}</p>${paras(`Предлагаемая цена договора составляет ${amount}, ${vat}.`, true)}${paras(p.tp.form.priceNote, true)}${signature()}`;
  }

  function openPreview(p, part) {
    const body = part === "tp" ? tpDoc(p) : part === "participant" ? anketaDoc(p) : part === "declaration" ? declDoc(p) : priceDoc(p);
    const basis = part === "tp" ? "" : p.sample ? "По стандартному шаблону: в документах примера нет формы заказчика." : `Составлено ${p.parts[part] ? p.parts[part].basis : basisText(p, part)}. Реквизиты — из «Реквизитов».`;
    openModal(`<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">Файл Word · предпросмотр</span>
      <h2 id="m-title">${esc(PART_TITLES[part])}.docx</h2>
      ${basis ? `<p class="small muted m0">${esc(basis)}</p>` : ""}
      <div class="sheet">${body}</div>
      <p class="small muted m0">В приложении этот файл скачивается на компьютер. Жёлтые поля остаются жёлтыми и в Word — сразу видно, что осталось вписать.</p>
    </div>`);
  }

  /* ---------- окна ---------- */
  let lastFocus = null;
  function openModal(html) {
    lastFocus = document.activeElement;
    const m = $("#modal");
    m.innerHTML = html;
    m.hidden = false;
    document.documentElement.style.overflow = "hidden";
    const close = m.querySelector(".x-close");
    if (close) close.focus();
  }
  function closeModal() {
    const m = $("#modal");
    if (m.hidden) return false;
    m.hidden = true;
    m.innerHTML = "";
    document.documentElement.style.overflow = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    return true;
  }
  function markIn(text, phrase) {
    const safe = esc(text);
    if (!phrase) return safe;
    const m = esc(phrase), i = safe.indexOf(m);
    return i < 0 ? safe : `${safe.slice(0, i)}<mark>${m}</mark>${safe.slice(i + m.length)}`;
  }
  function openRef(ref, hl) {
    const [type, a, b] = ref.split(":");
    if (type === "law") {
      const L = LAW[a];
      openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
        <span class="eyebrow">Закон · действующая редакция</span>
        <h2 id="m-title">${esc(`${L.law}, ст. ${L.art}, ${L.label}`)}</h2>
        <p class="small ink2 m0">Статья ${esc(L.art)}. ${esc(L.title)}</p>
        <div class="law-text">${markIn(L.text, hl)}</div>
        <p class="small muted m0">${esc(L.edition)}. Текст — с официального портала <a href="${esc(L.url)}" target="_blank" rel="noopener">pravo.gov.ru</a>. Многоточием отмечены пропущенные пункты.</p>
      </div>`);
      const box = $("#modal .law-text"), mark = box.querySelector("mark");
      if (mark) box.scrollTop = mark.offsetTop - box.offsetTop - 44;
      return;
    }
    const p = S.purchases.find((x) => x.id === a);
    const s = p && p.sources[b];
    if (!s) return;
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x-close" type="button" data-act="close" aria-label="Закрыть">${ic("x", 20)}</button>
      <span class="eyebrow">Цитата из документа</span>
      <h2 id="m-title">${esc(s.label)}</h2>
      <blockquote class="law-text">${esc(s.quote)}</blockquote>
      <p class="small muted m0">Файл: ${esc(s.file)}</p>
    </div>`);
  }

  let toastTimer;
  function toast(text) {
    const t = $("#toast");
    t.textContent = text;
    t.dataset.show = "true";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.dataset.show = "false"; }, 4200);
  }

  /* ---------- отрисовка и навигация ---------- */
  function screenHTML() {
    switch (S.screen) {
      case "home": return homeHTML();
      case "ask": return askHTML();
      case "new": return newHTML();
      case "profile": return profileHTML();
      case "docs": return docsHTML();
      default: return workspaceHTML();
    }
  }
  function autosize(el) {
    const max = el.classList.contains("edit-area") ? 600 : el.closest(".prompt") ? 160 : 140;
    el.style.height = "auto";
    el.style.height = `${Math.min(el.scrollHeight, max)}px`;
  }
  const renderSide = () => { $("#side").innerHTML = sideHTML(); };
  const renderHead = () => { $("#head").innerHTML = headHTML(); };
  function render() {
    renderSide();
    renderHead();
    const view = $("#view");
    view.classList.toggle("fill", WORK.includes(S.screen) || S.screen === "ask");
    view.innerHTML = screenHTML();
    document.querySelectorAll("#view textarea").forEach(autosize);
  }
  // Перерисовка на месте: фокус остаётся на том же элементе.
  function focusKey(el) {
    if (!el || el === document.body) return null;
    const scope = el.closest("#view") ? "#view " : el.closest("#side") ? "#side " : el.closest("#head") ? "#head " : "";
    if (el.id) return `#${CSS.escape(el.id)}`;
    const act = el.getAttribute("data-act");
    const goTo = el.getAttribute("data-go");
    if (!act && !goTo) return null;
    let sel = scope + (act ? `[data-act="${act}"]` : `[data-go="${goTo}"]`);
    for (const k of ["data-open", "data-q", "data-part", "data-edit", "data-key", "data-kind", "data-i", "data-id", "data-fold"]) {
      const v = el.getAttribute(k);
      if (v !== null) sel += `[${k}="${CSS.escape(v)}"]`;
    }
    return sel;
  }
  // Панели прокручиваются сами по себе: при перерисовке на месте их прокрутка сохраняется.
  const scrollState = () => [...document.querySelectorAll("[data-scroll]")].filter((el) => el.id).map((el) => [el.id, el.scrollTop]);
  function rerender() {
    const key = focusKey(document.activeElement);
    const pos = scrollState();
    render();
    pos.forEach(([id, top]) => { const el = document.getElementById(id); if (el) el.scrollTop = top; });
    const el = key && document.querySelector(key);
    if (el) el.focus({ preventScroll: true });
  }
  // Счётчики в сайдбаре, списке закупок и вкладках — без перерисовки того, что сейчас правят.
  function refreshCounts() {
    renderSide();
    const p = PURCHASE_SCREENS.includes(S.screen) ? cur() : null;
    const body = $("#plist-body");
    if (body) body.innerHTML = plistBodyHTML(p);
    const tabs = $("#tabs");
    if (tabs && p) tabs.outerHTML = tabsHTML(p);
  }
  const toTop = () => ["view", "pane-main"].forEach((id) => { const el = document.getElementById(id); if (el) el.scrollTop = 0; });

  let busyToken = 0;
  function go(screen, id, focusSel) {
    busyToken++;
    S.busy = null;
    if (screen === "p") screen = S.tabs[id || S.id] || "req";
    // На широком экране закупка открыта рядом со списком — как переписка в мессенджере.
    if (screen === "list" && !single.matches) {
      const target = cur() || [...S.purchases].sort(byUrgency)[0];
      if (target) { id = target.id; screen = S.tabs[target.id] || "req"; }
    }
    if (id && id !== S.id) S.info = false;
