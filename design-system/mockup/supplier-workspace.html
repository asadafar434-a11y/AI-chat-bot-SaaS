<title>Рабочее место поставщика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Onest:wght@400;500;600;700&family=Tinos:wght@400;700&family=Unbounded:wght@600;700&display=swap">
<style>
  /* Токены — design-system/brand.css («Индиго + мягкая») */
  :root {
    --ground: #eeeef6; --ground-2: #e4e4f0; --ink: #14142b; --ink-2: #474763; --ink-3: #77778f; --rule: #dcdcea;
    --paper: #ffffff; --paper-2: #f6f6fb; --paper-3: #ecebf6; --edge: #e3e2f0; --edge-2: #d0cfe4;
    --brand: #312e81; --brand-press: #26246a; --brand-tint: #e2e1f3; --on-brand: #ffffff;
    --ok: #0d9f6e; --ok-tint: #d8f5e9;
    --warn: #b4690e; --warn-tint: #fbeeda;
    --danger: #cf2f24;
    --danger-tint: color-mix(in srgb, var(--danger) 12%, var(--paper));
    --scrim: rgb(20 20 43 / .42);
    --r-surface: 24px; --r-card: 18px; --r-bubble: 22px; --r-ctl: 14px; --r-pill: 999px;
    --lift: 0 2px 6px rgb(20 20 43 / .05), 0 18px 40px -20px rgb(20 20 43 / .25);
    --lift-lg: 0 3px 8px rgb(20 20 43 / .05), 0 48px 84px -36px rgb(20 20 43 / .38);
    --display: "Unbounded", ui-sans-serif, system-ui, sans-serif;
    --ui: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    /* Предпросмотр файла Word: белый лист и Times-совместимый шрифт в обеих темах, как настоящий документ */
    --doc: "Tinos", "Times New Roman", Times, serif;
    --sheet: #ffffff; --sheet-ink: #111111; --sheet-mark: #ffff00;
    --side-w: 288px;
    --side-active: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0b0b16; --ground-2: #111124; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #8a8aa6; --rule: #22223c;
      --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge: #262645; --edge-2: #333359;
      --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
      --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
      --scrim: rgb(0 0 0 / .6);
      --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
      --lift-lg: 0 3px 8px rgb(0 0 0 / .45), 0 48px 84px -36px rgb(0 0 0 / .9);
      --side-active: #21213a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b0b16; --ground-2: #111124; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #8a8aa6; --rule: #22223c;
    --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge: #262645; --edge-2: #333359;
    --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
    --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
    --scrim: rgb(0 0 0 / .6);
    --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
    --lift-lg: 0 3px 8px rgb(0 0 0 / .45), 0 48px 84px -36px rgb(0 0 0 / .9);
    --side-active: #21213a;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/25px var(--ui); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button, label[for] { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .m0 { margin: 0; }
  .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-5 { margin-top: 20px; }
  .mt-6 { margin-top: 24px; } .mt-7 { margin-top: 28px; } .mt-8 { margin-top: 32px; } .mt-10 { margin-top: 40px; }
  .small { font-size: 14.5px; line-height: 22px; }
  .muted { color: var(--ink-3); }
  .ink2 { color: var(--ink-2); }
  .warn-t { color: var(--warn); font-weight: 600; }
  .ok-t { color: var(--ok); font-weight: 600; }
  .bad-t { color: var(--danger); font-weight: 600; }

  /* ---------- каркас: сайдбар и основная колонка ---------- */
  .side {
    position: fixed; inset-block: 0; left: 0; z-index: 40; width: var(--side-w);
    display: flex; flex-direction: column;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    background: var(--paper-2); border-right: 1px solid var(--rule);
  }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 12px 12px 18px; }
  .logo {
    appearance: none; border: 0; background: none; padding: 0;
    display: inline-flex; align-items: center; gap: 10px; text-align: left;
    font: 700 15px/1.15 var(--display); letter-spacing: -.03em; color: var(--ink);
  }
  .logo-mark { flex: none; width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); }
  .icon-btn.side-close { display: none; }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 20px; display: flex; flex-direction: column; gap: 22px; }
  .side-foot { margin: 0; padding: 12px 18px 16px; border-top: 1px solid var(--rule); font-size: 12.5px; line-height: 18px; color: var(--ink-3); }

  .nav { display: grid; gap: 2px; }
  .nav-item {
    appearance: none; border: 0; background: none; width: 100%;
    display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px;
    border-radius: var(--r-ctl); text-align: left; font-size: 15px; font-weight: 500; line-height: 20px; color: var(--ink-2);
  }
  .nav-item > svg { flex: none; color: var(--ink-3); }
  .nav-item:hover { background: var(--paper-3); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--side-active); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(20 20 43 / .07); }
  .nav-item[aria-current="page"] > svg { color: var(--brand); }
  .count { margin-left: auto; font: 500 12.5px/16px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sec-label { display: flex; align-items: baseline; justify-content: space-between; margin: 0 10px 6px; font-size: 12px; font-weight: 700; line-height: 16px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .sec-label .count { letter-spacing: 0; }
  .side-new { width: 100%; min-height: 44px; font-size: 15px; }
  .side-empty { margin: 0 10px; font-size: 14px; color: var(--ink-3); }

  .pur-list, .sub { list-style: none; margin: 0; padding: 0; }
  .pur-list { display: grid; gap: 2px; }
  .pur {
    appearance: none; border: 0; background: none; width: 100%; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 3px; align-items: start;
    padding: 9px 10px; border-radius: var(--r-ctl); color: var(--ink);
  }
  .pur:hover { background: var(--paper-3); }
  .pur[aria-current] { background: var(--side-active); box-shadow: 0 1px 2px rgb(20 20 43 / .07); }
  .pur-title { font-size: 14.5px; font-weight: 600; line-height: 19px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pur-meta { grid-column: 1; font-size: 12.5px; line-height: 17px; color: var(--ink-3); }
  .days { grid-column: 2; grid-row: 1; padding: 2px 7px; border-radius: var(--r-pill); background: var(--paper-3); color: var(--ink-2); font: 600 11.5px/16px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .days.soon { background: var(--warn-tint); color: var(--warn); }
  .sub { display: grid; gap: 1px; padding-block: 4px 8px; padding-inline: 14px 0; }
  .sub-item {
    appearance: none; border: 0; background: none; width: 100%; text-align: left;
    display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px;
    border-radius: var(--r-ctl); font-size: 14px; line-height: 19px; color: var(--ink-2);
  }
  .sub-item:hover { background: var(--paper-3); color: var(--ink); }
  .sub-item[aria-current="page"] { background: var(--brand-tint); color: var(--brand); font-weight: 600; }
  .sub-item[aria-current="page"] .count { color: inherit; }
  .mark-n { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: var(--r-pill); background: var(--warn-tint); color: var(--warn); font: 600 11.5px/16px var(--mono); text-align: center; }
  .mark-ok { margin-left: auto; display: grid; color: var(--ok); }
  .soon-tag { margin-left: auto; padding: 1px 8px; border-radius: var(--r-pill); background: var(--paper-3); color: var(--ink-3); font-size: 11.5px; font-weight: 600; line-height: 17px; letter-spacing: 0; text-transform: none; }
  .row-title .soon-tag { margin-left: 0; }

  .topbar {
    display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    align-items: center; gap: 6px; min-height: 56px; padding-inline: 8px 16px;
    background: var(--ground); border-bottom: 1px solid var(--rule);
  }
  .icon-btn { appearance: none; border: 0; background: none; flex: none; width: 40px; height: 40px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-2); }
  .icon-btn:hover { background: var(--paper-3); color: var(--ink); }
  .scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); }

  .main { margin-left: var(--side-w); }
  .page { max-width: 784px; margin-inline: auto; padding-inline: 32px; padding-block: 24px 56px; }

  @media (max-width: 1023px) {
    .topbar { display: flex; }
    .main { margin-left: 0; }
    .page { padding-inline: 16px; padding-block: 8px 40px; }
    .side {
      width: min(320px, 88vw); transform: translateX(-102%); visibility: hidden; box-shadow: var(--lift-lg);
      transition: transform .22s ease, visibility 0s linear .22s;
    }
    .app[data-drawer="open"] .side { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
    .icon-btn.side-close { display: grid; }
  }

  /* ---------- общие элементы экрана ---------- */
  .back {
    appearance: none; border: 0; background: none; padding: 0; margin-top: 4px;
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    color: var(--ink-3); font-size: 15px; font-weight: 500; line-height: 22px;
  }
  .back span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back:hover { color: var(--ink); }
  h1 { margin: 14px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4.4vw, 32px); line-height: 1.15; letter-spacing: -.04em; text-wrap: balance; }
  h1:focus { outline: none; }
  .h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3.4vw, 25px); line-height: 1.2; letter-spacing: -.04em; text-wrap: balance; }
  .lead { margin: 12px 0 0; max-width: 52ch; font-size: 17px; line-height: 26px; color: var(--ink-2); }
  .group { margin-top: 28px; }
  .group-title { margin: 0 0 10px; font-size: 13px; font-weight: 700; line-height: 18px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .foot { margin: 40px 0 0; font-size: 13px; line-height: 19px; color: var(--ink-3); }

  .btn {
    appearance: none; border: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding-inline: 24px; border-radius: var(--r-ctl);
    background: var(--brand); color: var(--on-brand); font-size: 16px; font-weight: 600; line-height: 20px; text-align: center;
  }
  .btn:hover { background: var(--brand-press); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.line { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--edge-2); }
  .btn.line:hover { background: var(--paper-2); }
  .btn.soft { background: var(--paper-2); color: var(--ink); }
  .btn.soft:hover { background: var(--paper-3); }
  .btn.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .btn.danger:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); }
  .btn.sm { min-height: 44px; padding-inline: 18px; font-size: 15px; }
  .btn.xs { min-height: 38px; padding-inline: 14px; font-size: 14.5px; }
  .btn:has(input:focus-visible), .link:has(input:focus-visible), .circle:has(input:focus-visible), .tool-btn:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 3px; }
  .link {
    appearance: none; border: 0; background: none; padding: 0; text-align: left;
    color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .link.quiet { color: var(--ink-3); font-weight: 500; text-decoration-color: color-mix(in srgb, var(--ink-3) 45%, transparent); }
  .link.quiet:hover { color: var(--ink); }
  .link.del:hover { color: var(--danger); }
  .src {
    appearance: none; border: 0; background: none; padding: 0; justify-self: start; text-align: left;
    color: var(--brand); font-size: 14px; font-weight: 500; line-height: 20px;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }

  .note { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-radius: var(--r-card); line-height: 22px; }
  .note > svg { flex: none; margin-top: 1px; }
  .note.warn { background: var(--warn-tint); color: var(--warn); font-weight: 600; }
  .note.ok { background: var(--ok-tint); color: var(--ok); font-weight: 600; }
  .note.info { background: var(--paper); color: var(--ink-2); font-size: 15px; }
  .note .link { color: inherit; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 0; padding: 9px 15px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font-size: 15px; font-weight: 500; line-height: 20px; text-align: left; }
  .chip:hover { background: var(--paper-3); }
  .chips.on-ground .chip { background: var(--paper); }
  .chips.on-ground .chip:hover { background: var(--paper-2); }
  .file-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding-inline: 10px 4px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); font-size: 13px; font-weight: 500; line-height: 18px; }
  .file-chip > svg { flex: none; color: var(--ink-3); }
  .file-chip .fc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .x { appearance: none; border: 0; background: none; flex: none; width: 24px; height: 24px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .file-chip .x:hover { background: var(--paper-3); color: var(--ink); }
  .file-chip.plain { padding-inline: 10px; }

  .circle { appearance: none; border: 0; background: none; flex: none; width: 38px; height: 38px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--ink-3); }
  .circle:hover { background: var(--paper-2); color: var(--ink); }
  .circle.send { background: var(--brand); color: var(--on-brand); }
  .circle.send:hover { background: var(--brand-press); }

  /* ---------- главная ---------- */
  .ask { display: grid; gap: 14px; margin-top: 8px; padding: 22px; border-radius: var(--r-surface); background: var(--paper); }
  .ask-lead { margin: 0; max-width: 50ch; color: var(--ink-2); }
  .askbox { display: flex; align-items: flex-end; gap: 6px; padding: 8px; border-radius: var(--r-surface); box-shadow: inset 0 0 0 1.5px var(--edge-2); }
  .askbox:focus-within { box-shadow: inset 0 0 0 2px var(--brand); }
  .askbox textarea { flex: 1; min-width: 0; min-height: 38px; max-height: 140px; padding-block: 7px; border: 0; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 24px; }
  textarea::placeholder, .input::placeholder { color: var(--ink-3); }
  .sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-top: 36px; }
  .cards { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .card {
    appearance: none; border: 0; width: 100%; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; row-gap: 4px; align-items: center;
    padding: 18px 20px; border-radius: var(--r-card); background: var(--paper); color: var(--ink);
  }
  .card:hover { box-shadow: var(--lift); }
  .card-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 17px; font-weight: 700; line-height: 24px; }
  .card-sub, .tags { grid-column: 1; }
  .card-sub { font-size: 14.5px; line-height: 21px; color: var(--ink-3); }
  .chev { grid-column: 2; grid-row: 1 / span 3; color: var(--ink-3); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { padding: 4px 11px; border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink-2); font-size: 13.5px; font-weight: 600; line-height: 19px; }
  .tag.warn { background: var(--warn-tint); color: var(--warn); }
  .tag.ok { background: var(--ok-tint); color: var(--ok); }
  .sample { font-size: 13px; font-weight: 600; color: var(--ink-3); }

  /* ---------- закупка ---------- */
  .kind { margin: 20px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-3); }
  .due { display: inline-flex; align-items: center; gap: 10px; margin: 16px 0 0; padding: 10px 16px; border-radius: var(--r-card); background: var(--paper); color: var(--ink-2); font-size: 15px; font-weight: 600; line-height: 21px; }
  .due > svg { flex: none; }
  .due.soon { background: var(--warn-tint); color: var(--warn); }
  .due.past { color: var(--ink-3); }
  .facts { display: grid; gap: 4px; margin: 16px 0 0; font-size: 15.5px; line-height: 23px; color: var(--ink-2); }
  .facts div { margin: 0; }
  .facts dt, .facts dd { display: inline; margin: 0; }
  .facts dd { color: var(--ink); font-weight: 600; }
  .menu { list-style: none; margin: 24px 0 0; padding: 0; overflow: hidden; border-radius: var(--r-surface); background: var(--paper); }
  .menu > li + li { border-top: 1px solid var(--rule); }
  .row {
    appearance: none; border: 0; background: none; width: 100%; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 4px; align-items: center;
    padding: 20px; color: var(--ink);
  }
  .row:hover { background: var(--paper-2); }
  .row-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 17px; font-weight: 700; line-height: 24px; }
  .row-sub { grid-column: 1; font-size: 15px; line-height: 22px; color: var(--ink-3); }
  .row .chev { grid-row: 1 / span 2; }
  .docs-line { margin: 20px 0 0; font-size: 14.5px; line-height: 22px; color: var(--ink-3); }
  .docs-line + .docs-line { margin-top: 4px; }
  .confirm { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-card); background: var(--paper); }
  .confirm p { margin: 0; font-weight: 600; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- требования ---------- */
  .list { list-style: none; margin: 0; padding: 0; overflow: hidden; border-radius: var(--r-card); background: var(--paper); }
  .list > li { display: grid; gap: 4px; padding: 14px 18px; }
  .list > li + li { border-top: 1px solid var(--rule); }
  .quote { margin: 4px 0 0; padding: 12px 16px; border-radius: var(--r-ctl); background: var(--paper-2); font-size: 14.5px; line-height: 22px; }
  .unver { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; font-weight: 500; line-height: 19px; color: var(--warn); }
  .unver > svg { flex: none; }
  .empty-group { margin: 0; padding: 14px 18px; border-radius: var(--r-card); background: var(--paper); font-size: 15px; line-height: 22px; color: var(--ink-3); }

  /* ---------- техническое предложение ---------- */
  .items { list-style: none; margin: 0; padding: 0; overflow: hidden; border-radius: var(--r-surface); background: var(--paper); }
  .items > li { display: grid; gap: 6px; padding: 18px 20px; }
  .items > li + li { border-top: 1px solid var(--rule); }
  .item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .item-head h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 22px; }
  .qty { font-size: 14px; color: var(--ink-3); }
  .flag { font-size: 13px; font-weight: 600; color: var(--warn); }

    "text": "10. Оператор электронной площадки направляет в банк информацию о реквизитах специального счета для осуществления банком по такому счету операции, предусмотренной частью 9 настоящей статьи, в течение одного часа с момента наступления следующих случаев:\n1) отклонение заявки на участие в закупке (за исключением случая, предусмотренного частью 13 настоящей статьи), отстранение участника закупки от участия в определении поставщика (подрядчика, исполнителя) в соответствии с настоящим Федеральным законом;\n2) отзыв заявки участником закупки в соответствии с настоящим Федеральным законом;\n3) заключение контракта в соответствии с настоящим Федеральным законом с участником закупки. В этом случае оператор электронной площадки направляет также информацию о реквизитах специальных счетов всех участников закупки, заявки которых не были отклонены, отстранены, отозваны в соответствии с настоящим Федеральным законом, за исключением участников закупки, признанных в соответствии с настоящим Федеральным законом уклонившимися от заключения контракта;\n4) отмена закупки в соответствии со статьей 36 настоящего Федерального закона. В этом случае оператор электронной площадки направляет информацию о реквизитах специальных счетов всех участников закупки, подавших заявки на участие в закупке;\n5) получение решения контрольного органа в сфере закупок об отказе в согласовании заключения контракта с единственным поставщиком (подрядчиком, исполнителем);\n6) получение предусмотренного настоящим Федеральным законом решения об отказе во включении информации об участнике закупки в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в связи с его уклонением от заключения контракта;\n7) включение информации об участнике закупки в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в соответствии со статьей 104 настоящего Федерального закона в связи с его уклонением от заключения контракта.\n11. Банк не позднее одного часа с момента получения информации, предусмотренной пунктами 1 - 6 части 10 настоящей статьи, прекращает осуществленное в соответствии с подпунктом \"в\" пункта 3 части 5 настоящей статьи блокирование денежных средств на специальном счете (специальных счетах), реквизиты которого (которых) направлены оператором электронной площадки, и направляет информацию о прекращении такого блокирования оператору электронной площадки. Не позднее одного часа с момента получения информации, предусмотренной пунктом 7 части 10 настоящей статьи, банк осуществляет перевод заблокированных в соответствии с подпунктом \"в\" пункта 3 части 5 настоящей статьи денежных средств на счет, на котором в соответствии с законодательством Российской Федерации учитываются операции со средствами, поступающими заказчику, и направляет информацию о таком переводе оператору электронной площадки.\n12. Возврат независимой гарантии, предоставленной для обеспечения заявки на участие в закупке, в случаях, предусмотренных пунктами 1 - 6 части 10 настоящей статьи, заказчиком лицу или гаранту, предоставившим независимую гарантию, не осуществляется, взыскание по ней не производится. В случае, предусмотренном пунктом 7 части 10 настоящей статьи, заказчик предъявляет требование об уплате денежной суммы по независимой гарантии, предоставленной для обеспечения заявки на участие в закупке участником закупки, информация о котором включена в реестр недобросовестных поставщиков (подрядчиков, исполнителей) в связи с уклонением такого участника от заключения контракта.",

еме мотивированный отказ от подписания документа о приемке с указанием причин такого отказа;\n…\n7) в случае получения в соответствии с пунктом 6 настоящей части мотивированного отказа от подписания документа о приемке поставщик (подрядчик, исполнитель) вправе устранить причины, указанные в таком мотивированном отказе, и направить заказчику документ о приемке в порядке, предусмотренном настоящей частью;\n8) датой приемки поставленного товара, выполненной работы, оказанной услуги считается дата размещения в единой информационной системе документа о приемке, подписанного заказчиком.",

  /* ---------- даты и деньги — как в web/src/lib/deadline.ts и rub-words.ts ---------- */
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

  // Срок подачи — самое важное в закупке: обратный отсчёт, янтарный за неделю до срока.
  function dueLine(dl, withTime) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dl.date || "");
    if (!m) return null;
    const [y, mo, d] = [Number(m[1]), Number(m[2]), Number(m[3])];
    const days = Math.round((new Date(y, mo - 1, d) - TODAY) / 86400000);
    const day = `${d} ${MONTHS[mo - 1]}${y !== TODAY.getFullYear() ? ` ${y}` : ""}`;
    const at = withTime && dl.time ? [dl.time, dl.zone].filter(Boolean).join(" ") : "";
    if (days < 0) return { head: `Приём заявок закончился ${day}`, tone: "past", days };
    if (days === 0) return { head: `Подать сегодня${at ? `, до ${at}` : ""}`, tone: "soon", days };
    return { head: `Подать до ${day}${at ? `, ${at}` : ""}`, left: `осталось ${days} ${plural(days, "день", "дня", "дней")}`, tone: days <= 7 ? "soon" : "calm", days };
  }
  // Сначала то, что горит, потом закупки без срока, в конце — прошедшие.
  function byUrgency(a, b) {
    const rank = (d) => (d === null ? [1, 0] : d.days >= 0 ? [0, d.days] : [2, -d.days]);
    const [ra, da] = rank(dueLine(a.deadline, false));
    const [rb, db] = rank(dueLine(b.deadline, false));
    return ra - rb || da - db;
  }

  const ONES = ["", "один", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
  const ONES_F = ["", "одна", "две", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
  const TEENS = ["десять", "одиннадцать", "двенадцать", "тринадцать", "четырнадцать", "пятнадцать", "шестнадцать", "семнадцать", "восемнадцать", "девятнадцать"];
  const TENS = ["", "", "двадцать", "тридцать", "сорок", "пятьдесят", "шестьдесят", "семьдесят", "восемьдесят", "девяносто"];
  const HUNDREDS = ["", "сто", "двести", "триста", "четыреста", "пятьсот", "шестьсот", "семьсот", "восемьсот", "девятьсот"];
  const SCALES = [
    { value: 1e9, forms: ["миллиард", "миллиарда", "миллиардов"], feminine: false },
    { value: 1e6, forms: ["миллион", "миллиона", "миллионов"], feminine: false },
    { value: 1e3, forms: ["тысяча", "тысячи", "тысяч"], feminine: true },
  ];
  function triad(n, feminine) {
    const words = [HUNDREDS[Math.floor(n / 100)]];
    const rest = n % 100;
    if (rest >= 10 && rest < 20) words.push(TEENS[rest - 10]);
    else words.push(TENS[Math.floor(rest / 10)], (feminine ? ONES_F : ONES)[rest % 10]);
    return words.filter(Boolean);
  }
  // 690000 → «Шестьсот девяносто тысяч рублей 00 копеек» — так цену пишут прописью в заявке.
  function rublesInWords(amount) {
    const cents = Math.round(amount * 100);
    const kopecks = cents % 100;
    let rubles = Math.floor(cents / 100);
    const words = [];
    for (const scale of SCALES) {
      const count = Math.floor(rubles / scale.value);
      if (count > 0) words.push(...triad(count, scale.feminine), plural(count, ...scale.forms));
      rubles %= scale.value;
    }
    words.push(...triad(rubles, false));
    const whole = Math.floor(cents / 100);
    const text = [words.length ? words.join(" ") : "ноль", plural(whole, "рубль", "рубля", "рублей"), String(kopecks).padStart(2, "0"), plural(kopecks, "копейка", "копейки", "копеек")].join(" ");
    return text[0].toUpperCase() + text.slice(1);
  }
  const fmtRub = (n) => n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/ /g, " ");
  function parseRub(text) {
    const m = /(\d[\d\s ]*)(?:[,.](\d{1,2}))?/.exec(text || "");
    if (!m) return null;
    const value = Number(m[1].replace(/[\s ]/g, "")) + (m[2] ? Number(m[2].padEnd(2, "0")) / 100 : 0);
    return Number.isFinite(value) && value > 0 ? value : null;
  }

  function md(text) {
    const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return text.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n").filter((l) => l.trim());
      if (!lines.length) return "";
      const head = lines[0].startsWith("- ") ? "" : lines.shift();
      const list = lines.filter((l) => l.startsWith("- "));
      const rest = lines.filter((l) => !l.startsWith("- "));
      return (head ? `<p>${inline(head)}</p>` : "") + (list.length ? `<ul>${list.map((l) => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>` : "") + (rest.length ? `<p>${rest.map(inline).join("<br>")}</p>` : "");
    }).join("");
  }
