<title>Рабочее место поставщика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
  /* Токены — design-system/brand.css («Индиго + мягкая») */
  :root {
    --ground: #eeeef6; --ink: #14142b; --ink-2: #474763; --ink-3: #77778f; --rule: #dcdcea;
    --paper: #ffffff; --paper-2: #f6f6fb; --paper-3: #ecebf6; --edge-2: #d0cfe4;
    --brand: #312e81; --brand-press: #26246a; --brand-tint: #e2e1f3; --on-brand: #ffffff;
    --ok: #0d9f6e; --ok-tint: #d8f5e9;
    --warn: #b4690e; --warn-tint: #fbeeda;
    --danger: #cf2f24;
    --danger-tint: color-mix(in srgb, var(--danger) 12%, var(--paper));
    --scrim: rgb(20 20 43 / .42);
    --r-surface: 24px; --r-card: 18px; --r-bubble: 22px; --r-ctl: 14px; --r-pill: 999px;
    --lift: 0 2px 6px rgb(20 20 43 / .05), 0 18px 40px -20px rgb(20 20 43 / .25);
    --display: "Unbounded", ui-sans-serif, system-ui, sans-serif;
    --ui: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0b0b16; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #8a8aa6; --rule: #22223c;
      --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge-2: #333359;
      --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
      --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
      --scrim: rgb(0 0 0 / .6);
      --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b0b16; --ink: #ebebf7; --ink-2: #a6a6c2; --ink-3: #8a8aa6; --rule: #22223c;
    --paper: #131324; --paper-2: #19192e; --paper-3: #21213a; --edge-2: #333359;
    --brand: #a5b4fc; --brand-press: #bcc6ff; --brand-tint: #22224a; --on-brand: #0b0a26;
    --ok: #3ddc9a; --ok-tint: #103326; --warn: #e2a34a; --warn-tint: #352812; --danger: #ff7a70;
    --scrim: rgb(0 0 0 / .6);
    --lift: 0 2px 6px rgb(0 0 0 / .45), 0 18px 40px -20px rgb(0 0 0 / .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/25px var(--ui); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .wrap { max-width: 680px; margin-inline: auto; padding-inline: 16px; }
  .top { padding-block: 20px 0; }
  .logo {
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px; font: 700 16px/1 var(--display); letter-spacing: -.03em;
  }
  .logo-mark { width: 30px; height: 30px; border-radius: 11px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); }
  main { padding-block: 8px 40px; }

  .back {
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; margin-top: 18px;
    color: var(--ink-3); font-weight: 500; font-size: 15px;
  }
  .back:hover { color: var(--ink); }
  h1 { margin: 14px 0 10px; font-family: var(--display); font-weight: 700; font-size: clamp(23px, 5vw, 30px); line-height: 1.18; letter-spacing: -.04em; text-wrap: balance; }
  .lead { margin: 0; font-size: 17px; line-height: 26px; color: var(--ink-2); max-width: 48ch; }
  .muted { color: var(--ink-3); }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 0 24px; border-radius: var(--r-ctl);
    background: var(--paper); color: var(--ink); font-weight: 600; font-size: 16px;
    box-shadow: inset 0 0 0 1.5px var(--edge-2);
  }
  .btn:hover { background: var(--paper-2); }
  .btn.main { background: var(--brand); color: var(--on-brand); box-shadow: none; }
  .btn.main:hover { background: var(--brand-press); }
  .btn:has(input:focus-visible), .ref:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 3px; }
  .link, .ref {
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .ref { font-size: 14px; font-weight: 500; }

  /* ---------- мои закупки ---------- */
  .cards { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
  .card {
    appearance: none; border: 0; cursor: pointer; width: 100%; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
    padding: 18px 20px; border-radius: var(--r-card); background: var(--paper);
  }
  .card:hover { box-shadow: var(--lift); }
  .card-title { font-weight: 700; font-size: 17px; line-height: 24px; }
  .card-sub { font-size: 14.5px; color: var(--ink-3); grid-column: 1; }
  .chev { grid-column: 2; grid-row: 1 / span 2; color: var(--ink-3); }
  .soon { color: var(--warn); font-weight: 600; }
  .good { color: var(--ok); font-weight: 600; }
  .bad-t { color: var(--danger); font-weight: 600; }
  .new-btn { margin-top: 22px; }

  /* ---------- закупка ---------- */
  .kind { margin: 20px 0 0; font-size: 14.5px; color: var(--ink-3); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-pill); font-weight: 600; font-size: 14.5px; background: var(--paper); color: var(--ink-2); }
  .pill.soon { background: var(--warn-tint); color: var(--warn); }
  .pill.good { background: var(--ok-tint); color: var(--ok); }
  .facts { margin: 16px 0 0; display: grid; gap: 4px; font-size: 15.5px; color: var(--ink-2); }
  .facts b { color: var(--ink); font-weight: 600; }
  .menu { list-style: none; margin: 24px 0 0; padding: 0; border-radius: var(--r-surface); background: var(--paper); overflow: hidden; }
  .menu li + li { border-top: 1px solid var(--rule); }
  .menu .card { border-radius: 0; background: transparent; padding: 20px; }
  .menu .card:hover { box-shadow: none; background: var(--paper-2); }
  .docs-line { margin: 20px 0 0; font-size: 14px; line-height: 21px; color: var(--ink-3); }

  /* ---------- требования ---------- */
  .group { margin-top: 26px; }
  .group h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .list { list-style: none; margin: 0; padding: 0; border-radius: var(--r-card); background: var(--paper); }
  .list li { padding: 14px 18px; display: grid; gap: 2px; }
  .list li + li { border-top: 1px solid var(--rule); }
  .list .ref { justify-self: start; }

  /* ---------- загрузка и ожидание ---------- */
  .drop {
    margin-top: 26px; padding: 36px 24px; border-radius: var(--r-surface);
    background: var(--paper); box-shadow: inset 0 0 0 2px var(--edge-2);
    display: grid; justify-items: center; gap: 16px; text-align: center;
  }
  .drop.over { background: var(--brand-tint); box-shadow: inset 0 0 0 2px var(--brand); }
  .drop p { margin: 0; color: var(--ink-2); }
  .drop-icon { color: var(--brand); }
  .or { font-size: 15px; color: var(--ink-3); }
  .busy { margin-top: 48px; display: grid; gap: 18px; }
  .busy-text { margin: 0; font-size: 18px; font-weight: 600; }
  .track { height: 6px; border-radius: var(--r-pill); background: var(--paper); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--brand); transition: width .6s ease; }

  /* ---------- техническое предложение ---------- */
  .note { margin-top: 20px; padding: 14px 18px; border-radius: var(--r-card); display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .note.warn { background: var(--warn-tint); color: var(--warn); }
  .note.ok { background: var(--ok-tint); color: var(--ok); }
  .note svg { flex: none; }
  .items { list-style: none; margin: 16px 0 0; padding: 0; border-radius: var(--r-surface); background: var(--paper); }
  .item { padding: 18px 20px; display: grid; gap: 6px; }
  .item + .item { border-top: 1px solid var(--rule); }
  .item-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .item-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .flag { font-size: 13px; font-weight: 600; color: var(--warn); }
  .need { margin: 0; font-size: 14.5px; line-height: 21px; color: var(--ink-3); }
  .offer { margin-inline: -8px; padding: 6px 8px; border-radius: 10px; outline: none; cursor: text; white-space: pre-wrap; }
  .offer:hover { background: var(--paper-2); }
  .offer:focus { background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--brand); }
  mark.fill { background: var(--warn-tint); color: var(--warn); border-radius: 6px; padding: 1px 5px; font-weight: 600; }
  .actions {
    position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 8px; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, transparent, var(--ground) 28%);
  }

  /* ---------- проверка ---------- */
  .findings { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
  .finding { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 16px 18px; border-radius: var(--r-card); background: var(--paper); }
  .finding p { margin: 0; }
  .finding .what { font-weight: 600; }
  .finding .todo { color: var(--ink-2); }
  .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .bad .ico { background: var(--danger-tint); color: var(--danger); }
  .warn .ico { background: var(--warn-tint); color: var(--warn); }
  .ok .ico { background: var(--ok-tint); color: var(--ok); }
  .finding.ok { background: transparent; }
  .finding.ok .what { color: var(--ok); }
  .under { margin: 22px 0 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 18px; }

  /* ---------- вопросы ---------- */
  .chatbox { margin-top: 22px; padding: 18px; border-radius: var(--r-surface); background: var(--paper); display: grid; gap: 18px; }
  .chatbox .empty { margin: 0; color: var(--ink-3); font-size: 15px; }
  .msg { font-size: 15px; line-height: 23px; }
  .msg.user { justify-self: end; max-width: 80%; padding: 10px 15px; background: var(--paper-3); border-radius: var(--r-bubble) var(--r-bubble) 8px var(--r-bubble); }
  .msg.bot p { margin: 0 0 8px; }
  .msg.bot p:last-child { margin: 0; }
  .bot-meta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 14px; color: var(--ink-3); }
  .thinking { margin: 0; color: var(--ink-3); animation: pulse 1.2s ease-in-out infinite; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { appearance: none; border: 0; cursor: pointer; text-align: left; padding: 10px 15px; border-radius: var(--r-pill); background: var(--paper); font-weight: 500; font-size: 15px; line-height: 20px; }
  .chip:hover { background: var(--paper-2); }
  .ask-bar { position: sticky; bottom: 0; z-index: 5; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--ground) 30%); }
  .field { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; border-radius: var(--r-surface); background: var(--paper); box-shadow: var(--lift); }
  .field textarea { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; resize: none; font-size: 16px; line-height: 24px; padding: 6px 0; max-height: 120px; }
  .field textarea::placeholder { color: var(--ink-3); }
  .send { appearance: none; border: 0; cursor: pointer; flex: none; width: 38px; height: 38px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--brand); color: var(--on-brand); }
  .send:hover { background: var(--brand-press); }

  /* ---------- цитата, уведомление ---------- */
  .modal-scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
  .modal { width: min(500px, 100%); max-height: calc(100% - 32px); overflow-y: auto; display: grid; gap: 14px; padding: 22px; border-radius: var(--r-surface); background: var(--paper); box-shadow: var(--lift); }
  .modal h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .modal .eyebrow { font-size: 13px; color: var(--ink-3); }
  .quote { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--paper-2); font-size: 15.5px; line-height: 24px; }
  .quote mark { background: var(--warn-tint); color: var(--ink); border-radius: 4px; padding: 0 3px; }
  .modal .btn { justify-self: end; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    width: max-content; max-width: min(460px, calc(100% - 32px));
    padding: 12px 18px; border-radius: var(--r-ctl); background: var(--ink); color: var(--paper);
    font-size: 14px; line-height: 20px; box-shadow: var(--lift); transition: opacity .18s ease, transform .18s ease;
  }
  .toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }
  .foot { margin: 36px 0 0; font-size: 13px; color: var(--ink-3); }

  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 480px) {
    .btn { width: 100%; }
    .actions { flex-direction: column; }
    .item, .card, .menu .card { padding: 16px; }
  }
</style>

<header class="wrap top">
  <button class="logo" type="button" data-go="home" aria-label="Тендерный юрист — мои закупки">

<script>
(() => {
  "use strict";

  const TODAY = new Date(2026, 8, 24); // дата, от которой считаются сроки в примере

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
  const rub = (n) => n.toLocaleString("ru-RU") + " ₽";
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const human = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
  const daysTo = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Math.round((new Date(y, m - 1, d) - TODAY) / 86400000); };
  const quick = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const CHEV = '<svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const UPLOAD = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="m9 14 3-3 3 3"/></svg>';
  const SEND = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
  const PEN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  const S = (label, doc, place, file, quote, mark) => ({ label, doc, place, file, quote, mark });
  const LAW = (label, text) => ({ label, doc: "Закон № 44-ФЗ", place: label.split(", ")[1], quote: text, law: true });
  const LAW43 = LAW("44-ФЗ, ст. 43", "Статья 43 определяет состав заявки на участие в закупке: какие сведения и документы в неё входят.");
  const LAW44 = LAW("44-ФЗ, ст. 44", "Статья 44 регулирует обеспечение заявок: размер, способы внесения — деньгами на специальном счёте или независимой гарантией — и когда обеспечение возвращают.");

  const PURCHASES = [
    {
      id: "p1", short: "Церемония «Педагог года — 2026»",
      title: "Торжественная церемония награждения «Педагог года — 2026»",
      kind: "44-ФЗ · электронный конкурс", customer: "Управление образования администрации г. Энска", nmck: 685000,
      deadline: "2026-09-30", time: "10:00",
      docs: ["Извещение.pdf", "Техническое задание.docx", "Проект контракта.pdf", "Порядок оценки.pdf"],
      sources: {
        izv4: S("Извещение, раздел 4", "Извещение", "раздел 4", "Извещение.pdf", "Дата и время окончания срока подачи заявок: 30.09.2026 10:00 (МСК).", "30.09.2026 10:00"),
        izv7: S("Извещение, раздел 7", "Извещение", "раздел 7", "Извещение.pdf", "Размер обеспечения заявки: 1% от начальной (максимальной) цены контракта — 6 850,00 руб. Обеспечение предоставляется путём блокирования денежных средств на специальном счёте участника или независимой гарантией.", "6 850,00 руб."),
        izv8: S("Извещение, раздел 8", "Извещение", "раздел 8", "Извещение.pdf", "Декларация о соответствии участника закупки единым требованиям формируется с использованием программно-аппаратных средств электронной площадки.", "формируется с использованием программно-аппаратных средств электронной площадки"),
        izv9: S("Извещение, раздел 9", "Извещение", "раздел 9", "Извещение.pdf", "Дата подведения итогов определения поставщика: не позднее 06.10.2026.", "не позднее 06.10.2026"),

  function busy(lines, done) {

    window.scrollTo(0, 0);
    let i = 0;
    const step = () => {
      if (i === lines.length) { done(); return; }
      $("#busy-text").textContent = lines[i];
      i += 1;
      $("#busy-bar").style.width = Math.round((i / lines.length) * 100) + "%";
      setTimeout(step, quick ? 60 : 850);
    };
    step();
  }

    p.chat.push({ role: "user", text: question });
    p.thinking = true;
    refreshChat(p);
    setTimeout(() => {
      p.thinking = false;
      const m = { role: "bot", text: answer.text, src: answer.src, shown: "", done: false };
      p.chat.push(m);
      const tokens = answer.text.match(/\*\*[^*]+\*\*|\S+\s*|\s+/g) || [];
      let k = 0;
      const tick = () => {
        m.shown += tokens[k++] || "";
        if (k < tokens.length) { refreshChat(p); setTimeout(tick, quick ? 0 : 26); }
        else { m.done = true; refreshChat(p); }
      };
      tick();
    }, quick ? 0 : 650);
  }

  /* ---------- действия ---------- */
  function compose(p) {
    busy(["Читаю ТЗ…", "Разбираю требования по пунктам…", "Пишу предложение по каждому пункту…"], () => {
      p.tp = p.tpDraft.map((r) => ({ ...r }));
      p.tpState = "done";
      go("tp");
    });
  }

  function runCheck(p) {
    busy(["Читаю вашу заявку…", "Сверяю с ТЗ по каждому пункту…"], () => {
      p.checkState = "done";
      go("check");
    });
  }

  function createPurchase(files) {
    busy(["Читаю извещение…", "Выписываю требования из ТЗ…", "Проверяю сроки и суммы…"], () => {
      let p = byId("p4");
      if (!p) {
        p = JSON.parse(JSON.stringify(NEW_TEMPLATE));
        prepare(p);
        PURCHASES.unshift(p);
      }
      if (files.length) p.docs = files;
      go("purchase", p.id);
      toast("Закупка добавлена: требования и сроки выписаны.");
    });
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "modal") { closeModal(); return; }
    const nav = e.target.closest("[data-go]");
    if (nav) { go(nav.dataset.go, nav.dataset.id); return; }
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const p = cur();
    const act = t.dataset.act;
    if (act === "compose") compose(p);
    else if (act === "download") toast("В рабочей версии здесь скачается готовый файл Word с этим текстом.");
    else if (act === "sample-check") runCheck(p);
    else if (act === "recheck") { p.checkState = "none"; go("check"); }
    else if (act === "quote") openQuote(t.dataset.src);
    else if (act === "close") closeModal();
    else if (act === "lawyer") toast("В рабочей версии вопрос уйдёт юристу по закупкам, ответ — в течение дня. Сейчас ничего не отправляется.");
    else if (act === "suggest") ask(p, t.dataset.q);
    else if (act === "sample-new") createPurchase([]);
  });

  document.addEventListener("submit", (e) => {
    if (e.target.id !== "ask-form") return;
    e.preventDefault();
    const input = $("#ask-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "";
    ask(cur(), text);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.id === "ask-input") {
      e.preventDefault();
      e.target.form.requestSubmit();
    }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "ask-input") {
      e.target.style.height = "auto";
      e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
      return;
    }
    const cell = e.target.closest && e.target.closest(".offer");
    if (!cell) return;
    const p = cur();
    const it = p.tp[Number(cell.dataset.i)];
    it.offer = cell.innerText.replace(/\n{3,}/g, "\n\n").trim();
    const flag = cell.closest(".item").querySelector("[data-flag]");
    if (!needsFill(it.offer) && flag) flag.remove();
    const fill = fillCount(p);
    $("#tp-note").outerHTML = fill
      ? `<div class="note warn" id="tp-note">${PEN}Впишите свои данные в ${fill} ${plural(fill, "пункт", "пункта", "пунктов")} — они выделены жёлтым. Нажмите на текст, чтобы исправить.</div>`
      : `<div class="note ok" id="tp-note">${TICK}Всё заполнено — можно скачивать.</div>`;
  });

  document.addEventListener("focusout", (e) => {
    const cell = e.target.closest && e.target.closest(".offer");
    if (cell) cell.innerHTML = offerHTML(cur().tp[Number(cell.dataset.i)].offer);
  });

  document.addEventListener("change", (e) => {
    const input = e.target;
    if (input.type !== "file" || !input.files.length) return;
    const names = [...input.files].map((f) => f.name);
    const p = cur();
    if (input.id === "file-app") runCheck(p);
    else if (input.id === "file-new") createPurchase(names);
    else if (input.id === "add-doc") {
      p.docs.push(...names);
      render();
      toast(`Добавлено: ${names.join(", ")}. В рабочей версии я перечитаю требования с учётом нового файла.`);
    }
  });

  document.addEventListener("dragover", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone) zone.classList.add("over");
  });
  document.addEventListener("dragleave", (e) => {
    const zone = e.target.closest && e.target.closest(".drop");
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over");
  });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest(".drop");
    if (!zone) return;
    zone.classList.remove("over");
    const names = [...((e.dataTransfer && e.dataTransfer.files) || [])].map((f) => f.name);
    if (!names.length) return;
    if (zone.id === "drop-app") runCheck(cur());
    else if (zone.id === "drop-new") createPurchase(names);
  });

  render();
})();
</script>
